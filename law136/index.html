<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEAE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121726" media="(prefers-color-scheme: dark)">
<title>القانون الدستوري</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231e2a44%27/%3E%3Cpath d=%27M9 9h14M9 16h14M9 23h9%27 stroke=%27%23d6a85a%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Noto+Naskh+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-card="a">
<div class="app">
  <header class="top" id="top">
    <div class="top-in">
      <div class="brand">
        <h1 id="brandName">القانون الدستوري</h1>
        <p id="brandSub"></p>
      </div>
      <div class="head-actions">
        <button type="button" class="icon-btn" id="mistakesBtn" aria-label="دفتر الأخطاء">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          <span class="badge" id="mistakesBadge" hidden>0</span>
        </button>
        <button type="button" class="icon-btn quiet" id="setBtn" aria-label="الإعدادات" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </button>
        <button type="button" class="icon-btn" id="modeBtn" aria-label="الوضع الليلي">
          <svg id="modeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap" id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="أقسام الموقع">
    <div class="tabs-in">
      <button type="button" class="tab" data-tab="home"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20h-5v-5H9v5H4z"/></svg></span>الرئيسية</button>
      <button type="button" class="tab" data-tab="plan"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M8.5 14.5l2 2 4-4"/></svg></span>الخطة</button>
      <button type="button" class="tab" data-tab="sum"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.3 5 7.8 4.5 4 4.8v13.4c3.8-.3 6.3.2 8 1.7 1.7-1.5 4.2-2 8-1.7V4.8c-3.8-.3-6.3.2-8 1.7zM12 6.5v13.4"/></svg></span>الملخصات</button>
      <button type="button" class="tab" data-tab="quiz"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4M12 16.6v.1"/></svg></span>الأسئلة</button>
      <button type="button" class="tab" data-tab="rev"><span class="tab-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14M5 12h14M5 19h9"/></svg></span>المراجعة</button>
    </div>
  </nav>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="mm" id="mapView" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">تحتاج هذه الصفحة إلى تشغيل JavaScript.</p></noscript>

<script src="../sync.js"></script>
<script src="../schedule.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="data/c1.js"></script>
<script src="data/c2.js"></script>
<script src="data/c4.js"></script>
<script src="data/c5.js"></script>
<script src="app.js"></script>
</body>
</html>
