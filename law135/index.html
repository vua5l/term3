<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EBE9E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111615" media="(prefers-color-scheme: dark)">
<title>القانون الدولي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%231F4A47%27/%3E%3Cpath d=%27M9 9h14M9 16h14M9 23h9%27 stroke=%27%23BFDCD6%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-card="b">
<div class="app">
  <header class="top" id="top">
    <div class="brand">
      <h1 id="brandName">القانون الدولي</h1>
      <p id="brandSub"></p>
    </div>
    <div class="rbs">
      <button type="button" class="rb fill" id="mistakesBtn" aria-label="دفتر الأخطاء">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 21l-6-4.5L6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/></svg>
        <span class="badge" id="mistakesBadge" hidden>0</span>
      </button>
      <button type="button" class="rb" id="setBtn" aria-label="الإعدادات" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
      <button type="button" class="rb fill" id="modeBtn" aria-label="الوضع الليلي">
        <svg id="modeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap" id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="أقسام الموقع">
    <div class="tabs-in">
      <button type="button" class="tab" data-tab="home"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.2 12 3.5l8.5 6.7V19.5a1 1 0 0 1-1 1h-5v-6h-5v6h-5a1 1 0 0 1-1-1z"/></svg></span>الرئيسية</button>
      <button type="button" class="tab" data-tab="plan"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17M9 15l2 2 4-4"/></svg></span>الخطة</button>
      <button type="button" class="tab" data-tab="sum"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.5 5 8 4.5 3.5 4.5v14c4.5 0 7 .5 8.5 2 1.5-1.5 4-2 8.5-2v-14C16 4.5 13.5 5 12 6.5z"/><path d="M12 6.5v14"/></svg></span>الملخصات</button>
      <button type="button" class="tab" data-tab="quiz"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.3-2.5 3.8"/><path d="M12 17.2h.01"/></svg></span>الأسئلة</button>
      <button type="button" class="tab" data-tab="rev"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h11M4 18h14"/></svg></span>المراجعة</button>
    </div>
  </nav>
</div>

<div class="sheet" id="sheet" hidden></div>
<div class="mm" id="mapView" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p class="noscript">تحتاج هذه الصفحة إلى تشغيل JavaScript.</p></noscript>

<script src="../sync.js"></script>
<script src="../schedule.js"></script>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="data/c1.js"></script>
<script src="data/c2.js"></script>
<script src="data/c3.js"></script>
<script src="data/c4.js"></script>
<script src="data/c5.js"></script>
<script src="data/c6.js"></script>
<script src="data/c7.js"></script>
<script src="data/c8.js"></script>
<script src="data/c9.js"></script>
<script src="data/defs.js"></script>
<script src="app.js"></script>
</body>
</html>
