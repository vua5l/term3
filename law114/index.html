–131","batch":3,"intro":"استعاض الفقه الإسلامي عن البطلان النسبي بنظرية العقد الموقوف: تعريفه وحالاته الخمس وحكم إجازته. ثم كيف يتقرر البطلان المطلق، ومن يحق له التمسك بالبطلان المطلق والنسبي.","sections":[{"h":"العقد الموقوف: تعريفه وحالاته الخمس","b":[{"t":"p","x":"لأن البطلان النسبي يخلق مراكز قانونية غير مستقرة، قد تمتد إذا لم يتقرر إبطال العقد أو تصحيحه حتى تتقادم دعوى الإبطال، استعاض الفقه الإسلامي عنه بنظرية العقد الموقوف.","pg":"128"},{"t":"def","h":"العقد الموقوف","x":"هو العقد الذي يوقف نفاذه، لصدوره ممن لا يملك ولاية عقده أو تعلق به حق للغير، إلى أن ترد عليه الإجازة فينفذ","pg":"128"},{"t":"list","h":"حالات العقد الموقوف الخمس","num":1,"items":[{"h":"عقد الفضولي في مال غيره («بيع ملك الغير»)","x":"كما لو باع شخص مال غيره دون إذن شرعي، فيكون البيع صحيحاً، إلا أنه لا ينفذ في حق المالك إلا بإجازته. وصاحب الحق في الإجازة هو المالك لمحل العقد.","pg":"128"},{"h":"تصرف المالك في ماله الذي تعلق به حق لغيره","x":"كالمريض مرض الموت إذا باع لوارثه، والورثة إذا باعوا التركة المستغرقة. وصاحب الحق في الإجازة هو الغير الذي له حق في المعقود عليه: باقي الورثة في الحالة الأولى، والدائنون الذين تعلقت ديونهم بالتركة في الثانية.","pg":"128–129"},{"h":"تصرفات ناقص الأهلية الدائرة بين النفع والضرر","x":"تكون موقوفة على إجازة الولي أو الوصي، أو القاصر نفسه بعد بلوغه سن الرشد.","pg":"129"},{"h":"عقد المكرَه","x":"يكون موقوفاً على إجازة المكرَه نفسه بعد زوال الإكراه.","pg":"129"},{"h":"إذا نص القانون على أن العقد يكون موقوفاً","x":"ومثّل له الكتاب في الحاشية بالمادة 156 من قانون المعاملات المدنية الإماراتي: تعاقد الشخص مع نفسه دون إذن من الأصيل يكون موقوفاً على إجازة الأصيل.","pg":"129"}]},{"t":"tip","x":"قارن: نقص الأهلية والإكراه المفسد للرضى يجعلان العقد في الفقه القانوني قابلاً للإبطال، كما مر في الدرسين الثالث والتاسع. أما في نظرية العقد الموقوف فتصرف ناقص الأهلية الدائر بين النفع والضرر، وعقد المكرَه، موقوفان على الإجازة."}]},{"h":"حكم العقد الموقوف وإجازته","b":[{"t":"quote","h":"حكمه قبل الإجازة بنص الكتاب","x":"والعقد الموقوف لا يرتب قبل إجازته أية آثار قانونية رغم انعقاده صحيحاً","pg":"129"},{"t":"list","h":"كيف تكون الإجازة","num":0,"items":[{"h":"بالفعل أو القول","x":"تكون الإجازة بكل فعل أو قول يدل عليها صراحة أو دلالة.","pg":"129"},{"h":"بالسكوت","x":"يعتبر السكوت إجازة إن دل على الرضا عرفاً.","pg":"129"}]},{"t":"list","h":"شرطا صحة الإجازة في العقد الموقوف","num":1,"items":[{"h":"قبول التصرف للإجازة وقت صدوره ووقت الإجازة","pg":"129"},{"h":"أن يكون موجوداً وقت الإجازة: من له الحق فيها، وطرفا العقد، والمتصرف فيه، وبدله إن كان عيناً","pg":"129"}]},{"t":"kinds","items":[{"h":"إذا أُجيز التصرف الموقوف","eff":"ok","et":"ينفذ من وقت صدوره","d":"فإذا أجيز التصرف الموقوف نفذ مستنداً إلى وقت صدوره واعتبرت الإجازة اللاحقة له كالوكالة السابقة","pg":"129"},{"h":"إذا رُفضت الإجازة","eff":"void","et":"يبطل التصرف","d":"أما إذا رفضت الإجازة بطل التصرف","pg":"129"}]}]},{"h":"كيف يتقرر البطلان المطلق","b":[{"t":"quote","h":"القاعدة بنص الكتاب","x":"العقد الباطل بطلاناً مطلقاً عقد معدوم، لم ينعقد، ولذلك فإن تقرير البطلان فيه لا يحتاج إلى اتخاذ أي إجراء، وبصفة خاصة لا يحتاج إلى استصدار حكم قضائي بذلك","pg":"129"},{"t":"kinds","items":[{"h":"إذا لم يُنفذ العقد","x":"كبيع باطل لم يسلم فيه البائع المبيع، ولم يدفع المشتري الثمن: لا يحتاج أي من المتعاقدين إلى اللجوء إلى القضاء لتقرير البطلان، ولكل منهما أن يتصرف على أساس عدم وجود العقد، فيتصرف البائع في المبيع كيف شاء، والمشتري في ماله كيف شاء.","pg":"129–130"},{"h":"إذا نُفذ العقد ولو جزئياً","x":"كأن يسلم البائع المبيع ثم يطالب باسترداده لأن العقد باطل: فإن قبل المشتري الرد اختياراً انتهى الأمر، وإن رفض فعلى البائع أن يرفع دعواه استناداً إلى بطلان العقد، فتبحث المحكمة في صحة العقد أو بطلانه، فإن تبين لها البطلان حكمت به وألزمت المشتري برد المبيع.","pg":"130"}]},{"t":"p","x":"والحكم هنا لا ينشئ حالة جديدة، لأن العقد باطل قبل صدوره، وإنما يكشف عن البطلان، ولذلك يسمى «حكماً كاشفاً أو مقرراً للبطلان».","pg":"130"},{"t":"warn","x":"في الكتاب: «فالحكم باطل قبل صدور الحكم»، والظاهر أن المراد: فالعقد باطل قبل صدور الحكم.","pg":"130"},{"t":"tip","x":"قارن: حكم المحكمة بالإبطال في البطلان النسبي يعد «منشئاً لحالة البطلان» كما في صفحة 128، وحكمها في البطلان المطلق كاشف أو مقرر كما في صفحة 130. وهذا من مواضع أسئلة الصح والخطأ."}]},{"h":"حق التمسك بالبطلان","b":[{"t":"kinds","items":[{"h":"في العقد الباطل","eff":"void","et":"لكل ذي مصلحة","d":"إذا كان العقد باطلاً فمن حق كل ذي مصلحة أن يتمسك ببطلانه","x":"سواء كان صاحب المصلحة أحد المتعاقدين أو أحد ورثتهما، أو شخصاً من الغير تؤثر صحة العقد في حقوقه، لأنه لن يكون هناك أكثر من استخلاص النتائج التي تترتب على وضع سابق هو عدم الوجود. وللمحكمة أن تقضي به من تلقاء نفسها.","pg":"130"},{"h":"في العقد القابل للإبطال","eff":"able","et":"لمن تقرر لمصلحته وحده","d":"أما العقد القابل للإبطال فإن التمسك بإبطاله لا يكون إلا للمتعاقد الذي تقررت القابلية للإبطال لمصلحته","x":"فإن كان السبب نقص الأهلية فناقص الأهلية وحده هو الذي يجوز له التمسك بالإبطال، وإن كان عيباً في الإرادة فمن شاب إرادته العيب وحده. ولا يجوز للمحكمة أن تقضي بالإبطال من تلقاء نفسها، بل لا بد أن يتمسك به صاحب المصلحة، إذ الإبطال تقرر لمصلحته.","pg":"130–131"}]}]}],"q":[{"id":"س10-01","k":"tf","q":"العقد الموقوف لا يرتب قبل إجازته أية آثار قانونية مع أنه انعقد صحيحاً.","a":true,"w":"«والعقد الموقوف لا يرتب قبل إجازته أية آثار قانونية رغم انعقاده صحيحاً».","pg":"129"},{"id":"س10-02","k":"tf","q":"بيع ملك الغير دون إذن شرعي يقع باطلاً.","a":false,"w":"يكون البيع صحيحاً، لكنه لا ينفذ في حق المالك إلا بإجازته، فهو من حالات العقد الموقوف.","pg":"128"},{"id":"س10-03","k":"tf","q":"صاحب الحق في إجازة بيع المريض مرض الموت لوارثه هو المريض نفسه.","a":false,"w":"صاحب الحق في الإجازة هو الغير الذي له حق في المعقود عليه، وهو في هذه الحالة باقي الورثة.","pg":"129"},{"id":"س10-04","k":"tf","q":"السكوت لا يعتبر إجازة للعقد الموقوف أبداً.","a":false,"w":"«ويعتبر السكوت إجازة إن دل على الرضا عرفاً».","pg":"129"},{"id":"س10-05","k":"tf","q":"إذا أُجيز التصرف الموقوف نفذ من وقت الإجازة لا من وقت صدوره.","a":false,"w":"بل «نفذ مستنداً إلى وقت صدوره واعتبرت الإجازة اللاحقة له كالوكالة السابقة».","pg":"129"},{"id":"س10-06","k":"tf","q":"تقرير البطلان المطلق يحتاج دائماً إلى حكم قضائي.","a":false,"w":"العقد الباطل بطلاناً مطلقاً معدوم، فتقرير البطلان فيه لا يحتاج إلى أي إجراء، ولا إلى حكم قضائي بصفة خاصة. وإنما يُلجأ إلى القضاء إذا نُفذ العقد ورفض المتعاقد الآخر الرد.","pg":"129–130"},{"id":"س10-07","k":"tf","q":"حكم المحكمة ببطلان العقد الباطل بطلاناً مطلقاً حكم كاشف أو مقرر للبطلان، لا منشئ.","a":true,"w":"لأن العقد باطل قبل صدور الحكم، فالحكم كشف عن البطلان. بخلاف حكم الإبطال في البطلان النسبي، فهو منشئ لحالة البطلان.","pg":"128، 130"},{"id":"س10-08","k":"tf","q":"يجوز للمحكمة أن تقضي بإبطال العقد القابل للإبطال من تلقاء نفسها.","a":false,"w":"لا يجوز، بل لا بد أن يتمسك به صاحب المصلحة، إذ الإبطال تقرر لمصلحته. أما البطلان المطلق فللمحكمة أن تقضي به من تلقاء نفسها.","pg":"130–131"},{"id":"س10-09","k":"tf","q":"يجوز لشخص من الغير تؤثر صحة العقد في حقوقه أن يتمسك ببطلان العقد الباطل.","a":true,"w":"من حق كل ذي مصلحة أن يتمسك ببطلانه: أحد المتعاقدين، أو أحد ورثتهما، أو شخص من الغير تؤثر صحة العقد في حقوقه.","pg":"130"},{"id":"س10-10","k":"tf","h":true,"q":"مثّل الكتاب في الحاشية للعقد الذي نص القانون على وقفه بتعاقد الشخص مع نفسه دون إذن من الأصيل في قانون المعاملات المدنية الإماراتي.","a":true,"w":"المادة 156 من قانون المعاملات المدنية الإماراتي: تعاقد الشخص مع نفسه دون إذن من الأصيل يكون موقوفاً على إجازة الأصيل.","pg":"129"},{"id":"س10-11","k":"mcq","q":"أي الآتي ليس من حالات العقد الموقوف التي ذكرها الكتاب؟","o":["عقد تخلف فيه ركن المحل","عقد الفضولي في مال غيره","عقد المكرَه","تصرفات ناقص الأهلية الدائرة بين النفع والضرر"],"a":0,"w":"تخلف ركن المحل يجعل العقد باطلاً بطلاناً مطلقاً. أما الثلاثة الأخرى فمن حالات العقد الموقوف الخمس، ومعها تصرف المالك في ماله الذي تعلق به حق لغيره، وما نص القانون على أنه موقوف.","pg":"127–129"},{"id":"س10-12","k":"mcq","q":"إذا باع الورثة التركة المستغرقة بالديون، فمن صاحب الحق في إجازة البيع؟","o":["الدائنون الذين تعلقت ديونهم بالتركة","أكبر الورثة","المحكمة","المشتري"],"a":0,"w":"صاحب الحق في الإجازة هو الغير الذي له حق في المعقود عليه، وهو هنا الدائنون الذين تعلقت ديونهم بالتركة.","pg":"129"},{"id":"س10-13","k":"mcq","q":"عقد المكرَه في نظرية العقد الموقوف يكون موقوفاً على إجازة:","o":["المكرَه نفسه بعد زوال الإكراه","المكرِه","القاضي","ولي المكرَه"],"a":0,"w":"«عقد المكرَه، يكون موقوفاً على إجازة المكرَه نفسه بعد زوال الإكراه».","pg":"129"},{"id":"س10-14","k":"mcq","q":"من الذي يجوز له التمسك بإبطال عقد أبرمه ناقص الأهلية؟","o":["ناقص الأهلية وحده","كل ذي مصلحة","المتعاقد الآخر","المحكمة من تلقاء نفسها"],"a":0,"w":"التمسك بإبطال العقد القابل للإبطال لا يكون إلا لمن تقررت القابلية لمصلحته، فناقص الأهلية وحده هو الذي يجوز له أن يتمسك بالإبطال.","pg":"130–131"},{"id":"س10-15","k":"mcq","q":"باع شخص سيارته بعقد باطل بطلاناً مطلقاً، ولم يسلمها، ولم يقبض الثمن. ماذا يلزمه ليتصرف فيها؟","o":["لا يلزمه شيء، فله أن يتصرف على أساس عدم وجود العقد","أن يرفع دعوى بطلان أولاً","أن يحصل على إجازة المشتري","أن ينتظر مضي سنة على العقد"],"a":0,"w":"إذا لم يُنفذ العقد الباطل لم يحتج أي من المتعاقدين إلى اللجوء إلى القضاء، ولكل منهما أن يتصرف على أساس عدم وجود العقد.","pg":"129–130"},{"id":"س10-16","k":"fill","q":"يعتبر السكوت إجازة للعقد الموقوف إن دل على الرضا ____.","o":["عرفاً","كتابة","قضاءً","صراحة"],"a":0,"w":"«ويعتبر السكوت إجازة إن دل على الرضا عرفاً».","pg":"129"},{"id":"س10-17","k":"fill","q":"إذا أُجيز التصرف الموقوف اعتبرت الإجازة اللاحقة له كـ____ السابقة.","o":["الوكالة","الهبة","الكفالة","الحوالة"],"a":0,"w":"«واعتبرت الإجازة اللاحقة له كالوكالة السابقة».","pg":"129"},{"id":"س10-18","k":"essay","q":"عرّف العقد الموقوف، واذكر حالاته الخمس مع صاحب الحق في الإجازة حيث ذكره الكتاب، ثم بيّن حكمه قبل الإجازة وبعدها.","pts":[{"x":"التعريف: «هو العقد الذي يوقف نفاذه، لصدوره ممن لا يملك ولاية عقده أو تعلق به حق للغير، إلى أن ترد عليه الإجازة فينفذ».","pg":"128"},{"x":"عقد الفضولي في مال غيره («بيع ملك الغير»): البيع صحيح ولا ينفذ في حق المالك إلا بإجازته، وصاحب الحق في الإجازة المالك لمحل العقد.","pg":"128"},{"x":"تصرف المالك في ماله الذي تعلق به حق لغيره: كبيع المريض مرض الموت لوارثه، والإجازة لباقي الورثة، وبيع الورثة التركة المستغرقة، والإجازة للدائنين.","pg":"128–129"},{"x":"تصرفات ناقص الأهلية الدائرة بين النفع والضرر: موقوفة على إجازة الولي أو الوصي أو القاصر نفسه بعد بلوغه سن الرشد.","pg":"129"},{"x":"عقد المكرَه: موقوف على إجازة المكرَه نفسه بعد زوال الإكراه. وما نص القانون على أنه موقوف، كتعاقد الشخص مع نفسه دون إذن الأصيل في المادة 156 من القانون الإماراتي (من الحاشية).","pg":"129"},{"x":"الحكم: لا يرتب أي أثر قبل الإجازة رغم انعقاده صحيحاً؛ فإن أُجيز نفذ مستنداً إلى وقت صدوره كالوكالة السابقة، وإن رُفضت الإجازة بطل.","pg":"129"}],"pg":"128–129"},{"id":"س10-19","k":"essay","q":"كيف يتقرر البطلان المطلق؟ فرّق بين العقد الذي لم يُنفذ والعقد الذي نُفذ ولو جزئياً، وبيّن طبيعة الحكم بالبطلان، ومن يحق له التمسك به.","pts":[{"x":"القاعدة: العقد الباطل بطلاناً مطلقاً معدوم لم ينعقد، فتقرير البطلان فيه لا يحتاج إلى أي إجراء، ولا إلى حكم قضائي بصفة خاصة.","pg":"129"},{"x":"إذا لم يُنفذ العقد: لا يحتاج أي من المتعاقدين إلى القضاء، ولكل منهما أن يتصرف على أساس عدم وجود العقد.","pg":"129–130"},{"x":"إذا نُفذ ولو جزئياً ورفض المتعاقد الآخر الرد: يرفع صاحب الحق دعواه استناداً إلى البطلان، فتحكم المحكمة به وتلزم بالرد.","pg":"130"},{"x":"طبيعة الحكم: لا ينشئ حالة جديدة بل يكشف عن البطلان، ولذلك يسمى «حكماً كاشفاً أو مقرراً للبطلان»، بخلاف حكم الإبطال في البطلان النسبي فهو منشئ لحالة البطلان.","pg":"128، 130"},{"x":"التمسك به: لكل ذي مصلحة، من المتعاقدين أو ورثتهما أو الغير الذي تؤثر صحة العقد في حقوقه، وللمحكمة أن تقضي به من تلقاء نفسها.","pg":"130"}],"pg":"128–130"}],"c":[{"id":"ب10-01","f":"العقد الموقوف","b":"هو العقد الذي يوقف نفاذه، لصدوره ممن لا يملك ولاية عقده أو تعلق به حق للغير، إلى أن ترد عليه الإجازة فينفذ","pg":"128"},{"id":"ب10-02","t":"list","f":"حالات العقد الموقوف (خمس)","items":["عقد الفضولي في مال غيره («بيع ملك الغير»)","تصرف المالك في ماله الذي تعلق به حق لغيره: المريض مرض الموت يبيع لوارثه، والورثة يبيعون التركة المستغرقة","تصرفات ناقص الأهلية الدائرة بين النفع والضرر","عقد المكرَه","ما نص القانون على أنه موقوف"],"pg":"128–129"},{"id":"ب10-03","t":"list","f":"شرطا صحة الإجازة في العقد الموقوف (اثنان)","items":["قبول التصرف للإجازة وقت صدوره ووقت الإجازة","أن يكون موجوداً وقت الإجازة: من له الحق فيها، وطرفا العقد، والمتصرف فيه، وبدله إن كان عيناً"],"pg":"129"},{"id":"ب10-04","t":"parts","f":"العقد الموقوف بعد الإجازة وبعد رفضها","parts":[{"l":"إذا أُجيز","x":"نفذ مستنداً إلى وقت صدوره، واعتبرت الإجازة اللاحقة له كالوكالة السابقة"},{"l":"إذا رُفضت الإجازة","x":"بطل التصرف"}],"pg":"129"},{"id":"ب10-05","t":"parts","f":"هل يحتاج تقرير البطلان المطلق إلى حكم قضائي؟ وما الاستثناء؟","parts":[{"l":"القاعدة","x":"لا يحتاج إلى أي إجراء، ولا إلى حكم قضائي بصفة خاصة، لأن العقد معدوم لم ينعقد"},{"l":"الاستثناء","x":"إذا نُفذ العقد ولو جزئياً ورفض المتعاقد الآخر الرد، لزم رفع دعوى البطلان"}],"pg":"129–130"},{"id":"ب10-06","t":"parts","f":"طبيعة حكم المحكمة في البطلانين","parts":[{"l":"البطلان المطلق","x":"حكم كاشف أو مقرر للبطلان (صفحة 130)"},{"l":"البطلان النسبي","x":"حكم منشئ لحالة البطلان (صفحة 128)"}],"pg":"128، 130"},{"id":"ب10-07","t":"parts","f":"من يتمسك بالبطلان؟ وهل تقضي به المحكمة من تلقاء نفسها؟","parts":[{"l":"البطلان المطلق","x":"كل ذي مصلحة، وللمحكمة أن تقضي به من تلقاء نفسها"},{"l":"البطلان النسبي","x":"من تقرر لمصلحته وحده: ناقص الأهلية، أو من شاب إرادته عيب، ولا تقضي به المحكمة من تلقاء نفسها"}],"pg":"130–131"}],"n":[{"id":"و10-01","x":"العقد الموقوف: يوقف نفاذه لصدوره ممن لا يملك ولاية عقده أو تعلق به حق للغير، حتى يُجاز. وحالاته خمس: الفضولي، والمالك الذي تعلق بماله حق الغير (مريض الموت يبيع لوارثه، والورثة يبيعون التركة المستغرقة)، وناقص الأهلية فيما يدور بين النفع والضرر، والمكرَه، وما نص عليه القانون.","pg":"128–129"},{"id":"و10-02","x":"لا أثر له قبل الإجازة. والإجازة بالفعل أو القول صراحة أو دلالة، والسكوت إجازة إن دل على الرضا عرفاً. فإن أُجيز نفذ من وقت صدوره كالوكالة السابقة، وإن رُفض بطل.","pg":"129"},{"id":"و10-03","x":"البطلان المطلق لا يحتاج إلى حكم؛ فإن نُفذ العقد ورفض الآخر الرد رُفعت الدعوى، والحكم كاشف أو مقرر. أما حكم الإبطال في البطلان النسبي فمنشئ.","pg":"128–130"},{"id":"و10-04","x":"المطلق: لكل ذي مصلحة، وللمحكمة من تلقاء نفسها. النسبي: لمن تقرر لمصلحته وحده، ولا تقضي به المحكمة من تلقاء نفسها.","pg":"130–131"}]},{"id":11,"title":"الإجازة والتقادم","pages":"131–134","batch":3,"intro":"إذا كان العقد قابلاً للإبطال سقط حق التمسك بإبطاله بأحد طريقين: الإجازة، أو عدم سماع الدعوى بمضي المدة. ومعهما المادتان 78 و79.","sections":[{"h":"سقوط الحق في الإبطال: المادة 78","b":[{"t":"art","no":"78","x":"الحق في طلب إبطال العقد يسقط بالإجازة الصريحة أو الضمنية إذا صدرت ممن له هذا الحق، وإذا أجاز العقد استندت الإجازة إلى وقت إبرامه.","pg":"131"},{"t":"p","x":"فإذا كان العقد قابلاً للإبطال فإن حق التمسك بإبطاله يسقط أو يزول إما بالإجازة أو التقادم.","pg":"131"}]},{"h":"الإجازة: معناها وطبيعتها","b":[{"t":"p","x":"يقرر القانون الحق في التمسك بالإبطال حماية لناقص الأهلية أو من شاب إرادته عيب، تحقيقاً لمصلحته الخاصة. فإن وجد المتعاقد أن مصلحته في إنفاذ العقد لا في إبطاله، كان طبيعياً أن يسمح له القانون بالتنازل عن حقه هذا واختيار إمضاء العقد.","pg":"131"},{"t":"def","h":"الإجازة","x":"ويقصد بالإجازة التنازل عن الحق في إبطال العقد","pg":"131"},{"t":"def","h":"الإجازة تصرفاً قانونياً","x":"فالإجازة إذاً تصرف قانوني يقصد به النزول عن الحق في التمسك بإبطال العقد ممن تقرر هذا الحق لمصلحته","pg":"132"},{"t":"p","x":"والإجازة بهذا المعنى لا ترد على العقد الباطل بطلاناً مطلقاً، فهو عقد غير موجود، والإجازة لا ترد إلا على عقد قائم لتصحيحه.","pg":"131"},{"t":"p","x":"والإجازة تصرف صادر عن إرادة منفردة، فهي ليست عقداً، إذ تنتج آثارها دون حاجة إلى قبول أو موافقة من الطرف الآخر.","pg":"132"}]},{"h":"شرطا صحة الإجازة","b":[{"t":"p","x":"يشترط لصحة الإجازة ما يشترط لصحة التصرفات القانونية عموماً: أن يكون المجيز ذا أهلية للإجازة، وأن تكون إرادته سليمة خالية من العيوب.","pg":"132"},{"t":"kinds","items":[{"h":"الشرط الأول: أهلية المجيز","d":"فهي أهلية إبرام العقد الذي يجاز","x":"فيجب لإجازة العقد القابل للإبطال لنقص الأهلية أن تكون أهلية المجيز قد اكتملت وقت الإجازة؛ فإن كان لا يزال ناقص الأهلية كانت إجازته قابلة للإبطال كالعقد الذي يجيزه. ويصح أن تصدر الإجازة ممن ينوب عنه نيابة قانونية كالولي أو الوصي، بشرط أن يكون العقد المراد إجازته مما يدخل في سلطة النائب.","pg":"132"},{"h":"الشرط الثاني: سلامة الإرادة","x":"إذا كانت قابلية العقد للإبطال بسبب عيب من عيوب الإرادة وجب أن تصدر الإجازة بعد زوال العيب، أي بعد انكشاف الغلط أو التدليس أو الاستغلال. فإن صدرت والمتعاقد لا يزال واقعاً في الغلط مثلاً كانت معيبة، قابلة للإبطال كالعقد المجاز ذاته.","pg":"132"}]}]},{"h":"صورتا الإجازة وإثباتها وأثرها","b":[{"t":"kinds","items":[{"h":"الإجازة الصريحة","d":"وتكون الاجازة صريحة إذا استخدمت فيها عبارات أو مواقف لا تدع مجالاً للشك في أن المقصود منها النزول عن الحق في إبطال العقد","egs":["كعبارة: «أسقطت حقي في طلب إبطال العقد»."],"pg":"132"},{"h":"الإجازة الضمنية","d":"وهي التي تستخلص من ظروف الحال، وبصفة خاصة من مسلك أو عمل يفيد نزول المتعاقد عن التمسك بحقه في الإبطال","egs":["أن يشتري طعاماً غير الذي يقصده نتيجة غلط، ثم يأكله بعد أن يكتشف ذلك، فيستفاد من فعله أنه نزل عن حقه في طلب إبطال البيع."],"pg":"133"}]},{"t":"list","h":"إثبات الإجازة","num":0,"items":[{"h":"على من يدعيها","x":"إذا قام نزاع بين الطرفين بشأن حصول الإجازة فعبء إثباتها على مدعيها، بكافة طرق الإثبات.","pg":"133"},{"h":"الإجازة الصريحة","x":"يُنظر إلى قيمة العقد المجاز، فإن تجاوزت قيمة معينة وجب إثباتها بالكتابة.","pg":"133"}]},{"t":"p","x":"ويترتب على إجازة العقد القابل للإبطال سقوط الحق في الإبطال، سواء كان لنقص الأهلية أو لوجود عيب.","pg":"133"},{"t":"tip","x":"لا تخلط بين إجازتين: إجازة العقد الموقوف في الدرس العاشر تُنفذ عقداً موقوفاً، وإجازة العقد القابل للإبطال هنا نزول عن الحق في إبطاله. وكلتاهما تستند إلى الماضي: الأولى تنفذ العقد من وقت صدوره، والثانية تستند إلى وقت إبرامه (المادة 78)."}]},{"h":"الإجازة والإقرار","b":[{"t":"p","x":"الإجازة ترد على عقد قابل للإبطال بقصد النزول عن الحق في الإبطال، بينما الإقرار يرد على عقد صحيح فيما بين طرفيه، ولكنه غير نافذ في مواجهة شخص من الغير.","pg":"133"},{"t":"list","h":"من أمثلة الإقرار في الكتاب","num":0,"items":[{"h":"إقرار الموكل لتصرف الوكيل","pg":"133"},{"h":"إقرار الورثة لتصرفات مورثهم التي أجراها في مرضه مرض الموت","pg":"133"}]}]},{"h":"عدم سماع دعوى الإبطال: المادة 79","b":[{"t":"p","x":"تقرر أحكام الفقه الإسلامي أن الحق لا يسقط بتقادم الزمن، وإنما تقرر عدم سماع الدعوى بعد مضي مدة معينة.","pg":"133"},{"t":"hashia","x":"وتتراوح هذه المدة وتختلف من مذهب إلى آخر ومن حال إلى حال، وقد ترد عليها استثناءات.","pg":"133"},{"t":"art","no":"79","x":"دعوى إبطال العقد لا تسمع إذا انقضت سنة من تاريخ العلم بسبب الإبطال، وإذا كان إبطال العقد لنقص الأهلية أو الإكراه فبانقضاء (سنة) من تاريخ اكتمال الأهلية أو زوال الإكراه.","pg":"133"},{"t":"list","h":"لماذا لا تُسمع الدعوى بعد المدة؟","num":1,"items":[{"h":"ليس لبطلان الحق","x":"عدم سماع الدعوى ليس مبنياً على بطلان الحق لصاحبه، وإنما هو منع للقضاء من سماعها مع بقاء الحق لصاحبه، فلو أقر به المدعى عليه لزمه.","pg":"134"},{"h":"ترك الدعوى مع التمكن","x":"يدل على عدم الحق ظاهراً.","pg":"134"},{"h":"صعوبة الإثبات","x":"يصعب إثبات الحق بعد مرور مدة طويلة.","pg":"134"}]},{"t":"hashia","x":"إلا أن يكون هناك عذر، كأن يكون المدعي غائباً أو صبياً أو مجنوناً وليس لهما ولي، أو يكون المدعى عليه أميراً جائراً يُخاف منه، أو أرض وقف ليس لها ناظر.","pg":"134"},{"t":"list","h":"متى تبدأ المدة؟","num":0,"items":[{"h":"القاعدة","x":"لا تبدأ من يوم إبرام العقد، بل من يوم زوال سبب قابليته للإبطال.","pg":"134"},{"h":"في نقص الأهلية","x":"من يوم اكتمال الأهلية.","pg":"134"},{"h":"في عيوب الإرادة","x":"من يوم زوال العيب، أي من يوم زوال الإكراه.","pg":"134"},{"h":"إذا بقي السبب قائماً","x":"لا تبدأ المدة بالسريان، ويظل الحق في طلب الإبطال قائماً إلى أن يسقط بالتقادم الطويل، أي بمضي عشر سنوات، ما عدا حال نقص الأهلية. وهو ما تضمنته الفقرة الثانية من المادة 79.","pg":"134"}]},{"t":"tip","x":"احفظ الأرقام: سنة لدعوى الإبطال (المادة 79)، وعشر سنوات تقادماً طويلاً إذا بقي سبب الإبطال قائماً، وعشر سنوات لدعوى البطلان المطلق في الدرس التالي (المادة 81)."}]}],"q":[{"id":"س11-01","k":"tf","q":"الإجازة ترد على العقد الباطل بطلاناً مطلقاً فتصححه.","a":false,"w":"لا ترد عليه، فهو عقد غير موجود، والإجازة لا ترد إلا على عقد قائم لتصحيحه.","pg":"131"},{"id":"س11-02","k":"tf","q":"الإجازة عقد لا ينتج أثره إلا بقبول الطرف الآخر.","a":false,"w":"الإجازة تصرف صادر عن إرادة منفردة، فهي ليست عقداً، وتنتج آثارها دون حاجة إلى قبول أو موافقة من الطرف الآخر.","pg":"132"},{"id":"س11-03","k":"tf","q":"إذا أجاز ناقص الأهلية العقد قبل اكتمال أهليته كانت إجازته قابلة للإبطال.","a":true,"w":"لأن الأهلية المطلوبة أهلية إبرام العقد الذي يجاز، فإجازته قابلة للإبطال شأنها شأن العقد الذي يجيزه.","pg":"132"},{"id":"س11-04","k":"tf","q":"يجوز للولي أو الوصي إجازة العقد القابل للإبطال لنقص أهلية من ينوب عنه في كل الأحوال.","a":false,"w":"يصح ذلك «بشرط أن يكون العقد المراد إجازته مما يدخل في سلطة النائب».","pg":"132"},{"id":"س11-05","k":"tf","q":"تصح الإجازة ولو صدرت والمتعاقد لا يزال واقعاً في الغلط.","a":false,"w":"تكون الإجازة معيبة، وبالتالي قابلة للإبطال كالعقد المجاز ذاته، لأنها يجب أن تصدر بعد زوال العيب.","pg":"132"},{"id":"س11-06","k":"tf","q":"من اشترى طعاماً بغلط ثم أكله بعد اكتشاف الغلط، يُستفاد من فعله أنه أجاز البيع إجازة ضمنية.","a":true,"w":"هذا مثال الكتاب على الإجازة الضمنية: يستفاد من فعله أنه نزل عن حقه في طلب إبطال البيع.","pg":"133"},{"id":"س11-07","k":"tf","q":"عبء إثبات الإجازة على من ينكرها.","a":false,"w":"«فيقع على عاتق مدعي الاجازة عبء إثباتها»، بكافة طرق الإثبات.","pg":"133"},{"id":"س11-08","k":"tf","q":"الإقرار يرد على عقد صحيح فيما بين طرفيه، لكنه غير نافذ في مواجهة الغير.","a":true,"w":"مثل إقرار الموكل لتصرف الوكيل، وإقرار الورثة لتصرفات مورثهم في مرض الموت. أما الإجازة فترد على عقد قابل للإبطال.","pg":"133"},{"id":"س11-09","k":"tf","q":"عدم سماع الدعوى بعد مضي المدة مبني على بطلان الحق لصاحبه.","a":false,"w":"ليس مبنياً على بطلان الحق، وإنما هو منع للقضاء من سماع الدعوى مع بقاء الحق لصاحبه، فلو أقر به المدعى عليه لزمه.","pg":"134"},{"id":"س11-10","k":"tf","q":"تبدأ مدة عدم سماع دعوى الإبطال دائماً من يوم إبرام العقد.","a":false,"w":"لا تبدأ من يوم إبرام العقد، بل من يوم زوال سبب قابليته للإبطال: من اكتمال الأهلية، أو من زوال العيب.","pg":"134"},{"id":"س11-11","k":"mcq","q":"بحسب المادة 79، متى لا تُسمع دعوى إبطال العقد للغلط إذا عُلم سببه؟","o":["إذا انقضت سنة من تاريخ العلم بسبب الإبطال","إذا انقضت ثلاث سنوات من تاريخ العلم بسبب الإبطال","إذا انقضت خمس عشرة سنة من تمام العقد","إذا انقضت ستة أشهر من تاريخ التعاقد"],"a":0,"w":"دعوى إبطال العقد لا تسمع إذا انقضت سنة من تاريخ العلم بسبب الإبطال. أما إذا بقي السبب قائماً فيظل الحق قائماً إلى أن يسقط بالتقادم الطويل بمضي عشر سنوات، ما عدا حال نقص الأهلية. وخمس عشرة سنة ذكرها الكتاب في دعوى البطلان المطلق لا في دعوى الإبطال.","pg":"133–134"},{"id":"س11-12","k":"mcq","q":"إذا كان سبب الإبطال الإكراه، فمن متى تُحسب سنة عدم سماع الدعوى؟","o":["من تاريخ زوال الإكراه","من تاريخ إبرام العقد","من تاريخ رفع الدعوى","من تاريخ العلم بالعقد"],"a":0,"w":"«وإذا كان إبطال العقد لنقص الأهلية أو الإكراه فبانقضاء (سنة) من تاريخ اكتمال الأهلية أو زوال الإكراه».","pg":"133"},{"id":"س11-13","k":"mcq","q":"أي الآتي مثال للإقرار لا للإجازة؟","o":["إقرار الورثة لتصرفات مورثهم التي أجراها في مرض الموت","قول المتعاقد: أسقطت حقي في طلب إبطال العقد","أكل الطعام بعد اكتشاف الغلط فيه","إجازة من اكتملت أهليته لعقد أبرمه وهو ناقص الأهلية"],"a":0,"w":"الإقرار يرد على عقد صحيح بين طرفيه غير نافذ في مواجهة الغير، ومن أمثلته إقرار الورثة لتصرفات مورثهم في مرض الموت. والثلاثة الأخرى صور للإجازة.","pg":"132–133"},{"id":"س11-14","k":"mcq","q":"إذا بقي سبب قابلية العقد للإبطال قائماً في غير حال نقص الأهلية، فإلى متى يظل الحق في طلب الإبطال؟","o":["إلى أن يسقط بالتقادم الطويل بمضي عشر سنوات","إلى أن تنقضي سنة من العقد","يبقى أبداً ولا يسقط","إلى أن تنقضي خمس عشرة سنة"],"a":0,"w":"إذا بقي السبب لم تبدأ المدة بالسريان، ويظل الحق قائماً إلى أن يسقط بالتقادم الطويل، أي بمضي عشر سنوات، ما عدا حال نقص الأهلية.","pg":"134"},{"id":"س11-15","k":"fill","q":"ويقصد بالإجازة ____ عن الحق في إبطال العقد.","o":["التنازل","الإقرار","التقادم","الفسخ"],"a":0,"w":"«ويقصد بالإجازة التنازل عن الحق في إبطال العقد».","pg":"131"},{"id":"س11-16","k":"fill","q":"الإجازة الصريحة إذا تجاوزت قيمة العقد المجاز قيمة معينة وجب إثباتها بـ____.","o":["الكتابة","الشهادة","اليمين","القرائن"],"a":0,"w":"«فإن تجاوزت قيمة معينة وجب إثباتها بالكتابة».","pg":"133"},{"id":"س11-17","k":"essay","q":"عرّف الإجازة، وبيّن طبيعتها وشرطي صحتها وصورتيها مع مثال لكل صورة، وإثباتها وأثرها، ثم فرّق بينها وبين الإقرار.","pts":[{"x":"التعريف: «ويقصد بالإجازة التنازل عن الحق في إبطال العقد»، فهي تصرف قانوني يقصد به النزول عن الحق في التمسك بالإبطال ممن تقرر هذا الحق لمصلحته.","pg":"131–132"},{"x":"طبيعتها: تصرف صادر عن إرادة منفردة، ليست عقداً، تنتج آثارها دون قبول من الطرف الآخر، ولا ترد على العقد الباطل بطلاناً مطلقاً.","pg":"131–132"},{"x":"الشرط الأول، أهلية المجيز: وهي أهلية إبرام العقد الذي يجاز؛ فإن أجاز ناقص الأهلية قبل اكتمال أهليته كانت إجازته قابلة للإبطال، ويصح أن يجيز الولي أو الوصي فيما يدخل في سلطته.","pg":"132"},{"x":"الشرط الثاني، سلامة الإرادة: تصدر الإجازة بعد زوال العيب، أي بعد انكشاف الغلط أو التدليس أو الاستغلال، وإلا كانت معيبة قابلة للإبطال.","pg":"132"},{"x":"صورتاها: صريحة، كعبارة «أسقطت حقي في طلب إبطال العقد»، وضمنية تستخلص من ظروف الحال، كأكل الطعام المشترى بغلط بعد اكتشافه.","pg":"132–133"},{"x":"إثباتها وأثرها: عبء الإثبات على مدعيها بكافة الطرق، والصريحة تثبت بالكتابة إن جاوزت قيمة العقد قيمة معينة؛ وأثرها سقوط الحق في الإبطال، وتستند إلى وقت إبرام العقد (المادة 78).","pg":"131، 133"},{"x":"الفرق بينها وبين الإقرار: الإجازة ترد على عقد قابل للإبطال للنزول عن الحق في الإبطال، والإقرار يرد على عقد صحيح بين طرفيه غير نافذ في مواجهة الغير، كإقرار الموكل لتصرف الوكيل.","pg":"133"}],"pg":"131–133"},{"id":"س11-18","k":"essay","q":"تكلم عن عدم سماع دعوى إبطال العقد: موقف الفقه الإسلامي، ونص المادة 79، وعلة الحكم، ومتى تبدأ المدة.","pts":[{"x":"الفقه الإسلامي: الحق لا يسقط بتقادم الزمن، وإنما تقرر عدم سماع الدعوى بعد مضي مدة معينة، تختلف من مذهب إلى آخر ومن حال إلى حال.","pg":"133"},{"x":"المادة 79: لا تسمع دعوى الإبطال إذا انقضت سنة من تاريخ العلم بسبب الإبطال، وفي نقص الأهلية أو الإكراه سنة من اكتمال الأهلية أو زوال الإكراه.","pg":"133"},{"x":"العلة: ليس بطلان الحق، بل منع القضاء من سماع الدعوى مع بقاء الحق، فلو أقر به المدعى عليه لزمه؛ ولأن ترك الدعوى مع التمكن يدل على عدم الحق ظاهراً؛ ولصعوبة الإثبات بعد مدة طويلة.","pg":"134"},{"x":"بداية المدة: من يوم زوال سبب القابلية للإبطال لا من يوم الإبرام: من اكتمال الأهلية، أو من زوال العيب.","pg":"134"},{"x":"إن بقي السبب قائماً لم تسرِ المدة، وظل الحق قائماً حتى يسقط بالتقادم الطويل بمضي عشر سنوات، ما عدا حال نقص الأهلية (الفقرة الثانية من المادة 79).","pg":"134"}],"pg":"133–134"}],"c":[{"id":"ب11-01","f":"الإجازة","b":"ويقصد بالإجازة التنازل عن الحق في إبطال العقد","pg":"131"},{"id":"ب11-02","f":"الإجازة تصرفاً قانونياً","b":"فالإجازة إذاً تصرف قانوني يقصد به النزول عن الحق في التمسك بإبطال العقد ممن تقرر هذا الحق لمصلحته","pg":"132"},{"id":"ب11-03","t":"list","f":"شرطا صحة الإجازة (اثنان)","items":["أن يكون المجيز ذا أهلية للإجازة، وهي أهلية إبرام العقد الذي يجاز","أن تكون إرادته سليمة خالية من العيوب، فتصدر بعد زوال العيب"],"pg":"132"},{"id":"ب11-04","f":"الإجازة الصريحة","b":"وتكون الاجازة صريحة إذا استخدمت فيها عبارات أو مواقف لا تدع مجالاً للشك في أن المقصود منها النزول عن الحق في إبطال العقد","pg":"132"},{"id":"ب11-05","f":"الإجازة الضمنية","b":"وهي التي تستخلص من ظروف الحال، وبصفة خاصة من مسلك أو عمل يفيد نزول المتعاقد عن التمسك بحقه في الإبطال","pg":"133"},{"id":"ب11-06","t":"parts","f":"الإجازة والإقرار: على أي عقد يرد كل منهما؟","parts":[{"l":"الإجازة","x":"على عقد قابل للإبطال، بقصد النزول عن الحق في الإبطال"},{"l":"الإقرار","x":"على عقد صحيح فيما بين طرفيه غير نافذ في مواجهة الغير، كإقرار الموكل لتصرف الوكيل"}],"pg":"133"},{"id":"ب11-07","t":"parts","f":"مدة عدم سماع دعوى الإبطال (المادة 79): القاعدة والاستثناء","parts":[{"l":"القاعدة","x":"سنة من تاريخ العلم بسبب الإبطال"},{"l":"الاستثناء","x":"في نقص الأهلية أو الإكراه: سنة من تاريخ اكتمال الأهلية أو زوال الإكراه"}],"pg":"133"},{"id":"ب11-08","t":"list","f":"علل عدم سماع الدعوى بعد المدة (ثلاث)","items":["ليس لبطلان الحق، بل منع للقضاء من سماعها مع بقاء الحق، فلو أقر به المدعى عليه لزمه","ترك الدعوى مع التمكن يدل على عدم الحق ظاهراً","صعوبة إثبات الحق بعد مرور مدة طويلة"],"pg":"134"},{"id":"ب11-09","t":"parts","f":"متى تبدأ مدة عدم سماع دعوى الإبطال؟ وماذا لو بقي السبب قائماً؟","parts":[{"l":"القاعدة","x":"من يوم زوال سبب القابلية للإبطال، لا من يوم الإبرام: من اكتمال الأهلية، أو من زوال العيب"},{"l":"إذا بقي السبب","x":"لا تسري المدة، ويظل الحق قائماً حتى يسقط بالتقادم الطويل بمضي عشر سنوات، ما عدا حال نقص الأهلية"}],"pg":"134"}],"n":[{"id":"و11-01","x":"المادة 78: يسقط الحق في طلب الإبطال بالإجازة الصريحة أو الضمنية ممن له الحق، وتستند الإجازة إلى وقت الإبرام. فحق الإبطال يزول بالإجازة أو بالتقادم.","pg":"131"},{"id":"و11-02","x":"الإجازة: تنازل عن الحق في الإبطال، تصرف بإرادة منفردة لا يحتاج إلى قبول، ولا ترد على الباطل مطلقاً. وشرطاها: أهلية إبرام العقد المجاز (وإلا فهي قابلة للإبطال، ويجيز الولي أو الوصي فيما يدخل في سلطته)، وصدورها بعد زوال العيب.","pg":"131–132"},{"id":"و11-03","x":"الصريحة: «أسقطت حقي في طلب إبطال العقد». والضمنية: أكل الطعام المشترى بغلط بعد اكتشافه. والإثبات على مدعيها بكل الطرق، والصريحة بالكتابة إن جاوزت قيمة معينة. والإقرار يرد على عقد صحيح غير نافذ في حق الغير.","pg":"132–133"},{"id":"و11-04","x":"المادة 79: لا تسمع دعوى الإبطال بعد سنة من العلم بالسبب، وفي نقص الأهلية أو الإكراه بعد سنة من اكتمال الأهلية أو زوال الإكراه. والمنع لا يُبطل الحق، فلو أقر المدعى عليه لزمه. وإن بقي السبب فعشر سنوات تقادماً طويلاً، ما عدا نقص الأهلية.","pg":"133–134"}]},{"id":12,"title":"أثر البطلان وانتقاص العقد","pages":"134–138","batch":3,"intro":"المادة 81 في البطلان المطلق بين الدعوى والدفع، ثم المقارنة بين البطلانين، وأثر البطلان في المادتين 82 و83، وانتقاص العقد في المادة 84. وهو آخر ما في نطاق الاختبار، قبل «الفرع الثالث: النيابة في التعاقد».","sections":[{"h":"التقادم في البطلان المطلق: المادة 81","b":[{"t":"art","no":"81","x":"1. إذا وقع العقد باطلاً جاز لكل ذي مصلحة أن يتمسك بالبطلان، وللمحكمة أن تقضي به من تلقاء نفسها، ولا يزول البطلان بالإجازة. 2. لا تسمع دعوى البطلان إذا انقضت (عشر) سنوات من تاريخ التعاقد، ولكن لكل ذي مصلحة أن يدفع ببطلان العقد في أي وقت.","pg":"134"},{"t":"p","x":"ويتمسك صاحب المصلحة بالبطلان المطلق إما في صورة دعوى يرفعها، وإما في صورة دفع إذا رُفعت عليه الدعوى بمناسبة تنفيذ هذا العقد الباطل.","pg":"134–135"},{"t":"kinds","items":[{"h":"الدعوى","x":"كان الفقه مستقراً على أن البطلان المطلق لا يرد عليه التقادم، لأن العقد الباطل معدوم، والعدم لا يتحول إلى وجود مهما مضى عليه الزمن، سواء نُفذ العقد فرفع المتعاقد دعوى البطلان لاسترداد ما نُفذ، أو لم يُنفذ فتمسك بالبطلان دفعاً. ونص المادة 81 ألا تُسمع الدعوى إذا انقضت عشر سنوات من تاريخ التعاقد.","pg":"134–135"},{"h":"الدفع","x":"إذا سقط الحق في رفع الدعوى أمكن التوصل إلى البطلان عن طريق الدفع مهما طالت المدة: فإذا انقضت عشر سنوات على إبرام العقد الباطل لم يستطع البائع أو المشتري رفع دعوى البطلان، لكن إن رفع المشتري دعوى يطالب فيها البائع بتسليم المبيع استطاع البائع أن يدفعها بالبطلان. فالدفع بالبطلان لا يسقط مهما مر عليه التقادم.","pg":"135"}]},{"t":"hashia","x":"ونقل الكتاب في الحاشية عن د. رمضان أبو السعود أن الفقه عدل عن ذلك واستقر على إخضاع دعوى البطلان المطلق للتقادم شأنها شأن سائر الدعاوى، فتسقط بمضي خمس عشرة سنة من وقت العقد. فالعقد الباطل يظل معدوماً مهما طال الأمد، لكن الدعوى بتقرير بطلانه تسقط، وسقوطها لا يعني أن العقد ينقلب صحيحاً، وإنما نكون بصدد عقد باطل لا يجوز تقرير بطلانه عن طريق الدعوى.","pg":"135"},{"t":"warn","x":"تعارض في الكتاب يحسن التنبه له: نص المادة 81، وشرح الكتاب في صفحتي 134 و135، يجعلان مدة عدم سماع دعوى البطلان المطلق عشر سنوات من تاريخ التعاقد. أما الحاشية في صفحة 135 والمقارنة في صفحة 136 فتقولان خمس عشرة سنة، نقلاً عن د. رمضان أبو السعود. ونص النظام عشر سنوات.","pg":"134–136"}]},{"h":"مقارنة بين البطلان المطلق والبطلان النسبي","b":[{"t":"list","h":"أوجه المقارنة الأربعة في الكتاب","num":1,"items":[{"h":"من يتمسك به","x":"المطلق يتمسك به كل ذي مصلحة. والنسبي لا يتمسك به إلا من تقرر لمصلحته، وهو ناقص الأهلية أو من شاب إرادته عيب عند إبرام العقد.","pg":"135"},{"h":"قضاء المحكمة من تلقاء نفسها","x":"للمحكمة أن تقضي بالمطلق من تلقاء نفسها دون حاجة إلى رفع دعوى، أما النسبي فلا بد فيه من رفع دعوى البطلان.","pg":"135"},{"h":"الإجازة","x":"البطلان النسبي ترد عليه الإجازة، أما المطلق فلا ترد عليه.","pg":"135"},{"h":"سقوط الدعوى والدفع","x":"تسقط دعوى البطلان المطلق بمضي خمسة عشر عاماً من يوم تمام العقد (كما في المقارنة)، ولا يسقط الدفع ببطلانه مهما طال الأمد، بينما تسقط دعوى البطلان النسبي بمقتضى مدة محددة في القانون.","pg":"136"}]},{"t":"tip","x":"والمدة المحددة في النظام لدعوى الإبطال سنة (المادة 79، في الدرس الحادي عشر). وتذكّر أن نص المادة 81 عشر سنوات لدعوى البطلان المطلق، لا خمس عشرة. وجدول المقارنة الكامل بين البطلانين في «جداول المقارنة»."}]},{"h":"أثر البطلان: المادتان 82 و83","b":[{"t":"art","no":"82","x":"في حالتي إبطال العقد أو بطلانه، يعود المتعاقدان إلى الحالة التي كانا عليها قبل التعاقد، وإذا استحال ذلك جاز أن يُقضى بالتعويض.","pg":"136"},{"t":"art","no":"83","x":"في حالتي إبطال العقد أو بطلانه لنقص أهلية المتعاقد أو انعدامها، لا يلزمه أن يرد غير ما عاد عليه من منفعة معتبرة بسبب تنفيذ العقد.","pg":"136"},{"t":"p","x":"تقضي القواعد العامة أن العقد إذا ثبت بطلانه زال وزال ما قد ينشئه من حقوق أو التزامات، بأثر رجعي يعود إلى زمن الانعقاد، من غير فرق بين الباطل بطلاناً مطلقاً والقابل للإبطال، لأن القابل للإبطال يصير بعد تقرير إبطاله باطلاً فاقداً لكيانه القانوني، كما لو كان باطلاً من أصله.","pg":"136"},{"t":"p","x":"فيرد كل متعاقد ما بحوزته من أموال وأشياء حصل عليها بسبب العقد، وينهي ما اكتسبه من حقوق، فيعود الطرفان إلى الحالة التي كانا عليها قبل إبرام العقد. فإن استحال على أحدهما أن يرد ما أخذه، أو أن يرد الحال إلى ما كان عليه، حُكم عليه بالتعويض.","pg":"136"},{"t":"quote","h":"أساس التعويض بنص الكتاب","x":"وينبني التعويض هنا على قواعد المسؤولية التقصيرية، لا قواعد المسؤولية العقدية","pg":"136"}]},{"h":"انتقاص العقد: المادة 84","b":[{"t":"art","no":"84","x":"إذا كان العقد في جزء منه باطلاً أو يجوز إبطاله؛ يبطل ذلك الجزء فقط، إلا إذا تبين أن المتعاقد ما كان ليرضى بالعقد دون ذلك الجزء فله طلب إبطال العقد.","pg":"137"},{"t":"list","h":"صور الانتقاص كما فصّلها الكتاب","num":1,"items":[{"h":"إذا كان العقد في شق منه باطلاً","x":"بطل العقد كله، إلا إذا كانت حصة كل شق معينة، فيبطل في الشق الباطل ويبقى صحيحاً في الباقي.","pg":"137"},{"h":"إذا كان في شق منه موقوفاً","x":"توقف في الموقوف على الإجازة: فإن أُجيز نفذ العقد كله، وإن لم يُجز بطل في الشق الموقوف فقط بحصته من العوض، وبقي في النافذ بحصته.","pg":"137"},{"h":"إذا اقترن العقد بشرط يمنعه الشارع أو يخالف النظام العام أو الآداب","x":"بطل الشرط وصح العقد، ما لم يكن الشرط هو الدافع إلى التعاقد فيبطل العقد كله.","pg":"137"}]},{"t":"p","x":"وهذا ما يعرف بـ«نظرية انتقاص العقد»، وهي معروفة في الفقه الإسلامي والفقه القانوني، إلا أن المعيار في الفقهين مختلف.","pg":"137"},{"t":"kinds","items":[{"h":"المعيار في فقه القانون","d":"فالمعيار في فقه القانون معيار ذاتي ينظر فيه إلى نية المتعاقدين","x":"هل كانا يريدان التعاقد بغير الشق الذي وقع باطلاً أم لا؟ فإن كانا يريدانه انتقص العقد، وإلا بطل العقد كله.","pg":"137"},{"h":"المعيار في الفقه الإسلامي","d":"أما في الفقه الإسلامي فالمعيار أصوب وأدق، لأنه معيار موضوعي يعتمد على بيان العوض لكل شطر أو عدم بيانه","x":"فإذا بُيّن العوض لكل شق انتقص العقد، سواء كان الشق المراد انتقاصه باطلاً أو موقوفاً.","egs":["من باع شيئين أحدهما يصح التعامل فيه والآخر لا يصح: صح العقد في الصحيح وبطل في الباطل إذا بُيّن المقابل لكل منهما، وإلا بطل العقد كله.","من باع أرضاً يملك جزءاً منها فقط: نفذ البيع في جزئه، وتوقف في الجزء الآخر على إجازة المالك الحقيقي؛ فإن أجازه نفذ العقد كله، وإن لم يُجزه بطل في هذا الشق فقط بحصته من الثمن، ونفذ في الآخر بحصته، ما لم يكن في ذلك تفريق للصفقة على المشتري، فيجوز له عندئذ طلب فسخ العقد."],"pg":"137–138"}]},{"t":"tip","x":"لاحظ أن عبارة المادة 84 تنظر إلى رضا المتعاقد: «إلا إذا تبين أن المتعاقد ما كان ليرضى بالعقد دون ذلك الجزء»، وأن قاعدة «بطل العقد كله، إلا إذا كانت حصة كل شق معينة» تنظر إلى بيان العوض. فاعرف لكل قول معياره."},{"t":"tip","x":"ينتهي نطاق الاختبار هنا في صفحة 138، وبعده «الفرع الثالث: النيابة في التعاقد»."}]}],"q":[{"id":"س12-01","k":"tf","q":"بحسب المادة 81 لا يزول البطلان المطلق بالإجازة.","a":true,"w":"«ولا يزول البطلان بالإجازة»، أما البطلان النسبي فترد عليه الإجازة.","pg":"134"},{"id":"س12-02","k":"tf","q":"العدم لا يتحول إلى وجود مهما مضى عليه الزمن، ولذلك كان الفقه مستقراً على أن البطلان المطلق لا يرد عليه التقادم.","a":true,"w":"لأن العقد الباطل بطلاناً مطلقاً عقد معدوم.","pg":"135"},{"id":"س12-03","k":"tf","q":"يسقط الدفع ببطلان العقد الباطل بمضي عشر سنوات من تاريخ التعاقد.","a":false,"w":"لكل ذي مصلحة أن يدفع ببطلان العقد في أي وقت، «فالدفع بالبطلان لا يسقط مهما مر عليه التقادم».","pg":"134–135"},{"id":"س12-04","k":"tf","h":true,"q":"سقوط دعوى البطلان المطلق يعني أن العقد الباطل ينقلب صحيحاً.","a":false,"w":"سقوط الدعوى لا يعني أن العقد ينقلب صحيحاً بعد مضي المدة، وإنما نكون بصدد عقد باطل لا يجوز تقرير بطلانه عن طريق الدعوى.","pg":"135"},{"id":"س12-05","k":"tf","q":"للمحكمة أن تقضي بالبطلان النسبي من تلقاء نفسها دون رفع دعوى.","a":false,"w":"هذا للبطلان المطلق. أما البطلان النسبي فلا بد فيه من رفع دعوى البطلان.","pg":"135"},{"id":"س12-06","k":"tf","q":"في حالتي إبطال العقد أو بطلانه يعود المتعاقدان إلى الحالة التي كانا عليها قبل التعاقد.","a":true,"w":"هذا نص المادة 82، «وإذا استحال ذلك جاز أن يُقضى بالتعويض».","pg":"136"},{"id":"س12-07","k":"tf","q":"يلزم ناقص الأهلية عند إبطال العقد لنقص أهليته أن يرد كل ما أخذه بسبب العقد.","a":false,"w":"المادة 83: «لا يلزمه أن يرد غير ما عاد عليه من منفعة معتبرة بسبب تنفيذ العقد».","pg":"136"},{"id":"س12-08","k":"tf","q":"التعويض عند استحالة الرد بعد البطلان يقوم على قواعد المسؤولية العقدية.","a":false,"w":"«وينبني التعويض هنا على قواعد المسؤولية التقصيرية، لا قواعد المسؤولية العقدية».","pg":"136"},{"id":"س12-09","k":"tf","q":"للبطلان أثر رجعي يعود إلى زمن الانعقاد، ولا فرق في ذلك بين العقد الباطل بطلاناً مطلقاً والعقد القابل للإبطال بعد تقرير إبطاله.","a":true,"w":"لأن القابل للإبطال يصير بعد تقرير إبطاله باطلاً فاقداً لكيانه القانوني كما لو كان باطلاً من أصله.","pg":"136"},{"id":"س12-10","k":"tf","q":"المعيار في الفقه الإسلامي لانتقاص العقد معيار ذاتي ينظر إلى نية المتعاقدين.","a":false,"w":"معيار الفقه الإسلامي موضوعي يعتمد على بيان العوض لكل شطر، أما المعيار الذاتي الذي ينظر إلى نية المتعاقدين فهو معيار فقه القانون.","pg":"137"},{"id":"س12-11","k":"tf","q":"إذا اقترن العقد بشرط يخالف النظام العام بطل العقد كله دائماً.","a":false,"w":"يبطل الشرط ويصح العقد، ما لم يكن الشرط هو الدافع إلى التعاقد فيبطل العقد كله.","pg":"137"},{"id":"س12-12","k":"mcq","q":"بحسب نص المادة 81، لا تُسمع دعوى البطلان المطلق إذا انقضت:","o":["عشر سنوات من تاريخ التعاقد","سنة من تاريخ العلم بسبب البطلان","خمس عشرة سنة من تمام العقد","ثلاث سنوات من تاريخ التعاقد"],"a":0,"w":"هذا نص المادة 81. أما خمس عشرة سنة فهي في الحاشية والمقارنة نقلاً عن د. رمضان أبو السعود، والسنة مدة دعوى الإبطال في المادة 79.","pg":"134–136"},{"id":"س12-13","k":"mcq","q":"بيع باطل مضت عليه إحدى عشرة سنة، ثم رفع المشتري دعوى يطالب البائع بتسليم المبيع. ما موقف البائع؟","o":["يدفع دعوى المشتري ببطلان العقد، لأن الدفع لا يسقط","لا يستطيع التمسك بالبطلان لمضي عشر سنوات","يلزمه التسليم لأن العقد انقلب صحيحاً","يلزمه أن يرفع دعوى بطلان أولاً"],"a":0,"w":"إذا انقضت عشر سنوات لم يستطع أحدهما رفع دعوى البطلان، لكن البائع يستطيع أن يدفع دعوى المشتري بالبطلان، فالدفع لا يسقط مهما مر عليه التقادم.","pg":"135"},{"id":"س12-14","k":"mcq","q":"من باع شيئين أحدهما يصح التعامل فيه والآخر لا يصح، فما حكم العقد في الفقه الإسلامي؟","o":["يصح في الصحيح ويبطل في الباطل إذا بُيّن المقابل لكل منهما، وإلا بطل كله","يبطل العقد كله في كل حال","يصح العقد كله في كل حال","يصح في الصحيح دائماً ولو لم يُبيّن المقابل"],"a":0,"w":"لأن المعيار في الفقه الإسلامي موضوعي يعتمد على بيان العوض لكل شطر.","pg":"137"},{"id":"س12-15","k":"mcq","q":"باع شخص أرضاً يملك جزءاً منها، ولم يُجز المالك الحقيقي البيع في الجزء الآخر، وكان في ذلك تفريق للصفقة على المشتري. ماذا يجوز للمشتري؟","o":["طلب فسخ العقد","إلزام المالك الحقيقي بالإجازة","أخذ الأرض كلها بالثمن كله","لا شيء، فالعقد نافذ كله"],"a":0,"w":"يبطل العقد في الجزء غير المملوك بحصته من الثمن، وينفذ في الآخر بحصته، ما لم يكن في ذلك تفريق للصفقة على المشتري، «فيجوز له عندئذٍ طلب فسخ العقد».","pg":"138"},{"id":"س12-16","k":"fill","q":"وينبني التعويض بعد البطلان على قواعد المسؤولية ____، لا قواعد المسؤولية العقدية.","o":["التقصيرية","الجنائية","الإدارية","التضامنية"],"a":0,"w":"«وينبني التعويض هنا على قواعد المسؤولية التقصيرية، لا قواعد المسؤولية العقدية».","pg":"136"},{"id":"س12-17","k":"fill","q":"أن يبطل العقد في شق منه ويبقى صحيحاً في الباقي هو ما يعرف بـ«نظرية ____ العقد».","o":["انتقاص","تحول","فسخ","وقف"],"a":0,"w":"وتسمى «نظرية انتقاص العقد»، والمعيار فيها مختلف بين الفقهين.","pg":"137"},{"id":"س12-18","k":"essay","q":"قارن بين البطلان المطلق والبطلان النسبي من حيث: من يتمسك به، وقضاء المحكمة به من تلقاء نفسها، والإجازة، وسماع الدعوى والدفع، وطبيعة حكم المحكمة.","pts":[{"x":"من يتمسك به: المطلق لكل ذي مصلحة من المتعاقدين أو ورثتهما أو الغير؛ والنسبي لمن تقرر لمصلحته وحده: ناقص الأهلية أو من شاب إرادته عيب.","pg":"130–131، 135"},{"x":"المحكمة: تقضي بالمطلق من تلقاء نفسها دون حاجة إلى دعوى، ولا تقضي بالنسبي إلا إذا تمسك به صاحبه برفع دعوى.","pg":"130–131، 135"},{"x":"الإجازة: ترد على النسبي فيسقط بها الحق في الإبطال (المادة 78)، ولا ترد على المطلق ولا يزول بها (المادة 81).","pg":"131، 134–135"},{"x":"سماع الدعوى: دعوى الإبطال لا تسمع بعد سنة من العلم بالسبب، أو من اكتمال الأهلية أو زوال الإكراه (المادة 79)؛ ودعوى البطلان المطلق لا تسمع بعد عشر سنوات من التعاقد (المادة 81)، وفي المقارنة خمسة عشر عاماً نقلاً عن الفقه؛ أما الدفع بالبطلان المطلق فلا يسقط مهما طال الأمد.","pg":"133–136"},{"x":"طبيعة الحكم: حكم الإبطال في النسبي منشئ لحالة البطلان، وحكم البطلان المطلق كاشف أو مقرر له.","pg":"128، 130"},{"x":"الخاتمة: يتفقان في الأثر بعد تقريره: زوال العقد بأثر رجعي، ورجوع المتعاقدين إلى ما كانا عليه (المادة 82).","pg":"136"}],"pg":"128–136"},{"id":"س12-19","k":"essay","q":"تكلم عن نظرية انتقاص العقد: نص المادة 84، وصوره، والمعيار في فقه القانون والفقه الإسلامي، مع مثال.","pts":[{"x":"النص: «إذا كان العقد في جزء منه باطلاً أو يجوز إبطاله؛ يبطل ذلك الجزء فقط، إلا إذا تبين أن المتعاقد ما كان ليرضى بالعقد دون ذلك الجزء فله طلب إبطال العقد» (المادة 84).","pg":"137"},{"x":"الشق الباطل: يبطل العقد كله إلا إذا كانت حصة كل شق معينة، فيبطل في الباطل ويصح في الباقي.","pg":"137"},{"x":"الشق الموقوف: يتوقف على الإجازة؛ فإن أُجيز نفذ العقد كله، وإلا بطل في الموقوف بحصته من العوض وبقي في النافذ بحصته.","pg":"137"},{"x":"الشرط الممنوع أو المخالف للنظام العام أو الآداب: يبطل الشرط ويصح العقد، ما لم يكن الشرط هو الدافع إلى التعاقد فيبطل كله.","pg":"137"},{"x":"معيار فقه القانون ذاتي: نية المتعاقدين، هل كانا يريدان التعاقد بغير الشق الباطل؟ فإن أرادا انتقص العقد، وإلا بطل كله.","pg":"137"},{"x":"معيار الفقه الإسلامي موضوعي «أصوب وأدق»: بيان العوض لكل شطر. ومثاله بيع شيئين أحدهما لا يصح التعامل فيه، وبيع أرض يملك البائع جزءاً منها، مع جواز طلب المشتري فسخ العقد إن كان في ذلك تفريق للصفقة عليه.","pg":"137–138"}],"pg":"137–138"}],"c":[{"id":"ب12-01","t":"parts","f":"المادة 81 في البطلان المطلق: الدعوى والدفع","parts":[{"l":"الدعوى","x":"لا تسمع إذا انقضت عشر سنوات من تاريخ التعاقد"},{"l":"الدفع","x":"لكل ذي مصلحة أن يدفع ببطلان العقد في أي وقت"}],"pg":"134"},{"id":"ب12-02","t":"list","f":"أوجه المقارنة بين البطلانين في الكتاب (أربعة)","items":["من يتمسك به: المطلق لكل ذي مصلحة، والنسبي لمن تقرر لمصلحته","المحكمة: تقضي بالمطلق من تلقاء نفسها، والنسبي لا بد فيه من دعوى","الإجازة: ترد على النسبي لا على المطلق","السقوط: دعوى المطلق تسقط بمدة (خمسة عشر عاماً في المقارنة، وعشر سنوات في المادة 81) والدفع لا يسقط، ودعوى النسبي بمدة محددة في القانون"],"pg":"135–136"},{"id":"ب12-03","f":"المادة 82: أثر الإبطال والبطلان","b":"في حالتي إبطال العقد أو بطلانه، يعود المتعاقدان إلى الحالة التي كانا عليها قبل التعاقد، وإذا استحال ذلك جاز أن يُقضى بالتعويض","pg":"136"},{"id":"ب12-04","f":"المادة 83: إبطال العقد لنقص الأهلية أو انعدامها","b":"في حالتي إبطال العقد أو بطلانه لنقص أهلية المتعاقد أو انعدامها، لا يلزمه أن يرد غير ما عاد عليه من منفعة معتبرة بسبب تنفيذ العقد","pg":"136"},{"id":"ب12-05","t":"parts","f":"التعويض بعد البطلان: متى يكون؟ وعلى أي قواعد؟","parts":[{"l":"متى","x":"إذا استحال على أحد المتعاقدين أن يرد ما أخذه، أو أن يرد الحال إلى ما كان عليه"},{"l":"أساسه","x":"قواعد المسؤولية التقصيرية، لا قواعد المسؤولية العقدية"}],"pg":"136"},{"id":"ب12-06","f":"المادة 84: انتقاص العقد","b":"إذا كان العقد في جزء منه باطلاً أو يجوز إبطاله؛ يبطل ذلك الجزء فقط، إلا إذا تبين أن المتعاقد ما كان ليرضى بالعقد دون ذلك الجزء فله طلب إبطال العقد","pg":"137"},{"id":"ب12-07","t":"list","f":"صور الانتقاص كما فصّلها الكتاب (ثلاث)","items":["شق باطل: يبطل العقد كله، إلا إذا كانت حصة كل شق معينة","شق موقوف: يتوقف على الإجازة، فإن لم تقع بطل في الموقوف بحصته من العوض","شرط ممنوع أو مخالف للنظام العام أو الآداب: يبطل الشرط ويصح العقد، ما لم يكن الدافع إلى التعاقد"],"pg":"137"},{"id":"ب12-08","t":"parts","f":"معيار انتقاص العقد في الفقهين","parts":[{"l":"فقه القانون","x":"ذاتي: نية المتعاقدين، هل كانا يريدان التعاقد بغير الشق الباطل؟"},{"l":"الفقه الإسلامي","x":"موضوعي، «أصوب وأدق»: بيان العوض لكل شطر أو عدم بيانه"}],"pg":"137"}],"n":[{"id":"و12-01","x":"المادة 81: يتمسك بالبطلان كل ذي مصلحة، وتقضي به المحكمة من تلقاء نفسها، ولا يزول بالإجازة، ولا تسمع دعواه بعد عشر سنوات من التعاقد، والدفع به في أي وقت. وفي الحاشية والمقارنة: خمس عشرة سنة نقلاً عن الفقه.","pg":"134–136"},{"id":"و12-02","x":"المقارنة: المطلق لكل ذي مصلحة، وتقضي به المحكمة من تلقاء نفسها، ولا تلحقه الإجازة. والنسبي لمن تقرر لمصلحته، ولا بد فيه من دعوى، وتلحقه الإجازة.","pg":"135"},{"id":"و12-03","x":"الأثر: زوال العقد بأثر رجعي إلى الانعقاد، بلا فرق بين الباطل والقابل للإبطال بعد إبطاله، ورجوع المتعاقدين إلى ما كانا عليه (82). وناقص الأهلية لا يرد إلا ما عاد عليه من منفعة معتبرة (83). والتعويض عند الاستحالة على المسؤولية التقصيرية.","pg":"136"},{"id":"و12-04","x":"الانتقاص (84): يبطل الجزء وحده، إلا إذا تبين أن المتعاقد ما كان ليرضى بالعقد دونه، فله طلب إبطال العقد. ومعيار فقه القانون ذاتي (النية)، ومعيار الفقه الإسلامي موضوعي (بيان العوض لكل شطر)، وهو «أصوب وأدق». وفي بيع أرض يملك البائع بعضها: يجوز للمشتري طلب فسخ العقد إن كان في ذلك تفريق للصفقة عليه.","pg":"137–138"}]}],"tables":[{"id":"ق1","t":"أنواع الغلط الثلاثة","l":[1],"cols":["الغلط المانع","الغلط غير المؤثر","الغلط الذي يعيب الإرادة"],"rows":[{"h":"أثره في الإرادة","c":["يعدمها لا يعيبها فقط","لا يؤثر فيها ولا يعيبها","يعيبها ولا يعدمها"],"pg":"76–79"},{"h":"متى يقع","c":["إذا تعلق الاعتقاد الخاطئ بركن من أركان العقد: الرضى أو المحل أو السبب","في الصفات غير الجوهرية، والغلط المادي في الحساب أو الكتابة","عند تكوين الإرادة، فيتوهم أمراً على غير الحقيقة فيُقبل على العقد"],"pg":"76–78"},{"h":"حكم العقد","c":["باطل أي منعدم","صحيح، ويُصحَّح الغلط","قابل للإبطال لمصلحة من وقع فيه"],"pg":"77–78"},{"h":"مثال الكتاب","c":["خاتم على أنه ألماس فإذا هو زجاج","ثمن مئة كُتب ألفاً بزيادة صفر","كتاب على أنه من الطبعة الأولى فبان من الرابعة"],"pg":"76–79"}]},{"id":"ق2","t":"الغلط والتغرير","l":[1,2],"cols":["الغلط","التغرير"],"rows":[{"h":"مصدر الوهم","c":["«وهم يتولد في ذهن الشخص تلقائياً»","«غلط قصد به المدلس إيقاع المتعاقد الآخر فيه وذلك عن طريق الحيلة والخداع»"],"pg":"89"},{"h":"مواده في النظام","c":["من المادة 57 إلى المادة 60","من المادة 61 إلى المادة 63"],"pg":"76، 86–92"},{"h":"ما يُشترط فيه","c":["أن يكون جوهرياً، وأن يتصل بعلم المتعاقد الآخر","أن يكون هو الدافع إلى التعاقد، وأن يتصل بعلم المتعاقد الآخر، وأن يترتب عليه غبن فاحش"],"pg":"79–85، 91–92"},{"h":"الإثبات والتعويض (من الحاشية)","c":["لا يرتب حقاً في التعويض إلا إذا ثبت خطأ أو تقصير المتعاقد الذي لم يقع في الغلط","أيسر إثباتاً لأنه بطرق احتيالية مادية، وللمدلس عليه الرجوع بالتعويض وفق المسؤولية التقصيرية"],"pg":"89"}]},{"id":"ق3","t":"أوجه التغرير الثلاثة","l":[2],"cols":["التغرير القولي","التغرير الفعلي","التغرير بكتمان العيب"],"rows":[{"h":"ما هو","c":["الكذب الصادر من أحد المتعاقدين لحمل الآخر على التعاقد","إحداث فعل في المعقود عليه ليظهر بصورة غير ما هو عليه في الواقع","إخفاء عيب في المبيع يقتضي العرف أن يكون خالياً من مثله"],"pg":"87–88"},{"h":"مثاله","c":["هذا الشيء يساوي أكثر، أو دُفع لي فيه سعر كذا فلم أقبل","إرجاع عداد الكيلومترات، ووضع الجيد من البضاعة في الأعلى","كتم تصدع جدران الدار، أو خلل محرك السيارة، أو مرض الدابة"],"pg":"87–88"},{"h":"حكمه","c":["منهي عنه، والعقد صحيح مع الخيار، ولا أرش عند الحنابلة، ولا خيار عند الجمهور إلا مع غبن فاحش","للمغرر به الإمساك دون تعويض أو الرد (الراجح)، وعند الحنفية يرجع بالنقصان فقط (من الحاشية)","محرم باتفاق الفقهاء، وللمغرر به خيار العيب: الفسخ، أو الإمضاء مع الأرش"],"pg":"87–88"}]},{"id":"ق4","t":"أنواع الإكراه عند فقهاء الشريعة","l":[3],"cols":["الملجئ أو التام","الناقص أو غير الملجئ","الأدبي"],"rows":[{"h":"ما هو","c":["لا يبقى للشخص معه قدرة ولا اختيار","التهديد بما لا يضر النفس أو العضو","يعدم تمام الرضا، ولا يعدم الاختيار"],"pg":"95"},{"h":"مثاله","c":["التهديد بالقتل، أو إتلاف عضو، أو الضرب الشديد، أو تلف جميع المال","الضرب اليسير، والحبس، وإتلاف بعض المال، ومنع الترقية","التهديد بحبس أحد الأصول أو الفروع، أو الأخ أو الأخت"],"pg":"95"},{"h":"حكمه","c":["يعدم الرضا ويفسد الاختيار","يعدم الرضا ولا يفسد الاختيار","إكراه شرعي استحساناً لا قياساً، ويترتب عليه عدم نفاذ التصرفات"],"pg":"95"}]},{"id":"ق5","t":"الإكراه المعدم للرضى والمفسد له","l":[3],"cols":["المعدم للرضى","المفسد للرضى"],"rows":[{"h":"الإرادة","c":["لا إرادة ولا رضى على الإطلاق","الإرادة والرضى موجودان لكنهما محفوفان بالخوف والرهبة"],"pg":"95–96"},{"h":"مثاله","c":["من يمسك بيد شخص ويرغمه على توقيع عقد لا يريده","من يبرم العقد تفادياً لأذى هُدد به"],"pg":"95–96"},{"h":"حكم العقد","c":["باطل لتخلف الرضى","قابل للإبطال"],"pg":"96"}]},{"id":"ق6","t":"اتصال العيب بعلم المتعاقد الآخر","l":[1,2,3],"cols":["الغلط","التغرير","الإكراه"],"rows":[{"h":"النص","c":["المادة 58","المادة 63","المادة 67"],"pg":"76، 92، 100–101"},{"h":"متى يُعتد به","c":["إذا وقع المتعاقد الآخر في الغلط نفسه، أو علم بوقوعه فيه، أو كان من السهل عليه أن يتبينه","إذا صدر من أحد المتعاقدين أو ممن ينوب عنه، أو صدر من الغير وكان الآخر يعلم به أو كان من المفترض أن يعلم","إذا صدر من المتعاقد الآخر أو نائبه أو من الغير بتحريضه، أو صدر من الغير وكان الآخر يعلم به أو كان من المفترض أن يعلم"],"pg":"83–85، 92، 100–101"},{"h":"إذا لم يتصل بعلمه","c":["لا يُعتد بالغلط","ليس للمغرر به إلا دعوى المسؤولية التقصيرية","ليس للمكره طلب الإبطال، والمتعاقد الآخر حسن النية"],"pg":"76، 92، 101"}]},{"id":"ق7","t":"الاستغلال والغبن","l":[4,5],"cols":["الاستغلال","الغبن"],"rows":[{"h":"طبيعته","c":["أمر نفسي أساساً، يكون الغبن فيه نتيجة للحالة النفسية","عدم التعادل بين الالتزامات المتقابلة في العقد، ومعياره مادي بحت"],"pg":"103"},{"h":"النص","c":["المادة 68","المادة 69 بفقراتها الثلاث"],"pg":"103، 106–108"},{"h":"الجزاء","c":["للمحكمة بناءً على طلب المغبون أن تنقص من التزاماته، أو تزيد من التزامات الآخر، أو تبطل العقد","لا إبطال لمجرد الغبن إلا في مال عديم الأهلية وناقصها وما تقضي به النصوص، وللآخر توقي الإبطال برفع الغبن"],"pg":"103، 107"},{"h":"تنبيه مهم","c":["ترفع الدعوى خلال مائة وثمانين يوماً من تاريخ التعاقد، وإلا امتنع سماعها","لا يجوز الطعن لمجرد الغبن في عقد أُبرم بطريق المزايدة"],"pg":"103، 108"}]},{"id":"ق8","t":"الغبن اليسير والغبن الفاحش","l":[5],"cols":["الغبن اليسير","الغبن الفاحش"],"rows":[{"h":"تعريفه","c":["ما يدخل تحت تقويم المقومين، أي ما يتناوله تقدير الخبراء (من الحاشية)","الغبن الذي لا يدخل تحت تقويم المقومين، وعند الحنابلة ما يخرج عن العادة ويُرجع فيه إلى العرف"],"pg":"106–107"},{"h":"مثاله","c":["سلعة قيمتها مائة ريال تباع بمائة وريال، أو بتسع وتسعين","سلعة قيمتها ألف ريال تباع بألف وخمسمائة، أو بخمسمائة فقط"],"pg":"106–107"},{"h":"حكمه","c":["التصرفات معه صحيحة بإجماع الفقهاء، ولو نشأ عن تدليس","المالكية والشافعية وبعض الحنفية: البطلان أو التعويض بشرط أن يكون ناشئاً عن تدليس، وعند الحنابلة يثبت به الخيار في ثلاثة مواضع"],"pg":"106–107"}]},{"id":"ق9","t":"الاستحالة المطلقة والاستحالة النسبية","l":[7],"cols":["الاستحالة المطلقة","الاستحالة النسبية"],"rows":[{"h":"مفهومها","c":["لا تقوم بالنسبة للمدين فحسب بل لكل الناس، فهي موضوعية ترجع إلى الالتزام ذاته","تقوم بالنسبة إلى المدين وقد لا تقوم بالنسبة إلى غيره"],"pg":"117"},{"h":"مثالها","c":["إعادة ميت إلى الحياة (طبيعية)، أو رفع استئناف انقضى ميعاده (قانونية)، من الحاشية","من يتعهد برسم لوحة فنية وهو يجهل الرسم"],"pg":"117"},{"h":"أثرها","c":["لا يقوم معها الالتزام","لا تمنع قيام الالتزام وينعقد العقد، وللدائن طلب التنفيذ على نفقة المدين أو التعويض"],"pg":"115، 117"}]},{"id":"ق10","t":"البطلان وعدم النفاذ والفسخ","l":[9],"cols":["البطلان","عدم النفاذ","الفسخ"],"rows":[{"h":"سببه","c":["تخلف ركن من أركان العقد أو شرط من شروط صحتها","العقد صحيح، لكنه لا يُحتج به في مواجهة الغير","أركان العقد سليمة، لكن أحد المتعاقدين لم ينفذ التزامه"],"pg":"126"},{"h":"أثره","c":["انعدام أثر العقد بالنسبة للمتعاقدين، وبالنسبة للغير تبعاً لذلك","ينتج العقد آثاره بين المتعاقدين، ولا يسري في حق الغير","يسقط التزام المتعاقد الآخر"],"pg":"126"},{"h":"مثاله أو مجاله","c":["عقد يرد على محل موجود لكنه غير مشروع","الصورية، والبيع في مرض الموت فيما تجاوز الثلث","لا يكون إلا في العقد الملزم لجانبين"],"pg":"125–126"}]},{"id":"ق11","t":"البطلان المطلق والبطلان النسبي","l":[9,10,11,12],"cols":["البطلان المطلق","البطلان النسبي"],"rows":[{"h":"سببه","c":["تخلف ركن كالرضى أو المحل أو السبب، أو تخلف الرسمية في العقد الشكلي","تخلف شرط من شروط صحة العقد، كنقص الأهلية أو عيب في الرضى كالغلط أو التدليس أو الإكراه"],"pg":"127"},{"h":"حال العقد قبل الحكم","c":["يصيبه البطلان منذ نشأته، فكأنه ولد ميتاً، «فلا يصلح لترتيب أي أثر من آثاره منذ إبرامه»","صحيح منتج لآثاره حتى يتقرر إبطاله"],"pg":"127–128"},{"h":"كيف يتقرر","c":["العقد منعدم من قبل الحكم بالبطلان","باتفاق الطرفين أو بحكم من المحكمة يعد منشئاً لحالة البطلان، لا بالإرادة المنفردة"],"pg":"128"},{"h":"طبيعة حكم المحكمة","c":["كاشف أو مقرر للبطلان، لا منشئ لحالة جديدة","منشئ لحالة البطلان"],"pg":"128، 130"},{"h":"من يتمسك به","c":["كل ذي مصلحة: أحد المتعاقدين أو ورثتهما أو الغير الذي تؤثر صحة العقد في حقوقه","من تقرر لمصلحته وحده: ناقص الأهلية، أو من شاب إرادته عيب"],"pg":"130–131"},{"h":"قضاء المحكمة من تلقاء نفسها","c":["جائز، دون حاجة إلى رفع دعوى","غير جائز، فلا بد من رفع دعوى البطلان"],"pg":"130–131، 135"},{"h":"الإجازة","c":["لا ترد عليه، ولا يزول بها (المادة 81)","ترد عليه، ويسقط بها الحق في الإبطال (المادة 78)"],"pg":"131، 134"},{"h":"سماع الدعوى والدفع","c":["لا تسمع الدعوى بعد عشر سنوات من التعاقد (المادة 81)، وفي المقارنة خمسة عشر عاماً؛ والدفع لا يسقط مهما طال الأمد","لا تسمع الدعوى بعد سنة من العلم بالسبب، أو من اكتمال الأهلية أو زوال الإكراه (المادة 79)"],"pg":"133–136"},{"h":"الفرق الجوهري","c":["عقد معدوم من نشأته، فلا تلحقه الإجازة، ويتمسك به كل ذي مصلحة","عقد صحيح منتج لآثاره حتى يتقرر إبطاله لمصلحة من تقرر له"],"pg":"127–135"}]},{"id":"ق12","t":"العقد الباطل والعقد الفاسد عند الحنفية","l":[9],"cols":["العقد الباطل","العقد الفاسد"],"rows":[{"h":"تعريفه","c":["ما لم يكن مشروعاً بأصله ولا وصفه","ما كان مشروعاً بأصله دون وصفه"],"pg":"127"},{"h":"أثره","c":["لا يعتبر منعقداً فعلاً، فلا يرتب عليه الشارع أي حكم أو أثر","يفيد الملك عند اتصال القبض به"],"pg":"127"},{"h":"مثال الكتاب","c":["عقود المجنون والطفل، وبيع الخمر والخنزير","لم يمثل له الكتاب"],"pg":"127"}]},{"id":"ق13","t":"عيوب الرضى الخمسة: النص والجزاء","l":[1,2,3,4,5],"cols":["الغلط","التغرير","الإكراه","الاستغلال","الغبن"],"rows":[{"h":"المواد","c":["من 57 إلى 60","من 61 إلى 63","من 64 إلى 67","68","69"],"pg":"76–106"},{"h":"جوهره","c":["وهم يقوم في ذهن الشخص يجعله يتصور أمراً على خلاف الواقع","خداع بطرق احتيالية يحمل على عقد لم يكن ليُبرم لولاها","تهديد دون حق بوسيلة مادية أو معنوية يخيف فيحمل على التصرف","استغلال ضعف ظاهر أو حاجة ملحة لإبرام عقد فيه غبن","زيادة العوض أو نقصه قدراً خارجاً عن المعتاد"],"pg":"76، 86، 93، 103، 106"},{"h":"الجزاء في النظام","c":["للمتعاقد طلب إبطال العقد إذا كان الغلط جوهرياً واتصل بعلم الآخر","للمغرر به طلب إبطال العقد إذا كان التغرير في أمر جوهري","للمكره طلب إبطال العقد إذا صدر الإكراه من المتعاقد الآخر أو علم به","إنقاص التزامات المغبون أو زيادة التزامات الآخر أو إبطال العقد","لا إبطال لمجرد الغبن إلا في مال عديم الأهلية وناقصها وما تقضي به النصوص"],"pg":"76، 91، 100–101، 103، 107"}]},{"id":"ق14","t":"الإجازة والإقرار","l":[11],"cols":["الإجازة","الإقرار"],"rows":[{"h":"يرد على","c":["عقد قابل للإبطال","عقد صحيح فيما بين طرفيه، لكنه غير نافذ في مواجهة شخص من الغير"],"pg":"133"},{"h":"أمثلة الكتاب","c":["صريحة: «أسقطت حقي في طلب إبطال العقد»، وضمنية: أكل الطعام المشترى بغلط بعد اكتشافه","إقرار الموكل لتصرف الوكيل، وإقرار الورثة لتصرفات مورثهم في مرض الموت"],"pg":"132–133"},{"h":"الفرق الجوهري","c":["نزول عن الحق في إبطال عقد قابل للإبطال","يتعلق بعقد صحيح بين طرفيه غير نافذ في مواجهة الغير"],"pg":"133"}]},{"id":"ق15","t":"معيار انتقاص العقد في الفقهين","l":[12],"cols":["فقه القانون","الفقه الإسلامي"],"rows":[{"h":"نوع المعيار","c":["ذاتي","موضوعي، ويراه الكتاب «أصوب وأدق»"],"pg":"137"},{"h":"ما يُنظر إليه","c":["نية المتعاقدين: هل كانا يريدان التعاقد بغير الشق الذي وقع باطلاً؟","بيان العوض لكل شطر أو عدم بيانه"],"pg":"137"},{"h":"متى ينتقص العقد","c":["إذا كانا يريدان التعاقد بغير الشق الباطل، وإلا بطل كله","إذا بُيّن العوض لكل شق، باطلاً كان الشق أو موقوفاً. وفي بيع شيئين أحدهما لا يصح التعامل فيه، إن لم يُبيَّن المقابل لكل منهما بطل العقد كله"],"pg":"137"},{"h":"مثال الكتاب","c":["لم يذكر الكتاب له مثالاً","بيع شيئين أحدهما لا يصح التعامل فيه، وبيع أرض يملك البائع جزءاً منها"],"pg":"137–138"},{"h":"الفرق الجوهري","c":["العبرة بإرادة المتعاقدين","العبرة ببيان العوض"],"pg":"137"}]}],"scope":{"from":"75","to":"138","desc":"من عيوب الرضى في صفحة 75 إلى انتقاص العقد في صفحة 138"}}</script>

var D = JSON.parse(document.getElementById('data').textContent);
var L = {}; D.lessons.forEach(function(l){ L[l.id] = l; });
var AVAIL = D.lessons.map(function(l){ return l.id; });
var QBY = {}; D.lessons.forEach(function(l){ l.q.forEach(function(q){ q.l = l.id; QBY[q.id] = q; }); });
var KIND = {tf:'صح أو خطأ', mcq:'اختيار من متعدد', fill:'ضع الكلمة الصحيحة', essay:'مقالي'};
var EFF = {void:'b-void', able:'b-able', ok:'b-ok', reduce:'b-reduce', stop:'b-stop'};
var FONTS = {
  readex:{name:'Readex Pro', css:'Readex+Pro:wght@300..700', label:'الخط الأول'},
  plex:{name:'IBM Plex Sans Arabic', css:'IBM+Plex+Sans+Arabic:wght@400;500;600;700', label:'الخط الثاني'},
  vazir:{name:'Vazirmatn', css:'Vazirmatn:wght@300..700', label:'الخط الثالث'}
};
var view = document.getElementById('view');
var CODE = 'law114';                       /* رمز المادة في جدول الاختبارات */
var SCH = window.term3Schedule || null;    /* ملف الربط schedule.js في جذر المستودع */
var INFO = null;                           /* الموعد والمهام كما يرسلها الجدول */
var SCOPE = D.scope || {from:'75', to:'138'};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function fmt(s){ return esc(s).replace(/«([^»]*)»/g, '<span class="qm">«</span><span class="qt">$1</span><span class="qm">»</span>'); }
function pg(p){ return p ? '<span class="pg">صفحة ' + esc(p) + '</span>' : ''; }
function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function nArabic(n, one, two, few, many){ if (n === 1) return one; if (n === 2) return two; if (n >= 3 && n <= 10) return n + ' ' + few; return n + ' ' + many; }

/* ---------- progress ---------- */
var KEY = 'mlz2-progress-v1';
function blank(){ return {v:1, t:0, read:{}, q:{}, c:{}, set:{font:'readex', size:1}}; }
var P = blank();
function adopt(o){ var b = blank(); if (!o || o.v !== 1) return b; b.t = o.t || 0; b.read = o.read || {}; b.q = o.q || {}; b.c = o.c || {}; b.set = Object.assign(b.set, o.set || {}); return b; }
try { var raw = localStorage.getItem(KEY); if (raw) P = adopt(JSON.parse(raw)); } catch(e) {}
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {} }
var dbRef = null, writing = false, dirty = false, timer = null, cloudState = 'local';
function touch(){ P.t = Date.now(); saveLocal(); schedule(); }
function schedule(){ if (!dbRef) return; dirty = true; clearTimeout(timer); timer = setTimeout(flush, 1500); }
function flush(){
  if (!dbRef || writing || !dirty) return;
  writing = true; dirty = false;
  dbRef.set(JSON.parse(JSON.stringify(P))).then(function(){ writing = false; if (dirty) timer = setTimeout(flush, 2000); }, function(e){
    writing = false;
    var c = e && e.code;
    if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed' || c === 'quota_exceeded'){ dbRef = null; cloudState = 'local'; }
    else { dirty = true; timer = setTimeout(flush, 4000); }
  });
}
function initCloud(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  Promise.all([window.claude.use('user'), window.claude.use('db')]).then(function(r){
    var user = r[0], db = r[1];
    if (!user || !db) return null;
    return user.id().then(function(id){
      if (!id) return null;
      dbRef = db.doc('data/users/' + id + '/progress');
      return dbRef.get();
    });
  }).then(function(snap){
    if (!snap || !dbRef) return;
    cloudState = 'cloud';
    if (snap.exists){
      var o = adopt(snap.data());
      if ((o.t || 0) > (P.t || 0)){ P = o; saveLocal(); applySettings(); render(); }
      else if ((P.t || 0) > (o.t || 0)) schedule();
    } else if (P.t) { schedule(); }
  }).catch(function(){ dbRef = null; cloudState = 'local'; });
}
function qrec(id){ return P.q[id] || {n:0, c:0, s:0, nb:0}; }
function record(id, ok){
  var old = qrec(id), today = riyadhToday();
  var r = {n:old.n + 1, c:old.c + (ok ? 1 : 0), s:old.s || 0, nb:old.nb || 0, d:old.d || ''};
  var before = r.nb, same = false;
  if (ok){
    if (r.nb){
      if (r.d !== today){ r.s += 1; r.d = today; } else same = true;
      if (r.s >= 2){ r.nb = 0; r.s = 0; r.d = ''; }
    }
  } else { r.nb = 1; r.s = 0; r.d = ''; }
  P.q[id] = r; touch(); updateBadge(); sendLevel();
  return {r:r, was:before, same:same};
}
function nbList(){ return Object.keys(P.q).filter(function(id){ return P.q[id].nb && QBY[id]; }); }
function updateBadge(){ var n = nbList().length, b = document.getElementById('nbBadge'); b.textContent = n; b.hidden = n === 0; }
function lessonStat(id){
  var qs = L[id] ? L[id].q : [], done = 0, right = 0, att = 0, corr = 0;
  qs.forEach(function(q){ var r = P.q[q.id]; if (r && r.n){ done++; att += r.n; corr += r.c; } });
  return {total:qs.length, done:done, pct: att ? Math.round(corr / att * 100) : null};
}
/* المستوى: من إجابات بنك الأسئلة ودفتر الأخطاء، ولا يُحكم قبل عشر إجابات، ولا يغيّر الخطة */
function levelOf(n, c){
  if (n < 10) return {k:'none', t:'لم يُقَس بعد', pct:null};
  var p = Math.round(c / n * 100);
  return {k: p >= 85 ? 'ex' : p >= 60 ? 'good' : 'weak', t: p >= 85 ? 'ممتاز' : p >= 60 ? 'جيد' : 'ضعيف', pct:p};
}
function levelStats(){
  var per = {}, N = 0, Cc = 0;
  D.lessons.forEach(function(l){ var n = 0, c = 0; l.q.forEach(function(q){ var r = P.q[q.id]; if (r){ n += r.n || 0; c += r.c || 0; } }); per[l.id] = {n:n, c:c, lv:levelOf(n, c)}; N += n; Cc += c; });
  return {per:per, n:N, c:Cc, lv:levelOf(N, Cc)};
}
function lvlBadge(lv){ return '<span class="lvl lvl-' + lv.k + '">' + esc(lv.t) + (lv.pct != null ? ' ' + lv.pct + '٪' : '') + '</span>'; }
function sendLevel(){ if (!SCH) return; var s = levelStats(); if (!s.n) return; try { SCH.level(CODE, s.c / s.n * 100, s.n); } catch(e){} }

/* ---------- settings ---------- */
function ensureFont(key){
  var f = FONTS[key]; if (!f) return;
  if (!document.getElementById('font-' + key)){
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.id = 'font-' + key;
    l.href = 'https://fonts.googleapis.com/css2?family=' + f.css + '&display=swap';
    document.head.appendChild(l);
  }
}
function applySettings(){
  var key = FONTS[P.set.font] ? P.set.font : 'readex';
  ensureFont(key);
  document.documentElement.style.setProperty('--font', '"' + FONTS[key].name + '","Noto Sans Arabic","Geeza Pro",system-ui,sans-serif');
  document.documentElement.classList.remove('fs-0', 'fs-2');
  if (P.set.size === 0) document.documentElement.classList.add('fs-0');
  if (P.set.size === 2) document.documentElement.classList.add('fs-2');
}

/* ---------- dates: the exam date comes from the schedule only ---------- */
var AR_DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function riyadhToday(){
  try { return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Riyadh', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()); }
  catch(e){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
}
function dayNum(s){ var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000; }
function dParts(s){ var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function arDay(s){ return AR_DAYS[dParts(s).getUTCDay()]; }
function arDate(s){ var d = dParts(s); return d.getUTCDate() + ' ' + AR_MONTHS[d.getUTCMonth()]; }
function examDate(){ return INFO && INFO.exam && INFO.exam.date || null; }
function daysLeft(){ var e = examDate(); return e ? dayNum(e) - dayNum(riyadhToday()) : null; }
function countText(n){
  if (n == null) return '…';
  if (n >= 3) return n + (n <= 10 ? ' أيام' : ' يوماً');
  if (n === 2) return 'بقي يومان';
  if (n === 1) return 'الاختبار غداً';
  if (n === 0) return 'الاختبار اليوم';
  return 'انتهى الاختبار';
}
function updateCount(){
  var n = daysLeft();
  document.getElementById('count').textContent = countText(n) + (n != null && n >= 0 && INFO.exam.tentative ? ' · مبدئي' : '');
}
function applyScope(){
  var s = document.getElementById('scopeLine');
  if (s) s.textContent = 'الاختبار الثاني · الصفحات ' + SCOPE.from + ' إلى ' + SCOPE.to;
}

/* ---------- the schedule link (SCHEDULE.md): lessons out, done and level back ---------- */
var KINDS = {learn:'تعلّم', recall:'تسميع', review:'مراجعة شاملة', eve:'ليلة الاختبار'};
function lid(id){ return 'l' + id; }
function lnum(lesson){ var m = /^l(\d+)$/.exec(lesson || ''); return m ? +m[1] : 0; }
/* الوقت بالدقائق على قواعد العدد: دقيقة، دقيقتان، 3 دقائق، 11 دقيقة */
function minText(m){
  m = Math.round(+m || 0);
  if (m < 1) return '';
  if (m === 1) return 'دقيقة';
  if (m === 2) return 'دقيقتان';
  var r = m % 100;
  return m + (r >= 3 && r <= 10 ? ' دقائق' : ' دقيقة');
}
/* وقت المهمة كما يرسله الجدول (minutes)، والجلسات للحفظ القديم وحده */
function taskMin(t){ return +t.minutes > 0 ? +t.minutes : (+t.units > 0 ? t.units * 25 : 0); }
/* دقائق الدرس من lessons.json كما وصلت عبر الجدول، مصحّحة بوقتك الفعلي إن صحّحها الجدول (calib) */
function lessonMin(id){
  var all = INFO && INFO.all, ls = all && all.lessons && all.lessons[CODE], l = null;
  (ls || []).forEach(function(x){ if (x.id === lid(id)) l = x; });
  if (!l) return 0;
  var m = +l.minutes > 0 ? +l.minutes : (+l.sessions > 0 ? l.sessions * 25 : 0);
  var c = all.calib && all.calib[CODE], f = c && +c.factor > 0 ? +c.factor : 1;
  return m ? Math.max(1, Math.round(m * f)) : 0;
}
function lessonMinTag(id){ var m = lessonMin(id); return '<bdi data-lmin="' + id + '">' + (m ? ' · ' + minText(m) : '') + '</bdi>'; }
function refreshLessonMins(){
  var els = document.querySelectorAll('[data-lmin]');
  for (var i = 0; i < els.length; i++){ var m = lessonMin(+els[i].getAttribute('data-lmin')); els[i].textContent = m ? ' · ' + minText(m) : ''; }
}
function taskHref(t){
  if (t.kind === 'review') return '#rev';
  if (t.kind === 'eve') return '#eve';
  return (t.kind === 'recall' ? '#r-' : '#l-') + lnum(t.lesson);
}
function taskTitle(t){ var n = lnum(t.lesson); return n ? title(n) : (t.title || ''); }
function passedToday(lesson){ var p = INFO && INFO.passes && INFO.passes[lesson]; return !!(p && p.indexOf(riyadhToday()) >= 0); }
function schDone(lesson, kind){ if (SCH) { try { SCH.done(CODE, lesson, kind); } catch(e){} } }
function schUndo(lesson){ if (SCH) { try { SCH.undo(CODE, lesson); } catch(e){} } }
function markLearned(id){ P.read[id] = 1; touch(); if (!passedToday(lid(id))) schDone(lid(id), 'learn'); }
function onInfo(info){
  if (!info) return;
  INFO = info; updateCount();
  var h = (location.hash || '#home').slice(1);
  if (h === '' || h === 'home' || h === 'rev' || h === 'eve' || /^r-\d+$/.test(h)) render(true);
  refreshLessonMins();
  if (!document.getElementById('sheet').hidden) drawSheet();
}
function initSchedule(){
  if (!SCH) return;
  try { var first = SCH.cached(CODE); if (first) INFO = first; } catch(e){}
  SCH.load(CODE).then(onInfo, function(){});
  SCH.onChange(function(){ try { onInfo(SCH.cached(CODE)); } catch(e){} });
}

/* ---------- views ---------- */
function vHome(){
  var today = riyadhToday(), h = '';
  if (!INFO || !INFO.exam){
    h += '<div class="card today"><p class="eyebrow">جدول الاختبارات</p>';
    if (!INFO) h += '<h1>افتح الصفحة مع الاتصال ليصلك الجدول</h1><p class="muted">مهام كل يوم وموعد الاختبار تأتي من جدول الاختبارات. وتستطيع أن تذاكر الآن من قائمة الدروس.</p>';
    else h += '<h1>لم أجد موعد هذه المادة في الجدول</h1><p class="muted">أضف موعدها في جدول الاختبارات، فتظهر هنا مهام كل يوم.</p>';
    return h + '</div><div class="sec-title"><h2>الدروس</h2></div>' + lessonRows();

  } else if (left === 0){
    h += '<p class="eyebrow">يوم الاختبار</p><h1>اليوم اختبارك، فلا مادة جديدة</h1><p class="muted">راجع ورقة الليلة الأخيرة، ثم البطاقات.</p><div class="btn-row" style="margin-top:.9rem"><a class="btn btn-gold" href="#last">ورقة الليلة الأخيرة</a><a class="btn btn-soft" href="#cards">البطاقات</a></div>';
  } else {

      h += '<h1>' + (doneN === tasks.length ? 'أنجزت مهام اليوم كلها' : 'أنجزت ' + doneN + ' من ' + tasks.length) + '</h1><ul class="tasks">' + tasks.map(taskRow).join('') + '</ul>';
    } else {
      h += '<h1>لا مهام لهذه المادة اليوم</h1><p class="muted">هكذا وزّعها الجدول. وتستطيع أن تراجع البطاقات أو تختبر نفسك.</p>';
    }

  h += '<a class="tool" href="#nb"><b>دفتر الأخطاء</b><span>' + (nbn ? 'فيه ' + nbn + ' سؤالاً' : 'فارغ الآن') + '</span></a>';
  h += '<a class="tool" href="#tables"><b>جداول المقارنة</b><span>' + nArabic(D.tables.length, 'جدول واحد', 'جدولان', 'جداول', 'جدولاً') + '</span></a>';
  h += '<a class="tool" href="#last"><b>ورقة الليلة الأخيرة</b><span>أهم النقاط في صفحة واحدة</span></a>';
  h += '</div>';
  h += '<div class="sec-title"><h2>تقدمك في الدروس</h2><a href="#lessons">كل الدروس</a></div>' + lessonRows();
  return h;
}
var TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
function taskRow(t){
  var ttl = t.kind === 'review' ? 'تسميع لكل الدروس' : t.kind === 'eve' ? 'البطاقات وورقة الليلة الأخيرة' : taskTitle(t);
  return '<li class="task' + (t.done ? ' done' : '') + '"><a class="go" href="' + taskHref(t) + '"><small>' + esc(KINDS[t.kind] || '') + '</small><b>' + esc(ttl) + '</b><span>' + esc([minText(taskMin(t)), t.pages ? 'الصفحات ' + t.pages : ''].filter(Boolean).join(' · ')) + '</span></a>'
    + '<button class="tick" type="button" data-act="task-tick" data-l="' + esc(t.lesson) + '" data-k="' + esc(t.kind) + '" data-done="' + (t.done ? 1 : 0) + '" aria-pressed="' + !!t.done + '" aria-label="' + (t.done ? 'إلغاء الإنجاز' : 'علّمها منجزة') + '">' + TICK + '</button></li>';
}
function planList(ex){
  var today = riyadhToday(), h = '<ol class="plan">';
  (INFO.days || []).forEach(function(d){
    var load = 0;
    h += '<li class="day' + (d.date === today ? ' is-today' : '') + '"><div class="day-date"><b>' + esc(d.date === today ? 'اليوم' : arDay(d.date)) + '</b><span>' + esc(arDate(d.date)) + '</span></div><div class="day-body"><div class="chips">';
    d.tasks.forEach(function(t){
      load += taskMin(t);
      var lab = t.kind === 'review' ? 'مراجعة شاملة' : t.kind === 'eve' ? 'ليلة الاختبار' : (KINDS[t.kind] + ': ' + taskTitle(t));

    });
    var dm = +d.minutes > 0 ? +d.minutes : load;

  });

function progressPanel(){
  var s = levelStats(), ex = examDate(), h = '<div class="sec-title"><h2>لوحة التقدم</h2></div><div class="card prog">';
  h += '<div class="prog-top"><div><span class="sub">' + (ex ? 'الاختبار ' + esc(arDay(ex)) + ' ' + esc(arDate(ex)) + (INFO.exam.tentative ? ' (مبدئي)' : '') : '') + '</span><span class="big">' + esc(countText(daysLeft())) + '</span></div><div style="text-align:end"><span class="sub">مستواك العام</span>' + lvlBadge(s.lv) + '</div></div>';
  if (INFO.progress) h += '<p class="prog-note">تعلّمت ' + INFO.progress.learned + ' من ' + nArabic(INFO.progress.total, 'درس واحد', 'درسين', 'دروس', 'درساً') + '، وأنجزت ' + INFO.progress.pct + '٪ من مرات المرور الثلاث لكل درس.</p>';
  h += '<div class="lvl-list">';
  var strong = [], weak = [];
  D.all.forEach(function(a){
    var p = s.per[a.id]; if (!p) return;

    if (p.lv.k === 'weak') weak.push(a.title);

  });

  else h += '<p class="prog-note">يُقاس مستوى كل درس من إجاباتك في بنك الأسئلة ودفتر الأخطاء، ولا يُحكم عليه قبل عشر إجابات، ولا يغيّر الخطة.</p>';
  return h + '</div>';
}
function title(i){ var a = D.all.filter(function(x){ return x.id === i; })[0]; return a ? a.title : ''; }
function firstUnread(ids){ var r = ids.filter(function(i){ return AVAIL.indexOf(i) >= 0 && !P.read[i]; })[0]; return r || ids[0]; }
function lessonRows(){
  var h = '<div class="list">';
  D.all.forEach(function(a){
    var av = AVAIL.indexOf(a.id) >= 0;

  'pt': function(el){ var i = +el.getAttribute('data-i'); S.checks = S.checks || {}; S.checks[i] = !S.checks[i]; render(true); },
  'copy-one': function(){ copyText(gradingRequest([S.items[S.i]])); },
  'copy-all': function(){ copyText(gradingRequest(S.items.filter(function(it){ return it.q.k === 'essay' && it.draft && it.draft.trim(); }))); },
  'new-essays': function(){ if (setup.lessons.length) copyText(newEssaysRequest(), 'نُسخ الطلب. الصقه في محادثة جديدة داخل مشروع المادة.'); },
  'zt-zoom': function(el){ var f = el.closest('.tbl').querySelector('.zf'), k = el.getAttribute('data-z'), z = f._z || 1; setZoom(f, k === 'in' ? z * 1.25 : k === 'out' ? z / 1.25 : (f._fit || 1)); },
  'zt-test': function(el){ var box = el.closest('.tbl'), f = box.querySelector('.zf'), on = !f.classList.contains('test'); f.classList.toggle('test', on); el.setAttribute('aria-pressed', on); box.querySelector('[data-act="zt-reveal"]').hidden = !on; Array.prototype.forEach.call(f.querySelectorAll('td'), function(td){ td.classList.remove('shown'); }); },
  'zt-reveal': function(el){ Array.prototype.forEach.call(el.closest('.tbl').querySelectorAll('td'), function(td){ td.classList.add('shown'); }); },
  'zt-cell': function(el){ if (el.closest('.zf').classList.contains('test')) el.classList.toggle('shown'); },
  'lesson-quiz': function(el){ var id = +el.getAttribute('data-id'); startQuiz(L[id].q, 'درس ' + L[id].title); },
  'lesson-cards': function(el){ cardLessons = [+el.getAttribute('data-id')]; deck = null; go('#cards'); },
  'unread': function(el){ var id = +el.getAttribute('data-id'); delete P.read[id]; touch(); if (passedToday(lid(id))) schUndo(lid(id)); render(true); },
  'quick': function(){ var ids = AVAIL.filter(function(i){ return P.read[i]; }); if (!ids.length) ids = AVAIL.slice(); var qs = []; ids.forEach(function(i){ qs = qs.concat(L[i].q.filter(function(q){ return q.k !== 'essay'; })); }); startQuiz(shuffle(qs).slice(0, 10), 'اختبار سريع'); },
  's-all': function(){ setup.lessons = setup.lessons.length === AVAIL.length ? [] : AVAIL.slice(); render(true); },
  's-les': function(el){ var id = +el.getAttribute('data-id'), i = setup.lessons.indexOf(id); if (i >= 0) setup.lessons.splice(i, 1); else setup.lessons.push(id); render(true); },
  's-kind': function(el){ var k = el.getAttribute('data-k'), i = setup.kinds.indexOf(k); if (i >= 0) setup.kinds.splice(i, 1); else setup.kinds.push(k); render(true); },
  's-count': function(el){ setup.count = +el.getAttribute('data-n'); render(true); },
  's-start': function(){ var qs = shuffle(pool()); if (setup.count) qs = qs.slice(0, setup.count); var names = setup.lessons.length === AVAIL.length ? 'كل الدروس' : setup.lessons.map(function(i){ return L[i].title; }).join('، '); startQuiz(qs, names); },
  'nb-practice': function(){ startQuiz(nbList().map(function(id){ return QBY[id]; }), 'دفتر الأخطاء'); },
  'q-opt': function(el){ if (S.revealed) return; var j = +el.getAttribute('data-j'), it = S.items[S.i]; answer(it.order[j] === it.q.a, j); },
  'q-tf': function(el){ if (S.revealed) return; var v = el.getAttribute('data-v') === '1'; answer(v === S.items[S.i].q.a, v); },
  'q-show': function(){ var ta = document.getElementById('essayDraft'); if (ta) S.items[S.i].draft = ta.value; S.essay = true; S.checks = {}; render(true); },
  'q-grade': function(){ if (S.revealed) return; var q = S.items[S.i].q, n = q.pts.length, got = 0; for (var i = 0; i < n; i++) if (S.checks && S.checks[i]) got++; answer(got === n, null); },
  'q-next': function(){ S.i++; S.revealed = false; S.picked = null; S.essay = false; S.last = null; S.checks = {}; if (S.i >= S.items.length) finishQuiz(); window.scrollTo(0, 0); render(true); },
  'q-quit': function(){ if (S.res.length) { S.i = S.items.length; render(true); } else { S = null; go('#quiz'); } },
  'retry-wrong': function(){ var qs = S.res.filter(function(r){ return !r.ok; }).map(function(r){ return QBY[r.id]; }); startQuiz(qs, 'إعادة الخاطئة'); },
  'c-flip': function(){ deck.flipped = !deck.flipped; var f = view.querySelector('.flip'); if (f){ f.classList.toggle('on', deck.flipped); f.setAttribute('aria-pressed', deck.flipped); } },
  'c-yes': function(){ var c = deck.list[deck.i]; P.c[c.id] = 1; touch(); deck.i++; deck.flipped = false; render(true); },
  'c-no': function(){ var c = deck.list[deck.i]; deck.list.push(c); deck.list.splice(deck.i, 1); deck.flipped = false; if (P.c[c.id]){ delete P.c[c.id]; touch(); } render(true); },
  'c-les': function(el){ var id = +el.getAttribute('data-id'), i = cardLessons.indexOf(id); if (i >= 0) cardLessons.splice(i, 1); else cardLessons.push(id); cardLessons.sort(function(a, b){ return a - b; }); buildDeck(); render(true); },
  'c-known': function(){ hideKnown = !hideKnown; buildDeck(); render(true); },
  'c-restart': function(){ buildDeck(); render(true); },
  'c-reset': function(){ cardLessons.forEach(function(i){ if (L[i]) L[i].c.forEach(function(c){ delete P.c[c.id]; }); }); touch(); buildDeck(); render(true); },
  'font': function(el){ P.set.font = el.getAttribute('data-k'); touch(); applySettings(); drawSheet(); },
  'size': function(el){ P.set.size = +el.getAttribute('data-s'); touch(); applySettings(); drawSheet(); },
  'reset-ask': function(){ confirmReset = true; drawSheet(); },
  'reset-no': function(){ confirmReset = false; drawSheet(); },
  'reset-yes': function(){ var s = P.set; P = blank(); P.set = s; touch(); confirmReset = false; deck = null; S = null; updateBadge(); drawSheet(); render(true); },
  'sheet-close': closeSheet
};
function onAct(e){
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var f = ACT[t.getAttribute('data-act')]; if (f){ e.preventDefault(); f(t, e); }
}
view.addEventListener('click', onAct);
document.getElementById('sheetBody').addEventListener('click', onAct);
view.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'c-flip'){ e.preventDefault(); ACT['c-flip'](); } });
document.getElementById('btnSettings').addEventListener('click', openSheet);
document.getElementById('backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });
window.addEventListener('hashchange', function(){ render(); });
document.addEventListener('visibilitychange', function(){ if (!document.hidden){ updateCount(); flush(); } });

applySettings(); applyScope(); initSchedule(); updateCount(); updateBadge(); render(); initCloud();
})();
</script>

</body></html>
