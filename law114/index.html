":"س3-15","k":"tf","q":"مجرد النفوذ الأدبي، كنفوذ الأب على ولده، يكفي وحده وسيلة للإكراه.","a":false,"w":"الأصل أنه لا يكفي، إلا إذا تجاوز صاحب النفوذ الحد المتعارف عليه وكان مصحوباً بوسيلة أخرى.","pg":"102"},{"id":"س3-16","k":"mcq","q":"عرّفت الإكراه في نظام المعاملات المدنية المادةُ:","o":["64","61","66","68"],"a":0,"w":"المادة الرابعة والستون.","pg":"93"},{"id":"س3-17","k":"mcq","q":"«المكره بحق» هو:","o":["الذي يكرهه ذو السلطان على بيع ماله في وفاء دينه ونفقة نفسه","من يهدده شخص بالقتل ليبيع","من يبيع فراراً من ظالم","من يبيع هازلاً"],"a":0,"w":"هذا تعريف الكتاب للمكره بحق، وبيعه صحيح.","pg":"94"},{"id":"س3-18","k":"mcq","q":"التهديد بحبس أحد الأصول أو الفروع مثال على الإكراه:","o":["الأدبي","الملجئ","غير الملجئ","المعدم للإرادة"],"a":0,"w":"الإكراه الأدبي يعدم تمام الرضا ولا يعدم الاختيار.","pg":"95"},{"id":"س3-19","k":"mcq","q":"التهديد بمنع الترقية أو إنزال درجة الوظيفة مثال على الإكراه:","o":["الناقص أو غير الملجئ","الملجئ أو التام","الأدبي","بحق"],"a":0,"w":"لأنه تهديد بما لا يضر النفس أو العضو، وهو من إلحاق الظلم.","pg":"95"},{"id":"س3-20","k":"mcq","q":"يترتب على الإكراه الأدبي:","o":["عدم نفاذ التصرفات المكره عليها","بطلانها بطلاناً مطلقاً","صحتها ولزومها","إنقاص الالتزامات"],"a":0,"w":"وهو إكراه شرعي استحساناً لا قياساً، كما قرر الكمال بن الهمام، وهو رأي المالكية.","pg":"95"},{"id":"س3-21","k":"mcq","q":"عنصرا الإكراه هما:","o":["التهديد والرهبة","الطرق الاحتيالية ونية التضليل","الضعف الظاهر والغبن","الوجود والإمكان"],"a":0,"w":"العنصر المادي هو التهديد، والعنصر المعنوي هو الرهبة.","pg":"96–98"},{"id":"س3-22","k":"mcq","q":"نصّت على أنه يراعى في تقدير الإكراه سن من وقع عليه وحالته الاجتماعية والصحية المادةُ:","o":["66","64","65","67"],"a":0,"w":"المادة السادسة والستون.","pg":"100"},{"id":"س3-23","k":"mcq","q":"صاحب القارب الذي لم يرض بإنقاذ طفل مشرف على الغرق إلا بمبلغ باهظ، مثال على:","o":["الإكراه الناشئ من ظروف خارجية (حالة الضرورة)","التغرير الفعلي","الغلط المشترك","الغبن اليسير"],"a":0,"w":"الرهبة نشأت عن ظروف خارجية، واستغلها صاحب القارب، فللأب طلب إبطال العقد.","pg":"102"},{"id":"س3-24","k":"mcq","q":"إذا صدر الإكراه من الغير، ولم يعلم به المتعاقد الآخر، ولم يكن في إمكانه العلم به، فإن المتعاقد الآخر يعد:","o":["حسن النية","سيء النية","شريكاً في الإكراه","مغبوناً"],"a":0,"w":"وله إن طلب المكره الإبطال أن يطالبه بتعويض.","pg":"101"},{"id":"س3-25","k":"fill","q":"الإكراه الملجئ هو الذي لا يبقى للشخص معه قدرة ولا ____.","o":["اختيار","رهبة","حق","مال"],"a":0,"w":"هذا تعريف الكتاب للإكراه الملجئ أو التام.","pg":"95"},{"id":"س3-26","k":"fill","q":"الإكراه المعدم للرضى يجعل العقد باطلاً، بينما الإكراه المفسد للرضى يجعل العقد ____.","o":["قابلاً للإبطال","منعدماً","صحيحاً لازماً","نافذاً في حق الغير"],"a":0,"w":"هذا نص عبارة الكتاب.","pg":"96"},{"id":"س3-27","k":"fill","q":"معيار وجود الرهبة من عدمها معيار ذاتي أو ____ وليس معياراً موضوعياً.","o":["شخصي","مادي","عرفي","قضائي"],"a":0,"w":"فيعتد بالمكره ذاته ولو لم يكن التهديد من شأنه إخافة الشخص المعتاد.","pg":"100"},{"id":"س3-28","k":"essay","q":"عرّف الإكراه في النظام وفي الفقه الإسلامي وعند فقهاء القانون، واذكر أنواعه عند فقهاء الشريعة مع حكم كل نوع.","pts":[{"x":"المادة 64: تهديد شخص دون حق بوسيلة مادية أو معنوية تخيفه فتحمله على التصرف.","pg":"93"},{"x":"في الفقه: حمل الإنسان غيره على ما لا يرضاه قولاً أو فعلاً بحيث لو خلى بنفسه لم يفعله. وعند فقهاء القانون: ضغط مادي أو أدبي يولد رهبة أو خوفاً تحمل على التعاقد.","pg":"94"},{"x":"الملجئ أو التام: لا يبقى معه قدرة ولا اختيار (القتل، تلف عضو، الضرب الشديد، تلف جميع المال)، وحكمه أنه يعدم الرضا ويفسد الاختيار.","pg":"95"},{"x":"الناقص أو غير الملجئ: التهديد بما لا يضر النفس أو العضو (الضرب اليسير، الحبس، إتلاف بعض المال، منع الترقية)، وحكمه أنه يعدم الرضا ولا يفسد الاختيار.","pg":"95"},{"x":"الأدبي: يعدم تمام الرضا ولا يعدم الاختيار (التهديد بحبس الأصول أو الفروع)، إكراه شرعي استحساناً لا قياساً، ويترتب عليه عدم نفاذ التصرفات. والشافعي يرى الإكراه نوعاً واحداً هو الملجئ.","pg":"95"}],"pg":"93–95"},{"id":"س3-29","k":"essay","q":"اشرح عنصري الإكراه، واذكر الحالات التي يتحقق بها الإكراه وفق المادة الخامسة والستين.","pts":[{"x":"العنصر المادي (التهديد): وسائل تقع على الحس أو النفس، تهدد المتعاقد أو عزيزاً عنده بخطر جسيم محدق بالنفس أو المال؛ ولا إكراه إذا نشأت الرهبة عن غير التهديد.","pg":"96"},{"x":"العنصر المعنوي (الرهبة): أن ينشأ عن التهديد رهبة قائمة على أساس، باعتقاد المهدد أن خطراً جسيماً محدقاً يهدده أو غيره.","pg":"98"},{"x":"المادة 65: يتحقق الإكراه إذا كان التهديد بخطر جسيم محدق يلحق بنفس المكره أو عرضه أو ماله، أو كان مسلطاً على غيره، ولم يكن ليبرم العقد لولاه.","pg":"97"},{"x":"الحالات: أن يكون المهدد به خطراً جسيماً، وأن يكون محدقاً حالاً، وأن يكون المكره قادراً على التنفيذ، وأن يكون الإكراه بغير حق.","pg":"97–98"}],"pg":"96–99"},{"id":"س3-30","k":"essay","q":"اذكر شرطي الإكراه الذي يعيب الإرادة، وبيّن حكم الإكراه الصادر من غير المتعاقدين.","pts":[{"x":"الشرط الأول: أن يكون الإكراه هو الدافع للتعاقد، بقيام علاقة سببية بين التهديد والتعبير عن الإرادة (المادة 65)، ويراعى في تقديره السن والحالة الاجتماعية والصحية وكل ظرف آخر (المادة 66)، والمعيار ذاتي.","pg":"99–100"},{"x":"الشرط الثاني: أن يتصل بعلم المتعاقد الآخر؛ فللمكره طلب الإبطال إذا صدر الإكراه من المتعاقد الآخر (المادة 67 فقرة 1).","pg":"100"},{"x":"إذا صدر من الغير فلا إبطال إلا إذا ثبت أن المتعاقد الآخر كان يعلم به أو كان من المفترض أن يعلم (المادة 67 فقرة 2)، ويعتبر صادراً منه إن صدر من نائبه أو من الغير بتحريضه.","pg":"101"},{"x":"والمتعاقد حسن النية إن طُلب الإبطال له أن يطالب بتعويض قد يتمثل في الإبقاء على العقد.","pg":"101"}],"pg":"99–101"},{"id":"س3-31","k":"essay","q":"ما حكم الإكراه الناشئ من ظروف خارجية (حالة الضرورة)؟ وما حكم الشوكة والنفوذ الأدبي؟","pts":[{"x":"العبرة في الإكراه بالرهبة، وتتحقق ولو نشأت عن ظروف خارجة عن إرادة الطرف الآخر، ما دام قد استغلها للحصول على ما ليس بحق له وهو يعلم بالرهبة، فللمكره طلب الإبطال. مثاله: صاحب القارب والطفل الغريق، والطبيب الذي يفرض أتعاباً باهظة.","pg":"102"},{"x":"الأصل أن مجرد الشوكة والنفوذ الأدبي لا يكفي للإكراه، إلا إذا تجاوز صاحبه الحد المتعارف عليه وكان مصحوباً بوسيلة أخرى، أي تعدى الاحترام إلى الخوف والرهبة.","pg":"102–103"},{"x":"نفوذ الزوج ليس في ذاته إكراهاً، فإن اقترن بتخويف وتهديد أو ضرب أو منع من زيارة الأهل لتتنازل أو تهب، كان تصرفها غير نافذ.","pg":"103"}],"pg":"102–103"},{"id":"س3-32","k":"essay","q":"فرّق بين الإكراه المعدم للرضى والإكراه المفسد للرضى، وبيّن آراء الفقهاء في حكم تصرف المكره.","pts":[{"x":"الإكراه المفسد للرضى: توجد معه الإرادة والرضى محفوفين بالخوف، فيعيب الإرادة ولا يعدمها، والعقد قابل للإبطال.","pg":"95–96"},{"x":"الإكراه المعدم للرضى: لا إرادة معه أصلاً، كمن يمسك بيد شخص ويرغمه على التوقيع، والعقد باطل لتخلف الرضى.","pg":"96"},{"x":"الجمهور: كل تصرف تحت الإكراه باطل. وبعض الحنفية والمالكية: العقد مع الإكراه موقوف في جميع التصرفات.","pg":"96"}],"pg":"95–96"}],"c":[{"id":"ب3-01","f":"الإكراه في النظام (المادة 64)","b":"تهديد شخص دون حق بوسيلةٍ مادية أو معنويّة تُخيفه فتحمله على التصرف","pg":"93"},{"id":"ب3-02","f":"الإكراه في الفقه الإسلامي","b":"حمل الإنسان غيره على ما لا يرضاه قولاً أو فعلاً، بحيث لو خلى بنفسه لم يفعله","pg":"94"},{"id":"ب3-03","f":"الإكراه عند فقهاء القانون","b":"ضغط مادي أو أدبي يقع على الشخص فيولد لديه رهبة أو خوفاً تحمله على التعاقد","pg":"94"},{"id":"ب3-04","f":"المكره بحق","b":"والمكره بحق هو الذي يكرهه ذو السلطان على بيع ماله في وفاء دينه ونفقة نفسه","pg":"94"},{"id":"ب3-05","f":"بيع التلجئة أو الأمان","b":"كأن اتفقا على بيع عين لأحدهما فراراً من ظالم يريد اغتصابه، أو اتقاء شر جار، حتى إذا ما أمن ذلك رد إليه ما باعه ورد هو ما أخذ من ثمن، فإن هذا البيع يقع باطلاً ولا ينعقد","pg":"94"},{"id":"ب3-06","f":"الإكراه الملجئ أو التام","b":"هو الذي لا يبقى للشخص معه قدرة ولا اختيار كأن يهدده بالقتل أو بإتلاف بعض الأعضاء أو بالضرب الشديد الذي يخشى منه القتل أو تلف العضو أو تلف جميع المال. وحكمه: أنه يعدم الرضا ويفسد الاختيار","pg":"95"},{"id":"ب3-07","f":"الإكراه الناقص أو غير الملجئ","b":"هو التهديد بما لا يضر النفس أو العضو، كالتهديد بالضرب اليسير أو بالحبس أو بإتلاف بعض المال أو بإلحاق الظلم كمنع الترقية أو إنزال درجة الوظيفة. وحكمه: أنه يعدم الرضا، ولا يفسد الاختيار","pg":"95"},{"id":"ب3-08","f":"الإكراه الأدبي","b":"وهو الذي يعدم تمام الرضا، ولا يعدم الاختيار، كالتهديد بحبس أحد الأصول أو الفروع، أو الأخ أو الأخت ونحوهم، وحكمه: أنه إكراه شرعي استحساناً لا قياساً، كما قرر الكمال بن الهمام من الحنفية، وهو رأي المالكية، ويترتب عليه عدم نفاذ التصرفات المكره عليها","pg":"95"},{"id":"ب3-09","f":"العنصر المادي في الإكراه (التهديد)","b":"أن تستخدم وسائل للإكراه تقع على الحس أو على النفس، فتهدد المتعاقد معه أو شخصاً عزيزاً عنده، ويكون من شأن هذه الوسائل التهديد بخطر جسيم محدق بالنفس أو المال","pg":"96"},{"id":"ب3-10","f":"المادة 65","b":"يتحقق الإكراه إذا كان التهديد بخطرٍ جسيم محدقٍ يلحق بنفس المكرَه أو عرضه أو ماله، أو كان التهديد مسلَّطاً على غيره ولم يكن المكرَه ليُبرم العقد لولا وجود الإكراه.","pg":"97"},{"id":"ب3-11","f":"المادة 66","b":"يراعى في تقدير الإكراه سن من وقع عليه الإكراه وحالته الاجتماعية والصحية وكل ظرف آخر من شأنه أن يؤثر في جسامة الإكراه.","pg":"100"},{"id":"ب3-12","f":"المادة 67","b":"1. للمكره طلب إبطال العقد إذا صدر الإكراه من المتعاقد الآخر. 2. إذا صدر الإكراه من غير المتعاقدين فليس للمُكرَه طلب إبطال العقد؛ ما لم يثبت أن المتعاقد الآخر كان يعلم بالإكراه أو كان من المفترض أن يعلم به.","pg":"100–101"}],"n":[{"id":"و3-01","x":"الإكراه (المادة 64): تهديد شخص دون حق بوسيلة مادية أو معنوية تخيفه فتحمله على التصرف.","pg":"93"},{"id":"و3-02","x":"أنواعه عند فقهاء الشريعة: ملجئ (يعدم الرضا ويفسد الاختيار)، وغير ملجئ (يعدم الرضا ولا يفسد الاختيار)، وأدبي (يعدم تمام الرضا ولا يعدم الاختيار، ويترتب عليه عدم النفاذ). والشافعي: نوع واحد هو الملجئ.","pg":"95"},{"id":"و3-03","x":"الإكراه المعدم للرضى: العقد باطل. والمفسد للرضى: العقد قابل للإبطال. والجمهور: تصرف المكره باطل، وبعض الحنفية والمالكية: موقوف.","pg":"96"},{"id":"و3-04","x":"عنصراه: تهديد ورهبة. وحالاته (المادة 65): خطر جسيم، محدق حال، مكره قادر على التنفيذ، إكراه بغير حق.","pg":"96–98"},{"id":"و3-05","x":"شرطاه: أن يكون دافعاً (ومعيار الرهبة ذاتي، والمادة 66: السن والحالة الاجتماعية والصحية وكل ظرف آخر)، وأن يتصل بعلم الآخر (المادة 67).","pg":"99–101"},{"id":"و3-06","x":"حالة الضرورة: للمكره طلب الإبطال إذا استغل الآخر الظروف الخارجية عالماً بالرهبة. والنفوذ الأدبي لا يكفي إلا إذا تجاوز الحد المتعارف عليه وصحبته وسيلة أخرى.","pg":"102–103"}]},{"id":4,"title":"الاستغلال","pages":"103–106","batch":2,"intro":"الاستغلال هو العيب الرابع من عيوب الرضى، ونصّت عليه المادة 68 من نظام المعاملات المدنية.","sections":[{"h":"نص المادة 68، والفرق بين الاستغلال والغبن","b":[{"t":"art","no":"68","x":"إذا استغل أحد المتعاقدين ضعفاً ظاهراً أو حاجة ملحة في المتعاقد الآخر، لإبرام عقدٍ لحقه منه غبنٌ، فللمحكمة بناءً على طلب المتعاقد المغبون ومراعاة لظروف الحال أن تنقص من التزاماته أو تزيد من التزامات المتعاقد الآخر أو تبطل العقد، ويجب أن ترفع الدعوى بذلك خلال (مائة وثمانين) يوماً من تاريخ التعاقد، وإلا امتنع سماعها.","pg":"103"},{"t":"p","x":"يجب عدم الخلط بين الغبن والاستغلال: فالغبن هو عدم التعادل بين الالتزامات المتقابلة في العقد، ومعياره مادي بحت. أما الاستغلال فهو أساساً أمر نفسي، يكون الغبن فيه نتيجة للحالة النفسية: يستغل المتعاقد حالة الضعف النفسية لدى المتعاقد الآخر للحصول على منفعة لا تتعادل البتة مع الأداء الذي يقدمه.","pg":"103"},{"t":"p","x":"ويُنظر إلى الاستغلال على أنه عيب من عيوب الرضى، لأن أحد الطرفين استغل ضعفاً ظاهراً أو حاجة ملحة في الآخر، فتعاقد معه على نحو لا تتناسب فيه الالتزامات، ولولا هذا الضعف أو الحاجة لما أقدم المتعاقد على العقد.","pg":"104"},{"t":"hashia","x":"والأصل في الغبن أنه لا يفسد الرضى، لأن إرادة المغبون سليمة ولو كانت قيمة ما أعطاه أقل من قيمة ما أخذه؛ فالتوازن الاقتصادي بين المتعاقدين ليس شرطاً لانعقاد العقد ولا لصحته، وكل ما يعني القانون التوازن القانوني، وهو أن يكون كل من المتعاقدين كامل الأهلية ورضاه صحيحاً غير معيب. وإنما يعتد القانون بالغبن إذا كان نتيجة لاستغلال أحد المتعاقدين نقطة ضعف عند الآخر.","pg":"103"}]},{"h":"شروط الاستغلال الثلاثة","b":[{"t":"list","h":"يشترط لقيام الاستغلال توافر ثلاثة شروط","num":1,"items":[{"h":"أن يستغل أحد المتعاقدين ضعفاً ظاهراً أو حاجة ملحة في المتعاقد الآخر","x":"ويلحق بذلك الطيش البين أو الهوى الجامح لدى المتعاقد الآخر. والعنصر النفسي هنا يتكون من شقين: نية الاستغلال لدى الطرف المستغل، وحالة الضعف النفسي لدى الطرف الآخر، وهي الضعف أو الحاجة الملحة.","pg":"104"},{"h":"أن يختل التعادل بين الأداءات المتقابلة على نحو يظهر فيه الغبن","x":"فيجب أن يترتب على العقد غبن يلحق المتعاقد الآخر، بأن تكون التزامات أحدهما لا تتعادل ولا تتناسب البتة مع التزامات الآخر، أي أن تقل قيمة المنفعة التي يحصل عليها كثيراً وبشكل واضح عن قيمة ما يحصل عليه الآخر.","pg":"104–105"},{"h":"أن يكون الاستغلال هو الذي دفع المتعاقد إلى التعاقد","x":"أي أن المغبون أبرم العقد لأن الآخر استغل فيه طيشاً أو هوى جامحاً، ولولا هذا الاستغلال لما أبرمه. وتقدير ذلك من مسائل الواقع التي يستقل بها قاضي الموضوع، وعبء إثبات عناصر الاستغلال على المغبون. ومن الناحية العملية يمكن أن يُتخذ عدم التعادل الفادح في الأداءات قرينة على أن ذلك يرجع إلى الضعف النفسي.","pg":"105"}]}]},{"h":"جزاء الاستغلال","b":[{"t":"p","x":"إذا توافرت الشروط، فللمتعاقد المغبون أن يختار بين أمرين: إنقاص التزاماته لتتناسب مع العقد، أو إبطال العقد. وتراعي المحكمة في ذلك ظروف الحال والعرف السائد.","pg":"105"},{"t":"list","h":"ما يجوز للمحكمة بناءً على طلب المغبون (المادة 68)","num":0,"items":[{"h":"أن تنقص من التزاماته","pg":"103"},{"h":"أو تزيد من التزامات المتعاقد الآخر","pg":"103"},{"h":"أو تبطل العقد","pg":"103"}]},{"t":"p","x":"وحدد المنظم السعودي مائة وثمانين يوماً لرفع دعوى الاستغلال من تاريخ العقد، وإلا امتنع القضاء عن سماع الدعوى.","pg":"105–106"},{"t":"hashia","x":"والاستغلال ينطوي على أمرين: إرادة غير مشروعة من جانب المستغل، وإرادة معيبة لدى المغبون. فاعتد القانون الألماني بإرادة المستغل، واعتبر الاستغلال مخالفاً للآداب، فجعل جزاءه البطلان المطلق. واعتدت قوانين أخرى، كالقانون السويسري والمشروع الفرنسي الإيطالي، بإرادة المغبون فاعتبرتها معيبة، فجعلت الجزاء الإبطال أو الإنقاص، وهو ما أخذ به القانون المصري الجديد. ولهذا يختلف الجزاء في الاستغلال عنه في عيوب الإرادة الأخرى، فهو إما إبطال للعقد أو إنقاص لالتزامات المتعاقد المغبون.","pg":"105–106"},{"t":"tip","x":"احفظ الرقم: مائة وثمانون يوماً من تاريخ التعاقد، وإلا امتنع سماع الدعوى.","pg":"103"}]}],"q":[{"id":"س4-01","k":"tf","q":"الغبن معياره مادي بحت، أما الاستغلال فهو أساساً أمر نفسي.","a":true,"w":"هذا ما ذكره الكتاب في التفريق بينهما.","pg":"103"},{"id":"س4-02","k":"tf","q":"يجب أن ترفع دعوى الاستغلال خلال تسعين يوماً من تاريخ التعاقد.","a":false,"w":"المدة في المادة 68 مائة وثمانون يوماً من تاريخ التعاقد، وإلا امتنع سماعها.","pg":"103"},{"id":"س4-03","k":"tf","q":"يقع على عاتق الطرف المغبون عبء إثبات توافر عناصر الاستغلال.","a":true,"w":"هذا ما ذكره الكتاب في الشرط الثالث.","pg":"105"},{"id":"س4-04","k":"tf","q":"الأصل في الغبن أنه يفسد الرضى ولو لم يكن نتيجة استغلال.","a":false,"w":"الأصل في الغبن أنه لا يفسد الرضى، وإنما يعتد به القانون إذا كان نتيجة لاستغلال نقطة ضعف عند المتعاقد الآخر.","pg":"103","h":1},{"id":"س4-05","k":"tf","q":"تقدير ما إذا كان الاستغلال هو الدافع إلى التعاقد من مسائل الواقع التي يستقل بتقديرها قاضي الموضوع.","a":true,"w":"هذا ما ذكره الكتاب في الشرط الثالث.","pg":"105"},{"id":"س4-06","k":"mcq","q":"نصّت على الاستغلال في نظام المعاملات المدنية المادةُ:","o":["68","64","69","72"],"a":0,"w":"المادة الثامنة والستون.","pg":"103"},{"id":"س4-07","k":"mcq","q":"للمحكمة في الاستغلال، بناءً على طلب المتعاقد المغبون:","o":["أن تنقص من التزاماته أو تزيد من التزامات الآخر أو تبطل العقد","أن تبطل العقد فقط","أن تحكم بالتعويض فقط","أن تقضي بالبطلان المطلق"],"a":0,"w":"هذا نص المادة 68، وتراعي المحكمة ظروف الحال.","pg":"103"},{"id":"س4-08","k":"mcq","q":"يلحق بالضعف الظاهر والحاجة الملحة في الاستغلال:","o":["الطيش البين أو الهوى الجامح","الغلط المشترك","التهديد بخطر جسيم","الغبن اليسير"],"a":0,"w":"هذا ما ذكره الكتاب في الشرط الأول.","pg":"104"},{"id":"س4-09","k":"mcq","q":"اعتد القانون الألماني في الاستغلال بإرادة المستغل، فجعل الجزاء:","o":["البطلان المطلق","الإبطال أو الإنقاص","التعويض فقط","الفسخ"],"a":0,"w":"لأنه اعتبر الاستغلال مخالفاً للآداب. أما القانون السويسري والمشروع الفرنسي الإيطالي فجعلا الجزاء الإبطال أو الإنقاص.","pg":"105","h":1},{"id":"س4-10","k":"fill","q":"يجب أن ترفع دعوى الاستغلال خلال (____) يوماً من تاريخ التعاقد، وإلا امتنع سماعها.","o":["مائة وثمانين","تسعين","ستين","ثلاثين"],"a":0,"w":"هذا نص المادة 68.","pg":"103"},{"id":"س4-11","k":"essay","q":"ما الفرق بين الغبن والاستغلال؟ واذكر شروط الاستغلال وجزاءه.","pts":[{"x":"الغبن عدم التعادل بين الالتزامات المتقابلة، ومعياره مادي بحت. والاستغلال أمر نفسي أساساً، يكون الغبن فيه نتيجة لاستغلال حالة الضعف النفسية.","pg":"103"},{"x":"الشروط: أن يستغل أحد المتعاقدين ضعفاً ظاهراً أو حاجة ملحة (ويلحق بهما الطيش البين والهوى الجامح)، وأن يختل التعادل على نحو يظهر فيه الغبن، وأن يكون الاستغلال هو الدافع إلى التعاقد، وعبء الإثبات على المغبون.","pg":"104–105"},{"x":"الجزاء (المادة 68): للمحكمة بناءً على طلب المغبون أن تنقص من التزاماته أو تزيد من التزامات الآخر أو تبطل العقد، والدعوى خلال مائة وثمانين يوماً من التعاقد وإلا امتنع سماعها.","pg":"103، 105–106"}],"pg":"103–106"}],"c":[{"id":"ب4-01","f":"المادة 68","b":"إذا استغل أحد المتعاقدين ضعفاً ظاهراً أو حاجة ملحة في المتعاقد الآخر، لإبرام عقدٍ لحقه منه غبنٌ، فللمحكمة بناءً على طلب المتعاقد المغبون ومراعاة لظروف الحال أن تنقص من التزاماته أو تزيد من التزامات المتعاقد الآخر أو تبطل العقد، ويجب أن ترفع الدعوى بذلك خلال (مائة وثمانين) يوماً من تاريخ التعاقد، وإلا امتنع سماعها.","pg":"103"},{"id":"ب4-02","f":"الغبن (في مقابلة الاستغلال)","b":"فالغبن هو عدم التعادل بين الالتزامات المتقابلة في العقد، فمعياره مادي بحت","pg":"103"},{"id":"ب4-03","f":"الاستغلال (في مقابلة الغبن)","b":"أما الاستغلال فهو أساساً أمر نفسي يكون الغبن فيه نتيجة للحالة النفسية","pg":"103"}],"n":[{"id":"و4-01","x":"الاستغلال (المادة 68): استغلال ضعف ظاهر أو حاجة ملحة، ويلحق بهما الطيش البين والهوى الجامح، لإبرام عقد فيه غبن. والغبن معياره مادي، والاستغلال أمر نفسي.","pg":"103–104"},{"id":"و4-02","x":"شروطه: الاستغلال، واختلال التعادل، وأن يكون هو الدافع. والجزاء: إنقاص التزامات المغبون أو زيادة التزامات الآخر أو إبطال العقد، والدعوى خلال مائة وثمانين يوماً من التعاقد وإلا امتنع سماعها.","pg":"104–106"}]},{"id":5,"title":"الغبن","pages":"106–109","batch":2,"intro":"الغبن هو العيب الخامس في الكتاب، ونصّت عليه المادة 69 من نظام المعاملات المدنية بفقراتها الثلاث.","sections":[{"h":"تعريف الغبن","b":[{"t":"def","h":"الغبن (المادة 69، الفقرة الأولى)","x":"زيادة العوض أو نقصه قدراً خارجاً عن المعتاد","pg":"106"},{"t":"p","x":"ومعناه عدم التعادل بين الالتزامات المتقابلة في العقد، بالزيادة أو بالنقص: فالمتعاقد غابن إذا أخذ أكثر مما أعطى، ومغبون إذا أعطى أكثر مما أخذ. وقد جعل المنظم السعودي تقدير وجود الغبن من عدمه إلى العرف.","pg":"106"}]},{"h":"نوعا الغبن","b":[{"t":"kinds","items":[{"h":"الغبن اليسير","eff":"ok","et":"صحيح","x":"أمر لا يسع الناس تجنبه في كافة المعاملات، وقد أجمع الفقهاء على صحة التصرفات معه، لأن اختلال التعادل فيه سهل الاحتمال وجرى التسامح فيه، حتى لو نشأ عن تدليس.","egs":["من يبيع سلعة قيمتها مائة ريال بمائة ريال وريال واحد، أو بتسع وتسعين."],"pg":"106"},{"h":"الغبن الفاحش","d":"هو الغبن الذي لا يدخل تحت تقويم المقومين","x":"وعرّفه فقهاء الحنابلة بأنه ما يخرج عن العادة، إذ لم يرد فيه تحديد، فيُرجع فيه إلى العرف، فما عده الناس في عرفهم غبناً يخرج عن العادة فهو غبن فاحش. وذهب جمع من الفقهاء، منهم المالكية والشافعية وبعض الحنفية، إلى القول ببطلانه أو طلب التعويض، واشترطوا أن يكون ناشئاً عن تدليس، وليس بينهم معيار ثابت متفق عليه لمقداره. وبناءً على ما ذهب إليه غالبية الفقهاء لا يكون الغبن سبباً للفسخ إلا إذا كان فاحشاً وناشئاً عن تدليس.","egs":["من يبيع سلعة قيمتها ألف ريال بألف وخمسمائة ريال، أو بخمسمائة ريال فقط."],"pg":"106–107"}]},{"t":"hashia","x":"والغبن اليسير هو ما يدخل تحت تقويم المقومين، أي ما يتناوله تقدير الخبراء، كشراء شيء بعشرة ثم يقدره خبير بثمانية أو تسعة أو عشرة.","pg":"106"},{"t":"hashia","x":"وخيار الغبن يثبت لمجرد الغبن، لحديث «لا ضرر ولا ضرار» وحديث «لا يحل مال امرئ مسلم إلا بطيبة نفس منه»، فالمغبون لم تطب نفسه؛ فإن لم يخرج الغبن عن العادة فلا فسخ، لأنه يُتسامح به. وقال الوزير: اتفقوا على أن الغبن في المبيع بما لا يفحش لا يؤثر في صحته.","pg":"107"}]},{"h":"مواضع الغبن الفاحش عند الحنابلة","b":[{"t":"p","x":"والأصل في الغبن أنه لا يؤثر في صحة العقد في عقود المعاوضات، إلا أنه يثبت عند الحنابلة إذا كان فاحشاً في ثلاثة مواضع:","pg":"107"},{"t":"list","h":"المواضع الثلاثة","num":1,"items":[{"h":"تلقي الركبان","x":"إذا تلقاهم فاشترى منهم وباعهم وغبنهم.","pg":"107"},{"h":"النجش","x":"وهو أن يزيد في السلعة من لا يريد شراءها.","pg":"107"},{"h":"المسترسل","x":"وهو الجاهل بقيمة السلعة ولا يحسن المبايعة.","pg":"107"}]},{"t":"p","x":"فإذا غُبن غبناً يخرج عن العادة فله الخيار بين الفسخ والإمضاء.","pg":"107"}]},{"h":"موقف نظام المعاملات المدنية","b":[{"t":"art","no":"69، الفقرة الثانية","x":"ليس للمتعاقد طلب إبطال العقد لمجرد الغبن إلا في مال عديم الأهلية وناقصها وما تقضي به النصوص النظامية، وللمتعاقد الآخر توقي الإبطال إذا قدم ما تراه المحكمة كافياً لرفع الغبن.","pg":"107"},{"t":"p","x":"فلا يحق للمغبون طلب إبطال العقد لمجرد الغبن إلا في حالات محددة ذُكرت على سبيل الحصر. وللمتعاقد الآخر الذي يرغب في الاستمرار في العقد أن يتجنب إبطاله بتقديم ما يعيد التوازن بين الالتزامات، بزيادتها أو إنقاصها، وهو أمر متروك لقاضي الموضوع وفق تقدير العرف السائد.","pg":"108"},{"t":"list","h":"الحالات التي يجوز فيها طلب الإبطال لمجرد الغبن (على سبيل الحصر)","num":1,"items":[{"h":"إذا وقع الغبن في مال عديم الأهلية","pg":"108"},{"h":"إذا وقع الغبن في مال ناقص الأهلية","pg":"108"},{"h":"إذا نص عليه النظام","pg":"108"}]},{"t":"art","no":"69، الفقرة الثالثة","x":"لا يجوز الطعن لمجرد الغبن في عقدٍ أُبرم بطريق المزايدة","pg":"108"},{"t":"def","h":"بيع المزايدة","x":"أن ينادي على السلعة بحضور المزايدين، فيزيد الناس فيها بعضهم على بعض، حتى تقف على آخر من يزيد فيها فيأخذها","pg":"108"},{"t":"list","h":"شرطا بيع المزايدة عند الفقهاء","num":1,"items":[{"h":"ألا يقصد منه الإضرار بالغير","pg":"108"},{"h":"وأن يكون بنية الشراء","pg":"108"}]},{"t":"hashia","x":"والمغابنة لا بد منها، لأن كلاً من البائع والمشتري يرغب في الربح، والشارع لم ينه عن الربح في البيع والشراء ولم يحدد له قدراً، وقد شُرع الخيار ليكون للبائع والمشتري فرصة في التأمل حتى لا يغبن أحدهما ولا يندم.","pg":"108"}]},{"h":"تطبيق قضائي في الغبن","b":[{"t":"p","x":"رفضت الدائرة التجارية دعوى غبن رفعها تاجر شريك في الشركة، «يعلم بقيمة حصصه التي اشتراها وقت البيع والتخارج»، لأنه تاجر وصاحب شركة وشريك في عدة شركات ومحامٍ، ومثله لا يُغبن لعلمه بأحوال التجارة. ولأن فقهاء الشريعة نصوا على أن الغبن ليس له حد شرعاً، والمدعي ليس من الركبان ولا المسترسلين ولا ممن لا يحسن المماسكة، وقد اشترى وباع الحصص برضاه واختياره، ويعلم أن الحصص والأسهم قابلة للزيادة والنقصان. ولأنهم اتفقوا في الحكم على إسقاط كل منهم جميع مطالباته ودعواه قبل الآخر، «لأن الساقط شرعاً لا يعود ومن سعى إلى نقض ما صدر عنه فسعيه مردود عليه».","pg":"108–109"},{"t":"hashia","x":"الدعوى رقم 148/2/ق لعام 1431هـ.","pg":"109"}]}],"q":[{"id":"س5-01","k":"tf","q":"عرّفت المادة 69 الغبن بأنه زيادة العوض أو نقصه قدراً خارجاً عن المعتاد.","a":true,"w":"هذا تعريف الفقرة الأولى من المادة 69.","pg":"106"},{"id":"س5-02","k":"tf","q":"جعل المنظم السعودي تقدير وجود الغبن من عدمه إلى العرف.","a":true,"w":"هذا ما ذكره الكتاب.","pg":"106"},{"id":"س5-03","k":"tf","q":"الغبن اليسير يجعل العقد قابلاً للإبطال لأنه اختلال في التعادل.","a":false,"w":"أجمع الفقهاء على صحة التصرفات مع الغبن اليسير، لأن اختلال التعادل فيه سهل الاحتمال وجرى التسامح فيه.","pg":"106"},{"id":"س5-04","k":"tf","q":"للمتعاقد طلب إبطال العقد لمجرد الغبن في كل العقود.","a":false,"w":"المادة 69 فقرة 2: ليس له ذلك إلا في مال عديم الأهلية وناقصها وما تقضي به النصوص النظامية.","pg":"107"},{"id":"س5-05","k":"tf","q":"يجوز الطعن لمجرد الغبن في عقد أُبرم بطريق المزايدة.","a":false,"w":"المادة 69 فقرة 3: «لا يجوز الطعن لمجرد الغبن في عقدٍ أُبرم بطريق المزايدة».","pg":"108"},{"id":"س5-06","k":"tf","q":"للمتعاقد الآخر أن يتوقى الإبطال للغبن إذا قدم ما تراه المحكمة كافياً لرفع الغبن.","a":true,"w":"هذا آخر الفقرة الثانية من المادة 69.","pg":"107"},{"id":"س5-07","k":"mcq","q":"الغبن الذي لا يدخل تحت تقويم المقومين هو:","o":["الغبن الفاحش","الغبن اليسير","الاستغلال","الغلط غير المؤثر"],"a":0,"w":"هذا تعريف الغبن الفاحش. أما اليسير فهو ما يدخل تحت تقويم المقومين.","pg":"106"},{"id":"س5-08","k":"mcq","q":"النجش هو:","o":["أن يزيد في السلعة من لا يريد شراءها","أن يتلقى الركبان فيشتري منهم","أن يجهل المشتري قيمة السلعة","أن تباع السلعة بالمزايدة"],"a":0,"w":"هذا تعريف الكتاب للنجش، وهو من مواضع ثبوت الغبن الفاحش عند الحنابلة.","pg":"107"},{"id":"س5-09","k":"mcq","q":"المسترسل هو:","o":["الجاهل بقيمة السلعة ولا يحسن المبايعة","من يزيد في السلعة ولا يريد شراءها","من يتلقى الركبان","التاجر الخبير بالأسعار"],"a":0,"w":"هذا تعريف الكتاب للمسترسل.","pg":"107"},{"id":"س5-10","k":"mcq","q":"يجوز طلب إبطال العقد لمجرد الغبن في:","o":["مال عديم الأهلية وناقصها وما تقضي به النصوص النظامية","كل عقود المعاوضات","العقود المبرمة بالمزايدة","كل عقد فيه غبن يسير"],"a":0,"w":"هذه حالات محددة على سبيل الحصر في الفقرة الثانية من المادة 69.","pg":"107"},{"id":"س5-11","k":"mcq","q":"من يبيع سلعة قيمتها ألف ريال بخمسمائة ريال فقط، فهذا مثال على:","o":["الغبن الفاحش","الغبن اليسير","الغلط المادي","الإكراه الأدبي"],"a":0,"w":"هذا مثال الكتاب على الغبن الفاحش.","pg":"107"},{"id":"س5-12","k":"fill","q":"لا يجوز الطعن لمجرد الغبن في عقدٍ أُبرم بطريق ____.","o":["المزايدة","المرابحة","الوكالة","النيابة"],"a":0,"w":"هذا نص الفقرة الثالثة من المادة 69.","pg":"108"},{"id":"س5-13","k":"essay","q":"عرّف الغبن، واذكر نوعيه، وبيّن موقف نظام المعاملات المدنية من إبطال العقد لمجرد الغبن.","pts":[{"x":"المادة 69 فقرة 1: زيادة العوض أو نقصه قدراً خارجاً عن المعتاد، وتقديره إلى العرف.","pg":"106"},{"x":"الغبن اليسير: لا يسع الناس تجنبه، والتصرفات معه صحيحة بإجماع الفقهاء، كبيع ما قيمته مائة بمائة وريال.","pg":"106"},{"x":"الغبن الفاحش: لا يدخل تحت تقويم المقومين، وعند الحنابلة ما يخرج عن العادة ويُرجع فيه إلى العرف، كبيع ما قيمته ألف بخمسمائة.","pg":"106–107"},{"x":"المادة 69 فقرة 2: لا إبطال لمجرد الغبن إلا في مال عديم الأهلية وناقصها وما تقضي به النصوص، وللآخر توقي الإبطال برفع الغبن. والفقرة 3: لا طعن لمجرد الغبن في عقد المزايدة.","pg":"107–108"}],"pg":"106–108"},{"id":"س5-14","k":"essay","q":"اذكر المواضع الثلاثة التي يثبت فيها الغبن الفاحش عند الحنابلة، مع تعريف كل منها وحكمها.","pts":[{"x":"تلقي الركبان: إذا تلقاهم فاشترى منهم وباعهم وغبنهم.","pg":"107"},{"x":"النجش: أن يزيد في السلعة من لا يريد شراءها.","pg":"107"},{"x":"المسترسل: الجاهل بقيمة السلعة الذي لا يحسن المبايعة.","pg":"107"},{"x":"فإذا غُبن غبناً يخرج عن العادة فله الخيار بين الفسخ والإمضاء.","pg":"107"}],"pg":"107"}],"c":[{"id":"ب5-01","f":"الغبن (المادة 69، الفقرة الأولى)","b":"زيادة العوض أو نقصه قدراً خارجاً عن المعتاد","pg":"106"},{"id":"ب5-02","f":"الغبن الفاحش","b":"هو الغبن الذي لا يدخل تحت تقويم المقومين","pg":"106"},{"id":"ب5-03","f":"النجش","b":"وهو أن يزيد في السلعة من لا يريد شراءها","pg":"107"},{"id":"ب5-04","f":"المسترسل","b":"وهو الجاهل بقيمة السلعة ولا يحسن المبايعة","pg":"107"},{"id":"ب5-05","f":"بيع المزايدة","b":"أن ينادي على السلعة بحضور المزايدين، فيزيد الناس فيها بعضهم على بعض، حتى تقف على آخر من يزيد فيها فيأخذها","pg":"108"},{"id":"ب5-06","f":"المادة 69، الفقرة الثانية","b":"ليس للمتعاقد طلب إبطال العقد لمجرد الغبن إلا في مال عديم الأهلية وناقصها وما تقضي به النصوص النظامية، وللمتعاقد الآخر توقي الإبطال إذا قدم ما تراه المحكمة كافياً لرفع الغبن.","pg":"107"},{"id":"ب5-07","f":"المادة 69، الفقرة الثالثة","b":"لا يجوز الطعن لمجرد الغبن في عقدٍ أُبرم بطريق المزايدة","pg":"108"}],"n":[{"id":"و5-01","x":"الغبن (المادة 69 فقرة 1): زيادة العوض أو نقصه قدراً خارجاً عن المعتاد، وتقديره إلى العرف. اليسير لا يؤثر بالإجماع، والفاحش لا يدخل تحت تقويم المقومين.","pg":"106"},{"id":"و5-02","x":"لا إبطال لمجرد الغبن إلا في مال عديم الأهلية وناقصها وما تقضي به النصوص، وللآخر توقي الإبطال برفع الغبن (فقرة 2)، ولا طعن لمجرد الغبن في المزايدة (فقرة 3).","pg":"107–108"},{"id":"و5-03","x":"مواضع الغبن الفاحش عند الحنابلة: تلقي الركبان، والنجش، والمسترسل، وفيها الخيار بين الفسخ والإمضاء.","pg":"107"}]},{"id":6,"title":"خيار المجلس","pages":"109–112","batch":2,"intro":"بعد عيوب الإرادة في النظام، يعرض الكتاب خيار المجلس في الفقه الإسلامي وبعض أحكامه.","sections":[{"h":"الخيار وحكمته ودليله","b":[{"t":"def","h":"الخيار","x":"الخيار هو طلب خير الأمرين في العقد إما الإمضاء أو الإلغاء","pg":"109"},{"t":"p","x":"والأصل في العقد اللزوم، لأن القصد منه ترتيب أثره الذي اتجهت إليه إرادة أطرافه، كنقل الملكية في البيع. لكن الشارع أثبت الخيار في حالات معينة رفقاً بالمتعاقدين، فالبيع قد يقع فجأة من غير تفكير ولا تأمل ولا نظر في القيمة أو السلعة، فيندم أحد المتعاقدين أو كلاهما؛ فأعطى الإسلام فرصة للتروي تسمى الخيار.","pg":"109"},{"t":"quote","h":"دليله (متفق عليه)","x":"البيعان بالخيار مالم يتفرقا، فإن صدقا وبينا بورك لهما في بيعهما، وإن كتما وكذبا محقت بركة بيعهما","pg":"109"},{"t":"p","x":"وقال ابن القيم: أثبت الشارع خيار المجلس في البيع حكمة ومصلحة للمتعاقدين، وليحصل لهما تمام الرضى الذي شرطه الله تعالى فيه بقوله: «عَنْ تَرَاضٍ مِنْكُمْ»، فإن العقد قد يقع بغتة من غير تروٍّ ولا نظر في القيمة، فاقتضت محاسن هذه الشريعة الكاملة أن يجعل للعقد وقتاً يتروى فيه المتبايعان، ويعيدان النظر، ويستدرك كل واحد منهما.","pg":"109–110"}]},{"h":"خيار المجلس ومتى يتحقق التفرق","b":[{"t":"def","h":"خيار المجلس","x":"ويقصد به الاجتماع الذي تم فيه العقد، وأصله مكان الجلوس، والمراد بالمجلس هنا مكان التبايع على أي حال كان المتعاقدين","pg":"110"},{"t":"p","x":"وهو يثبت في البيع ولو لم يشترطه المتعاقدان، وهو مذهب جمهور الفقهاء، لحديث «البيعان بالخيار مالم يتفرقا»، أي ما لم يتفرقا ببدنيهما، فالخيار ممتد زمن عدم تفرقهما.","pg":"110"},{"t":"p","x":"والتفرق المقصود تفرق الأبدان، والمرجع فيه إلى العرف: فما عده الناس تفرقاً عُد تفرقاً، لأن الشارع أطلق التفرق ولم يبينه، فدل على أنه أراد ما يعرفه الناس.","pg":"110"},{"t":"list","h":"أمثلة الكتاب على التفرق بالأبدان عرفاً","num":0,"items":[{"h":"في مكان واسع كالصحراء","x":"بأن يمشي أحدهما مستدبراً صاحبه خطوات.","pg":"110"},{"h":"في دار كبيرة ذات مجالس وبيوت","x":"بأن يفارقه من بيت إلى بيت.","pg":"110"},{"h":"في دار صغيرة","x":"إذا صعد أحدهما السطح، أو خرج منها.","pg":"111"},{"h":"في سفينة","x":"في الكبيرة بصعود أحدهما أعلاها إن كانا أسفلها أو العكس، وفي الصغيرة بخروج أحدهما منها.","pg":"111"}]},{"t":"p","x":"ولو حُجز بينهما بحاجز كحائط، أو ناما، لم يعد ذلك تفرقاً، لبقائهما بأبدانهما في محل العقد ولو طالت المدة.","pg":"111"},{"t":"hashia","x":"والخطوات المقصودة في الصحراء ثلاث فأكثر، وقُيّد ذلك بما إذا لم يسمع كلامه المعتاد.","pg":"110"},{"t":"hashia","x":"وللبيهقي: «ما لم يتفرقا عن مكانهما»، وهو صريح في الدلالة. قال أبو برزة وابن عمر: التفرق معناه التفرق بالأبدان. قال الحافظ: ولا يعلم لهما مخالف من الصحابة، وهو قول الجمهور من الصحابة والتابعين ومن بعدهم.","pg":"110"}]},{"h":"العقود التي يثبت فيها خيار المجلس","b":[{"t":"list","h":"يثبت فيها خيار المجلس","num":0,"items":[{"h":"البيع","pg":"110"},{"h":"الصلح والقسمة والهبة على عوض إن كان العوض فيها معلوماً","x":"لأنها نوع من البيوع.","pg":"111"},{"h":"الإجارة","x":"لأنها عقد معاوضة، فكانت شبيهة بالبيع.","pg":"111"},{"h":"الصرف والسلم","x":"لتناول البيع لهما.","pg":"111"}]},{"t":"list","h":"ولا يثبت في سائر العقود، مثل","num":0,"items":[{"h":"المساقاة، والحوالة، والوقف، والرهن، والضمان","pg":"111"}]},{"t":"hashia","x":"ولا يثبت كذلك في المزارعة، والأخذ بالشفعة، والإقالة، والجعالة، والشركة، والوكالة، والمضاربة، والعارية، والمسابقة، والهبة بغير عوض، والوديعة، والوصية قبل الموت، ولا في النكاح والخلع والطلاق والإبراء والعتق على مال والكفالة والصلح عن نحو دم، لأن ذلك ليس بيعاً ولا في معناه. وقال الوزير وغيره: اتفقوا على أن خيار المجلس لا يثبت في العقود غير اللازمة كالشركة والوكالة والمضاربة، ولا في العقود اللازمة التي لا يقصد فيها العوض كالنكاح والخلع والكتابة.","pg":"111"}]},{"h":"ما يسقط به خيار المجلس","b":[{"t":"list","h":"يسقط خيار المجلس بأمور","num":1,"items":[{"h":"أن يتفق المتعاقدان على عدم الخيار، وذلك قبل تمام العقد","x":"فقد وجب البيع، كأن يقولا: تبايعنا على أن لا خيار بيننا، أو يقول أحدهما: بعتك على أن لا خيار بيننا فيقبل الآخر؛ فلا خيار لأنهما شرطا عدم وجوده.","pg":"111"},{"h":"أن يسقطا الخيار بعد تمام العقد","x":"كأن يقول كل منهما: اخترت إمضاء العقد أو التزامه، فيسقط خيارهما، لأن الخيار حق فيسقط بإسقاطه. وإذا أسقطه أحدهما سقط خيار القائل وبقي خيار صاحبه.","pg":"111–112"},{"h":"أن يتفرقا عن المجلس بأبدانهما عرفاً","x":"فإذا فارق أحدهما صاحبه لزم البيع. وتحرم الفرقة من موضع التبايع بغير إذن صاحبه، خشية أن يطلب الفسخ.","pg":"112"},{"h":"أن يموت أحد المتعاقدين","x":"فينقطع الخيار، لأن الموت فرقة. ولا يسقط الخيار بجنون أحدهما لعدم التفرق، وله خياره إذا أفاق، ولا يثبت الخيار لوليه لأن الرغبة في البيع وعدمها لا تُعلم إلا من جهته. وإن خرس أحدهما قامت إشارته مقام نطقه.","pg":"112"}]},{"t":"quote","h":"قول ابن القيم كما نقله الكتاب","x":"إذا أسقطا الخيار قبل التفرق، سقط على الصحيح، ودل عليه النص، ولأنهما عقدا على هذا الوجه وإذا أسقطه أحدهما سقط خيار القائل وبقي خيار صاحبه","pg":"112"},{"t":"warn","x":"في آخر صفحة 111 وأول صفحة 112 دخل وسط كلام خيار المجلس كلام لا علاقة له به: عن النائب إذا خرج عن حدود نيابته والمدين المعسر، وعن قصر التعويض في المسؤولية العقدية على الضرر المتوقع. والظاهر أنه خطأ في الطباعة، فلم يدخل في هذا الدرس، وذُكر مثالا النائب والمدين المعسر في درس البطلان عند الكلام عن عدم النفاذ.","pg":"111–112"}]}],"q":[{"id":"س6-01","k":"tf","q":"الأصل في العقد اللزوم.","a":true,"w":"لأن القصد منه ترتيب أثره الذي اتجهت إليه إرادة أطرافه، والخيار استثناء أثبته الشارع رفقاً بالمتعاقدين.","pg":"109"},{"id":"س6-02","k":"tf","q":"يثبت خيار المجلس في البيع ولو لم يشترطه المتعاقدان.","a":true,"w":"وهو مذهب جمهور الفقهاء، لحديث «البيعان بالخيار مالم يتفرقا».","pg":"110"},{"id":"س6-03","k":"tf","q":"التفرق المقصود في خيار المجلس هو تفرق الأقوال لا الأبدان.","a":false,"w":"«والتفرق المقصود هنا تفرق الأبدان»، والمرجع فيه إلى العرف.","pg":"110"},{"id":"س6-04","k":"tf","q":"إذا حُجز بين المتعاقدين بحاجز كحائط، عُد ذلك تفرقاً ينقطع به الخيار.","a":false,"w":"الحاجز والنوم لا يعدان تفرقاً، لبقائهما بأبدانهما في محل العقد ولو طالت المدة.","pg":"111"},{"id":"س6-05","k":"tf","q":"يثبت خيار المجلس في عقد الإجارة لأنه عقد معاوضة شبيه بالبيع.","a":true,"w":"هذا ما ذكره الكتاب.","pg":"111"},{"id":"س6-06","k":"tf","q":"يثبت خيار المجلس في الرهن والضمان.","a":false,"w":"لا يثبت في سائر العقود كالمساقاة والحوالة والوقف والرهن والضمان.","pg":"111"},{"id":"س6-07","k":"tf","q":"يسقط خيار المجلس بجنون أحد المتعاقدين.","a":false,"w":"لا يسقط بالجنون لعدم التفرق، وله خياره إذا أفاق.","pg":"112"},{"id":"س6-08","k":"tf","q":"إذا أسقط أحد المتعاقدين الخيار سقط خيار القائل وبقي خيار صاحبه.","a":true,"w":"هذا ما نقله الكتاب عن ابن القيم.","pg":"112"},{"id":"س6-09","k":"mcq","q":"الخيار هو:","o":["طلب خير الأمرين في العقد إما الإمضاء أو الإلغاء","حق الفسخ للغبن الفاحش وحده","مكان التبايع","تفرق الأبدان"],"a":0,"w":"هذا تعريف الكتاب للخيار.","pg":"109"},{"id":"س6-10","k":"mcq","q":"التفرق في خيار المجلس يُرجع في تحديده إلى:","o":["العرف","نص نظام المعاملات المدنية","اختيار البائع وحده","مدة محددة بثلاثة أيام"],"a":0,"w":"لأن الشارع أطلق التفرق ولم يبينه، فدل على أنه أراد ما يعرفه الناس.","pg":"110"},{"id":"س6-11","k":"mcq","q":"من العقود التي يثبت فيها خيار المجلس:","o":["الصرف والسلم","المساقاة","الحوالة","الوقف"],"a":0,"w":"يثبت في الصرف والسلم لتناول البيع لهما، ولا يثبت في المساقاة والحوالة والوقف.","pg":"111"},{"id":"س6-12","k":"mcq","q":"إذا مات أحد المتعاقدين قبل التفرق:","o":["ينقطع الخيار لأن الموت فرقة","ينتقل الخيار إلى وارثه","يثبت الخيار لوليه","يبطل العقد بطلاناً مطلقاً"],"a":0,"w":"«فبموت أحدهما ينقطع الخيار لأن الموت فرقة».","pg":"112"},{"id":"س6-13","k":"fill","q":"والمراد بالمجلس هنا مكان ____ على أي حال كان المتعاقدين.","o":["التبايع","الكتابة","القضاء","السكن"],"a":0,"w":"وأصل المجلس مكان الجلوس، والمراد به هنا مكان التبايع.","pg":"110"},{"id":"س6-14","k":"fill","q":"وإن خرس أحد المتعاقدين قامت ____ مقام نطقه.","o":["إشارته","يمينه","سكوته","شهادته"],"a":0,"w":"هذا ما ذكره الكتاب في آخر أحكام سقوط الخيار.","pg":"112"},{"id":"س6-15","k":"essay","q":"عرّف الخيار وخيار المجلس، واذكر دليله وحكمته، ومتى يتحقق التفرق.","pts":[{"x":"الخيار: طلب خير الأمرين في العقد إما الإمضاء أو الإلغاء، والأصل في العقد اللزوم، وأثبت الشارع الخيار رفقاً بالمتعاقدين.","pg":"109"},{"x":"خيار المجلس: المجلس هو الاجتماع الذي تم فيه العقد، والمراد مكان التبايع؛ ويثبت في البيع ولو لم يُشترط، لحديث «البيعان بالخيار مالم يتفرقا».","pg":"109–110"},{"x":"حكمته عند ابن القيم: أن يحصل للمتعاقدين تمام الرضى، لأن العقد قد يقع بغتة، فجُعل وقت للتروي.","pg":"109–110"},{"x":"التفرق بالأبدان عرفاً: في الصحراء بالمشي خطوات، وفي الدار الكبيرة من بيت إلى بيت، وفي الصغيرة بصعود السطح أو الخروج؛ والحاجز كالحائط والنوم ليسا تفرقاً.","pg":"110–111"}],"pg":"109–111"},{"id":"س6-16","k":"essay","q":"اذكر ما يسقط به خيار المجلس، مع التوضيح.","pts":[{"x":"الاتفاق على عدم الخيار قبل تمام العقد، كقولهما: تبايعنا على أن لا خيار بيننا.","pg":"111"},{"x":"إسقاطه بعد تمام العقد، كقول كل منهما: اخترت إمضاء العقد؛ وإن أسقطه أحدهما سقط خياره وبقي خيار صاحبه.","pg":"111–112"},{"x":"التفرق عن المجلس بالأبدان عرفاً، وتحرم الفرقة بغير إذن صاحبه خشية أن يطلب الفسخ.","pg":"112"},{"x":"موت أحد المتعاقدين، لأن الموت فرقة؛ ولا يسقط بالجنون، والأخرس تقوم إشارته مقام نطقه.","pg":"112"}],"pg":"111–112"},{"id":"س6-17","k":"essay","q":"في أي العقود يثبت خيار المجلس؟ وفي أيها لا يثبت؟","pts":[{"x":"يثبت في البيع، وفي الصلح والقسمة والهبة على عوض معلوم لأنها نوع من البيوع، وفي الإجارة لأنها معاوضة شبيهة بالبيع، وفي الصرف والسلم لتناول البيع لهما.","pg":"111"},{"x":"ولا يثبت في سائر العقود كالمساقاة والحوالة والوقف والرهن والضمان.","pg":"111"},{"x":"ومن الحاشية: اتفقوا على أنه لا يثبت في العقود غير اللازمة كالشركة والوكالة والمضاربة، ولا في العقود اللازمة التي لا يقصد فيها العوض كالنكاح والخلع.","pg":"111"}],"pg":"111"}],"c":[{"id":"ب6-01","f":"الخيار","b":"الخيار هو طلب خير الأمرين في العقد إما الإمضاء أو الإلغاء","pg":"109"},{"id":"ب6-02","f":"خيار المجلس","b":"ويقصد به الاجتماع الذي تم فيه العقد، وأصله مكان الجلوس، والمراد بالمجلس هنا مكان التبايع على أي حال كان المتعاقدين","pg":"110"},{"id":"ب6-03","f":"حديث خيار المجلس","b":"البيعان بالخيار مالم يتفرقا، فإن صدقا وبينا بورك لهما في بيعهما، وإن كتما وكذبا محقت بركة بيعهما","pg":"109"}],"n":[{"id":"و6-01","x":"الخيار: طلب خير الأمرين إمضاءً أو إلغاءً، والأصل في العقد اللزوم. وخيار المجلس يثبت في البيع ولو لم يُشترط، لحديث «البيعان بالخيار مالم يتفرقا».","pg":"109–110"},{"id":"و6-02","x":"التفرق بالأبدان عرفاً، والحاجز كالحائط والنوم ليسا تفرقاً. ويثبت في البيع والصلح والقسمة والهبة على عوض والإجارة والصرف والسلم، لا في المساقاة والحوالة والوقف والرهن والضمان.","pg":"110–111"},{"id":"و6-03","x":"يسقط «بأمور منها» أربعة ذكرها الكتاب: الاتفاق على عدمه قبل تمام العقد، وإسقاطه بعده، والتفرق بالأبدان، وموت أحدهما. ولا يسقط بالجنون، والأخرس تقوم إشارته مقام نطقه.","pg":"111–112"}]},{"id":7,"title":"المحل","pages":"113–122","batch":2,"intro":"المحل أو المعقود عليه هو الركن الثاني من أركان العقد بعد الرضى، ونصّت على أحكامه المواد من 70 إلى 74 من نظام المعاملات المدنية.","sections":[{"h":"محل العقد ومحل الالتزام","b":[{"t":"p","x":"العقد ارتباط الإيجاب بالقبول لإحداث أثر نظامي، وهذا الأثر هو الالتزامات، وتعتبر هذه الالتزامات محل العقد. والالتزام لا ينشأ إلا إذا كان له محل، فوجود محل الالتزام شرط لنشأته، ولذلك يجوز أن يعتبر محل الالتزام هو ذاته محل العقد.","pg":"113"},{"t":"p","x":"وقد يتعدد محل العقد بتعدد الالتزامات الناشئة عنه: فعقد الإيجار يولد التزامين أساسيين، دفع الأجرة على المستأجر، وتمكين المستأجر من الانتفاع بالعين على المؤجر، فمحل عقد الإيجار هو الأجرة والانتفاع.","pg":"113"},{"t":"def","h":"محل العقد","x":"ولذلك فإن محل العقد هو مجموع الالتزامات الناشئة عنه","pg":"114"},{"t":"hashia","x":"يذكر الدكتور عبد المنعم الصدة خلافاً بين الفقهاء في تحديد ماهية المحل: فمنهم من يعتبره ركناً في الالتزام، ومنهم من يعتبره من عناصر الإرادة. والصحيح عنده أن للالتزام محلاً وللعقد محلاً آخر: فمحل الالتزام هو الأداء الذي يجب على المدين أن يقوم به لصالح الدائن، وهو نقل حق عيني أو عمل أو امتناع عن عمل؛ ومحل العقد هو العملية القانونية التي يراد تحقيقها من وراء العقد. وآية ذلك أن محل الالتزام قد يكون صحيحاً في ذاته، ويقع العقد باطلاً لأن العملية القانونية المقصودة منه يحرمها القانون، كالتعامل في تركة مستقبلة لشخص على قيد الحياة، وشراء القضاة المختصين للحق المتنازع فيه.","pg":"113"},{"t":"art","no":"70","x":"يصح أن يكون محل الالتزام نقل حق عيني أو عملاً أو امتناعاً عن عمل","pg":"114"},{"t":"list","h":"صور محل الالتزام في المادة 70","num":0,"items":[{"h":"نقل حق عيني","x":"كالبيع: يلتزم البائع بنقل ملكية المبيع إلى المشتري وتمكينه منه بالصورة التي ارتضاها في العقد.","pg":"114"},{"h":"عمل","x":"كما في عقد العمل أو المقاولة.","pg":"114"},{"h":"امتناع عن عمل","x":"كما في الالتزام بعدم المنافسة.","pg":"114"}]},{"t":"art","no":"71","x":"يصح أن يكون محل الالتزام شيئاً مستقبلاً معيَّناً بنوعه ومقداره، وفيما عدا الأحوال التي تجيزها النصوص النظامية لا يصح أن تكون تركة شخص على قيد الحياة محلاً للتعامل ولو كان قد صدر منه أو برضاه.","pg":"114"},{"t":"p","x":"ومن أمثلة المحل المستقبل المعين بنوعه ومقداره ما يكون في عقد الاستصناع.","pg":"114"},{"t":"art","no":"72","x":"1. يجب أن تتوفر في محل الالتزام الشروط الآتية: أ- أن يكون ممكناً في ذاته. ب- ألا يكون مخالفاً للنظام العام. ج- أن يكون معيَّناً بذاته أو بنوعه ومقداره أو قابلاً للتعيين. 2. يقع العقد باطلاً إذا لم تتوفر في المحل الشروط الواردة في الفقرة (1) من هذه المادة.","pg":"114"},{"t":"list","h":"شروط المحل الثلاثة كما يعرضها الكتاب","num":1,"items":[{"h":"أن يكون المحل موجوداً أو ممكناً","pg":"115"},{"h":"أن يكون المحل غير مخالف للنظام العام، مشروعاً وقابلاً للتعامل فيه","pg":"118"},{"h":"أن يكون المحل معيناً أو قابلاً للتعيين","pg":"120"}]}]},{"h":"الشرط الأول: أن يكون المحل موجوداً أو ممكناً","b":[{"t":"p","x":"إذا كان محل الالتزام نقل حق عيني لزم أن يكون موجوداً أو ممكن الوجود. وإذا كان قياماً بعمل أو امتناعاً عن عمل وجب أن يكون الأداء ممكناً، فلا يقوم الالتزام إذا كان الأداء مستحيلاً، إذ لا يكلف أحد بالمستحيل. والقاعدة الفقهية: أن لا تكليف إلا بمقدور.","pg":"115"},{"t":"p","x":"وهذا جوهر شرط الفقه الإسلامي أن يكون المعقود عليه مقدوراً على تسليمه وقت العقد، المبيع وكذلك الثمن، لأن ما لا يقدر على تسليمه شبيه بالمعدوم، والمعدوم لا يصح بيعه.","pg":"115"},{"t":"hashia","x":"ومما لا يُقدر على تسليمه عند فقهاء الشريعة: العبد الآبق، ولا يجعل ثمناً، علم الآخذ مكانه أو لم يعلمه، لأن النبي ﷺ نهى عن شراء العبد وهو آبق، وكذا الجمل الشارد والفرس الغائر ونحوهما.","pg":"115"},{"t":"hashia","x":"والوجود ليس إلا صورة للإمكان، فالإمكان والوجود ليسا شرطين بل شرط واحد، يعبر عنه بالإمكان تارة وبالوجود تارة أخرى، تبعاً لنوع المحل الذي يرد عليه الالتزام.","pg":"115"},{"t":"h3","x":"1. وجود المحل"},{"t":"p","x":"إذا كان المحل نقل حق عيني أو شخصي، أو عملاً يتعلق بشيء معين، وجب أن يكون الشيء الذي يرد عليه الحق أو يتعلق به العمل موجوداً، وقت العقد أو في المستقبل.","pg":"115–116"},{"t":"kinds","items":[{"h":"هلاك الشيء قبل التعاقد","eff":"void","et":"لا ينعقد العقد","x":"إذا تعاقد الطرفان على أن الشيء موجود ثم تبين أنه هلك قبل التعاقد، لم ينعقد العقد، لأن هناك استحالة مطلقة وسابقة على التعاقد.","egs":["بيع منزل تبين أنه هلك قبل العقد لأي سبب.","حوالة حق اتضح أنه انقضى قبل الحوالة."],"pg":"116"},{"h":"هلاك الشيء بعد نشوء الالتزام","eff":"stop","et":"ينعقد ثم ينفسخ","x":"ينشأ الالتزام صحيحاً وينعقد العقد، لكن تحدث استحالة في التنفيذ تؤدي إلى انقضاء الالتزام ما لم يكن للمدين يد في الهلاك، فينفسخ العقد من تلقاء نفسه.","pg":"116"}]},{"t":"p","x":"والوجود يتعلق بالشيء المادي والحق على حد سواء، فمن قبيل المحل غير الموجود: التنازل عن الإيجار إذا كان قد انقضى قبل التنازل، والوفاء بدين سبق الوفاء به.","pg":"116"},{"t":"p","x":"ولا يلزم أن يكون المحل موجوداً وقت العقد، بل يكفي أن يكون قابلاً للوجود في المستقبل، إلا إذا اتجهت نية المتعاقدين إلى أن يكون موجوداً وقت التعاقد. فيجوز بيع ثمار حديقة قبل اكتمال نضجها، وبيع شقة سوف تبنى، وبيع كتاب لم يتم تأليفه بعد. ويجب لصحة بيع الشيء المستقبل ألا يكون وجوده مرهوناً بالصدفة، وإلا صار المحل شيئاً احتمالياً لا مستقبلاً.","pg":"116"},{"t":"p","x":"وإذا لم يوجد الشيء في المستقبل فلا يؤثر ذلك في صحة انعقاد العقد، لأنه يكفي لقيامه صحيحاً أن يكون المحل قابلاً للوجود، لكن عدم تحقق الوجود قد يؤدي إلى فسخ العقد أو انفساخه بحسب الأحوال.","pg":"116–117"},{"t":"h3","x":"2. إمكانية المحل"},{"t":"p","x":"إذا كان المحل عملاً أو امتناعاً عن عمل وجب أن يكون مما يمكن القيام به، أي ألا يكون الأداء مستحيلاً، والمقصود الاستحالة المطلقة.","pg":"117"},{"t":"kinds","items":[{"h":"الاستحالة المطلقة","eff":"void","et":"لا يقوم الالتزام","d":"وهي الاستحالة التي لا تقوم بالنسبة للمدين فحسب، وإنما تقوم لكل الناس","x":"أي أن تكون استحالة موضوعية ترجع إلى الالتزام في ذاته، فتقوم بالنسبة للجميع، وليست استحالة شخصية تقوم بالنسبة للبعض دون البعض الآخر.","pg":"117"},{"h":"الاستحالة النسبية","eff":"ok","et":"ينعقد العقد","d":"وهي التي تقوم بالنسبة إلى المدين وقد لا تقوم بالنسبة إلى غيره","x":"فلا تمنع قيام الالتزام، وينعقد معها العقد، سواء كانت قائمة وقت انعقاد العقد أو لاحقة له. فإذا عجز المدين عن التنفيذ العيني، جاز للدائن أن يطلب التنفيذ على نفقة المدين، أو أن يطالب بالتعويض.","egs":["من يتعهد بأن يرسم لوحة فنية لشخص معين، وهو يجهل الرسم."],"pg":"117"}]},{"t":"hashia","x":"وتكون الاستحالة المطلقة طبيعية ترجع إلى طبيعة المحل، كمن التزم بأن يعيد ميتاً إلى الحياة، أو بأن يمتنع عن عمل قد قام به فعلاً؛ أو قانونية ترجع إلى حكم القانون، كمحامٍ تعهد برفع استئناف عن حكم انقضى ميعاد الاستئناف فيه.","pg":"117"}]},{"h":"الشرط الثاني: أن يكون المحل غير مخالف للنظام العام","b":[{"t":"warn","x":"عنوان هذا الشرط في الكتاب في صفحة 118: «أن يكون المحل مخالفاً للنظام العام»، والمقصود «غير مخالف» كما يدل عليه الكلام تحته ونص المادة 72. وفي الصفحة نفسها «القابلية لتعيين»، والمقصود «القابلية للتعامل».","pg":"118"},{"t":"p","x":"لا ينشأ الالتزام إلا إذا كان محله غير مخالف للنظام العام، ومقتضى ذلك أن يكون مشروعاً. وشرط المشروعية يجب أن يتوافر في الالتزام أياً كان: عملاً أو امتناعاً عن عمل، أو نقل حق عيني، أو دفع مبلغ من النقود. ويناقشه الكتاب من جانبين: المشروعية، والقابلية للتعامل.","pg":"118"},{"t":"h3","x":"1. مشروعية المحل"},{"t":"p","x":"مشروعية المحل أمر حتمي، سواء جاءت بنص القانون أو بقاعدة من قواعد الفقه الإسلامي. وورد هذا الشرط في كتب الفقه بصيغة: «أن يكون المعقود عليه أو على منفعته مباح النفع»، أي أن يكون المحل من المباحات الجائزة شرعاً، فلا يجوز أن يكون المحل خمراً أو خنزيراً في البيع، ولا دوراً للدعارة في الإيجار. وهذا نفس ما يشترطه القانون: أن يكون المحل مشروعاً غير مخالف للنظام العام أو الآداب.","pg":"118"},{"t":"p","x":"ويجب أن يكون المحل المباح ذا منفعة، فيخرج ما لا نفع فيه كالحشرات، إلا ما استثناه الفقهاء، وكذلك ما فيه منفعة محرمة كالخمر.","pg":"118"},{"t":"list","h":"مشروعية المحل بحسب نوع الالتزام","num":0,"items":[{"h":"إذا كان الالتزام إيجابياً، أي قياماً بعمل معين","x":"وجب ألا يكون هذا العمل مخالفاً للنظام العام أو الآداب، وإلا كان محل الالتزام غير مشروع.","pg":"118–119"},{"h":"إذا كان الالتزام سلبياً، أي امتناعاً عن عمل","x":"وجب ألا يكون امتناعاً عن عمل يفرض القانون فعله، كمن يتعهد لآخر بالامتناع عن الوفاء برسوم مالية للدولة مثل مصلحة الزكاة والدخل أو مصلحة الجمارك، أو يتعهد بعدم أداء الشهادة في دعوى استُدعي للشهادة فيها، ﴿وَمَن يَكْتُمْهَا فَإِنَّهُ آثِمٌ قَلْبُهُ﴾.","pg":"119"},{"h":"إذا كان الامتناع قيداً على الحرية الشخصية","x":"كالامتناع عن مزاولة مهنة معينة امتناعاً مطلقاً، أو الامتناع عن الزواج، أو الالتزام بعدم مبارحة مكان معين لفترة غير معقولة؛ فكل هذه التزامات غير مشروعة، ويكون العقد معها باطلاً.","pg":"119"}]},{"t":"hashia","x":"فالقتل والسرقة والتجسس وإدارة أماكن القمار والدعارة أعمال غير مشروعة، لا تصلح محلاً للالتزام، فإن تعاقد اثنان على عمل منها كان عقدهما باطلاً بطلاناً مطلقاً.","pg":"119"},{"t":"h3","x":"2. القابلية وإمكانية التعامل"},{"t":"p","x":"إذا كان الالتزام بنقل حق عيني، فالمحل يعتبر غير مشروع إذا كان الشيء الوارد عليه الحق خارجاً عن دائرة التعامل.","pg":"119"},{"t":"list","h":"ما يخرج عن دائرة التعامل","num":1,"items":[{"h":"ما يخرج بطبيعته","x":"وهو ما لا يستطيع أحد أن يستأثر بحيازته، كأشعة الشمس والهواء وماء البحار والأنهار، فيكون التعامل فيه غير ممكن.","pg":"119"},{"h":"ما يخرج مراعاة للغرض الذي خُصص له الشيء","x":"كالأموال العامة المخصصة للمنفعة العامة، فلا يجوز التصرف فيها، ولا الحجر عليها، ولا تملكها بالتقادم.","pg":"120"},{"h":"الحقوق اللصيقة بالشخصية وحقوق المواطنة الوطنية والسياسية","x":"فلا يجوز النزول عن الشخصية أو الاسم أو حق الأبوة وحق الولاية، ولا يجوز بيع الناخب لصوته، ولا البيع أو التنازل عن وظيفة عامة، ولا التنازل عن حق وطني أو سياسي.","pg":"120"}]},{"t":"hashia","x":"والمقصود عدم القابلية للتعامل في هذه الأشياء في مجموعها، كأشعة الشمس كلها أو الماء كله أو الهواء كله. فإن أمكن حيازة بعضها وتغيير شيء من خصائصها أو إضافة ميزات إليها جاز التعامل فيه، كماء أُخذ من البحر فحُلّي ثم بيع، وهواء ضُغط في حيز معين، وغاز اشتُق من الهواء ثم بيع.","pg":"119–120"}]},{"h":"الشرط الثالث: أن يكون المحل معيناً أو قابلاً للتعيين","b":[{"t":"p","x":"الالتزام يوجب على المدين أداءً معيناً لمصلحة الدائن، ويجبره عليه إن امتنع، فوجب أن يكون الأداء معيناً، وإلا كيف يُطالب بأداء لا يعرف ماهيته ومداه؟ ويكون المحل معيناً إذا حُدد تحديداً كافياً لبيان عناصره ومضمونه. ويكتفي الفقه بأن يكون المحل قابلاً للتعيين، أي أن تكون هناك عوامل تساعد على تعيينه.","pg":"120"},{"t":"list","h":"طرق التعيين باختلاف المحل","num":1,"items":[{"h":"إذا كان المحل عملاً يقوم به المدين","x":"وجب توضيح العمل وبيان حدوده ومداه، كمقاول التزم بإقامة بناء فتحدد مواصفاته تحديداً كافياً. وقد تعين ظروف التعامل على التحديد، فالمدرسة أو المستشفى يقتضي الغرض منهما مواصفات يلزم توافرها عادة في أبنيتهما.","pg":"121"},{"h":"إذا كان المحل نقل حق عيني في شيء معين بالذات","x":"لزم أن يتعين بمميزاته الذاتية تعييناً واضحاً كافياً نافياً للجهالة: فالسيارة توصف بنوعها وسنة صنعها وقوة محركها وسعته، والمنزل بموقعه ومساحته وعدد طوابقه وغير ذلك.","pg":"121"},{"h":"إذا كان المحل نقل حق عيني في شيء معين بالنوع","x":"لزم أن يتعين بنوعه ومقداره ودرجة جودته، كبيع كمية من القطن تُعين من حيث صنفها وصفتها وكميتها. فإن لم يتعين المقدار وجب أن يكون قابلاً للتعيين، كتوريد الأغذية اللازمة لعمال مصنع، فيتحدد القدر بحاجة العمال. وإذا لم تُذكر درجة الجودة وجب أن يكون الشيء من الصنف المتوسط، ما لم يوجد عرف يقضي بخلاف ذلك.","pg":"121–122"}]},{"t":"art","no":"73، الفقرة الأولى","x":"إذا لم يحدِّد المتعاقدان مقدار المحل وتضمن العقد ما يمكن للمحكمة تحديده به؛ حددته بناءً على ذلك.","pg":"121"},{"t":"art","no":"73، الفقرة الثانية","x":"إذا لم يتفق المتعاقدان على درجة جودة الشيء ولم يوجد عرف أو قرينة؛ التزم المدين بأن يسلم شيئاً ذا جودة متوسطة.","pg":"121"},{"t":"art","no":"74","x":"يجوز أن يتضمن العقد أي شرطٍ يرتضيه المتعاقدان إذا توفرت فيه الشروط الواردة في الفقرة 1 من المادة الثانية والسبعين من هذا النظام. وإذا تضمن العقد شرطاً باطلاً بطل الشرط وحده، وللمتعاقد طلب إبطال العقد إذا تبيّن أنه ما كان ليرضى بالعقد دون ذلك الشرط.","pg":"122"},{"t":"kinds","items":[{"h":"تخلف شرط من شروط المحل الثلاثة","eff":"void","et":"باطل","x":"نصت الفقرة الثانية من المادة 72: «يقع العقد باطلاً إذا لم تتوفر في المحل الشروط الواردة في الفقرة (1) من هذه المادة».","pg":"114، 122"},{"h":"الشرط الباطل في العقد (المادة 74)","eff":"stop","et":"يبطل الشرط وحده","x":"ويبقى العقد، إلا أن للمتعاقد طلب إبطال العقد إذا تبيّن أنه ما كان ليرضى بالعقد دون ذلك الشرط.","pg":"122"}]},{"t":"warn","x":"في نص المادة 74 في الكتاب خطأ طباعي: «الننظام»، والمقصود «النظام».","pg":"122"}]}],"q":[{"id":"س7-01","k":"tf","q":"يجوز أن يعتبر محل الالتزام هو ذاته محل العقد.","a":true,"w":"لأن وجود محل الالتزام شرط لنشأة الالتزام، وبالتالي لوجود محل العقد.","pg":"113"},{"id":"س7-02","k":"tf","q":"محل عقد الإيجار هو الأجرة فقط.","a":false,"w":"عقد الإيجار يولد التزامين، فمحله الأجرة والانتفاع.","pg":"113"},{"id":"س7-03","k":"tf","q":"يصح أن يكون محل الالتزام امتناعاً عن عمل، كما في الالتزام بعدم المنافسة.","a":true,"w":"المادة 70: يصح أن يكون محل الالتزام نقل حق عيني أو عملاً أو امتناعاً عن عمل.","pg":"114"},{"id":"س7-04","k":"tf","q":"يصح التعامل في تركة شخص على قيد الحياة متى صدر منه أو برضاه، في كل الأحوال.","a":false,"w":"المادة 71: فيما عدا الأحوال التي تجيزها النصوص النظامية لا يصح أن تكون تركة شخص على قيد الحياة محلاً للتعامل ولو كان قد صدر منه أو برضاه.","pg":"114"},{"id":"س7-05","k":"tf","q":"إذا تبين أن المنزل المبيع قد هلك قبل العقد، انعقد العقد ثم انفسخ.","a":false,"w":"إذا هلك الشيء قبل التعاقد لم ينعقد العقد أصلاً، لوجود استحالة مطلقة وسابقة على التعاقد.","pg":"116"},{"id":"س7-06","k":"tf","q":"إذا هلك الشيء بعد نشوء الالتزام ولم يكن للمدين يد في الهلاك، انفسخ العقد من تلقاء نفسه.","a":true,"w":"ينشأ الالتزام صحيحاً، ثم تحدث استحالة في التنفيذ تؤدي إلى انقضاء الالتزام وانفساخ العقد.","pg":"116"},{"id":"س7-07","k":"tf","q":"يشترط في كل الأحوال أن يكون المحل موجوداً وقت العقد.","a":false,"w":"يكفي أن يكون المحل قابلاً للوجود في المستقبل، إلا إذا اتجهت نية المتعاقدين إلى وجوده وقت التعاقد.","pg":"116"},{"id":"س7-08","k":"tf","q":"يجب لصحة بيع الشيء المستقبل ألا يكون وجوده مرهوناً بالصدفة.","a":true,"w":"وإلا صار المحل شيئاً احتمالياً لا مستقبلاً.","pg":"116"},{"id":"س7-09","k":"tf","q":"الاستحالة النسبية تمنع قيام الالتزام.","a":false,"w":"الاستحالة النسبية لا تمنع قيام الالتزام، وينعقد معها العقد.","pg":"117"},{"id":"س7-10","k":"tf","q":"تعهد محامٍ برفع استئناف عن حكم انقضى ميعاد الاستئناف فيه مثال على الاستحالة القانونية.","a":true,"w":"الاستحالة القانونية ترجع إلى حكم القانون، وهي من صور الاستحالة المطلقة.","pg":"117","h":1},{"id":"س7-11","k":"tf","q":"الالتزام بعدم مبارحة مكان معين لفترة غير معقولة التزام مشروع.","a":false,"w":"هذا قيد على الحرية الشخصية، فهو التزام غير مشروع والعقد معه باطل.","pg":"119"},{"id":"س7-12","k":"tf","q":"الأموال العامة المخصصة للمنفعة العامة يجوز تملكها بالتقادم.","a":false,"w":"هذه الأموال لا يجوز التصرف فيها، ولا الحجر عليها، ولا تملكها بالتقادم.","pg":"120"},{"id":"س7-13","k":"tf","q":"إذا لم يتفق المتعاقدان على درجة جودة الشيء ولم يوجد عرف أو قرينة، التزم المدين بأن يسلم شيئاً ذا جودة متوسطة.","a":true,"w":"هذا نص الفقرة الثانية من المادة 73.","pg":"121"},{"id":"س7-14","k":"tf","q":"إذا تضمن العقد شرطاً باطلاً بطل العقد كله في كل الأحوال.","a":false,"w":"المادة 74: يبطل الشرط وحده، وللمتعاقد طلب إبطال العقد إذا تبين أنه ما كان ليرضى بالعقد دون ذلك الشرط.","pg":"122"},{"id":"س7-15","k":"mcq","q":"نصّت على أنه «يصح أن يكون محل الالتزام نقل حق عيني أو عملاً أو امتناعاً عن عمل» المادةُ:","o":["70","71","72","75"],"a":0,"w":"المادة السبعون.","pg":"114"},{"id":"س7-16","k":"mcq","q":"شروط محل الالتزام في المادة 72 هي:","o":["أن يكون ممكناً في ذاته، وألا يكون مخالفاً للنظام العام، وأن يكون معيناً أو قابلاً للتعيين","أن يكون مكتوباً، ومسجلاً، ومعيناً","أن يكون موجوداً، ومملوكاً للبائع، ومسلّماً","أن يكون مشروعاً فقط"],"a":0,"w":"هذه الشروط الثلاثة في الفقرة الأولى من المادة 72.","pg":"114"},{"id":"س7-17","k":"mcq","q":"إذا لم تتوفر في المحل الشروط الواردة في الفقرة الأولى من المادة 72، فإن العقد يقع:","o":["باطلاً","قابلاً للإبطال","موقوفاً","صحيحاً مع التعويض"],"a":0,"w":"الفقرة الثانية من المادة 72: يقع العقد باطلاً.","pg":"114"},{"id":"س7-18","k":"mcq","q":"تعهد شخص بأن يرسم لوحة فنية لشخص معين وهو يجهل الرسم، مثال على:","o":["الاستحالة النسبية","الاستحالة المطلقة","المحل غير المشروع","المحل غير المعين"],"a":0,"w":"لأن غيره يستطيع الرسم، فالاستحالة شخصية نسبية لا تمنع قيام الالتزام.","pg":"117"},{"id":"س7-19","k":"mcq","q":"من الأشياء الخارجة عن دائرة التعامل بطبيعتها:","o":["أشعة الشمس والهواء وماء البحار والأنهار","الأموال العامة المخصصة للمنفعة العامة","حق الأبوة وحق الولاية","الوظيفة العامة"],"a":0,"w":"لأنها أشياء لا يستطيع أحد أن يستأثر بحيازتها. أما الأموال العامة فتخرج مراعاة للغرض الذي خُصصت له، والحقوق اللصيقة بالشخصية وحقوق المواطنة لا تصلح للتعامل.","pg":"119–120"},{"id":"س7-20","k":"mcq","q":"بيع الناخب صوته:","o":["لا يجوز، لأنه من الحقوق اللصيقة بالشخصية أو حقوق المواطنة","يجوز إذا رضي الناخب","يجوز في غير الانتخابات العامة","قابل للإبطال فقط"],"a":0,"w":"«ولا يجوز بيع الناخب لصوته».","pg":"120"},{"id":"س7-21","k":"mcq","q":"تعهد شخص بعدم أداء الشهادة في دعوى استُدعي للشهادة فيها، محل التزامه:","o":["غير مشروع","مستحيل استحالة نسبية","غير معين","شيء مستقبل"],"a":0,"w":"لأنه امتناع عن عمل يفرض القانون فعله.","pg":"119"},{"id":"س7-22","k":"mcq","q":"يجوز بيع ثمار حديقة قبل اكتمال نضجها، لأن:","o":["المحل يكفي أن يكون قابلاً للوجود في المستقبل","الثمار من الأموال العامة","البيع فيها موقوف","الغبن فيها يسير"],"a":0,"w":"يجوز أن يكون محل الالتزام شيئاً مستقبلاً، بشرط ألا يكون وجوده مرهوناً بالصدفة.","pg":"116"},{"id":"س7-23","k":"fill","q":"القاعدة الفقهية أن لا تكليف إلا ب____.","o":["مقدور","مكتوب","مشهود","مدفوع"],"a":0,"w":"إذ لا يكلف أحد بالمستحيل.","pg":"115"},{"id":"س7-24","k":"fill","q":"ما لا يُقدر على تسليمه شبيه ب____، والمعدوم لا يصح بيعه.","o":["المعدوم","الموجود","المغصوب","المرهون"],"a":0,"w":"وهذا جوهر شرط الفقه الإسلامي أن يكون المعقود عليه مقدوراً على تسليمه.","pg":"115"},{"id":"س7-25","k":"essay","q":"اذكر شروط محل الالتزام كما نصت عليها المادة 72، واشرح الشرط الأول (وجود المحل وإمكانه).","pts":[{"x":"المادة 72: أن يكون ممكناً في ذاته، وألا يكون مخالفاً للنظام العام، وأن يكون معيناً بذاته أو بنوعه ومقداره أو قابلاً للتعيين؛ وإلا وقع العقد باطلاً.","pg":"114"},{"x":"الوجود: يجب أن يكون الشيء موجوداً وقت العقد أو سيوجد مستقبلاً؛ فإن هلك قبل التعاقد لم ينعقد العقد، وإن هلك بعد نشوء الالتزام انقضى الالتزام وانفسخ العقد ما لم يكن للمدين يد.","pg":"115–116"},{"x":"ويجوز التعامل في الشيء المستقبل كثمار لم تنضج وشقة ستبنى، بشرط ألا يكون وجوده مرهوناً بالصدفة.","pg":"116"},{"x":"الإمكان: الاستحالة المطلقة (لكل الناس) تمنع قيام الالتزام، والنسبية (للمدين وحده) لا تمنعه، وللدائن التنفيذ على نفقة المدين أو التعويض.","pg":"117"}],"pg":"114–117"},{"id":"س7-26","k":"essay","q":"اشرح شرط مشروعية المحل وقابليته للتعامل، مع الأمثلة.","pts":[{"x":"لا ينشأ الالتزام إلا إذا كان محله غير مخالف للنظام العام، أي مشروعاً؛ وعبارة الفقهاء: أن يكون المعقود عليه أو على منفعته مباح النفع، فلا يصح بيع الخمر والخنزير ولا إيجار دور الدعارة.","pg":"118"},{"x":"الالتزام الإيجابي يجب ألا يكون العمل فيه مخالفاً للنظام العام أو الآداب. والسلبي يجب ألا يكون امتناعاً عن عمل يفرضه القانون، كالتعهد بعدم دفع رسوم الدولة أو بعدم أداء الشهادة، ولا قيداً على الحرية كالامتناع المطلق عن مهنة أو عن الزواج.","pg":"118–119"},{"x":"الخارج عن التعامل: بطبيعته كأشعة الشمس والهواء وماء البحار، أو للغرض الذي خُصص له كالأموال العامة، والحقوق اللصيقة بالشخصية وحقوق المواطنة كالاسم والولاية وصوت الناخب.","pg":"119–120"}],"pg":"118–120"},{"id":"س7-27","k":"essay","q":"كيف يتم تعيين المحل؟ فصّل بحسب نوعه، واذكر نص الفقرتين الأولى والثانية من المادة 73.","pts":[{"x":"يكون المحل معيناً إذا حُدد تحديداً كافياً لبيان عناصره ومضمونه، ويكفي أن يكون قابلاً للتعيين.","pg":"120"},{"x":"العمل: يوضح وتبين حدوده ومداه، كمواصفات البناء. والمعين بالذات: بمميزاته الذاتية النافية للجهالة كالسيارة والمنزل. والمعين بالنوع: بنوعه ومقداره ودرجة جودته، والقدر قد يكون قابلاً للتعيين كأغذية عمال مصنع.","pg":"121–122"},{"x":"المادة 73 فقرة 1: إذا لم يحدد المتعاقدان مقدار المحل وتضمن العقد ما يمكن للمحكمة تحديده به حددته. وفقرة 2: إذا لم يتفقا على درجة الجودة ولا عرف ولا قرينة، فالجودة متوسطة.","pg":"121"}],"pg":"120–122"},{"id":"س7-28","k":"essay","q":"فرّق بين الاستحالة المطلقة والاستحالة النسبية من حيث المفهوم والأثر، مع التمثيل.","pts":[{"x":"المطلقة: لا تقوم بالنسبة للمدين فحسب بل لكل الناس، موضوعية ترجع إلى الالتزام ذاته، فلا يقوم معها الالتزام.","pg":"117"},{"x":"وتكون طبيعية كإعادة ميت إلى الحياة، أو قانونية كتعهد محام برفع استئناف انقضى ميعاده (من الحاشية).","pg":"117"},{"x":"النسبية: تقوم بالنسبة للمدين وحده، كمن تعهد برسم لوحة وهو يجهل الرسم؛ لا تمنع قيام الالتزام، وللدائن طلب التنفيذ على نفقة المدين أو التعويض.","pg":"117"}],"pg":"117"}],"c":[{"id":"ب7-01","f":"المادة 70","b":"يصح أن يكون محل الالتزام نقل حق عيني أو عملاً أو امتناعاً عن عمل","pg":"114"},{"id":"ب7-02","f":"المادة 71","b":"يصح أن يكون محل الالتزام شيئاً مستقبلاً معيَّناً بنوعه ومقداره، وفيما عدا الأحوال التي تجيزها النصوص النظامية لا يصح أن تكون تركة شخص على قيد الحياة محلاً للتعامل ولو كان قد صدر منه أو برضاه.","pg":"114"},{"id":"ب7-03","f":"المادة 72","b":"1. يجب أن تتوفر في محل الالتزام الشروط الآتية: أ- أن يكون ممكناً في ذاته. ب- ألا يكون مخالفاً للنظام العام. ج- أن يكون معيَّناً بذاته أو بنوعه ومقداره أو قابلاً للتعيين. 2. يقع العقد باطلاً إذا لم تتوفر في المحل الشروط الواردة في الفقرة (1) من هذه المادة.","pg":"114"},{"id":"ب7-04","f":"محل العقد","b":"ولذلك فإن محل العقد هو مجموع الالتزامات الناشئة عنه","pg":"114"},{"id":"ب7-05","f":"الاستحالة المطلقة","b":"وهي الاستحالة التي لا تقوم بالنسبة للمدين فحسب، وإنما تقوم لكل الناس","pg":"117"},{"id":"ب7-06","f":"الاستحالة النسبية","b":"وهي التي تقوم بالنسبة إلى المدين وقد لا تقوم بالنسبة إلى غيره","pg":"117"},{"id":"ب7-07","f":"المادة 73 (الفقرتان الأولى والثانية)","b":"1. إذا لم يحدِّد المتعاقدان مقدار المحل وتضمن العقد ما يمكن للمحكمة تحديده به؛ حددته بناءً على ذلك. 2. إذا لم يتفق المتعاقدان على درجة جودة الشيء ولم يوجد عرف أو قرينة؛ التزم المدين بأن يسلم شيئاً ذا جودة متوسطة.","pg":"121"},{"id":"ب7-08","f":"المادة 74","b":"يجوز أن يتضمن العقد أي شرطٍ يرتضيه المتعاقدان إذا توفرت فيه الشروط الواردة في الفقرة 1 من المادة الثانية والسبعين من هذا النظام. وإذا تضمن العقد شرطاً باطلاً بطل الشرط وحده، وللمتعاقد طلب إبطال العقد إذا تبيّن أنه ما كان ليرضى بالعقد دون ذلك الشرط.","pg":"122"}],"n":[{"id":"و7-01","x":"محل العقد مجموع الالتزامات الناشئة عنه. ومحل الالتزام نقل حق عيني أو عمل أو امتناع عن عمل (المادة 70)، ويصح شيئاً مستقبلاً معيناً بنوعه ومقداره، ولا يصح التعامل في تركة إنسان حي إلا فيما تجيزه النصوص (المادة 71).","pg":"113–114"},{"id":"و7-02","x":"شروط المحل (المادة 72): ممكن في ذاته، وغير مخالف للنظام العام، ومعين أو قابل للتعيين؛ وإلا فالعقد باطل.","pg":"114"},{"id":"و7-03","x":"الهلاك قبل العقد: لا ينعقد. والهلاك بعد نشوء الالتزام: ينعقد ثم ينقضي الالتزام وينفسخ العقد إن لم يكن للمدين يد. والاستحالة المطلقة تمنع الالتزام، والنسبية لا تمنعه.","pg":"116–117"},{"id":"و7-04","x":"الخارج عن التعامل: بطبيعته (الشمس والهواء والبحار)، أو للغرض الذي خُصص له (الأموال العامة)، والحقوق اللصيقة بالشخصية وحقوق المواطنة.","pg":"119–120"},{"id":"و7-05","x":"المادة 73: تحدد المحكمة المقدار إن تضمن العقد ما يحدده، وعند عدم الاتفاق على الجودة ولا عرف ولا قرينة فالجودة متوسطة. والمادة 74: الشرط الباطل يبطل وحده، وللمتعاقد طلب الإبطال إن لم يكن ليرضى بالعقد دونه.","pg":"121–122"}]},{"id":8,"title":"السبب","pages":"122–124","batch":2,"intro":"السبب هو الركن الثالث من أركان العقد، ونصّت عليه المادتان 75 و76 من نظام المعاملات المدنية.","sections":[{"h":"تعريف السبب","b":[{"t":"def","h":"سبب العقد","x":"سبب العقد هو الباعث الدافع أو الرئيس الذي يحمل الشخص على التعاقد، والذي لولاه لما أُبرم العقد","pg":"122"},{"t":"p","x":"فالشخص قد يتعاقد بناءً على أكثر من دافع، ولا تعد هذه الدوافع كلها سبباً للعقد، وإنما الدافع الرئيس الذي لولاه لما أقدم على التعاقد هو سبب العقد.","pg":"122"},{"t":"eg","x":"من يشتري منزلاً قد تدفعه الرغبة في إيجاد مسكن ملائم لأسرته، والظهور بمظهر المالك أمام الناس؛ فإن كان الدافع الرئيس هو السكنى فهي سبب العقد.","pg":"122"},{"t":"hashia","x":"ويقاس سبب العقد بمعيار شخصي، فيختلف من شخص إلى آخر باختلاف طوائف العقود، بل يختلف في النوع الواحد من العقود، ولذلك يوصف بأنه السبب الشخصي: فقد يشتري شخص سيارة للركوب الخاص، ويشتريها آخر لاستعمالها سيارة أجرة واستثمار أمواله، وقد يستأجر الشخص شقة للسكنى وأخرى ليستعملها مكتباً يدير منه أعماله.","pg":"122–123"}]},{"h":"مشروعية السبب","b":[{"t":"art","no":"75","x":"يقع باطلاً أي عقد يكون السبب الباعث على التعاقد فيه غير مشروع إذا صرح به في العقد أو دلت عليه ظروف التعاقد","pg":"123"},{"t":"art","no":"76","x":"كل عقد لم يُذكر سببه يُفترض أن له سبباً مشروعاً؛ ما لم يقم الدليل على خلاف ذلك","pg":"123"},{"t":"kinds","items":[{"h":"السبب غير المشروع","eff":"void","et":"باطل","x":"يجب أن يكون سبب العقد مشروعاً، فإن كان غير مشروع، أي مخالفاً للنظام العام والآداب، كان العقد باطلاً.","egs":["أن يكون الدافع إلى استئجار شقة استعمالها مكاناً للمقامرة، أو لإخفاء البضائع المهربة أو المسروقة."],"pg":"123"}]},{"t":"p","x":"ولأن البواعث الدافعة إلى العقد كثيرة ومتنوعة، فلا يكفي أن يكون أحدها غير مشروع للقول بالبطلان، بل العبرة بالباعث والسبب الرئيس الذي دفع المتعاقد إلى التعاقد، فهو الذي يجب الوقوف عنده.","pg":"123"}]},{"h":"علم المتعاقد الآخر بالباعث","b":[{"t":"p","x":"ولأن البواعث أمور شخصية خارجة عن العقد، تتغير من شخص إلى آخر ومن عقد إلى آخر، كان لا بد من ضابط يضمن استقرار التعامل، حتى لا يتحلل أي متعاقد من التزاماته بدعوى أن باعثه غير مشروع؛ فيتعين أن يكون الطرفان على علم بهذا الباعث، حتى تنتفي المفاجأة ويستقر التعامل.","pg":"123–124"},{"t":"eg","x":"وقد يكون الباعث مشروعاً لأحد المتعاقدين وغير مشروع للآخر: كمن يقترض مبلغاً ليستخدمه في المقامرة أو شراء المخدرات، والمقرض باعثه استثمار نقوده بالحصول على فائدة القرض.","pg":"124"},{"t":"p","x":"والرأي الغالب في الفقه القانوني أنه لا يكفي لبطلان العقد أن يكون باعث أحد المتعاقدين غير مشروع، بل يجب أن يتصل هذا الباعث بعلم المتعاقد الآخر، محافظةً على استقرار المعاملات، وحمايةً للمتعاقد حسن النية الذي لم يعلم وقت العقد بالباعث غير المشروع. ولا يجوز التمسك بالبطلان إلا من جانب الطرف الذي قام لديه باعث مشروع وقت إبرام العقد، وكان يجهل تماماً وجود الباعث غير المشروع لدى الطرف الآخر.","pg":"124"}]}],"q":[{"id":"س8-01","k":"tf","q":"كل الدوافع التي تحمل الشخص على التعاقد تعد سبباً للعقد.","a":false,"w":"الشخص قد يتعاقد لأكثر من دافع، ولا تعد هذه الدوافع كلها سبباً، بل الدافع الرئيس.","pg":"122"},{"id":"س8-02","k":"tf","q":"كل عقد لم يُذكر سببه يُفترض أن له سبباً مشروعاً، ما لم يقم الدليل على خلاف ذلك.","a":true,"w":"هذا نص المادة 76.","pg":"123"},{"id":"س8-03","k":"tf","q":"يكفي لبطلان العقد أن يكون أحد بواعثه الكثيرة غير مشروع.","a":false,"w":"لا يكفي ذلك، بل العبرة بالباعث والسبب الرئيس الذي دفع المتعاقد إلى التعاقد.","pg":"123"},{"id":"س8-04","k":"tf","q":"يذهب الرأي الغالب في الفقه القانوني إلى أنه لا يكفي لبطلان العقد أن يكون باعث أحد المتعاقدين غير مشروع، بل يجب أن يتصل بعلم المتعاقد الآخر.","a":true,"w":"وذلك محافظة على استقرار المعاملات وحماية للمتعاقد حسن النية.","pg":"124"},{"id":"س8-05","k":"tf","q":"يقاس سبب العقد بمعيار موضوعي لا يختلف من شخص إلى آخر.","a":false,"w":"يقاس سبب العقد بمعيار شخصي، فيختلف من شخص إلى آخر، ولذلك يوصف بالسبب الشخصي.","pg":"122–123","h":1},{"id":"س8-06","k":"mcq","q":"نصّت على بطلان العقد الذي يكون السبب الباعث عليه غير مشروع إذا صُرح به في العقد أو دلت عليه ظروف التعاقد المادةُ:","o":["75","76","72","74"],"a":0,"w":"المادة الخامسة والسبعون. أما المادة 76 فافتراض مشروعية السبب غير المذكور.","pg":"123"},{"id":"س8-07","k":"mcq","q":"من استأجر شقة ليستعملها مكاناً للمقامرة، فعقده:","o":["باطل لعدم مشروعية السبب","صحيح لأن المحل مشروع","قابل للإبطال للغلط","موقوف على إجازة المؤجر"],"a":0,"w":"هذا مثال الكتاب على السبب غير المشروع، والعقد معه باطل.","pg":"123"},{"id":"س8-08","k":"mcq","q":"بحسب الرأي الغالب، لا يجوز التمسك ببطلان العقد لعدم مشروعية الباعث إلا من جانب:","o":["الطرف الذي قام لديه باعث مشروع وكان يجهل تماماً الباعث غير المشروع لدى الآخر","الطرف صاحب الباعث غير المشروع","أي شخص من الغير","المقرض دائماً"],"a":0,"w":"هذا ما ذكره الكتاب حماية للمتعاقد حسن النية.","pg":"124"},{"id":"س8-09","k":"fill","q":"سبب العقد هو الباعث الدافع أو ____ الذي يحمل الشخص على التعاقد.","o":["الرئيس","الثانوي","العارض","الظاهر"],"a":0,"w":"والذي لولاه لما أُبرم العقد.","pg":"122"},{"id":"س8-10","k":"essay","q":"عرّف سبب العقد، واذكر نصي المادتين 75 و76، وبيّن متى يكون السبب غير مشروع، وحكم الباعث غير المشروع لدى أحد المتعاقدين.","pts":[{"x":"سبب العقد: الباعث الدافع أو الرئيس الذي يحمل الشخص على التعاقد، والذي لولاه لما أُبرم العقد، كالسكنى في شراء المنزل.","pg":"122"},{"x":"المادة 75: يقع باطلاً أي عقد يكون السبب الباعث عليه غير مشروع إذا صُرح به أو دلت عليه ظروف التعاقد. والمادة 76: كل عقد لم يذكر سببه يفترض أن له سبباً مشروعاً ما لم يقم الدليل على خلاف ذلك.","pg":"123"},{"x":"يكون السبب غير مشروع إذا خالف النظام العام والآداب، كاستئجار شقة للمقامرة، والعبرة بالباعث الرئيس لا بأي باعث.","pg":"123"},{"x":"الرأي الغالب: لا بطلان لعدم مشروعية باعث أحدهما إلا إذا اتصل بعلم الآخر، ولا يتمسك بالبطلان إلا من كان باعثه مشروعاً وجهل باعث صاحبه.","pg":"124"}],"pg":"122–124"}],"c":[{"id":"ب8-01","f":"سبب العقد","b":"سبب العقد هو الباعث الدافع أو الرئيس الذي يحمل الشخص على التعاقد، والذي لولاه لما أُبرم العقد","pg":"122"},{"id":"ب8-02","f":"المادة 75","b":"يقع باطلاً أي عقد يكون السبب الباعث على التعاقد فيه غير مشروع إذا صرح به في العقد أو دلت عليه ظروف التعاقد","pg":"123"},{"id":"ب8-03","f":"المادة 76","b":"كل عقد لم يُذكر سببه يُفترض أن له سبباً مشروعاً؛ ما لم يقم الدليل على خلاف ذلك","pg":"123"}],"n":[{"id":"و8-01","x":"السبب: الباعث الدافع الرئيس الذي لولاه لما أُبرم العقد، ويقاس بمعيار شخصي. والعقد باطل إذا كان سببه غير مشروع وصُرح به أو دلت عليه الظروف (المادة 75)، والعقد الذي لم يُذكر سببه يُفترض أن سببه مشروع حتى يقوم الدليل (المادة 76).","pg":"122–123"},{"id":"و8-02","x":"الرأي الغالب: لا بطلان لعدم مشروعية باعث أحدهما إلا إذا اتصل بعلم الآخر، ولا يتمسك بالبطلان إلا من كان باعثه مشروعاً وجهل باعث صاحبه.","pg":"124"}]},{"id":9,"title":"إبطال العقد وبطلانه","pages":"125–128","batch":2,"intro":"معنى البطلان، والفرق بينه وبين الانعدام وعدم النفاذ والفسخ، وأنواعه في الفقه الإسلامي والفقه القانوني، حتى عنوان العقد الموقوف.","sections":[{"h":"تعريف البطلان، والبطلان والانعدام","b":[{"t":"def","h":"البطلان","x":"البطلان هو الأثر المترتب على تخلف ركن من أركان العقد أو شرط من الشرائط الواجب توافرها في هذه الأركان","pg":"125"},{"t":"p","x":"والبطلان معناه انعدام كل أثر للعقد فيما بين المتعاقدين أو الغير. ويميز بعض الفقهاء بين البطلان والانعدام على النحو الآتي:","pg":"125"},{"t":"kinds","items":[{"h":"العقد الباطل","d":"فالعقد الباطل هو عقد قد توافرت فيه أركانه، غاية الأمر أنه يقع مختلاً لعدم توافر ما يشترطه القانون في هذا الركن من شروط","egs":["أن يرد العقد على محل موجود ولكنه غير مشروع: فالمحل موجود باعتباره ركناً، لكنه غير مشروع، فيقع العقد باطلاً."],"pg":"125"},{"h":"العقد المنعدم","d":"أما العقد المنعدم فهو عقد يفتقد ركن من أركانه، كأن يتخلف المحل أو الرضا أو السبب","x":"والعقد المعدوم لا يعتبر أن له وجوداً قانونياً بل ولا وجوداً مادياً، فهو معدوم الأثر واقعاً وقانوناً.","pg":"125"}]},{"t":"hashia","x":"فكرة الانعدام لم تكن في القوانين القديمة، وابتدعها الفقه الفرنسي، وأول ما ثارت بمناسبة عقد زواج بين شخصين من جنس واحد؛ إذ توجد قاعدة قديمة في الزواج تقضي بأن لا بطلان إلا بنص، ولا نص في القانون الفرنسي يحرم ذلك، فقال الفقه الفرنسي إن العقد هنا منعدم لا مجرد باطل، فلا حاجة إلى نص. والقائلون بالانعدام يقصدون أن العقد المنعدم لا يترتب عليه أي أثر، بخلاف العقد الباطل بطلاناً مطلقاً الذي قد تترتب عليه بعض الآثار.","pg":"125"}]},{"h":"البطلان وعدم النفاذ","b":[{"t":"p","x":"البطلان انعدام أثر العقد بالنسبة للمتعاقدين، وبالنسبة للغير تبعاً لذلك. أما عدم النفاذ أو عدم السريان فمعناه عدم الاحتجاج بالعقد أمام الغير: فقد يكون العقد صحيحاً منتجاً لآثاره فيما بين المتعاقدين، لكنه لا يسري ولا ينفذ في حق الغير.","pg":"126"},{"t":"list","h":"أمثلة الكتاب على عدم النفاذ","num":0,"items":[{"h":"الصورية","x":"ينشأ العقد صحيحاً فيما بين المتعاقدين، لكنه غير نافذ في مواجهة الغير.","pg":"126"},{"h":"البيع في مرض الموت","x":"يقع صحيحاً بين المتعاقدين، لكنه لا يسري في حق الورثة فيما تجاوز الثلث.","pg":"126"}]},{"t":"p","x":"بل قد يكون العقد قابلاً للإبطال في حق المتعاقدين، وفي الوقت ذاته لا يسري ولا ينفذ في مواجهة الغير.","pg":"126"},{"t":"quote","h":"الفرق بعبارة الكتاب","x":"فالبطلان إذاً يصيب العقد في ذاته، أما عدم النفاذ فيجعل العقد غير محتجاً به في مواجهة الغير","pg":"126"},{"t":"warn","x":"ومن أمثلة عدم النفاذ أيضاً ما ورد في أول صفحة 112 في غير موضعه بخطأ طباعي: «النائب إذا خرج عن حدود نيابته، وكذا المدين المعسر إذا أبرم عقوداً تضر بحق دائنيه فإن هذه العقود لا تنفذ في مواجهتهم».","pg":"112"}]},{"h":"البطلان والفسخ","b":[{"t":"p","x":"البطلان يرجع إلى تخلف ركن من أركان العقد أو شرط من شروط صحة هذه الأركان. أما في الفسخ فأركان العقد سليمة مستوفية لشروطها، غاية ما في الأمر أن أحد المتعاقدين لم يقم بتنفيذ التزامه، فيسقط التزام المتعاقد الآخر. ولذلك لا يكون الفسخ إلا في العقد الملزم لجانبين.","pg":"126"}]},{"h":"أنواع البطلان في الفقه الإسلامي","b":[{"t":"p","x":"ذهب جمهور علماء الفقه الإسلامي إلى أن العقد غير الصحيح قسم واحد، هو العقد الباطل أو الفاسد، وحقيقته أنه العقد الذي اختل فيه أحد الأركان أو الشروط فلم يترتب عليه أثره الشرعي. وذهب الحنفية إلى تقسيمه قسمين:","pg":"126–127"},{"t":"kinds","items":[{"h":"العقد الباطل عند الحنفية","eff":"void","et":"لا يعتبر منعقداً","d":"وهو مالم يكن مشروعاً بأصله ولا وصفه","x":"كأن يكون أحد العاقدين فاقد الأهلية، كعقود المجنون والطفل، أو يكون محل العقد غير قابل لحكم العقد شرعاً، كبيع الخمر والخنزير. وهو لا يعتبر منعقداً فعلاً، فلا يرتب عليه الشارع أي حكم أو أثر.","pg":"127"},{"h":"العقد الفاسد عند الحنفية","eff":"stop","et":"يفيد الملك بالقبض","d":"وهو ما كان مشروعاً بأصله دون وصفه","x":"والعقد الفاسد يفيد الملك عند اتصال القبض به.","pg":"127"}]},{"t":"hashia","x":"ومراتب العقود في الشريعة الإسلامية حسب تدرجها من الضعف إلى القوة: العقد الباطل، ثم الفاسد، ثم الموقوف، ثم النافذ، ثم اللازم، وهو أقوى مراتب العقود من حيث الأثر. والقوانين تعرف تقسيم البطلان إلى مراتب: فالقانون الألماني يعرف البطلان المطلق والبطلان النسبي، بل يعرف فقهه العقد المنعدم، وقانون الالتزامات السويسري يميز بين الباطل بطلاناً مطلقاً والباطل بطلاناً نسبياً، والقانون الإنجليزي يميز بين الباطل بطلاناً مطلقاً ويدخل فيه المنعدم، والباطل بطلاناً نسبياً، والعقد غير النافذ، وهو عقد صحيح لا يمكن إثباته طبقاً للقواعد، كعقد غير مكتوب لا يثبت إلا بالكتابة.","pg":"126"}]},{"h":"أنواع البطلان في الفقه القانوني","b":[{"t":"kinds","items":[{"h":"البطلان المطلق","eff":"void","et":"باطل من نشأته","d":"وهو الجزاء على تخلف ركن من أركان العقد كركن الرضى أو المحل أو السبب، أو تخلف الرسمية في العقد الشكلي","x":"والبطلان المطلق يصيب العقد منذ نشأته، فكأن هذا العقد ولد ميتاً، فلا يصلح لترتيب أي أثر من آثاره منذ إبرامه.","pg":"127"},{"h":"البطلان النسبي (العقد القابل للإبطال)","eff":"able","et":"قابل للإبطال","d":"وهو الجزاء على تخلف شرط من شروط صحة العقد","x":"كأن يكون المتعاقد ناقص الأهلية، أو يكون الرضى معيباً بعيب من عيوب الرضى كالغلط أو التدليس أو الإكراه. والعقد القابل للإبطال عقد صحيح منتج لآثاره، ويظل كذلك إلى أن يتقرر إبطاله.","pg":"127–128"}]},{"t":"p","x":"ولا يتقرر الإبطال بالإرادة المنفردة لمن له الحق فيه، بل لا بد من الاتفاق عليه مع الطرف الآخر، أو استصدار حكم من المحكمة. فناقص الأهلية أو من شاب إرادته عيب لا يستطيع تقرير إبطال العقد بإرادته المنفردة، بل عليه أن يتفق مع الطرف الآخر، أو يرفع دعوى أمام القضاء. فإذا قضت المحكمة بالإبطال، كان حكمها منشئاً لحالة البطلان، لأن العقد كان صحيحاً منتجاً لآثاره قبل الحكم، بخلاف العقد الباطل بطلاناً مطلقاً الذي كان منعدماً من قبل الحكم.","pg":"128"},{"t":"hashia","x":"والعقد الباطل ليس عملاً قانونياً، إذ هو كعقد لا وجود له، لكنه عمل مادي أو واقعة قانونية، فقد ينتج أثراً عرضياً لا أثره الأصلي، وقد ينتج في حالات استثنائية أثره الأصلي لضرورة استقرار التعامل أو حماية المتعاقد حسن النية. ومن ذلك الزواج غير الصحيح في الشريعة الإسلامية: لا ينتج آثاره الأصلية كحل المتعة ووجوب النفقة والتوارث، لكنه ينتج آثاراً عرضية كوجوب العدة في بعض الأحوال، ووجوب المهر بعد الدخول، وثبوت النسب احتياطاً، باعتباره واقعة مادية لا عقداً.","pg":"127"},{"t":"p","x":"ولأن البطلان النسبي يخلق نوعاً من المراكز القانونية غير المستقرة، قد تمتد إذا لم يتقرر إبطال العقد أو تصحيحه حتى تتقادم دعوى الإبطال، فإن الفقه الإسلامي قد استعاض عنه بنظرية العقد الموقوف.","pg":"128"},{"t":"tip","x":"وتفصيل العقد الموقوف في الدرس العاشر، وهو داخل نطاق الاختبار بعد زيادة الصفحات."}]}],"q":[{"id":"س9-01","k":"tf","q":"البطلان معناه انعدام كل أثر للعقد فيما بين المتعاقدين أو الغير.","a":true,"w":"هذا ما ذكره الكتاب بعد تعريف البطلان.","pg":"125"},{"id":"س9-02","k":"tf","q":"العقد المنعدم هو العقد الذي توافرت أركانه لكنه مختل لتخلف شرط في أحدها.","a":false,"w":"هذا وصف العقد الباطل. أما المنعدم فهو الذي يفتقد ركناً من أركانه، كأن يتخلف المحل أو الرضا أو السبب.","pg":"125"},{"id":"س9-03","k":"tf","q":"عدم النفاذ يصيب العقد في ذاته.","a":false,"w":"«فالبطلان إذاً يصيب العقد في ذاته، أما عدم النفاذ فيجعل العقد غير محتجاً به في مواجهة الغير».","pg":"126"},{"id":"س9-04","k":"tf","q":"لا يكون الفسخ إلا في العقد الملزم لجانبين.","a":true,"w":"لأن الفسخ يكون عند عدم قيام أحد المتعاقدين بتنفيذ التزامه، فيسقط التزام الآخر.","pg":"126"},{"id":"س9-05","k":"tf","q":"ذهب جمهور علماء الفقه الإسلامي إلى أن العقد غير الصحيح قسمان: باطل وفاسد.","a":false,"w":"الجمهور: قسم واحد هو العقد الباطل أو الفاسد. أما التقسيم إلى باطل وفاسد فهو للحنفية.","pg":"126–127"},{"id":"س9-06","k":"tf","q":"العقد الفاسد عند الحنفية يفيد الملك عند اتصال القبض به.","a":true,"w":"بخلاف العقد الباطل الذي لا يرتب عليه الشارع أي حكم أو أثر.","pg":"127"},{"id":"س9-07","k":"tf","q":"يتقرر إبطال العقد القابل للإبطال بالإرادة المنفردة لمن له الحق فيه.","a":false,"w":"لا يتقرر بالإرادة المنفردة، بل لا بد من الاتفاق على ذلك أو استصدار حكم من المحكمة.","pg":"128"},{"id":"س9-08","k":"tf","q":"حكم المحكمة بإبطال العقد القابل للإبطال يعد منشئاً لحالة البطلان.","a":true,"w":"لأن العقد كان صحيحاً منتجاً لآثاره قبل الحكم.","pg":"128"},{"id":"س9-09","k":"mcq","q":"البطلان المطلق هو الجزاء على:","o":["تخلف ركن من أركان العقد، أو تخلف الرسمية في العقد الشكلي","تخلف شرط من شروط صحة العقد","عدم تنفيذ أحد المتعاقدين التزامه","عدم الاحتجاج بالعقد أمام الغير"],"a":0,"w":"البطلان المطلق جزاء تخلف ركن كالرضى أو المحل أو السبب، أو تخلف الرسمية. أما تخلف شرط الصحة فجزاؤه البطلان النسبي.","pg":"127"},{"id":"س9-10","k":"mcq","q":"العقد الذي يكون أحد طرفيه ناقص الأهلية، أو رضاه معيباً بالغلط أو التدليس أو الإكراه، يكون:","o":["قابلاً للإبطال (بطلاناً نسبياً)","باطلاً بطلاناً مطلقاً","منعدماً","مفسوخاً"],"a":0,"w":"البطلان النسبي جزاء تخلف شرط من شروط صحة العقد.","pg":"127"},{"id":"س9-11","k":"mcq","q":"البيع في مرض الموت فيما تجاوز الثلث:","o":["صحيح بين المتعاقدين، لكنه لا يسري في حق الورثة","باطل بطلاناً مطلقاً","منعدم","مفسوخ"],"a":0,"w":"هذا مثال الكتاب على عدم النفاذ.","pg":"126"},{"id":"س9-12","k":"mcq","q":"العقد الباطل عند الحنفية هو:","o":["ما لم يكن مشروعاً بأصله ولا وصفه","ما كان مشروعاً بأصله دون وصفه","ما توقف نفاذه على الإجازة","العقد الذي أركانه سليمة ولم يُنفذ"],"a":0,"w":"وأما ما كان مشروعاً بأصله دون وصفه فهو العقد الفاسد.","pg":"127"},{"id":"س9-13","k":"mcq","q":"مراتب العقود في الشريعة الإسلامية من الأضعف إلى الأقوى، كما في الحاشية:","o":["الباطل، ثم الفاسد، ثم الموقوف، ثم النافذ، ثم اللازم","الفاسد، ثم الباطل، ثم النافذ، ثم الموقوف، ثم اللازم","الباطل، ثم الموقوف، ثم الفاسد، ثم اللازم، ثم النافذ","الموقوف، ثم الباطل، ثم الفاسد، ثم النافذ، ثم اللازم"],"a":0,"w":"واللازم أقوى مراتب العقود من حيث الأثر.","pg":"126","h":1},{"id":"س9-14","k":"mcq","q":"استعاض الفقه الإسلامي عن البطلان النسبي بنظرية:","o":["العقد الموقوف","الغلط المشترك","الانعدام","خيار المجلس"],"a":0,"w":"لأن البطلان النسبي يخلق مراكز قانونية غير مستقرة.","pg":"128"},{"id":"س9-15","k":"fill","q":"البطلان النسبي هو الجزاء على تخلف ____ من شروط صحة العقد.","o":["شرط","ركن","محل","سبب"],"a":0,"w":"أما تخلف الركن فجزاؤه البطلان المطلق.","pg":"127"},{"id":"س9-16","k":"essay","q":"عرّف البطلان، وفرّق بينه وبين الانعدام، وعدم النفاذ، والفسخ.","pts":[{"x":"البطلان: الأثر المترتب على تخلف ركن من أركان العقد أو شرط من الشرائط الواجب توافرها فيها، ومعناه انعدام كل أثر للعقد بين المتعاقدين أو الغير.","pg":"125"},{"x":"الانعدام (عند من يميز): العقد الباطل توافرت أركانه مع اختلال شرط، كمحل موجود غير مشروع؛ والمنعدم فقد ركناً كالمحل أو الرضا أو السبب، فلا وجود قانونياً ولا مادياً له.","pg":"125"},{"x":"عدم النفاذ: العقد صحيح بين المتعاقدين لكنه لا يحتج به على الغير، كالصورية والبيع في مرض الموت فيما جاوز الثلث؛ فالبطلان يصيب العقد في ذاته.","pg":"126"},{"x":"الفسخ: أركان العقد سليمة، لكن أحد المتعاقدين لم ينفذ التزامه فيسقط التزام الآخر، ولا يكون إلا في العقد الملزم لجانبين.","pg":"126"}],"pg":"125–126"},{"id":"س9-17","k":"essay","q":"اذكر أنواع البطلان في الفقه الإسلامي وفي الفقه القانوني، وبيّن الفرق بين البطلان المطلق والبطلان النسبي.","pts":[{"x":"الجمهور: العقد غير الصحيح قسم واحد (الباطل أو الفاسد). والحنفية: باطل (غير مشروع بأصله ولا وصفه، ولا يعتبر منعقداً) وفاسد (مشروع بأصله دون وصفه، ويفيد الملك بالقبض).","pg":"126–127"},{"x":"البطلان المطلق: جزاء تخلف ركن أو الرسمية في العقد الشكلي، يصيب العقد منذ نشأته فكأنه ولد ميتاً.","pg":"127"},{"x":"البطلان النسبي: جزاء تخلف شرط صحة كنقص الأهلية أو عيب الرضى، والعقد صحيح منتج لآثاره حتى يتقرر إبطاله باتفاق أو بحكم منشئ، لا بالإرادة المنفردة.","pg":"127–128"},{"x":"واستعاض الفقه الإسلامي عن البطلان النسبي بنظرية العقد الموقوف، لما فيه من مراكز قانونية غير مستقرة.","pg":"128"}],"pg":"126–128"}],"c":[{"id":"ب9-01","f":"البطلان","b":"البطلان هو الأثر المترتب على تخلف ركن من أركان العقد أو شرط من الشرائط الواجب توافرها في هذه الأركان","pg":"125"},{"id":"ب9-02","f":"العقد الباطل (عند من يميزه عن المنعدم)","b":"فالعقد الباطل هو عقد قد توافرت فيه أركانه، غاية الأمر أنه يقع مختلاً لعدم توافر ما يشترطه القانون في هذا الركن من شروط","pg":"125"},{"id":"ب9-03","f":"العقد المنعدم","b":"أما العقد المنعدم فهو عقد يفتقد ركن من أركانه، كأن يتخلف المحل أو الرضا أو السبب","pg":"125"},{"id":"ب9-04","f":"البطلان المطلق","b":"وهو الجزاء على تخلف ركن من أركان العقد كركن الرضى أو المحل أو السبب، أو تخلف الرسمية في العقد الشكلي","pg":"127"},{"id":"ب9-05","f":"البطلان النسبي","b":"وهو الجزاء على تخلف شرط من شروط صحة العقد","pg":"127"},{"id":"ب9-06","f":"العقد الباطل عند الحنفية","b":"وهو مالم يكن مشروعاً بأصله ولا وصفه","pg":"127"},{"id":"ب9-07","f":"العقد الفاسد عند الحنفية","b":"وهو ما كان مشروعاً بأصله دون وصفه","pg":"127"}],"n":[{"id":"و9-01","x":"البطلان: أثر تخلف ركن أو شرط من شرائط الأركان، ومعناه انعدام كل أثر للعقد. والباطل توافرت أركانه مع اختلال شرط، والمنعدم فقد ركناً.","pg":"125"},{"id":"و9-02","x":"عدم النفاذ: العقد صحيح بين طرفيه ولا يحتج به على الغير (الصورية، والبيع في مرض الموت فيما جاوز الثلث). والفسخ: الأركان سليمة لكن أحدهما لم ينفذ التزامه، ولا يكون إلا في العقد الملزم لجانبين.","pg":"126"},{"id":"و9-03","x":"الجمهور: العقد غير الصحيح قسم واحد. والحنفية: باطل (غير مشروع بأصله ولا وصفه) وفاسد (مشروع بأصله دون وصفه، ويفيد الملك بالقبض).","pg":"126–127"},{"id":"و9-04","x":"البطلان المطلق جزاء تخلف ركن أو الرسمية، والعقد كأنه ولد ميتاً. والنسبي جزاء تخلف شرط صحة، والعقد صحيح منتج لآثاره حتى يتقرر إبطاله باتفاق أو حكم منشئ. والفقه الإسلامي استعاض عنه بالعقد الموقوف.","pg":"127–128"}]},{"id":10,"title":"العقد الموقوف وتقرير البطلان","pages":"128
