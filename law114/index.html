<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>الميد الثاني مصادر الالتزام</title>
<meta name="theme-color" content="#171B22">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-readex" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
<style>
/* Layout: one centred reading column for a phone; glassy sticky header with the countdown, fixed bottom tabs within thumb reach, content on blue-grey cards. One dark look: base #171B22 with cards #202630, ivory text, light blue for small headings and the timeline, ivory only for the main button (.btn-gold, an old name) and the current tab. Legal-effect colours: green valid, amber voidable, rose void, violet the rest. */
:root{
  /* الأساس: رمادي مزرق عميق، لا أسود خالص */
  --bg:#171B22;
  --glass:rgba(23,27,34,.9);
  --surface:#202630;
  --raised:#2A313C;
  --line:#2F3744;
  --line-2:#404A5A;
  /* النص: عاجي */
  --text:#ECE7DC;
  --text-2:#BCB6AB;
  --text-3:#9E998E;
  /* المميِّز: عاجي للزر الرئيس وتبويب الصفحة الحالية وحدهما، ونصه داكن */
  --accent:#ECE7DC;
  --accent-ink:#171B22;
  /* المساند: أزرق فاتح للعناوين الصغيرة والخط الزمني، وخلفية الشرائح */
  --sky:#8FB1D9;
  --sky-tint:rgba(143,177,217,.13);
  --chip:#26354A;
  /* ألوان حكم العقد: أخضر صحيح، وكهرماني قابل للإبطال، وورديّ باطل، وبنفسجي لما سواها */
  --ok:#86C9A0;
  --ok-tint:rgba(134,201,160,.14);
  --ok-ink:#0E2418;
  --bad:#F2798A;
  --bad-tint:rgba(242,121,138,.14);
  --bad-ink:#2A0F12;
  --able:#E5C266;
  --able-tint:rgba(229,194,102,.14);
  --teal:#7CC9C4;
  --teal-tint:rgba(124,201,196,.11);
  --violet:#B9A6F0;
  --violet-tint:rgba(185,166,240,.12);
  --shadow:rgba(0,0,0,.45);
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --font:"Readex Pro","Noto Sans Arabic","Geeza Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html{font-size:17px;-webkit-text-size-adjust:100%}
html.fs-0{font-size:15.5px}
html.fs-2{font-size:18.5px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.8;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--sky);outline-offset:2px}
.app{min-height:100%}
.wrap{max-width:44rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:.6rem;padding-block:.55rem}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:1.06rem;font-weight:700;line-height:1.35}
.brand span{display:block;font-size:.72rem;color:var(--text-3);font-weight:500}
.count{flex:none;background:var(--chip);color:var(--sky);border-radius:999px;padding:.28rem .8rem;font-size:.84rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.icon-btn{flex:none;width:2.45rem;height:2.45rem;border-radius:50%;border:0;background:var(--raised);display:grid;place-items:center;color:var(--text-2)}
.icon-btn svg{width:1.25rem;height:1.25rem}

/* main */
main{padding-block:1.1rem calc(6.2rem + env(safe-area-inset-bottom,0px));outline:none}
.enter{animation:enter .22s ease both}
@keyframes enter{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
.stack{display:grid;gap:.85rem}
.h-view{font-size:1.5rem;font-weight:700;line-height:1.4;margin:0;text-wrap:balance}
.eyebrow{font-size:.74rem;font-weight:600;color:var(--sky);margin:0}
.muted{color:var(--text-2)}
.small{font-size:.82rem}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin:1.4rem 0 .6rem}
.sec-title h2{font-size:1rem;font-weight:700;margin:0}
.sec-title a,.link{background:none;border:0;padding:0;color:var(--sky);font-size:.84rem;font-weight:600;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1rem 1.05rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.05rem;padding:.55rem 1.1rem;border-radius:var(--r-md);border:0;font-weight:600;font-size:.98rem;text-decoration:none;text-align:center}
.btn-gold{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--raised);color:var(--text)}
.btn-line{background:none;border:1.5px solid var(--line-2);color:var(--text)}
.btn-block{width:100%}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1.5px solid transparent;background:var(--chip);color:var(--text-2);border-radius:999px;padding:.32rem .85rem;font-size:.86rem;font-weight:500;line-height:1.5}
.chip[aria-pressed="true"]{background:var(--chip);border-color:var(--sky);color:var(--sky);font-weight:600}
.pg{display:inline-block;font-size:.7rem;font-weight:500;line-height:1.55;color:var(--text-3);border:1px solid var(--line-2);border-radius:999px;padding:0 .5rem;margin-inline-start:.3rem;vertical-align:.12em;white-space:nowrap;font-variant-numeric:tabular-nums}
.qt{color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:600;border-radius:999px;padding:.12rem .62rem;white-space:nowrap;line-height:1.6}
.badge::before{content:"";width:.42rem;height:.42rem;border-radius:50%;background:currentColor}
.b-void{color:var(--bad);background:var(--bad-tint)}
.b-able{color:var(--able);background:var(--able-tint)}
.b-ok{color:var(--ok);background:var(--ok-tint)}
.b-reduce{color:var(--able);background:var(--able-tint)}
.b-stop{color:var(--violet);background:var(--violet-tint)}
.idtag{font-size:.7rem;color:var(--text-3);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:1.1rem;color:var(--text-2)}
.empty p{margin:0}

/* home */
.today{background:linear-gradient(160deg,#243349 0%,var(--surface) 72%);border:1px solid #33465F}
.today h1{font-size:1.32rem;font-weight:700;margin:.15rem 0 .35rem;line-height:1.45}
.today p{margin:0}
.today .btn{margin-top:.9rem}
.plan{list-style:none;margin:0;padding:0}
.day{display:grid;grid-template-columns:4.6rem 1fr;gap:.85rem}
.day-date{padding-block:.6rem}
.day-date b{display:block;font-size:.95rem;font-weight:700}
.day-date span{display:block;font-size:.76rem;color:var(--text-3);font-variant-numeric:tabular-nums}
.day-body{position:relative;border-inline-start:2px solid rgba(143,177,217,.3);padding-inline-start:1rem;padding-block:.55rem 1rem;min-width:0}
.day-body::before{content:"";position:absolute;inset-inline-start:-8px;top:.9rem;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid rgba(143,177,217,.55)}
.day.is-today .day-body::before{border-color:var(--sky);background:var(--sky)}
.day.is-exam .day-body::before{border-color:var(--sky)}
.day:last-child .day-body{border-inline-start-color:transparent}
.day-body p{margin:.35rem 0 0;font-size:.8rem;color:var(--text-3)}
.lchip{display:inline-flex;align-items:center;gap:.35rem;background:var(--chip);border:0;color:var(--text);border-radius:999px;padding:.28rem .75rem;font-size:.85rem;font-weight:500;text-decoration:none}
.lchip.done{color:var(--ok)}
.lchip.done::before{content:"";width:.5rem;height:.28rem;border:solid currentColor;border-width:0 0 2px 2px;transform:rotate(-45deg) translateY(-1px)}
.lchip.soon{color:var(--text-3)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:.8rem .9rem;text-align:start;text-decoration:none;color:var(--text)}
.tool b{font-size:.94rem;font-weight:600}
.tool span{font-size:.76rem;color:var(--text-3)}
.lrow{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:.75rem .9rem;text-decoration:none;color:var(--text);width:100%;text-align:start}
.lrow .num{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:.82rem;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
.lrow .num.done{background:var(--ok-tint);color:var(--ok)}
.lrow .meta{flex:1;min-width:0}
.lrow .meta b{display:block;font-size:.98rem;font-weight:600}
.lrow .meta span{display:block;font-size:.76rem;color:var(--text-3)}
.lrow .stat{flex:none;font-size:.76rem;color:var(--text-2);text-align:end;font-variant-numeric:tabular-nums}
.lrow.soon{opacity:.55}
.list{display:grid;gap:.55rem}

/* lesson */
.back{display:inline-flex;align-items:center;gap:.3rem;color:var(--text-2);font-size:.86rem;text-decoration:none;margin-bottom:.4rem}
.back svg{width:1rem;height:1rem}
.l-title{font-size:2rem;font-weight:700;line-height:1.35;margin:.1rem 0 .4rem}
.l-intro{color:var(--text-2);margin:0}
.toc{margin-top:.9rem}
.sec{margin-top:1.7rem;scroll-margin-top:5rem}
.sec>h2{font-size:1.18rem;font-weight:700;line-height:1.5;margin:0 0 .7rem;text-wrap:balance}
.blk{margin-top:.75rem}
.blk p{margin:0}
.b-p{line-height:1.95}
.b-h3{font-size:1.02rem;font-weight:700;margin-top:1.3rem;display:flex;align-items:center;gap:.5rem}
.b-h3::before{content:"";width:.45rem;height:.45rem;border-radius:50%;background:var(--sky)}
.box{border-radius:var(--r-md);padding:.85rem .95rem}
.box .lbl{display:block;font-size:.74rem;font-weight:600;margin-bottom:.25rem}
.b-def,.b-art,.b-quote{background:var(--surface);border:1px solid var(--line)}
.b-def .lbl,.b-quote .lbl{color:var(--sky)}
.b-art .lbl{color:var(--text-2)}
.b-art .lbl em{font-style:normal;color:var(--sky)}
.b-def .tx,.b-art .tx,.b-quote .tx{font-size:1.06rem;line-height:1.95}
.qm{color:var(--sky)}
.b-eg{background:var(--raised)}
.b-eg .lbl{color:var(--text-2)}
.b-eg p{color:var(--text-2)}
.b-hashia{background:var(--teal-tint)}
.b-hashia .lbl{color:var(--teal)}
.b-warn{background:var(--violet-tint)}
.b-warn .lbl{color:var(--violet)}
.b-tip{background:var(--sky-tint)}
.b-tip .lbl{color:var(--sky)}
.b-list h4{font-size:.9rem;font-weight:700;margin:0 0 .45rem;color:var(--text-2)}
.b-list h4 .hs{color:var(--teal);font-weight:600}
.items{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.items li{display:grid;grid-template-columns:auto 1fr;gap:.65rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:.7rem .85rem}
.items .mk{width:1.55rem;height:1.55rem;border-radius:50%;background:var(--chip);color:var(--sky);display:grid;place-items:center;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:.15rem}
.items .mk.dot{background:none}
.items .mk.dot::before{content:"";width:.42rem;height:.42rem;border-radius:50%;background:var(--sky)}
.items b{display:block;font-weight:600;line-height:1.7}
.items p{color:var(--text-2);margin-top:.2rem}
.kinds{display:grid;gap:.65rem}
.kind{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:.9rem 1rem}
.kind-h{display:flex;align-items:flex-start;justify-content:space-between;gap:.7rem}
.kind-h b{font-size:1.06rem;font-weight:700;line-height:1.6}
.kind .d{margin-top:.45rem;font-size:1.02rem;line-height:1.9}
.kind .d .lbl{display:block;font-size:.72rem;font-weight:600;color:var(--sky);margin-bottom:.1rem}
.kind .x{margin-top:.45rem;color:var(--text-2)}
.kind .hk{margin-top:.45rem}
.kind .hk span{font-size:.74rem;font-weight:600;color:var(--sky)}
.kind ul{margin:.5rem 0 0;padding:0;list-style:none;display:grid;gap:.35rem}
.kind ul li{position:relative;padding-inline-start:1rem;color:var(--text-2);font-size:.95rem}
.kind ul li::before{content:"";position:absolute;inset-inline-start:0;top:.75em;width:.36rem;height:.36rem;border-radius:50%;background:var(--line-2)}
.kind .egl{display:block;margin-top:.55rem;font-size:.72rem;font-weight:600;color:var(--text-3)}
.l-end{margin-top:2rem;display:grid;gap:.6rem}

/* quiz */
.setup-group{margin-top:1.1rem}
.setup-group h3{font-size:.86rem;font-weight:600;color:var(--text-2);margin:0 0 .5rem}
.avail{margin-top:1rem;font-size:.84rem;color:var(--text-3)}
.run-top{display:flex;align-items:center;gap:.8rem}
.run-top .pos{flex:1;font-size:.86rem;color:var(--text-2);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:999px;background:var(--raised);overflow:hidden;margin:.6rem 0 1rem}
.bar i{display:block;height:100%;background:var(--sky);border-radius:999px;transition:width .25s ease}
.q-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .7rem;font-size:.76rem;color:var(--text-3)}
.q-meta .k{color:var(--sky);font-weight:600}
.q-meta .hs{color:var(--teal);font-weight:600}
.q-text{font-size:1.18rem;font-weight:600;line-height:1.8;margin:.55rem 0 1rem}
.blank{display:inline-block;min-width:4.5rem;border-bottom:2px solid var(--sky);color:var(--sky);text-align:center;line-height:1.4}
.opts{display:grid;gap:.55rem}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.3rem;text-align:start;background:var(--raised);border:1.5px solid transparent;border-radius:var(--r-md);padding:.7rem .95rem;font-size:1rem;line-height:1.6;color:var(--text)}
.opts.tf .opt{justify-content:center;font-weight:600}
.opt .tx{flex:1}
.opt .sign{flex:none;width:1.45rem;height:1.45rem;border-radius:50%;border:2px solid var(--line-2);position:relative}
.opts.tf .opt .sign{display:none}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-tint);border-color:var(--ok)}
.opt.right .sign{background:var(--ok);border-color:var(--ok)}
.opt.right .sign::after{content:"";position:absolute;left:50%;top:45%;width:.55rem;height:.3rem;border:solid var(--ok-ink);border-width:0 0 2.5px 2.5px;transform:translate(-50%,-50%) rotate(-45deg)}
.opt.wrong{background:var(--bad-tint);border-color:var(--bad)}
.opt.wrong .sign{background:var(--bad);border-color:var(--bad)}
.opt.wrong .sign::before,.opt.wrong .sign::after{content:"";position:absolute;left:50%;top:50%;width:.62rem;height:2.5px;background:var(--bad-ink);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.opt.wrong .sign::after{transform:translate(-50%,-50%) rotate(-45deg);border:0}
.opt.dim{opacity:.55}
.fb{margin-top:1rem;border-radius:var(--r-lg);padding:.95rem 1rem;background:var(--surface);border:1px solid var(--line)}
.fb .v{font-weight:700;margin:0}
.fb .v.ok{color:var(--ok)}
.fb .v.no{color:var(--bad)}
.fb .nbline{font-size:.8rem;color:var(--text-3);margin:.2rem 0 0}
.fb .w{margin:.55rem 0 0;color:var(--text-2);line-height:1.9}
.essay-draft{width:100%;min-height:7rem;resize:vertical;background:var(--raised);border:1.5px solid var(--line-2);border-radius:var(--r-md);color:var(--text);padding:.75rem .9rem;font:inherit;line-height:1.8}
.pts{list-style:none;margin:.6rem 0 0;padding:0;display:grid;gap:.5rem}
.pts li{background:var(--raised);border-radius:var(--r-md);padding:.65rem .85rem;line-height:1.85}
.next{margin-top:1rem}
.score{display:flex;align-items:baseline;gap:.6rem}
.score b{font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--text-2)}
.wrongs{display:grid;gap:.55rem;margin-top:.8rem}
.wrongs details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:.7rem .9rem}
.wrongs summary{cursor:pointer;line-height:1.7}
.wrongs .ans{margin:.5rem 0 0;color:var(--ok)}

/* cards */
.flip-wrap{perspective:1200px;margin-top:.9rem}
.flip{display:grid;transform-style:preserve-3d;transition:transform .5s ease;border-radius:var(--r-lg);cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.1rem 1.15rem;min-height:14rem;display:flex;flex-direction:column;gap:.5rem}
.face.front{justify-content:center}
.face.back{transform:rotateY(180deg)}
.face .term{font-size:1.55rem;font-weight:700;line-height:1.5}
.face .hint{font-size:.78rem;color:var(--text-3)}
.face .def{font-size:1.05rem;line-height:1.95;margin:0}
.face .top-row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.74rem;color:var(--text-3)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
.deck-info{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text-3);margin-top:.9rem;font-variant-numeric:tabular-nums}

/* notebook */
.dots{display:inline-flex;gap:.28rem;flex:none}
.dots i{width:.72rem;height:.72rem;border-radius:50%;border:2px solid var(--ok)}
.dots i.on{background:var(--ok)}
.nb-item{display:flex;align-items:flex-start;gap:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:.75rem .9rem}
.nb-item .dots{margin-top:.45rem}
.nb-item .t{flex:1;min-width:0;line-height:1.75}
.nb-item .t small{display:block;color:var(--text-3);font-size:.72rem}

/* tables */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tbl h3{font-size:1rem;font-weight:700;margin:0;padding:.85rem 1rem .2rem}
.tbl .for{font-size:.74rem;color:var(--text-3);padding:0 1rem .7rem;margin:0}
.tbl table{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl thead th{background:var(--raised);color:var(--sky);font-size:.84rem;font-weight:600;text-align:start;padding:.55rem .8rem}
.tbl .rh th{font-size:.74rem;font-weight:600;color:var(--text-3);text-align:start;padding:.65rem .8rem .1rem;border-top:1px solid var(--line)}
.tbl td{vertical-align:top;padding:.15rem .8rem .7rem;font-size:.93rem;line-height:1.8;overflow-wrap:anywhere}
.tbl td+td{border-inline-start:1px solid var(--line)}
.tbl .stk{border-top:1px solid var(--line);padding:.7rem 1rem}
.tbl .stk h4{font-size:.76rem;font-weight:600;color:var(--text-3);margin:0 0 .4rem}
.tbl .stk dl{margin:0;display:grid;gap:.45rem}
.tbl .stk dt{font-size:.8rem;font-weight:600;color:var(--sky)}
.tbl .stk dd{margin:0;font-size:.93rem;line-height:1.8}

/* last night */
.ln-group{margin-top:1.2rem}
.ln-group h3{font-size:.95rem;font-weight:700;margin:0 0 .5rem}
.ln{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.ln li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:.7rem .9rem;line-height:1.85}

/* bottom tabs */

<script id="data" type="application/json">{"all":[{"id":1,"title":"الغلط","pages":"75–86"},{"id":2,"title":"التغرير","pages":"86–93"},{"id":3,"title":"الإكراه","pages":"93–103"},{"id":4,"title":"الاستغلال","pages":"103–106"},{"id":5,"title":"الغبن","pages":"106–109"},{"id":6,"title":"خيار المجلس","pages":"109–112"},{"id":7,"title":"المحل","pages":"113–122"},{"id":8,"title":"السبب","pages":"122–124"},{"id":9,"title":"إبطال العقد وبطلانه","pages":"125–128"},{"id":10,"title":"العقد الموقوف وتقرير البطلان","pages":"128–131"},{"id":11,"title":"الإجازة والتقادم","pages":"131–134"},{"id":12,"title":"أثر البطلان وانتقاص العقد","pages":"134–138"}],"lessons":[{"id":1,"title":"الغلط","pages":"75–86","batch":1,"intro":"الغلط أول عيوب الرضى في الكتاب، ونصّ على أحكامه نظام المعاملات المدنية في المواد من 57 إلى 60.","sections":[{"h":"مدخل: عيوب الرضى","b":[{"t":"p","x":"لكي ينعقد العقد صحيحاً لا بد أن يتوفر الرضى بين أطرافه، وهو ركن العقد الأول. ولا يكفي وجود الرضى، بل يجب أن يصدر من صاحب أهلية معتبرة شرعاً، والمقصود أهلية الأداء.","pg":"75"},{"t":"def","h":"أهلية الأداء","x":"صلاحية الشخص لمباشرة التصرفات القانونية بنفسه","pg":"75"},{"t":"p","x":"ويجب كذلك أن تصدر الإرادة سليمة خالية من أي عيب: فمن يقدم على العقد يجب أن تكون إرادته كاملة وحرة، وأن يكون على بينة مما هو مقدم عليه، وإلا كان رضاه معيباً غير سليم، وجاز المطالبة بإبطال العقد.","pg":"75"},{"t":"p","x":"وتسمى هذه العيوب في الفقه الإسلامي «الخيارات»، لأن من شاب إرادته عيب له أن يختار أفضل الأمرين: إمضاء العقد أو فسخه.","pg":"75"},{"t":"list","h":"عيوب الرضى التي يذكرها الكتاب ومواضعها في النظام","num":1,"items":[{"h":"الغلط","x":"المواد من 57 إلى 60.","pg":"76"},{"h":"التغرير","x":"المواد من 61 إلى 63.","pg":"86–92"},{"h":"الإكراه","x":"المواد من 64 إلى 67.","pg":"93–101"},{"h":"الاستغلال","x":"المادة 68.","pg":"103"},{"h":"الغبن","x":"المادة 69.","pg":"106"}]}]},{"h":"تعريف الغلط ونصوصه","b":[{"t":"def","h":"الغلط","x":"الغلط هو وهم يقوم في ذهن الشخص يجعله يتصور أمراً على خلاف الواقع، وهذا قد يكون ناتجاً عن واقعة غير صحيحة يتوهم الشخص صحتها، أو عن واقعة صحيحة يتوهم عدم صحتها","pg":"76"},{"t":"art","no":"57","x":"للمتعاقد طلب إبطال العقد إذا وقع في غلط جوهري لولاه لم يرض بالعقد، وبخاصة إذا كان الغلط الجوهري في صفة المحل أو شخص المتعاقد معه أو صفته أو الحكم النظامي.","pg":"76"},{"t":"art","no":"58","x":"لا يُعتد بغلط المتعاقد إلا إذا كان المتعاقد الآخر قد وقع معه في الغلط نفسه أو علم بوقوعه فيه أو كان من السهل عليه أن يتبينه.","pg":"76"},{"t":"art","no":"59","x":"لا يؤثر في العقد مجرد الغلط المادي في الحساب أو الكتابة.","pg":"76"},{"t":"art","no":"60","x":"ليس لمن وقع في غلط أن يتمسك به على وجه يتعارض مع ما يقضي به حسن النية، ويكون ملزماً بالعقد الذي قصد إبرامه إذا أظهر المتعاقد الآخر استعداده لتنفيذ هذا العقد.","pg":"76"}]},{"h":"أنواع الغلط الثلاثة","b":[{"t":"kinds","items":[{"h":"الغلط المانع","eff":"void","et":"باطل أي منعدم","d":"هو الغلط الذي يحول دون انعقاد العقد، فهو لا يعيب الإرادة فحسب ولكنه يعدمها، ويتحقق إذا تعلق الاعتقاد الخاطئ بركن من أركان العقد كالرضى أو المحل أو السبب","x":"لأن الإرادتين لم تتوافقا فيه على عنصر من العناصر الأساسية في العقد: ماهية العقد أو المحل أو السبب، «فالتراضي إذاً غير موجود والعقد باطل أي منعدم».","egs":["في جنس المعقود عليه: من يشتري خاتماً على أنه من ألماس فإذا به من الزجاج، أو قماشاً على أنه من الحرير فإذا به من ألياف صناعية تشبه الحرير. فالعقد باطل لا يترتب عليه أثره الشرعي، لفوات المعقود عليه بفوات الجنس.","نقود يعطيها شخص لآخر على أنها قرض، ويأخذها الآخر على أنها هبة: لا ينعقد العقد لتخلف ركن الرضى، لأن الإرادتين لم تتطابق.","في ذاتية المحل: شخص يملك سيارتين من صنفين مختلفين، فتعاقد على بيع إحداهما، وانصرفت نية المشتري إلى شراء الأخرى.","في السبب: يتفق الورثة مع الموصى لهم على قسمة العين الشائعة بينهم، ثم يتضح أن الوصية باطلة."],"pg":"76–77"},{"h":"الغلط غير المؤثر","eff":"ok","et":"صحيح","d":"هو الغلط الذي لا يؤثر في صحة العقد، فلا يكون العقد بسببه قابلاً للفسخ لأنه لم يكن دافعاً للتعاقد","x":"ومنه الغلط في صفات غير جوهرية للشيء، والغلط المادي في الحساب أو الكتابة (المادة 59)، فلا يؤثر في الإرادة ولا يعيبها، ويُكتفى بتصحيح الغلط.","egs":["ثوب اشتُري على أنه من صناعة شركة معينة، فتبين أنه من صناعة شركة أخرى مطابقة لها في الجودة: صفة غير جوهرية.","اتفقا على أن الثمن مئة، فكُتب الرقم بزيادة صفر فصار ألفاً: الإرادتان سليمتان، والغلط وقع في المحرر بعد توافقهما، فيُكتفى بتصحيحه.","بيع عدة أشياء حُدد لكل منها ثمن مستقل، ثم وقع غلط في ناتج الجمع: لا يؤثر في صحة العقد، ويجب تصحيحه واعتماد حاصل الجمع الصحيح."],"pg":"77–78"},{"h":"الغلط الذي يعيب الإرادة","eff":"able","et":"قابل للإبطال","d":"هو الغلط الذي يحدث عند تكوين الإرادة في ذهن صاحبها، وذلك بأن يتوهم أمراً على غير الحقيقة، وبهذا الوهم يُقبل على إبرام العقد، ويترتب على هذا الوهم جواز المطالبة بفسخ العقد","x":"وهو النوع الذي يؤثر في صحة العقود ويجعل العقد قابلاً للإبطال لمصلحة من وقع فيه؛ فلا يمنع تكوين العقد ابتداءً كالغلط المانع، ولا هو بالغلط اليسير الذي لا يؤثر في صحة العقد.","pg":"78–79"}]},{"t":"hashia","x":"وقد يقع الغلط في الجنس والوصف معاً، كمن يشتري حصاناً على أنه عربي، فيتضح أنه بغل غير عربي.","pg":"77"},{"t":"tip","x":"يستعمل الكتاب في هذا الدرس كلمتي «الفسخ» و«الإبطال» بمعنى واحد، أما المادة 57 فعبّرت بـ«طلب إبطال العقد»، فاكتب في جوابك عبارة المادة."}]},{"h":"الشرط الأول للإبطال: أن يكون الغلط جوهرياً","b":[{"t":"p","x":"بيّنت المادتان 57 و58 شرطين لإبطال العقد بالغلط الذي يعيب الإرادة: أن يكون الغلط جوهرياً، وأن يتصل بعلم المتعاقد الآخر. وهذا هو الأول.","pg":"79"},{"t":"def","h":"الغلط الجوهري","x":"يعتبر الغلط جوهرياً إذا كان الوقوع فيه هو السبب الرئيس الدافع إلى التعاقد","pg":"79"},{"t":"p","x":"والمعنى أنه لولا هذا الغلط لما أقدم المتعاقد على العقد، فيجب أن يبلغ حداً من الجسامة بحيث لو علمه لامتنع عن الدخول في العلاقة التعاقدية. وقد يقع في صفة جوهرية للشيء محل العقد، أو في ذات المتعاقد أو صفة من صفاته.","pg":"79"},{"t":"h3","x":"أ. الغلط في صفة جوهرية للشيء"},{"t":"def","h":"الغلط في صفة جوهرية للشيء","x":"ويقصد به الغلط الذي يقع فيه أحد المتعاقدين في وصف معين كان يظن أنه موجود في محل العقد، بحيث يمتنع المتعاقد عن إبرام العقد لو لم يقع فيه","pg":"79"},{"t":"p","x":"ويسمى «الغلط في وصف مرغوب فيه». والصفة الجوهرية هي «الصفات التي دفعت المتعاقد إلى إبرام العقد». فإذا وقع الغلط في وصف مرغوب فيه في محل العقد ثبت خيار الفسخ لفوات الوصف.","pg":"79–80"},{"t":"eg","x":"كتاب اشتُري على أنه من الطبعة الأولى فبان من الطبعة الرابعة، ولوحة اشتُريت على أنها من رسم فنان معين فإذا هي مقلدة، وأرض اشتُريت لإقامة مصنع فتبين أن إقامة المصانع ممنوعة في منطقتها.","pg":"79–80"},{"t":"list","h":"المعياران اللذان يعتد بهما القانون المدني لاعتبار الصفة جوهرية، ويكفي أحدهما","num":1,"items":[{"h":"معيار ذاتي أو شخصي","x":"«وذلك إذا وقع في صفة تكون جوهرية في اعتبار المتعاقدين».","pg":"80"},{"h":"معيار موضوعي","x":"«وذلك باعتبار الصفة جوهرية لما يلابس العقد من ظروف ولما ينبغي في التعامل من حسن النية».","pg":"80"}]},{"t":"p","x":"والعبرة في تحديد جوهرية الصفة ليست بالصفات التي يخرج تخلفها الشيء من نوع إلى نوع آخر، بل بالصفات التي دفعت المتعاقد إلى التعاقد، فلولاها ما أقدم عليه؛ فهو تحديد شخصي ذاتي.","pg":"80"},{"t":"p","x":"وقد لا يكون الشيء مادياً: فقد يكون عملاً متصلاً بشيء، كمقاول غلط في طبيعة الأرض التي التزم بالبناء عليها فله طلب الإبطال. وقد يكون شيئاً معنوياً أو حقاً مالياً، كمشتري المحل التجاري يغلط في عنصر العملاء، والمضرور الذي تنازل عن حقه في التعويض يغلط في حجم إصابته ومداها.","pg":"81"},{"t":"hashia","x":"ولا فرق بين الغلط في أداء المتعاقد نفسه والغلط في أداء المتعاقد معه: فالمشتري قد يظن أنه يشتري لوحة من رسم فنان معين فيتضح العكس، والبائع قد يبيع لوحة بثمن رخيص ثم يتضح أنها كبيرة القيمة لأنها من رسم فنان مشهور.","pg":"81"},{"t":"h3","x":"ب. الغلط في شخص المتعاقد"},{"t":"p","x":"الأصل أن شخصية المتعاقد ليست محل اعتبار في عقود المعاوضات، لأن كل طرف يأخذ مقابلاً لما يعطي. لكن قد يكون لشخصية المتعاقد اعتبار عند التعاقد، فلولاها لما دخل الأطراف في العقد. وهذا الاعتبار قد يكون لذات المتعاقد أو لصفة من صفاته.","pg":"81"},{"t":"list","h":"صورتا الغلط في شخص المتعاقد","num":1,"items":[{"h":"الغلط في ذات المتعاقد","x":"في العقود القائمة على الاعتبار الشخصي: عقود التبرع كالهبة، وبعض عقود المعاوضة كالوكالة والعمل والإيجار. مثاله: من يقصد هبة مال لشخص معين فتقع الهبة لشخص آخر، ومن يبرم عقد شركة معتقداً أن شريكه شخص معين ثم يكتشف أنه شخص آخر. والراجح أن الغلط هنا جوهري، لأن هذه العقود من عقود الاعتبار الشخصي.","pg":"81–82"},{"h":"الغلط في صفة جوهرية في المتعاقد","x":"أن يظن المتعاقد توافر صفة في الآخر دفعته إلى التعاقد معه بالذات، ثم لا تكون فيه. مثاله: من يتبرع لطالب معتقداً أنه الأول بين زملائه ثم يتضح أنه ليس كذلك، ومن يتعاقد مع مهندس أو صانع على أنه يحمل شهادة فنية وخبير في فنه ثم يتضح أنه لا يحملها ولا يملك أي مهارة خاصة.","pg":"82"}]},{"t":"hashia","x":"ويظهر الغلط في الشخص كثيراً في عقود التبرع كالهبة، وفي بعض عقود المعاوضة كالوكالة والعمل والإيجار، وقد يقع في عقد الزواج، وفي الوصية والشفعة.","pg":"81"}]},{"h":"الشرط الثاني للإبطال: أن يتصل الغلط بعلم المتعاقد الآخر","b":[{"t":"p","x":"حرصاً على استقرار المعاملات، وتفادياً لعنصر المفاجأة، اشترط المنظم مع كون الغلط جوهرياً أن يتصل بعلم المتعاقد الآخر، وهذا مضمون المادة 58. ويتحقق ذلك في إحدى ثلاث صور:","pg":"83"},{"t":"list","h":"صور اتصال الغلط بعلم المتعاقد الآخر","num":1,"items":[{"h":"الغلط المشترك","x":"وهو «الحالة التي يقع فيها كلا المتعاقدين في الغلط». مثاله: يشتري شخص تمثالاً على أنه أثري، والبائع يعتقد ذلك أيضاً، ثم يتبين بعد العقد أنه حديث؛ فللمشتري طلب الإبطال، ولا يجوز للبائع أن يعترض لأنه وقع في الغلط ذاته.","pg":"83"},{"h":"إذا كان أحد المتعاقدين يعلم بالغلط الذي وقع فيه المتعاقد الآخر","x":"ولا يكفي مجرد العلم بالغلط، بل يجب العلم الفعلي أو اليقيني أن هذا الغلط هو الذي دفع الآخر إلى التعاقد. ومن علم الحقيقة فكتمها كان سيء النية غير جدير بالحماية. مثاله: يشتري شخص خاتماً من النحاس معتقداً أنه من الذهب، والبائع يعلم أنه نحاس ويعلم اعتقاد المشتري؛ فللمشتري طلب الإبطال.","pg":"84"},{"h":"إذا كان من السهل على أحد المتعاقدين أن يتبين الغلط الذي وقع فيه المتعاقد الآخر","x":"فهو لم يكن يعلم فعلاً، لكن كان من السهل عليه أن يتبين الغلط ولم يتبينه، فيكون مقصراً لا يستحق أن يُفضَّل على من لا ذنب له. مثاله: يشتري شخص من تاجر متخصص في الأشياء الأثرية شيئاً يعتقده أثرياً وليس كذلك، ولم يبين له البائع؛ فللمشتري طلب فسخ البيع للغلط.","pg":"84–85"}]},{"t":"hashia","x":"نظرية الغلط المشترك: يرى كثير من الفقهاء أن الغلط الفردي لا يكفي لقيام دعوى الفسخ للغلط، بل لا بد أن يكون الغلط مشتركاً بين المتعاقدين، حتى لا يفاجأ أحدهما بدعوى إبطال وهو لا يعلم شيئاً عن غلط صاحبه. ويرى السنهوري أن هذه النظرية على إطلاقها لا تتماشى مع المنطق، لأن الغلط يفسد رضى من وقع فيه ولو لم يشترك الآخر فيه؛ ولا تتفق مع العدالة، لأن من علم بغلط صاحبه وتركه مسترسلاً فيه دون تنبيه أولى بأن يبطل العقد معه؛ ثم هي ليست ضرورية لتحقيق استقرار المعاملات، إذ يمكن الوصول إليه من طريق آخر.","pg":"82–83"},{"t":"hashia","x":"ويؤخذ على فكرة الغلط المشترك أنها قاصرة على التصرف الذي يتم بإرادتين، أي العقد، مع أن من التصرفات ما يتم بإرادة واحدة؛ ولذا اتجه معظم الفقهاء إلى الأخذ بالغلط الفردي مع تقييده بما يكفل استقرار المعاملات.","pg":"83"}]},{"h":"أثر الغلط، والتمسك به على وجه يتعارض مع حسن النية","b":[{"t":"p","x":"إذا وقع أحد المتعاقدين في غلط مما يُعتد به كانت إرادته معيبة، وجاز له أن يطلب فسخ العقد جزاءً لوجود الغلط. والحق في ذلك مقرر لمصلحة من وقع في الغلط وحده، فلا يجوز للمتعاقد الآخر الذي لم يقع في أي غلط أن يطالب بفسخ العقد. وهذا مضمون المادة 57.","pg":"85"},{"t":"p","x":"وهذا الحق يخضع لمبدأ عدم جواز التعسف في استعمال الحق (المادة 60): فيعد متعسفاً، ومتعارضاً مع حسن النية، من عرض عليه المتعاقد الآخر تصحيح الغلط فظل متمسكاً بطلب الفسخ. ومن العدل وتعاليم الإسلام أن العقد متى أُبرم ضمن مواصفات معينة التزم أطرافه به، فإذا أظهر الطرف الآخر استعداده لتصحيح الغلط وجبره فلا يحق التمسك بالإبطال.","pg":"85–86"},{"t":"list","h":"ولا يجوز للمتعاقد الذي وقع في غلط جوهري أن يتمسك بإبطال العقد","num":0,"items":[{"h":"لمجرد الإضرار بالمتعاقد الآخر","pg":"86"},{"h":"أو إذا كانت المصالح التي يرمي إليها من الإبطال قليلة الأهمية، لا تتناسب البتة مع ما يصيب المتعاقد الآخر من ضرر بسبب الإبطال","pg":"86"}]},{"t":"hashia","x":"ونصت المادة 156 من القانون المدني الأردني على المعنى نفسه الذي في المادة 60.","pg":"85"}]}],"q":[{"id":"س1-01","k":"tf","q":"الغلط المانع يعيب الإرادة فحسب ولا يعدمها.","a":false,"w":"الغلط المانع «لا يعيب الإرادة فحسب ولكنه يعدمها»، فهو يحول دون انعقاد العقد.","pg":"76"},{"id":"س1-02","k":"tf","q":"مجرد الغلط المادي في الحساب أو الكتابة يجعل العقد قابلاً للإبطال.","a":false,"w":"نصت المادة 59 على أنه: «لا يؤثر في العقد مجرد الغلط المادي في الحساب أو الكتابة»، ويُكتفى بتصحيح الغلط.","pg":"78"},{"id":"س1-03","k":"tf","q":"إذا اتفق المتعاقدان على أن الثمن مئة فكُتب ألفاً بزيادة صفر، بقي العقد صحيحاً ويُكتفى بتصحيح الغلط.","a":true,"w":"لأن إرادة الطرفين سليمة، والغلط وقع في المحرر بعد توافق الإرادتين، فلا يؤثر ويُكتفى بتصحيحه.","pg":"78"},{"id":"س1-04","k":"tf","q":"الغلط الذي يعيب الإرادة يمنع تكوين العقد ابتداءً.","a":false,"w":"الغلط الذي يعيب الإرادة يجعل العقد قابلاً للإبطال لمصلحة من وقع فيه، «فهو لا يمنع تكوين العقد ابتداءً كما في الغلط المانع».","pg":"78–79"},{"id":"س1-05","k":"tf","q":"يكفي لاعتبار الغلط في الشيء جوهرياً أن يتوافر أحد المعيارين: الذاتي أو الموضوعي.","a":true,"w":"قال الكتاب: «ومن البديهي أن يكفي أحد هذين المعيارين لاعتبار الغلط في الشيء جوهرياً».","pg":"80"},{"id":"س1-06","k":"tf","q":"العبرة في تحديد الصفات الجوهرية للشيء بالصفات التي يؤدي تخلفها إلى إخراج الشيء من نوع معين وإدخاله في نوع آخر.","a":false,"w":"العبرة ليست بتلك الصفات، بل بالصفات التي دفعت المتعاقد إلى التعاقد، فالتحديد شخصي أو ذاتي.","pg":"80"},{"id":"س1-07","k":"tf","q":"الأصل أن شخصية المتعاقد ليست محل اعتبار في عقود المعاوضات.","a":true,"w":"لأن كل طرف من أطراف العقد يأخذ مقابلاً لما يعطي.","pg":"81"},{"id":"س1-08","k":"tf","q":"يُعتد بغلط المتعاقد ولو لم يقع المتعاقد الآخر في الغلط نفسه، ولم يعلم به، ولم يكن من السهل عليه أن يتبينه.","a":false,"w":"المادة 58: «لا يُعتد بغلط المتعاقد إلا إذا كان المتعاقد الآخر قد وقع معه في الغلط نفسه أو علم بوقوعه فيه أو كان من السهل عليه أن يتبينه».","pg":"76"},{"id":"س1-09","k":"tf","q":"في صورة علم أحد المتعاقدين بغلط الآخر، يكفي مجرد العلم بالغلط.","a":false,"w":"«فلا يكفي مجرد العلم بالغلط بل يجب العلم الفعلي أو اليقيني أن هذا الغلط هو الذي دفع المتعاقد معه إلى التعاقد».","pg":"84"},{"id":"س1-10","k":"tf","q":"يجوز للمتعاقد الذي لم يقع في أي غلط أن يطالب بفسخ العقد للغلط الذي وقع فيه صاحبه.","a":false,"w":"الحق في طلب الفسخ مقرر لمصلحة المتعاقد الذي وقع في الغلط وحده.","pg":"85"},{"id":"س1-11","k":"tf","q":"إذا أظهر المتعاقد الآخر استعداده لتنفيذ العقد الذي قصد من وقع في الغلط إبرامه، كان من وقع في الغلط ملزماً بهذا العقد.","a":true,"w":"هذا نص المادة 60.","pg":"85"},{"id":"س1-12","k":"tf","q":"إذا أعطى شخص آخرَ نقوداً على أنها قرض، وأخذها الآخر على أنها هبة، كان العقد قابلاً للإبطال.","a":false,"w":"هذا من الغلط المانع: لا ينعقد العقد أصلاً لتخلف ركن الرضى، لأن الإرادتين لم تتطابق.","pg":"77"},{"id":"س1-13","k":"tf","q":"يقع الغلط في ذات المتعاقد في عقود التبرع مثل الهبة، وبعض عقود المعاوضة مثل الوكالة والعمل والإيجار.","a":true,"w":"لأنها عقود يكون فيها شخص المتعاقد محل اعتبار عند التعاقد.","pg":"81–82"},{"id":"س1-14","k":"tf","q":"يرى السنهوري أن نظرية الغلط المشترك على إطلاقها تتماشى مع المنطق وتتفق مع العدالة.","a":false,"w":"يرى السنهوري أنها على إطلاقها لا تتماشى مع المنطق ولا تتفق مع العدالة، وليست ضرورية لتحقيق استقرار المعاملات.","pg":"82","h":1},{"id":"س1-15","k":"mcq","q":"أي أنواع الغلط الآتية يجعل العقد باطلاً، أي منعدماً؟","o":["الغلط المانع","الغلط الذي يعيب الإرادة","الغلط غير المؤثر","الغلط المادي في الحساب أو الكتابة"],"a":0,"w":"لأن الإرادتين لم تتوافقا في الغلط المانع على عنصر أساسي في العقد، «فالتراضي إذاً غير موجود والعقد باطل أي منعدم». أما الذي يعيب الإرادة فيجعل العقد قابلاً للإبطال، وغير المؤثر، ومنه الغلط المادي، لا يؤثر في صحة العقد.","pg":"77"},{"id":"س1-16","k":"mcq","q":"من اشترى خاتماً على أنه من ألماس فإذا به من الزجاج، فقد وقع في غلط:","o":["في جنس المعقود عليه","في صفة غير جوهرية","في شخص المتعاقد","مادي في الكتابة"],"a":0,"w":"هذا مثال الكتاب على الغلط في جنس المعقود عليه، وهو من الغلط المانع، والعقد فيه باطل.","pg":"76–77"},{"id":"س1-17","k":"mcq","q":"نصت على أحكام الغلط في نظام المعاملات المدنية المواد:","o":["من 57 إلى 60","من 61 إلى 63","من 64 إلى 67","68 و69"],"a":0,"w":"المواد من السابعة والخمسين إلى الستين.","pg":"76"},{"id":"س1-18","k":"mcq","q":"من اشترى كتاباً على أنه من الطبعة الأولى فبان من الطبعة الرابعة، وقع في غلط:","o":["في صفة جوهرية للشيء","في ذات المتعاقد","مانع يعدم الإرادة","مادي في الحساب"],"a":0,"w":"هذا مثال الكتاب على الغلط في صفة جوهرية للشيء، ويسمى الغلط في وصف مرغوب فيه.","pg":"79"},{"id":"س1-19","k":"mcq","q":"اعتبار الصفة جوهرية «لما يلابس العقد من ظروف ولما ينبغي في التعامل من حسن النية» هو:","o":["المعيار الموضوعي","المعيار الذاتي أو الشخصي","نظرية الغلط المشترك","معيار الغبن الفاحش"],"a":0,"w":"هذا هو المعيار الموضوعي. أما الذاتي فهو أن تكون الصفة جوهرية في اعتبار المتعاقدين.","pg":"80"},{"id":"س1-20","k":"mcq","q":"اشترى شخص تمثالاً على أنه أثري، والبائع يعتقد ذلك أيضاً، ثم تبين أنه حديث. هذه صورة:","o":["الغلط المشترك","علم أحد المتعاقدين بالغلط","سهولة تبيّن الغلط","الغلط غير المؤثر"],"a":0,"w":"كلا المتعاقدين وقع في الغلط نفسه، فهو غلط مشترك، وللمشتري طلب الإبطال ولا يجوز للبائع أن يعترض.","pg":"83"},{"id":"س1-21","k":"mcq","q":"اشترى شخص من تاجر متخصص في الأشياء الأثرية شيئاً يظنه أثرياً، ولم يكن كذلك، ولم يبين له البائع. يُعتد بغلط المشتري هنا لأن البائع:","o":["كان من السهل عليه أن يتبين الغلط","وقع في الغلط نفسه","أكره المشتري على الشراء","استغل حاجة ملحة لدى المشتري"],"a":0,"w":"هذه صورة سهولة تبين الغلط: فالتاجر المتخصص كان من السهل عليه أن يتبين اعتقاد المشتري، ولم يبين، فهو مقصر.","pg":"84–85"},{"id":"س1-22","k":"mcq","q":"يُعد من وقع في الغلط متعسفاً في استعمال حقه في طلب الفسخ إذا:","o":["عرض عليه المتعاقد الآخر تصحيح الغلط فظل متمسكاً بطلبه","طلب الفسخ فور علمه بالغلط","كان الغلط جوهرياً","كان المتعاقد الآخر يعلم بالغلط"],"a":0,"w":"هذا ما ذكره الكتاب في شرح المادة 60، ويعد ذلك أيضاً تعارضاً مع حسن النية.","pg":"85"},{"id":"س1-23","k":"mcq","q":"من تبرع لطالب معتقداً أنه الأول بين زملائه ثم اتضح أنه ليس كذلك، وقع في غلط:","o":["في صفة جوهرية في المتعاقد","في ذات المتعاقد","في جنس المعقود عليه","مادي في الكتابة"],"a":0,"w":"ظن توافر صفة في المتعاقد دفعته إلى التعاقد معه بالذات، فهو غلط في صفة جوهرية في المتعاقد.","pg":"82"},{"id":"س1-24","k":"mcq","q":"اتفاق الورثة مع الموصى لهم على قسمة العين الشائعة، ثم يتضح أن الوصية باطلة، مثال على الغلط في:","o":["السبب","ذاتية المحل","صفة غير جوهرية","شخص المتعاقد"],"a":0,"w":"هذا مثال الكتاب على الغلط في السبب، وهو من صور الغلط المانع.","pg":"77"},{"id":"س1-25","k":"mcq","q":"الحق في طلب الفسخ للغلط مقرر لمصلحة:","o":["المتعاقد الذي وقع في الغلط","المتعاقد الآخر الذي لم يقع في غلط","المتعاقدين معاً في كل حال","الغير"],"a":0,"w":"فلا يجوز للمتعاقد الآخر الذي لم يقع في أي غلط أن يطالب بالفسخ.","pg":"85"},{"id":"س1-26","k":"fill","q":"الغلط هو ____ يقوم في ذهن الشخص يجعله يتصور أمراً على خلاف الواقع.","o":["وهم","خداع","تهديد","ضعف"],"a":0,"w":"هذا تعريف الكتاب للغلط.","pg":"76"},{"id":"س1-27","k":"fill","q":"يعتبر الغلط جوهرياً إذا كان الوقوع فيه هو السبب ____ الدافع إلى التعاقد.","o":["الرئيس","الثانوي","البعيد","العارض"],"a":0,"w":"والمعنى أنه لولا هذا الغلط لما أقدم المتعاقد على إبرام العقد.","pg":"79"},{"id":"س1-28","k":"fill","q":"يسمى الغلط في صفة جوهرية للشيء: الغلط في وصف ____ فيه.","o":["مرغوب","مشكوك","مختلف","مرهون"],"a":0,"w":"قال الكتاب: «ويسمى الغلط في وصف مرغوب فيه».","pg":"79"},{"id":"س1-29","k":"fill","q":"الغلط غير المؤثر لا يكون العقد بسببه قابلاً للفسخ لأنه لم يكن ____ للتعاقد.","o":["دافعاً","سابقاً","مخالفاً","مانعاً"],"a":0,"w":"هذا تعريف الكتاب للغلط غير المؤثر.","pg":"77"},{"id":"س1-30","k":"essay","q":"عرّف الغلط، واذكر أنواعه الثلاثة مع حكم العقد في كل نوع، ومثال لكل نوع.","pts":[{"x":"الغلط وهم يقوم في ذهن الشخص يجعله يتصور أمراً على خلاف الواقع، من واقعة غير صحيحة يتوهم صحتها، أو صحيحة يتوهم عدم صحتها.","pg":"76"},{"x":"الغلط المانع: يحول دون انعقاد العقد ويعدم الإرادة، لتعلقه بركن من أركان العقد (الرضى أو المحل أو السبب)، فالعقد باطل أي منعدم. مثاله: خاتم على أنه ألماس فإذا هو زجاج.","pg":"76–77"},{"x":"الغلط غير المؤثر: لا يؤثر في صحة العقد لأنه لم يكن دافعاً للتعاقد، كالصفات غير الجوهرية والغلط المادي في الحساب أو الكتابة (المادة 59)، ويُصحَّح. مثاله: الثمن مئة كُتب ألفاً.","pg":"77–78"},{"x":"الغلط الذي يعيب الإرادة: يحدث عند تكوين الإرادة فيتوهم المتعاقد أمراً على غير الحقيقة فيُقبل على العقد، والعقد قابل للإبطال لمصلحة من وقع فيه. مثاله: «كما لو اشترى شخص كتاباً على أنه من الطبعة الأولى فبان من الطبعة الرابعة».","pg":"78–79"}],"pg":"76–79"},{"id":"س1-31","k":"essay","q":"اذكر شرطي إبطال العقد للغلط في نظام المعاملات المدنية، مع ذكر النصين اللذين قررا ذلك.","pts":[{"x":"المادة 57: للمتعاقد طلب إبطال العقد إذا وقع في غلط جوهري لولاه لم يرض بالعقد، وبخاصة إذا كان في صفة المحل أو شخص المتعاقد معه أو صفته أو الحكم النظامي.","pg":"79"},{"x":"المادة 58: لا يُعتد بغلط المتعاقد إلا إذا وقع المتعاقد الآخر معه في الغلط نفسه أو علم بوقوعه فيه أو كان من السهل عليه أن يتبينه.","pg":"79"},{"x":"الشرط الأول: أن يكون الغلط جوهرياً، أي السبب الرئيس الدافع إلى التعاقد، ويقع في صفة جوهرية للشيء، أو في ذات المتعاقد أو صفة من صفاته.","pg":"79–82"},{"x":"الشرط الثاني: أن يتصل الغلط بعلم المتعاقد الآخر، في إحدى ثلاث صور: الغلط المشترك، أو علم الآخر بالغلط، أو سهولة تبينه له.","pg":"82–85"}],"pg":"79–85"},{"id":"س1-32","k":"essay","q":"تكلم عن صور اتصال الغلط بعلم المتعاقد الآخر، ومثّل لكل صورة.","pts":[{"x":"الغلط المشترك: يقع فيه المتعاقدان معاً، كتمثال يعتقد البائع والمشتري أنه أثري ثم يتبين أنه حديث؛ فللمشتري الإبطال ولا يعترض البائع.","pg":"83"},{"x":"علم أحد المتعاقدين بغلط الآخر: يلزم العلم الفعلي أو اليقيني بأن الغلط هو الدافع، ومن كتم الحقيقة سيء النية؛ كخاتم نحاس يظنه المشتري ذهباً والبائع يعلم.","pg":"84"},{"x":"سهولة تبين الغلط: لم يعلم فعلاً لكن كان من السهل عليه التبين فهو مقصر؛ كتاجر أثريات باع شيئاً يظنه المشتري أثرياً ولم يبين له.","pg":"84–85"}],"pg":"83–85"},{"id":"س1-33","k":"essay","q":"ما المقصود بالغلط في صفة جوهرية للشيء؟ وما المعياران اللذان يعتد بهما القانون لاعتبار الصفة جوهرية؟","pts":[{"x":"هو الغلط الذي يقع فيه أحد المتعاقدين في وصف معين كان يظن وجوده في محل العقد، بحيث يمتنع عن إبرام العقد لو لم يقع فيه، ويسمى الغلط في وصف مرغوب فيه، ويثبت معه خيار الفسخ لفوات الوصف.","pg":"79–80"},{"x":"المعيار الذاتي أو الشخصي: أن تكون الصفة جوهرية في اعتبار المتعاقدين.","pg":"80"},{"x":"المعيار الموضوعي: أن تعتبر الصفة جوهرية لما يلابس العقد من ظروف ولما ينبغي في التعامل من حسن النية، ويكفي أحد المعيارين.","pg":"80"},{"x":"والعبرة بالصفات التي دفعت المتعاقد إلى التعاقد، لا بالصفات التي يخرج تخلفها الشيء من نوعه. مثاله: كتاب على أنه من الطبعة الأولى فبان من الرابعة.","pg":"79–80"}],"pg":"79–80"},{"id":"س1-34","k":"essay","q":"متى لا يجوز لمن وقع في غلط أن يتمسك به؟ اشرح المادة الستين.","pts":[{"x":"نص المادة 60: ليس لمن وقع في غلط أن يتمسك به على وجه يتعارض مع ما يقضي به حسن النية، ويكون ملزماً بالعقد الذي قصد إبرامه إذا أظهر المتعاقد الآخر استعداده لتنفيذه.","pg":"85"},{"x":"الحق في الفسخ للغلط يخضع لمبدأ عدم جواز التعسف في استعمال الحق؛ فيعد متعسفاً من عُرض عليه تصحيح الغلط فظل متمسكاً بطلبه.","pg":"85"},{"x":"ولا يجوز التمسك بالإبطال لمجرد الإضرار بالمتعاقد الآخر، أو إذا كانت مصلحة الإبطال قليلة الأهمية لا تتناسب مع ضرر الآخر.","pg":"86"}],"pg":"85–86"},{"id":"س1-35","k":"essay","q":"ما المقصود بنظرية الغلط المشترك؟ وما رأي السنهوري فيها؟","h":1,"pts":[{"x":"يرى كثير من الفقهاء أن الغلط الفردي لا يكفي لدعوى الفسخ، بل يجب أن يكون الغلط مشتركاً بين المتعاقدين، حفاظاً على استقرار المعاملات وحتى لا يفاجأ المتعاقد الآخر.","pg":"82"},{"x":"رأي السنهوري: النظرية على إطلاقها لا تتماشى مع المنطق، لأن الغلط يفسد رضى من وقع فيه ولو لم يشترك الآخر.","pg":"83"},{"x":"ولا تتفق مع العدالة، لأن من علم بغلط صاحبه وتركه مسترسلاً فيه أولى بأن يبطل العقد معه، وهي ليست ضرورية لاستقرار المعاملات.","pg":"83"}],"pg":"82–83"}],"c":[{"id":"ب1-01","f":"أهلية الأداء","b":"صلاحية الشخص لمباشرة التصرفات القانونية بنفسه","pg":"75"},{"id":"ب1-02","f":"الغلط","b":"الغلط هو وهم يقوم في ذهن الشخص يجعله يتصور أمراً على خلاف الواقع، وهذا قد يكون ناتجاً عن واقعة غير صحيحة يتوهم الشخص صحتها، أو عن واقعة صحيحة يتوهم عدم صحتها","pg":"76"},{"id":"ب1-03","f":"الغلط المانع","b":"هو الغلط الذي يحول دون انعقاد العقد، فهو لا يعيب الإرادة فحسب ولكنه يعدمها، ويتحقق إذا تعلق الاعتقاد الخاطئ بركن من أركان العقد كالرضى أو المحل أو السبب","pg":"76"},{"id":"ب1-04","f":"الغلط غير المؤثر","b":"هو الغلط الذي لا يؤثر في صحة العقد، فلا يكون العقد بسببه قابلاً للفسخ لأنه لم يكن دافعاً للتعاقد","pg":"77"},{"id":"ب1-05","f":"الغلط الذي يعيب الإرادة","b":"هو الغلط الذي يحدث عند تكوين الإرادة في ذهن صاحبها، وذلك بأن يتوهم أمراً على غير الحقيقة، وبهذا الوهم يُقبل على إبرام العقد، ويترتب على هذا الوهم جواز المطالبة بفسخ العقد","pg":"78"},{"id":"ب1-06","f":"الغلط الجوهري","b":"يعتبر الغلط جوهرياً إذا كان الوقوع فيه هو السبب الرئيس الدافع إلى التعاقد","pg":"79"},{"id":"ب1-07","f":"الغلط في صفة جوهرية للشيء","b":"ويقصد به الغلط الذي يقع فيه أحد المتعاقدين في وصف معين كان يظن أنه موجود في محل العقد، بحيث يمتنع المتعاقد عن إبرام العقد لو لم يقع فيه","pg":"79"},{"id":"ب1-08","f":"الصفة الجوهرية","b":"الصفات التي دفعت المتعاقد إلى إبرام العقد","pg":"79"},{"id":"ب1-09","f":"المعيار الذاتي أو الشخصي","b":"وذلك إذا وقع في صفة تكون جوهرية في اعتبار المتعاقدين","pg":"80"},{"id":"ب1-10","f":"المعيار الموضوعي","b":"وذلك باعتبار الصفة جوهرية لما يلابس العقد من ظروف ولما ينبغي في التعامل من حسن النية","pg":"80"},{"id":"ب1-11","f":"الغلط المشترك","b":"الحالة التي يقع فيها كلا المتعاقدين في الغلط","pg":"83"},{"id":"ب1-12","f":"المادة 57","b":"للمتعاقد طلب إبطال العقد إذا وقع في غلط جوهري لولاه لم يرض بالعقد، وبخاصة إذا كان الغلط الجوهري في صفة المحل أو شخص المتعاقد معه أو صفته أو الحكم النظامي.","pg":"76"},{"id":"ب1-13","f":"المادة 58","b":"لا يُعتد بغلط المتعاقد إلا إذا كان المتعاقد الآخر قد وقع معه في الغلط نفسه أو علم بوقوعه فيه أو كان من السهل عليه أن يتبينه.","pg":"76"},{"id":"ب1-14","f":"المادة 59","b":"لا يؤثر في العقد مجرد الغلط المادي في الحساب أو الكتابة.","pg":"76"},{"id":"ب1-15","f":"المادة 60","b":"ليس لمن وقع في غلط أن يتمسك به على وجه يتعارض مع ما يقضي به حسن النية، ويكون ملزماً بالعقد الذي قصد إبرامه إذا أظهر المتعاقد الآخر استعداده لتنفيذ هذا العقد.","pg":"76"}],"n":[{"id":"و1-01","x":"عيوب الرضى في الكتاب خمسة: الغلط (57 إلى 60)، والتغرير (61 إلى 63)، والإكراه (64 إلى 67)، والاستغلال (68)، والغبن (69).","pg":"76–106"},{"id":"و1-02","x":"أنواع الغلط: المانع يعدم الإرادة والعقد باطل أي منعدم، وغير المؤثر لا يؤثر والعقد صحيح، والذي يعيب الإرادة يجعل العقد قابلاً للإبطال لمصلحة من وقع فيه.","pg":"76–79"},{"id":"و1-03","x":"شرطا إبطال العقد للغلط: أن يكون جوهرياً (المادة 57)، وأن يتصل بعلم المتعاقد الآخر بوقوعه فيه أو علمه به أو سهولة تبينه له (المادة 58).","pg":"79–85"},{"id":"و1-04","x":"معيارا الصفة الجوهرية: ذاتي (في اعتبار المتعاقدين) وموضوعي (لما يلابس العقد من ظروف وحسن النية)، ويكفي أحدهما.","pg":"80"},{"id":"و1-05","x":"الغلط المادي في الحساب أو الكتابة لا يؤثر في العقد ويُصحَّح (المادة 59). ولا تمسك بالغلط على وجه يخالف حسن النية، ويُلزم من وقع فيه بالعقد الذي قصده إذا أظهر الآخر استعداده لتنفيذه (المادة 60).","pg":"78، 85"}]},{"id":2,"title":"التغرير","pages":"86–93","batch":1,"intro":"التغرير هو العيب الثاني من عيوب الرضى، ونصّت عليه المواد من 61 إلى 63 من نظام المعاملات المدنية، ويسمى أيضاً التدليس والخداع.","sections":[{"h":"تعريف التغرير ودليله وحكمه","b":[{"t":"def","h":"التغرير (المادة 61)","x":"أن يخدع أحد المتعاقدين الآخر بطرق احتياليَّة تحمله على إبرام عقد لم يكن ليبرمه لولاها","pg":"86"},{"t":"p","x":"والتغرير والتدليس والخداع مصطلحات متعددة لمفهوم مشترك، هو إيقاع أحد المتعاقدين في وهم يدفعه للتعاقد.","pg":"86"},{"t":"hashia","x":"والتدليس مشتق من الدُّلسة وهي الظلمة، فكأن البائع بتدليسه صيّر المشتري في ظلمة معنوية بالنسبة إلى حقيقة الحال، فلم يتم إبصاره لواقع الحال.","pg":"86"},{"t":"quote","h":"دليل ثبوت الخيار بالتغرير (أخرجه مسلم)","x":"من اشترى شاة مصراة فهو بخير النظرين إن شاء أمسكها وإن شاء ردها وصاعاً من تمر","pg":"86"},{"t":"p","x":"وقاس الفقهاء على التصرية كل فعل من المدلس بمحل العقد يظن العاقد به كمالاً فلا يوجد، لأن الخيار غير منوط بالتصرية لذاتها، بل لما فيها من التلبيس، وهذا في المعاوضات المالية.","pg":"86"},{"t":"p","x":"ويحرم التغرير كتحريم كتم العيب، لأحاديث منها: «المسلم أخو المسلم، لا يحل لمسلم باع من أخيه بيعاً، وفيه عيب، إلا بينه له»، و«من غشنا فليس منا». ويثبت للمغرر به الرد بخيار التغرير، وهو إعطاؤه حق الخيار: إن شاء فسخ العقد، وإن شاء أمضاه.","pg":"86–87"},{"t":"hashia","x":"ولا فرق في التدليس الموجب للخيار بين أن يصدر من أحد العاقدين، أو من شخص آخر أجنبي عنهما كالدلال ونحوه إذا كان بتواطؤ مع أحد العاقدين.","pg":"87"}]},{"h":"أوجه التغرير الثلاثة","b":[{"t":"kinds","items":[{"h":"1. التغرير القولي","d":"وهو الكذب الصادر من أحد المتعاقدين لحمل المتعاقد الآخر على التعاقد","x":"ومجاله الغالب في ثمن المبيع. وحكمه أنه منهي عنه شرعاً لأنه غش وخداع، ويقع العقد صحيحاً مع وجود التدليس، لحديث المصراة الذي جعل للمشتري الخيار، وهذا يدل على صحة البيع. ولا أرش في خيار التدليس عند الحنابلة، فإذا أمسك المشتري فبدون مقابل. ولا يثبت الخيار عند الجمهور إلا إذا اقترن بغبن فاحش.","egs":["أن يقول البائع أو المؤجر كذباً: هذا الشيء يساوي أكثر، أو لا مثيل له في السوق، أو دُفع لي فيه سعر كذا فلم أقبل."],"pg":"87"},{"h":"2. التغرير الفعلي","d":"ويكون بإحداث فعل في المعقود عليه ليظهر بصورة غير ما هو عليه في الواقع، أي أنه تزوير الوصف في المعقود عليه أو تغييره بقصد الإيهام","egs":["وضع الجيد من البضاعة المبيعة في الأعلى والرديء في الأسفل.","إيقاف عداد الكيلومترات أو إرجاعه إلى الخلف في السيارة المستعملة، ليوهم المشتري بقلة استعمالها."],"pg":"88"},{"h":"3. التغرير بكتمان العيب","d":"فهو إخفاء عيب في المبيع يقتضي العرف أن يكون خالياً من مثلها","x":"والعيب «نقيصة يقتضي العرف سلامة المبيع منها غالباً». وحكم هذا الكتمان أنه محرم باتفاق الفقهاء، ونصّت عليه الفقرة الثانية من المادة 61. ويثبت فيه للمغرر به خيار العيب: أن يفسخ العقد، أو يمضيه وله الأرش.","egs":["أن يكتم البائع تصدعاً في جدران الدار، أو خللاً في محرك السيارة، أو مرضاً في الدابة المبيعة."],"pg":"88"}]},{"t":"art","no":"61، الفقرة الثانية","x":"يعدُّ تغريراً تعمد السكوت لإخفاء أمر لم يكن المغرر به ليبرم العقد لو علم به.","pg":"88"},{"t":"def","h":"الأرش","hs":1,"x":"الأرش هو الفرق ما بين قيمة السلعة سليمة وقيمتها معيبة","pg":"87"},{"t":"hashia","x":"وفي التصرية رجّح الكتاب أن للمغرر به الخيار بين أمرين: إمساك المبيع دون طلب تعويض عن النقص أو الغبن، أو رده لصاحبه، لحديث «لا تصروا الإبل والغنم...». وقال الحنفية: ليس للمشتري الحق في فسخ البيع، بل له فقط أن يرجع بالنقصان، ولم يأخذوا بالحديث لمخالفته القياس، لأن ضمان العدوان يكون بالمثل أو القيمة، والتمر ليس منهما.","pg":"88"},{"t":"tip","x":"انتبه للفرق: في التغرير القولي لا أرش عند الحنابلة، فإن أمسك المشتري فبلا مقابل. أما في كتمان العيب فيثبت خيار العيب: الفسخ، أو الإمضاء مع الأرش."}]},{"h":"علاقة التغرير بالغلط","b":[{"t":"quote","h":"الفرق بينهما بعبارة الكتاب","x":"فالغلط وهم يتولد في ذهن الشخص تلقائياً يصور له الأمر على خلاف الواقع، بينما الغلط الناشئ عن التدليس فهو غلط قصد به المدلس إيقاع المتعاقد الآخر فيه وذلك عن طريق الحيلة والخداع","pg":"89"},{"t":"hashia","x":"هناك نظرية حديثة ترى أن التدليس عمل غير مشروع يوجب على المدلس تعويض من أصابه ضرر وفق المسؤولية التقصيرية، وأن نظرية الغلط تغني عن التدليس، لأن الغلط في مفهومه الحديث يشمل الغلط التلقائي والغلط المستثار، وهو التدليس. ومع ذلك جُعل التدليس عيباً مستقلاً لفائدتين: الأولى: أنه أيسر إثباتاً من الغلط، لأنه يتم بطرق احتيالية مادية يسهل إثباتها. والثانية: أن المدلس عليه يستطيع، بجانب طلب الإبطال، الرجوع بالتعويض على المدلس وفق قواعد المسؤولية التقصيرية، أما الغلط التلقائي فلا يرتب حقاً في التعويض إلا إذا ثبت خطأ أو تقصير المتعاقد الذي لم يقع في الغلط.","pg":"89"}]},{"h":"عنصرا التغرير","b":[{"t":"p","x":"يشترط في التدليس عنصران ليعتد به قانوناً عيباً من عيوب الإرادة يجعل العقد قابلاً للإبطال لمصلحة من وقع في الغلط:","pg":"89"},{"t":"list","h":"عنصرا التغرير","num":0,"items":[{"h":"أولاً: العنصر المادي","x":"والمقصود به «استخدام وسائل وطرق احتيالية دافعة إلى التعاقد»، يلجأ فيها أحد المتعاقدين إلى وسائل مادية من شأنها تضليل الآخر. ويفترض أن تكون مصحوبة بالكذب، كمن يصبغ طيراً عادياً بألوان مختلفة مدعياً أنه طائر استوائي نادر، ومن يطلي خاتماً عادياً بطلاء الذهب. ومجرد الكذب وحده، شفوياً كان أو مكتوباً، لا يكفي، بل يجب أن يُدعم بمظاهر خارجية تكسبه وجه الحقيقة، كتقديم أوراق غير صحيحة من خطابات وتوصيات وشهادات، كمن يُطلع غيره على شهادة هندسة مزورة ليقنعه بأنه مهندس.","pg":"89–90"},{"h":"ثانياً: العنصر المعنوي","x":"وهو «نية التضليل»: أن يلجأ الشخص إلى الطرق الاحتيالية بقصد إيهام المتعاقد الآخر بغير الحقيقة، أي بقصد إيقاعه في غلط وحمله على التعاقد بناءً على ذلك.","pg":"91"}]},{"t":"hashia","x":"ومن الوسائل الاحتيالية أيضاً الاستعانة بأشخاص آخرين لتأييد الادعاءات الكاذبة، والاستعانة بمظاهر الثروة والجاه، كسكنى قصر فخم، وتأثيث مكاتب لشركات وهمية واستخدام موظفين فيها. والواقع أنه من الصعب تصور الطرق الاحتيالية دون وجود نية الخداع.","pg":"90–91"},{"t":"h3","x":"متى يعد الكتمان تغريراً؟"},{"t":"p","x":"الأصل في الكتمان أو السكوت أنه ليس تدليساً ما لم تُستخدم معه طرق احتيالية. ومع ذلك يعد تعمد الكتمان تغريراً إذا كان الساكت ملتزماً بالإفضاء بما يعرفه قبل العقد فكتمه رغم أهميته، وكان الآخر لو علمه لما أقدم على التعاقد، وهو ما نصّت عليه الفقرة الثانية من المادة 61.","pg":"90"},{"t":"list","h":"شروط الكتمان حتى يعد تدليساً","hs":1,"num":1,"items":[{"h":"أن يكون هذا الأمر جوهرياً فلو علمه المتعاقد الآخر لما أقدم على التعاقد","pg":"90"},{"h":"أن يعرفه المتعاقد الذي كتمه وأن يعرف خطره ومدى أهميته للمتعاقد الآخر، ومع ذلك يتعمد الكتمان","pg":"90"},{"h":"أن يجهله المتعاقد الآخر ولا يكون بوسعه معرفته بالطرق العادية","pg":"90"}]}]},{"h":"شروط التغرير","b":[{"t":"list","h":"شروط التغرير الثلاثة","num":1,"items":[{"h":"أن يكون التغرير هو الدافع إلى التعاقد","x":"أي أن يرد الخداع على أمر جوهري لو علم به المتعاقد لما أبرم العقد (المادة 62). فإن لم تؤدِّ الحيل إلى الوهم، كأن اكتشفها المتعاقد الآخر، لم يتأثر رضاه، ولا يعتبر التدليس دافعاً. وتقدير ذلك متروك لقاضي الموضوع، ومعياره ذاتي لا مادي: ينظر إلى أثر الحيل في التعاقد ذاته لا إلى ماهيتها، «فمن الحيل ما ينطلي على الجاهل ولا ينطلي على المتعلم».","pg":"91"},{"h":"أن يتصل التغرير بعلم المتعاقد الآخر","x":"أي أن يصدر من أحد المتعاقدين أو ممن ينوب عنه، أو على الأقل أن يعلم به المتعاقد الآخر، أو يكون من المفروض حتماً أن يعلم به (المادة 63). فإن صدر من الغير وعجز المغرر به عن إثبات علم الآخر، فليس له إلا الرجوع بدعوى المسؤولية التقصيرية، حماية لاستقرار المعاملات. وعبء إثبات التدليس على من يدعيه، وله أن يثبت شروطه بكافة طرق الإثبات لأنها وقائع مادية.","pg":"92"},{"h":"أن يترتب على التغرير غبن فاحش","x":"فالتغرير بلا غبن فاحش لا يبرر طلب فسخ العقد للتغرير، لكن للمغرر به أن يطلب فسخ العقد للغلط، لأن التغرير يعني إيقاع المتعاقد في غلط، فضلاً عن حقه في مطالبة من غرر به بالتعويض على أساس القواعد العامة في المسؤولية المدنية، لأن التغرير عمل غير مشروع.","pg":"92"}]},{"t":"art","no":"62","x":"للمغرر به طلب إبطال العقد إذا كان التغرير في أمر جوهري لولاه لم يرض بالعقد.","pg":"91"},{"t":"art","no":"63","x":"إذا صدر التغرير من غير المتعاقدين فليس للمغرر به أن يطلب إبطال العقد؛ ما لم يثبت أن المتعاقد الآخر كان يعلم بالتغرير أو كان من المفترض أن يعلم به.","pg":"92"},{"t":"warn","x":"ذكر الكتاب الغبن الفاحش شرطاً ثالثاً، ثم قال: «ولم يشترط المنظم السعودي صراحة وجود الغبن الفاحش في التغرير ولكن رد تحديد الغبن إلى العرف». فاحفظ الأمرين معاً كما في الكتاب.","pg":"92–93"}]},{"h":"تطبيق قضائي من ديوان المظالم","b":[{"t":"p","x":"ادّعى مشترٍ لمحل تجاري، وهو المدعى عليه، أن البائع دلّس عليه حين ذكر له أن المحل يعمل بشكل جيد بخلاف الحقيقة، وأنه لم ينقل إليه كفالة العمال، وطلب فسخ البيع. فرفضت الدائرة التجارية ادعاءه، لأنه بعد استلامه المحل وعلمه بحقيقة الحال استمر فيه عدة أشهر دون عمل جاد لفسخ العقد، ولم يطلب الإقالة إلا بعد مدة يتبين العيب في أقل منها بكثير. وأما كفالة العمال فالبائع ينكر الاتفاق عليها، ولا بينة للمشتري. فقضت ببقاء العقد وسريانه، وألزمت المشتري بدفع قيمة المبيع.","pg":"93"},{"t":"quote","h":"القاعدة التي استندت إليها الدائرة","x":"ولما كان من المقرر عند الفقهاء أن تصرف المشتري في المبيع بعد علمه بالعيب دال على الرضا ومبطل لخياري العيب والتدليس","pg":"93"},{"t":"hashia","x":"القضية رقم 1048/5/ق لعام 1430هـ.","pg":"93"}]}],"q":[{"id":"س2-01","k":"tf","q":"التغرير والتدليس والخداع مصطلحات متعددة لمفهوم مشترك.","a":true,"w":"المفهوم المشترك هو إيقاع أحد المتعاقدين في وهم يدفعه للتعاقد.","pg":"86"},{"id":"س2-02","k":"tf","q":"التغرير القولي يجعل العقد باطلاً.","a":false,"w":"«ويقع العقد صحيحاً مع وجود التدليس وذلك لحديث المصراة حيث جُعل للمشتري الخيار».","pg":"87"},{"id":"س2-03","k":"tf","q":"عند الحنابلة لا أرش في خيار التدليس، فإذا أمسك المشتري فبدون مقابل.","a":true,"w":"هذا ما ذكره الكتاب عن الحنابلة في التغرير القولي.","pg":"87"},{"id":"س2-04","k":"tf","q":"لا يثبت الخيار في التغرير القولي عند الجمهور إلا إذا اقترن بغبن فاحش.","a":true,"w":"هذا قول الجمهور كما ذكره الكتاب.","pg":"87"},{"id":"س2-05","k":"tf","q":"مجرد الكذب وحده، شفوياً كان أو مكتوباً، يكفي لتحقق العنصر المادي في التغرير.","a":false,"w":"لا يكفي الكذب وحده، بل يجب أن يُدعم بمظاهر خارجية تصبغه بلون الحقيقة.","pg":"90"},{"id":"س2-06","k":"tf","q":"الأصل في الكتمان أو السكوت أنه ليس تدليساً ما لم تُستخدم معه طرق احتيالية.","a":true,"w":"ومع ذلك يعد تعمد الكتمان تغريراً إذا كان الساكت ملتزماً بالإفضاء بما يعرفه.","pg":"90"},{"id":"س2-07","k":"tf","q":"معيار تقدير ما إذا كانت الحيل دافعة إلى التعاقد معيار مادي ينظر إلى الحيل من حيث ماهيتها.","a":false,"w":"المعيار ذاتي لا مادي: ينظر القاضي إلى مدى تأثير الحيل في التعاقد ذاته، «فمن الحيل ما ينطلي على الجاهل ولا ينطلي على المتعلم».","pg":"91"},{"id":"س2-08","k":"tf","q":"إذا صدر التغرير من غير المتعاقدين، فللمغرر به أن يطلب إبطال العقد في كل الأحوال.","a":false,"w":"المادة 63: ليس له ذلك ما لم يثبت أن المتعاقد الآخر كان يعلم بالتغرير أو كان من المفترض أن يعلم به.","pg":"92"},{"id":"س2-09","k":"tf","q":"يقع عبء إثبات التدليس على من يدعي وجوده.","a":true,"w":"وله أن يثبت شروطه بكافة طرق الإثبات، لأنها وقائع مادية.","pg":"92"},{"id":"س2-10","k":"tf","q":"نصّ المنظم السعودي صراحة على اشتراط الغبن الفاحش في التغرير.","a":false,"w":"«ولم يشترط المنظم السعودي صراحة وجود الغبن الفاحش في التغرير ولكن رد تحديد الغبن إلى العرف».","pg":"92–93"},{"id":"س2-11","k":"tf","q":"قررت الدائرة التجارية في ديوان المظالم أن تصرف المشتري في المبيع بعد علمه بالعيب دال على الرضا ومبطل لخياري العيب والتدليس.","a":true,"w":"ولذلك رفضت ادعاء المشتري بالتدليس، وقضت ببقاء العقد وسريانه.","pg":"93"},{"id":"س2-12","k":"mcq","q":"عرّفت التغرير في نظام المعاملات المدنية المادةُ:","o":["61","57","64","68"],"a":0,"w":"المادة الحادية والستون.","pg":"86","h":true},{"id":"س2-13","k":"mcq","q":"إرجاع عداد الكيلومترات في السيارة المستعملة إلى الخلف مثال على:","o":["التغرير الفعلي","التغرير القولي","التغرير بكتمان العيب","الغلط المادي"],"a":0,"w":"لأنه إحداث فعل في المعقود عليه ليظهر بصورة غير ما هو عليه في الواقع.","pg":"88"},{"id":"س2-14","k":"mcq","q":"قول البائع كذباً: «دُفع لي فيه سعر كذا فلم أقبل»، مثال على:","o":["التغرير القولي","التغرير الفعلي","الإكراه الأدبي","الاستغلال"],"a":0,"w":"التغرير القولي هو الكذب الصادر من أحد المتعاقدين لحمل الآخر على التعاقد، ومجاله الغالب في الثمن.","pg":"87"},{"id":"س2-15","k":"mcq","q":"الأرش هو:","o":["الفرق ما بين قيمة السلعة سليمة وقيمتها معيبة","ثمن السلعة كاملاً","تعويض عن تأخير التسليم","نصف ثمن السلعة"],"a":0,"w":"هذا تعريف الكتاب للأرش في الحاشية.","pg":"87","h":1},{"id":"س2-16","k":"mcq","q":"دليل ثبوت الخيار بالتغرير الذي ذكره الكتاب هو حديث:","o":["«من اشترى شاة مصراة...»","«البيعان بالخيار ما لم يتفرقا»","«لا ضرر ولا ضرار»","«إنما البيع عن تراض»"],"a":0,"w":"حديث المصراة: «من اشترى شاة مصراة فهو بخير النظرين إن شاء أمسكها وإن شاء ردها وصاعاً من تمر».","pg":"86"},{"id":"س2-17","k":"mcq","q":"في التغرير بكتمان العيب يثبت للمغرر به:","o":["خيار العيب: الفسخ، أو الإمضاء وله الأرش","الفسخ فقط","الأرش فقط دون فسخ","لا يثبت له شيء"],"a":0,"w":"«ويثبت فيه للمغرر به إما خيار العيب، بأن يفسخ العقد أو يمضي العقد وله الأرش».","pg":"88"},{"id":"س2-18","k":"mcq","q":"العنصر المعنوي في التغرير هو:","o":["نية التضليل","الرهبة","الغبن الفاحش","الطيش البيّن"],"a":0,"w":"فلا بد لوجود التغرير من نية أو قصد الخداع والتضليل.","pg":"91"},{"id":"س2-19","k":"mcq","q":"إذا صدر التغرير من غير المتعاقدين، وعجز المغرر به عن إثبات علم المتعاقد الآخر به، فليس له إلا:","o":["الرجوع بدعوى المسؤولية التقصيرية","طلب إبطال العقد","طلب إنقاص الثمن","التمسك بخيار المجلس"],"a":0,"w":"وذلك حماية لاستقرار المعاملات.","pg":"92"},{"id":"س2-20","k":"mcq","q":"صبغ طير عادي بألوان مختلفة لادعاء أنه طائر استوائي نادر، مثال على:","o":["العنصر المادي في التغرير","العنصر المعنوي في التغرير","الإكراه الحسي","الغلط المشترك"],"a":0,"w":"هو وسيلة مادية احتيالية مصحوبة بالكذب، وهذا هو العنصر المادي.","pg":"90"},{"id":"س2-21","k":"fill","q":"التدليس مشتق من الدُّلسة وهي ____.","o":["الظلمة","الحيلة","الكذبة","الغفلة"],"a":0,"w":"كأن البائع بتدليسه صيّر المشتري في ظلمة معنوية بالنسبة إلى حقيقة الحال.","pg":"86","h":1},{"id":"س2-22","k":"fill","q":"العيب: نقيصة يقتضي ____ سلامة المبيع منها غالباً.","o":["العرف","القاضي","الثمن","البائع"],"a":0,"w":"تعريف الكتاب للعيب: «والعيب معناه نقيصة يقتضي العرف سلامة المبيع منها غالباً».","pg":"88"},{"id":"س2-23","k":"essay","q":"عرّف التغرير، واذكر أوجهه الثلاثة مع مثال وحكم كل وجه.","pts":[{"x":"التغرير (المادة 61): أن يخدع أحد المتعاقدين الآخر بطرق احتيالية تحمله على إبرام عقد لم يكن ليبرمه لولاها. ودليل الخيار فيه حديث المصراة.","pg":"86"},{"x":"التغرير القولي: الكذب لحمل الآخر على التعاقد، ومجاله الغالب الثمن؛ منهي عنه، والعقد صحيح مع الخيار، ولا أرش عند الحنابلة، ولا خيار عند الجمهور إلا مع غبن فاحش.","pg":"87"},{"x":"التغرير الفعلي: إحداث فعل في المعقود عليه ليظهر بغير حقيقته، كإرجاع عداد السيارة، أو وضع الجيد أعلى البضاعة. وحكمه (من الحاشية): للمغرر به الخيار بين إمساك المبيع دون طلب تعويض عن النقص أو الغبن، أو رده لصاحبه، وهو الرأي الراجح، وقال الحنفية: ليس له فسخ البيع، بل يرجع بالنقصان فقط.","pg":"88"},{"x":"التغرير بكتمان العيب: إخفاء عيب يقتضي العرف خلو المبيع منه؛ محرم باتفاق الفقهاء، والمادة 61 فقرة 2، وللمغرر به خيار العيب: الفسخ أو الإمضاء مع الأرش.","pg":"88"}],"pg":"86–88"},{"id":"س2-24","k":"essay","q":"اشرح عنصري التغرير، وبيّن متى يعد الكتمان تغريراً.","pts":[{"x":"العنصر المادي: استخدام وسائل وطرق احتيالية دافعة إلى التعاقد، مصحوبة بالكذب ومدعومة بمظاهر خارجية؛ والكذب وحده لا يكفي.","pg":"89–90"},{"x":"العنصر المعنوي: نية التضليل، أي قصد إيهام الآخر بغير الحقيقة وإيقاعه في غلط يحمله على التعاقد.","pg":"91"},{"x":"الكتمان: «الأصل فيه أنه ليس تدليساً ما لم تستخدم معه طرقاً احتيالية»، ومع ذلك يعد تعمد الكتمان تغريراً إذا كان الساكت ملتزماً بالإفضاء بما يعرفه فكتمه رغم أهميته، وكان الآخر لو علمه لما تعاقد (المادة 61 فقرة 2).","pg":"90"}],"pg":"89–91"},{"id":"س2-25","k":"essay","q":"اذكر شروط التغرير الذي يعيب الإرادة، مع النصوص النظامية.","pts":[{"x":"أن يكون هو الدافع إلى التعاقد، أي في أمر جوهري (المادة 62: للمغرر به طلب إبطال العقد إذا كان التغرير في أمر جوهري لولاه لم يرض بالعقد)، والمعيار ذاتي يقدره قاضي الموضوع.","pg":"91"},{"x":"أن يتصل بعلم المتعاقد الآخر (المادة 63)، فإن صدر من الغير ولم يثبت علم الآخر فليس للمغرر به إلا دعوى المسؤولية التقصيرية.","pg":"92"},{"x":"أن يترتب عليه غبن فاحش، وإلا فله طلب الفسخ للغلط مع التعويض؛ ولم يشترط المنظم السعودي الغبن الفاحش صراحة بل رده إلى العرف.","pg":"92–93"}],"pg":"91–93"},{"id":"س2-26","k":"essay","q":"ما العلاقة بين الغلط والتدليس؟ وما فائدة اعتبار التدليس عيباً مستقلاً عن الغلط؟","h":1,"pts":[{"x":"الغلط وهم يتولد في ذهن الشخص تلقائياً، أما الغلط الناشئ عن التدليس فقصد المدلس إيقاع المتعاقد الآخر فيه عن طريق الحيلة والخداع.","pg":"89"},{"x":"الفائدة الأولى: أن التدليس أيسر إثباتاً من الغلط، لأنه يتم بطرق احتيالية مادية يسهل إثباتها.","pg":"89"},{"x":"الفائدة الثانية: أن المدلس عليه يرجع بالتعويض على المدلس وفق المسؤولية التقصيرية بجانب الإبطال، أما الغلط التلقائي فلا تعويض فيه إلا إذا ثبت خطأ أو تقصير المتعاقد الآخر.","pg":"89"}],"pg":"89"}],"c":[{"id":"ب2-01","f":"التغرير (المادة 61)","b":"أن يخدع أحد المتعاقدين الآخر بطرق احتياليَّة تحمله على إبرام عقد لم يكن ليبرمه لولاها","pg":"86"},{"id":"ب2-02","f":"التغرير القولي","b":"وهو الكذب الصادر من أحد المتعاقدين لحمل المتعاقد الآخر على التعاقد","pg":"87"},{"id":"ب2-03","f":"التغرير الفعلي","b":"ويكون بإحداث فعل في المعقود عليه ليظهر بصورة غير ما هو عليه في الواقع، أي أنه تزوير الوصف في المعقود عليه أو تغييره بقصد الإيهام","pg":"88"},{"id":"ب2-04","f":"العيب","b":"والعيب معناه نقيصة يقتضي العرف سلامة المبيع منها غالباً","pg":"88"},{"id":"ب2-05","f":"الأرش","b":"الأرش هو الفرق ما بين قيمة السلعة سليمة وقيمتها معيبة","pg":"87","h":1},{"id":"ب2-06","f":"العنصر المادي في التغرير","b":"والمقصود به استخدام وسائل وطرق احتيالية دافعة إلى التعاقد","pg":"89"},{"id":"ب2-07","f":"العنصر المعنوي في التغرير","b":"وهو نية التضليل","pg":"91"},{"id":"ب2-08","f":"المادة 61، الفقرة الثانية","b":"يعدُّ تغريراً تعمد السكوت لإخفاء أمر لم يكن المغرر به ليبرم العقد لو علم به.","pg":"88"},{"id":"ب2-09","f":"المادة 62","b":"للمغرر به طلب إبطال العقد إذا كان التغرير في أمر جوهري لولاه لم يرض بالعقد.","pg":"91"},{"id":"ب2-10","f":"المادة 63","b":"إذا صدر التغرير من غير المتعاقدين فليس للمغرر به أن يطلب إبطال العقد؛ ما لم يثبت أن المتعاقد الآخر كان يعلم بالتغرير أو كان من المفترض أن يعلم به.","pg":"92"}],"n":[{"id":"و2-01","x":"التغرير (المادة 61): خداع بطرق احتيالية تحمل على عقد لم يكن ليُبرم لولاها. ودليل الخيار فيه حديث المصراة.","pg":"86"},{"id":"و2-02","x":"أوجهه ثلاثة: قولي (كذب، ومجاله الغالب الثمن)، وفعلي (تزوير الوصف كإرجاع عداد السيارة)، وكتمان عيب (محرم باتفاق، وفيه خيار العيب مع الأرش).","pg":"87–88"},{"id":"و2-03","x":"عنصراه: مادي (طرق احتيالية، والكذب وحده لا يكفي) ومعنوي (نية التضليل). والكتمان الأصل فيه أنه ليس تدليساً ما لم تستخدم معه طرق احتيالية، ومع ذلك يعد تعمده تغريراً إذا كان الساكت ملتزماً بالإفضاء (المادة 61 فقرة 2).","pg":"89–91"},{"id":"و2-04","x":"شروطه: أن يكون دافعاً (المادة 62، والمعيار ذاتي)، ومتصلاً بعلم الآخر (المادة 63، وإلا فدعوى مسؤولية تقصيرية)، ومترتباً عليه غبن فاحش، ولم يشترطه المنظم صراحة بل رده إلى العرف.","pg":"91–93"}]},{"id":3,"title":"الإكراه","pages":"93–103","batch":1,"intro":"الإكراه هو العيب الثالث من عيوب الرضى، ونصّت عليه المواد من 64 إلى 67 من نظام المعاملات المدنية.","sections":[{"h":"تعريف الإكراه","b":[{"t":"def","h":"الإكراه في النظام (المادة 64)","x":"تهديد شخص دون حق بوسيلةٍ مادية أو معنويّة تُخيفه فتحمله على التصرف","pg":"93"},{"t":"def","h":"الإكراه في الفقه الإسلامي","x":"حمل الإنسان غيره على ما لا يرضاه قولاً أو فعلاً، بحيث لو خلى بنفسه لم يفعله","pg":"94"},{"t":"def","h":"الإكراه عند فقهاء القانون","x":"ضغط مادي أو أدبي يقع على الشخص فيولد لديه رهبة أو خوفاً تحمله على التعاقد","pg":"94"},{"t":"p","x":"والإكراه يعيب الإرادة فيجعل رضى المتعاقد معيباً، فالمكره في حقيقة الأمر لا يريد أن يتعاقد، لكنه يندفع إلى التعاقد تحت تأثير الخوف والرهبة التي يولدها الإكراه.","pg":"94"},{"t":"hashia","x":"والإكراه ليس بذاته ما يفسد الرضى ويعيب الإرادة، وإنما الرهبة والخوف اللذان يولدهما الإكراه.","pg":"94–95"}]},{"h":"الإكراه في الفقه الإسلامي: الرضى والاختيار وبيع التلجئة","b":[{"t":"quote","h":"الأصل في اشتراط الرضى (رواه ابن حبان وابن ماجه)","x":"إنما البيع عن تراض","pg":"94"},{"t":"p","x":"فلا يصح العقد إلا إذا وُجد الرضى والاختيار، فلا يصح بيع المكره، إلا أن يكون الإكراه بحق.","pg":"94"},{"t":"def","h":"المكره بحق","x":"والمكره بحق هو الذي يكرهه ذو السلطان على بيع ماله في وفاء دينه ونفقة نفسه","pg":"94"},{"t":"p","x":"وعند الحنابلة يشترط في البيع أن يكون العاقدان مختارين ظاهراً وباطناً. فإن كانا مختارين ظاهراً فقط، كأن يتفقا على بيع عين لأحدهما فراراً من ظالم يريد اغتصابها، أو اتقاء شر جار، حتى إذا أمن ذلك رد إليه ما باعه ورد هو ما أخذ من ثمن، فالبيع باطل لا ينعقد، ويسمى بيع التلجئة أو الأمان. ولا يشترط أن يقولا في العقد إن هذا بيع تلجئة. ومثله بيع الهازل، لأنه لم يرد حقيقته فهو غير مختار في المعنى.","pg":"94"},{"t":"hashia","x":"وتقبل دعوى التلجئة والهزل بالقرينة الدالة عليهما مع اليمين، فإن لم توجد قرينة لم تقبل إلا ببينة. ومن باع شيئاً فراراً من ظالم دون أن يتفق مع المشتري على أنه بيع تلجئة صح بيعه. ومن أُكره على أن يحضر مالاً فباع ملكه لذلك صح البيع، لأنه أُكره على سبب البيع لا على البيع. ومن استولى على ملك رجل بلا حق فجحده، وقال: لا أعترف لك به إلا إذا بعتنيه، فاضطر لبيعه، وقع البيع باطلاً لأنه مكره.","pg":"94"}]},{"h":"أنواع الإكراه عند فقهاء الشريعة","b":[{"t":"warn","x":"قال الكتاب: «والإكراه عند فقهاء الشريعة نوعان»، ثم ذكر الملجئ وغير الملجئ، ثم قال: «وهناك نوع ثالث وهو الإكراه الأدبي». فاذكر الثلاثة في جوابك كما ذكرها الكتاب.","pg":"95"},{"t":"kinds","items":[{"h":"1. الإكراه الملجئ أو التام","d":"هو الذي لا يبقى للشخص معه قدرة ولا اختيار","hk":"أنه يعدم الرضا ويفسد الاختيار","egs":["التهديد بالقتل، أو بإتلاف بعض الأعضاء، أو بالضرب الشديد الذي يخشى منه القتل أو تلف العضو، أو بتلف جميع المال."],"pg":"95"},{"h":"2. الإكراه الناقص أو غير الملجئ","d":"هو التهديد بما لا يضر النفس أو العضو","hk":"أنه يعدم الرضا، ولا يفسد الاختيار","egs":["التهديد بالضرب اليسير، أو بالحبس، أو بإتلاف بعض المال، أو بإلحاق الظلم كمنع الترقية أو إنزال درجة الوظيفة."],"pg":"95"},{"h":"3. الإكراه الأدبي","d":"وهو الذي يعدم تمام الرضا، ولا يعدم الاختيار","hk":"أنه إكراه شرعي استحساناً لا قياساً، كما قرر الكمال بن الهمام من الحنفية، وهو رأي المالكية، ويترتب عليه عدم نفاذ التصرفات المكره عليها","egs":["التهديد بحبس أحد الأصول أو الفروع، أو الأخ أو الأخت ونحوهم."],"pg":"95"}]},{"t":"hashia","x":"ويرى الشافعي أن الإكراه نوع واحد، وهو الإكراه الملجئ، وأما غير الملجئ فلا يسمى إكراهاً.","pg":"95"}]},{"h":"الإكراه يعيب الإرادة ولا يعدمها","b":[{"t":"p","x":"المكره يقدم على العقد بإرادته، لكن رضاه ليس سليماً: فهو يقارن بين وضعين، إبرام العقد وتفادي الأذى، أو رفض التعاقد وتحمل الأذى، فيقرر إبرام العقد تفادياً للأذى. فالإرادة والرضى موجودان، لكنهما محفوفان بالخوف والرهبة.","pg":"95"},{"t":"quote","h":"بعبارة الكتاب","x":"فالإكراه إذاً يعيب الإرادة ولكنه لا يعدمها","pg":"95"},{"t":"kinds","items":[{"h":"الإكراه المعدم للرضى","eff":"void","et":"باطل","x":"إذا وصل الإكراه إلى درجة تعدم الرضى والإرادة فلا إرادة ولا رضى على الإطلاق، ويخرج عن نطاق الإكراه الذي يعيب الإرادة، فيجعل العقد باطلاً لتخلف الرضى.","egs":["من يمسك بيد شخص ويرغمه على توقيع عقد لا يريده."],"pg":"95–96"},{"h":"الإكراه المفسد للرضى","eff":"able","et":"قابل للإبطال","x":"توجد معه الإرادة لكنها معيبة، فيجعل العقد قابلاً للإبطال.","pg":"96"}]},{"t":"list","h":"آراء الفقهاء في حكم التصرف الواقع تحت الإكراه","num":0,"items":[{"h":"جمهور الفقهاء","x":"كل تصرف وقع تحت تأثير الإكراه فهو باطل، سواء كان العقد قابلاً للفسخ أو غير قابل له، لأنه لا بد لصحة التصرفات عندهم من الرضى، والإكراه يعدم الرضى.","pg":"96"},{"h":"بعض الحنفية والمالكية","x":"العقد مع الإكراه عقد موقوف في جميع التصرفات، ما يقبل منها الفسخ وما لا يقبله.","pg":"96"}]}]},{"h":"عنصرا الإكراه","b":[{"t":"p","x":"اشترط المنظم لكي يكون الإكراه عيباً يجعل العقد قابلاً للإبطال توافر عنصرين:","pg":"96"},{"t":"list","h":"عنصرا الإكراه","num":0,"items":[{"h":"أولاً: عنصر مادي (التهديد)","x":"«أن تستخدم وسائل للإكراه تقع على الحس أو على النفس، فتهدد المتعاقد معه أو شخصاً عزيزاً عنده، ويكون من شأن هذه الوسائل التهديد بخطر جسيم محدق بالنفس أو المال». فإذا لم يوجد تهديد فلا تكون الإرادة معيبة، ولو وجدت في نفس المتعاقد رهبة نشأت عن مصدر آخر غير التهديد.","pg":"96"},{"h":"ثانياً: عنصر معنوي (الرهبة)","x":"لا يكفي التهديد، بل يجب أن تنشأ عنه رهبة في نفس المهدد قائمة على أساس، وذلك إذا أدى التهديد إلى اعتقاده أن خطراً جسيماً محدقاً يهدده هو أو غيره في النفس أو الجسم أو الشرف أو المال. فإن لم يبعث التهديد رهبة، كأن يكون شجاعاً لا يأبه للتهديد، أو واثقاً من حماية الدولة، أو معتقداً أن من هدده غير جاد أو لا يقدر على التنفيذ، فلا يعتبر إكراهاً يعيب الإرادة.","pg":"98–99"}]},{"t":"hashia","x":"ومن الرهبة التي تنشأ عن مصدر آخر غير التهديد: خشية الإنسان ممن له سلطان عليه بحكم القرابة أو العمل. فإذا طلب الأب من ابنه، أو الرئيس من مرؤوسه، أو الزوج من زوجته إبرام عقد، فأبرمه خوفاً منه دون أن يستخدم أي وسيلة من وسائل الإكراه، فلا إكراه، ولا تكون الإرادة معيبة.","pg":"96–97"},{"t":"h3","x":"الإكراه الحسي والإكراه النفسي"},{"t":"p","x":"الإكراه الحسي يقع على الجسم كالضرب والإيذاء بأنواعه. والإكراه النفسي تهديد بإلحاق الأذى دون إيقاعه بالفعل، أو تهديد ينصب على شعور الإنسان وأحاسيسه فيوقع في نفسه رهبة. «وفي الواقع أن ليس هناك فرق بين الاكراه الحسي والاكراه النفسي»، فكل وسيلة أحدثت رهبة وخشية دافعة إلى التعاقد تفسد الرضى. ولا فرق أيضاً بين أن يقع التهديد على المتعاقد نفسه أو على غيره مما يؤثر في نفسه ويدفعه لإبرام العقد.","pg":"97"},{"t":"hashia","x":"بل قد يكون التهديد بأذى يوقعه الإنسان على نفسه، ليبعث الرهبة في نفس المتعاقد الآخر.","pg":"97"},{"t":"h3","x":"حالات تحقق الإكراه (المادة 65)"},{"t":"art","no":"65","x":"يتحقق الإكراه إذا كان التهديد بخطرٍ جسيم محدقٍ يلحق بنفس المكرَه أو عرضه أو ماله، أو كان التهديد مسلَّطاً على غيره ولم يكن المكرَه ليُبرم العقد لولا وجود الإكراه.","pg":"97"},{"t":"list","h":"فيتحقق الإكراه بتوافر الحالات الآتية","num":1,"items":[{"h":"أن يكون الشيء المهدد به خطراً جسيماً مما يشق على النفس تحمله","x":"وهذا يختلف باختلاف الأشخاص، فيجب أن يُبحث تأثيره في كل شخص على حدة.","pg":"97–98"},{"h":"أن يكون الخطر المهدد به محدقاً حالاً، يلحق بالنفس أو العرض أو المال","x":"فلو كان آجلاً في المستقبل لم يتحقق الإكراه، لأن المكرَه يتمكن بالتأجيل من الاحتماء بالسلطات العامة. وهذا شرط عند الحنفية والشافعية وبعض الحنابلة. وقال المالكية: لا يشترط أن يكون المهدد عاجلاً، وإنما الشرط أن يكون الخوف حالاً.","pg":"98"},{"h":"أن يكون المُكرِه قادراً على تنفيذ ما هدد به","x":"ولو كان التهديد مسلطاً على غير المهدد ما دام قد ولد لديه الرهبة التي تدفعه إلى التعاقد. فإن لم يكن قادراً على تنفيذ ما هدد به لعجزه، أو لتمكن المكرَه من الهرب، فلا يتحقق الإكراه.","pg":"98"},{"h":"أن يكون الإكراه بغير حق، أي لا يكون مشروعاً","x":"وهو ما يقصد منه الوصول إلى غرض غير مشروع. أما الإكراه بحق، وهو الذي يقصد منه تحقيق غرض مشروع، فلا تأثير له على التصرفات أصلاً، كبيع مال المدين جبراً عنه لوفاء ديونه، واستملاك الأراضي جبراً عن أصحابها للصالح العام كتوسيع مسجد أو طريق.","pg":"98"}]},{"t":"warn","x":"في صفحة 98 جاءت الحالة الرابعة بعنوان «رابعاً: خامساً:» في سطر واحد، وهو خطأ طباعي، فالحالات أربع لا خمس. وفي الصفحة نفسها «محدق حال» والمقصود «محدقاً حالاً».","pg":"98"}]},{"h":"شرطا الإكراه الذي يعيب الإرادة","b":[{"t":"list","h":"الشرطان","num":1,"items":[{"h":"الشرط الأول: أن يكون الإكراه هو الدافع للتعاقد","x":"أي أن تكون الرهبة الناشئة عن التهديد هي التي حملته على قبول ما لم يكن ليقبله مختاراً، فتقوم علاقة سببية بين التهديد والتعبير عن الإرادة، وهو ما نصّت عليه المادة 65 بقولها: «ولم يكن المكرَه ليُبرم العقد لولا وجود الإكراه». فإن ثبت أنه كان سيبرم العقد ولو لم يصبه التهديد برهبة، فالرهبة لم تدفعه ولم يتأثر رضاه بها.","pg":"99"},{"h":"الشرط الثاني: أن يتصل الإكراه بعلم المتعاقد الآخر","x":"فإن صدر التهديد من المتعاقد الآخر نفسه ووجهه مباشرة إلى صاحبه، واستوفى شروطه، فالإرادة معيبة بلا شك (المادة 67، الفقرة الأولى). وإن صدر من غير المتعاقدين فليس للمكره طلب الإبطال إلا إذا ثبت أن المتعاقد الآخر كان يعلم بالإكراه أو كان من المفترض أن يعلم به (المادة 67، الفقرة الثانية).","pg":"100–101"}]},{"t":"art","no":"66","x":"يراعى في تقدير الإكراه سن من وقع عليه الإكراه وحالته الاجتماعية والصحية وكل ظرف آخر من شأنه أن يؤثر في جسامة الإكراه.","pg":"100"},{"t":"p","x":"فتقدير الرهبة يعتمد على شخص المكره نفسه: فإن بلغ التهديد في ذهنه حداً من الجسامة دفعه إلى إبرام العقد فهو إكراه بالمعنى القانوني، ولو لم يكن من شأن هذا التهديد إخافة الشخص المعتاد. ويؤخذ في الحسبان أيضاً ما أحاط بالتهديد من ظروف: هل وقع في مكان مأهول بالسكان أم مقفر؟ وهل كان ليلاً أم نهاراً؟","pg":"100"},{"t":"quote","h":"معيار الرهبة بعبارة الكتاب","x":"فمعيار وجود الرهبة من عدمها، معيار ذاتي أو شخصي وليس معياراً موضوعياً","pg":"100"},{"t":"warn","x":"ذكر الكتاب قبل نص المادة 66 أنه يراعى في تقدير الإكراه جنس من وقع عليه وعمره وحالته الاجتماعية وتعليمه وحالته الصحية، أما نص المادة 66 كما نقله الكتاب ففيه: السن، والحالة الاجتماعية، والحالة الصحية، وكل ظرف آخر. فإن سُئلت عن نص المادة فاكتب ما فيها. وفي الكتاب خطأ طباعي في نص المادة: «لبإكراه» والمقصود «الإكراه».","pg":"99–100"},{"t":"art","no":"67","x":"1. للمكره طلب إبطال العقد إذا صدر الإكراه من المتعاقد الآخر. 2. إذا صدر الإكراه من غير المتعاقدين فليس للمُكرَه طلب إبطال العقد؛ ما لم يثبت أن المتعاقد الآخر كان يعلم بالإكراه أو كان من المفترض أن يعلم به.","pg":"100–101"},{"t":"list","h":"ويعتبر الإكراه صادراً من المتعاقد الآخر في حالتين","num":1,"items":[{"h":"إذا أُبرم العقد بطريق النيابة، وصدر التهديد عن نائب هذا المتعاقد","x":"ولو لم يعلم المتعاقد الأصيل بهذا الإكراه.","pg":"101"},{"h":"إذا صدر الإكراه من شخص من الغير بتحريض من هذا المتعاقد أو نائبه","pg":"101"}]},{"t":"p","x":"أما إذا صدر الإكراه من الغير، فالإبطال وإن وافق واقع تعيب إرادة المكره، ففيه مفاجأة للمتعاقد الآخر تمس حقوقه العقدية وهو لم يخطئ، وتوقيع جزاء عليه يتعارض مع مبدأ شخصية الجزاء. فإن لم يعلم بالإكراه ولم يكن في إمكانه العلم به فهو حسن النية، فإن طلب المكره إبطال العقد فللمتعاقد حسن النية أن يطالبه بتعويض، قد يتمثل في الإبقاء على العقد واستمراره، ولا يمنع ذلك أن يرجع المتعاقد على الغير الذي صدر منه الإكراه على أساس قواعد المسؤولية التقصيرية.","pg":"101"},{"t":"hashia","x":"والعلم الفعلي لا يستلزم أن يكون المتعاقد قد ساهم مع الغير في الإكراه أو اتفق معه، بل يكفي العلم. والعلم الافتراضي هو الذي يكون فيه عدم العلم منطوياً على خطأ أو غفلة أو إهمال أو عدم انتباه من المتعاقد. فإن لم يتوافر العلم الفعلي ولا الافتراضي ظل العقد صحيحاً رغم الإكراه، رعاية لاستقرار المعاملات وإعمالاً لمبدأ الثقة وحسن النية.","pg":"101"}]},{"h":"الإكراه الناشئ من ظروف خارجية (حالة الضرورة)","b":[{"t":"p","x":"قد تنشأ الرهبة الدافعة إلى التعاقد عن ظروف لا دخل لأحد المتعاقدين بها، فيستغلها أحدهما للضغط على إرادة الآخر. والعبرة في الإكراه بالرهبة التي يولدها، وهي تتحقق ولو كانت ناتجة عن ظروف خارجة عن إرادة الطرف الآخر، ما دام قد استغل تلك الظروف للحصول على ما ليس بحق له، وهو يعلم بوجود الرهبة التي تكونت بسببها. فيكون للعاقد الذي وقع تحت تأثير الإكراه الحق في طلب إبطال العقد.","pg":"102"},{"t":"eg","x":"طفل أشرف على الغرق، فطلب والده من أحد أصحاب القوارب إنقاذه، فلم يرض إلا بمبلغ باهظ، فرضي الأب خشية الخطر المحدق بابنه. وطبيب يستغل جسامة المرض وضرورة التدخل الفوري للعلاج فيفرض أتعاباً باهظة على المريض.","pg":"102"}]},{"h":"الشوكة والنفوذ الأدبي وسيلةً لبعث الرهبة","b":[{"t":"p","x":"الأصل أن مجرد الشوكة والنفوذ الأدبي، كنفوذ الأب أو الأم على الولد، لا يكفي وسيلة للإكراه، إلا إذا تجاوز صاحب النفوذ في استغلاله الحد المتعارف عليه بين الناس، وكان مصحوباً بوسيلة أخرى؛ أي إذا تجاوز النفوذ مجرد الشعور بالاحترام إلى الخوف والرهبة.","pg":"102–103"},{"t":"p","x":"ونفوذ الزوج على زوجته، بما فيه من احتمال أن يطلقها أو يتزوج عليها، ليس في ذاته إكراهاً، فإن اقترن بتخويف وتهديد اعتُبر إكراهاً مؤثراً في تصرفها. ومن باب أولى إذا أكرهها بالضرب أو بمنعها من زيارة أهلها لتتنازل عن حق لها أو تهب له مالاً، فيعتبر تصرفها غير نافذ لأنه مشوب بعيب الإكراه.","pg":"103"},{"t":"hashia","x":"ومن النفوذ أيضاً ما للزوج على زوجته، وللأستاذ على طلابه، وللرئيس على مرؤوسيه.","pg":"103"}]}],"q":[{"id":"س3-01","k":"tf","q":"عرّفت المادة 64 الإكراه بأنه تهديد شخص دون حق بوسيلة مادية أو معنوية تخيفه فتحمله على التصرف.","a":true,"w":"هذا تعريف المادة الرابعة والستين كما نقله الكتاب.","pg":"93"},{"id":"س3-02","k":"tf","q":"بيع التلجئة صحيح عند الحنابلة لأن العاقدين مختاران في الظاهر.","a":false,"w":"عند الحنابلة يشترط أن يكون العاقدان مختارين ظاهراً وباطناً، وبيع التلجئة يقع باطلاً ولا ينعقد.","pg":"94"},{"id":"س3-03","k":"tf","q":"يشترط لبطلان بيع التلجئة أن يقول العاقدان في العقد: إن هذا بيع تلجئة.","a":false,"w":"«ولا يشترط أن يقولا في العقد: إن هذا بيع تلجئة».","pg":"94"},{"id":"س3-04","k":"tf","q":"الإكراه الناقص أو غير الملجئ يعدم الرضا ويفسد الاختيار.","a":false,"w":"حكم الإكراه غير الملجئ «أنه يعدم الرضا، ولا يفسد الاختيار». أما الذي يعدم الرضا ويفسد الاختيار فهو الملجئ.","pg":"95"},{"id":"س3-05","k":"tf","q":"يرى الشافعي أن الإكراه نوع واحد هو الإكراه الملجئ.","a":true,"w":"وأما غير الملجئ فلا يسمى إكراهاً عنده.","pg":"95","h":1},{"id":"س3-06","k":"tf","q":"الإكراه يعيب الإرادة ولكنه لا يعدمها.","a":true,"w":"ففي الإكراه توجد الإرادة ويوجد الرضى، لكنهما محفوفان بالخوف والرهبة.","pg":"95"},{"id":"س3-07","k":"tf","q":"من أمسك بيد شخص وأرغمه على توقيع عقد لا يريده، فالعقد قابل للإبطال.","a":false,"w":"هذا إكراه يعدم الإرادة، «فالإكراه المعدم للرضى يجعل العقد باطلاً لتخلف الرضى».","pg":"96"},{"id":"س3-08","k":"tf","q":"يذهب جمهور الفقهاء إلى أن كل تصرف وقع تحت تأثير الإكراه فهو باطل.","a":true,"w":"سواء كان العقد قابلاً للفسخ أو غير قابل له، لأن الإكراه يعدم الرضى.","pg":"96"},{"id":"س3-09","k":"tf","q":"إذا وجدت في نفس المتعاقد رهبة نشأت عن مصدر آخر غير التهديد، كانت إرادته معيبة بالإكراه.","a":false,"w":"إذا لم يوجد تهديد فلا تكون الإرادة معيبة، ولو وجدت رهبة نشأت عن مصدر آخر.","pg":"96"},{"id":"س3-10","k":"tf","q":"يختلف حكم الإكراه الحسي عن حكم الإكراه النفسي.","a":false,"w":"«وفي الواقع أن ليس هناك فرق بين الاكراه الحسي والاكراه النفسي».","pg":"97"},{"id":"س3-11","k":"tf","q":"يشترط المالكية أن يكون الخطر المهدد به عاجلاً.","a":false,"w":"«وقال المالكية: لا يشترط أن يكون المهدد عاجلاً، وإنما الشرط أن يكون الخوف حالاً».","pg":"98"},{"id":"س3-12","k":"tf","q":"بيع مال المدين جبراً عنه لوفاء ديونه إكراه بحق لا تأثير له على التصرفات.","a":true,"w":"لأنه إكراه يقصد منه تحقيق غرض مشروع.","pg":"98"},{"id":"س3-13","k":"tf","q":"معيار وجود الرهبة في الإكراه معيار موضوعي ينظر فيه إلى الشخص المعتاد.","a":false,"w":"«فمعيار وجود الرهبة من عدمها، معيار ذاتي أو شخصي وليس معياراً موضوعياً».","pg":"100"},{"id":"س3-14","k":"tf","q":"إذا صدر الإكراه من نائب المتعاقد في عقد أُبرم بطريق النيابة، اعتُبر صادراً من المتعاقد الآخر ولو لم يعلم الأصيل به.","a":true,"w":"هذا ما ذكره الكتاب في شرح المادة 67.","pg":"101"},{"id
