لإعفاف نفسه من الحرام"],["مستحب","مع وجود الشهوة، ووجود تكاليف الزواج","لاشتماله على مصالح كثيرة للرجال والنساء"],["مباح","مع عدم الشهوة والميل إليه، أو خاف العجز عن الإيفاء بموجبه، كالعنّين والكبير","—"],["مكروه","قد يكون في الحالة الثالثة (حالة الإباحة)","لأنه يفوت على المرأة الغرض الصحيح من النكاح، وهو إعفافها، ويضر بها"],["حرام","في دار كفار حربيين ولا ضرورة به للنكاح، على الصحيح؛ وإن أضر بالمرأة لعجزه عن الوطء أو مطلق النفقة، أو إلا من حرام؛ وإن تيقن الجور","تعريض ذريته للخطر واستيلاء الكفار عليهم؛ وبالجور يأثم ويرتكب المحرمات فتنعدم المصالح"]]},{"id":"c-qadi-mathoon","ch":"ch2","p":"25–26","title":"القاضي ومأذون الأنكحة في إجراء عقد النكاح","cols":["وجه المقارنة","القاضي","مأذون الأنكحة"],"rows":[["السند","المادة (33) من نظام المرافعات الشرعية لمحكمة الأحوال الشخصية، والمادة (32) للمحكمة العامة حيث لا محكمة متخصصة","نظام التوثيق، والمادة (18) منه"],["العقود التي يجريها","المعمول به (عام 1443هـ): عقد النكاح الذي أحد أطرافه غير سعودي","إن كان كلا الطرفين سعوديًا أو كلاهما غير سعودي"]]},{"id":"c-buloogh","ch":"ch2","p":"30","title":"علامات البلوغ","cols":["العلامة","لمن تكون","تفصيلها في الكتاب"],"rows":[["خروج المني","مشتركة","يقظةً أو منامًا، باحتلام أو جماع أو غير ذلك"],["السن","مشتركة","خمس عشرة سنة للغلام والجارية عند الشافعي وأبي يوسف ومحمد وابن وهب من المالكية؛ وثماني عشرة سنة للغلام عند أبي حنيفة والمشهور عند المالكية؛ وسبع عشرة سنة للجارية عند أبي حنيفة"],["نبات الشعر الخشن حول القُبُل","مشتركة","الذي يُحتاج في إزالته إلى نحو حلق، دون الزغب الضعيف"],["الحيض","تختص بها الأنثى","—"],["الحمل","تختص بها الأنثى","لأن حملها دليل إنزالها، فيُحكم ببلوغها منذ حملت"]]},{"id":"c-junoon-atah","ch":"ch2","p":"33","title":"الجنون والعته","cols":["وجه المقارنة","الجنون","العته"],"rows":[["التعريف الأول","اختلال في العقل ينشأ عنه اضطراب أو هيجان","ضعف في العقل ينشأ عنه ضعف في الوعي والإدراك"],["وقيل","اختلال العقل بحيث يمنع جريان الأفعال والأقوال على نهج العقل إلا نادرًا، فإن كان في أكثر السنة فمطبق، وما دونها فغير مطبق","آفة ناشئة عن الذات توجب خللًا في العقل، فيصير صاحبه مختلط العقل، يشبه بعض كلامه كلام العقلاء وبعضه كلام المجانين"],["حكم زواجه (م11)","للمحكمة الإذن بطلب ولي تزويجه بثلاثة شروط","مثل المجنون"]]},{"id":"c-arkan-madhahib","ch":"ch3","p":"37","title":"أركان النكاح عند المذاهب","cols":["المذهب","أركان النكاح"],"rows":[["الحنفية","الإيجاب والقبول فقط"],["المالكية","ولي، ومحل (زوج وزوجة)، وصيغة"],["الشافعية","خمسة: صيغة، وزوج، وزوجة، وشاهدان، وولي"],["الحنابلة","ثلاثة: زوجان، والإيجاب، والقبول، وبه أخذ المنظم"]]},{"id":"c-rukn-shart","ch":"ch3","p":"35–39","title":"الركن والشرط","cols":["وجه المقارنة","الركن","الشرط"],"rows":[["التعريف","جزء الماهية: ما يدخل في الشيء ولا يقوم إلا به","ما يلزم من عدمه العدم، ولا يلزم من وجوده وجود ولا عدم لذاته"],["المشترك","مما لا يتم الشيء إلا به","مما لا يتم الشيء إلا به"],["الفرق","جزء من الزواج وحقيقته","خارج عن ماهية الزواج وحقيقته"]]},{"id":"c-shart-types","ch":"ch3","p":"38–39","title":"الشروط الشرعية والشروط الجعلية","cols":["وجه المقارنة","الشروط الشرعية","الشروط الجعلية"],"rows":[["حقيقتها","شروط صحة عقد الزواج المذكورة في المادة 13","شروط يشترطها أحد الخاطبين لإتمام عقد الزواج، ويتراضيان عليها"],["واضعها","من وضع الشارع، ولا محل فيها لاختيار المكلفين","يشترطها أحد الخاطبين ويتراضيان عليها"],["موضعها","المادة 13","المادة 27"]]},{"id":"c-wali-jumhur-hanafi","ch":"ch3","p":"40–41","title":"اشتراط الولي: الجمهور والحنفية","cols":["وجه المقارنة","الجمهور","الحنفية"],"rows":[["الحكم","الولي شرط، ونكاح المرأة نفسها بلا إيجاب وليها باطل","لا يشترط، والأصل مباشرة الولي، فإن باشرته المرأة جاز"],["الأدلة","﴿وأنكحوا الأيامى منكم﴾، ﴿ولا تنكحوا المشركين﴾، ﴿فلا تعضلوهن﴾، «لا نكاح إلا بولي»، «أيما امرأة لم ينكحها الولي فنكاحها باطل»","القياس على البيع والشراء والإجارة، وحديث «الأيم أحق بنفسها من وليها»"],["الجواب أو القيد","الحديث في الثيب: أحق بنفسها في تعيين من تريد، والبكر يكتفى بصمتها","أعطوا الولي حق إيقاف العقد وإبطاله إذا لم يكن الزوج كفؤًا"]]},{"id":"c-muharramat-qism","ch":"ch3","p":"43","title":"المحرمات على التأبيد والمحرمات مؤقتًا","cols":["وجه المقارنة","على سبيل التأبيد","تحريمًا مؤقتًا"],"rows":[["سبب التحريم","وصف غير قابل للزوال","أمر قابل للزوال، وتزول الحرمة بزوال سببه"],["أمثلة الكتاب","الأمومة، والبنوة، والأخوة، والعمومة، والمصاهرة، والرضاع","أخت الزوجة، وزوجة الغير، والمشركة غير ذات الدين السماوي"]]},{"id":"c-kafaa","ch":"ch3","p":"45–46","title":"الكفاءة: شرط لزوم أم شرط صحة","cols":["وجه المقارنة","شرط لزوم","شرط صحة"],"rows":[["القائل","المنظم في المادة 14، وهو الراجح من أقوال أهل العلم","بعض العلماء، وهو رواية عن أحمد"],["الأثر إذا انتفت","النكاح صحيح، ولمن لم يرض من المرأة أو أوليائها الفسخ، وفي النظام للقريب حتى الدرجة الثالثة، ولا يفسخه إلا القاضي","فرق بينهما، كما نقل ابن تيمية أنه مقتضى كلام أحمد"],["الدليل","أمر النبي ﷺ فاطمة بنت قيس أن تنكح أسامة بن زيد، وقاعدة العادة محكمة","—"]]},{"id":"c-ishara","ch":"ch3","p":"51","title":"الإشارة المفهومة في الإيجاب والقبول","cols":["وجه المقارنة","النظام ومذهب الحنفية","الجمهور (حاشية الكتاب)"],"rows":[["متى يؤخذ بها","عند العجز عن النطق والكتابة","يجوزونها ولو كان قادرًا على الكتابة"]]},{"id":"c-majlis","ch":"ch3","p":"52–53","title":"المجلس الحقيقي والمجلس الحكمي","cols":["وجه المقارنة","المجلس الحقيقي","المجلس الحكمي"],"rows":[["صورته","اتحاد مجلس العقد بين الإيجاب والقبول ولو طال، ما لم ينقطع بإعراض أو قيام","إبرام العقد بإحدى وسائل التقنية، ومنه الاتصال المرئي"],["ما يقطعه أو يشترط فيه","الفصل بكلام أجنبي، أو ما يدل على الإعراض، أو بطلان أهلية الموجب قبل القبول","وجوب التأكد من الأطراف"]]},{"id":"c-taliq-idafa","ch":"ch3","p":"54","title":"الصيغة المعلقة والصيغة المضافة","cols":["وجه المقارنة","المعلقة على شرط","المضافة إلى المستقبل"],"rows":[["مثالها","تزوجتك إن جاء أبوك","تزوجتك أول العام القادم"],["حكمها","لا ينعقد، سواء أكان الشرط محققًا أم محتملًا أم مستحيلًا","لا يصح لا في الحال ولا عند حصول الزمن المضاف إليه"],["الاستثناء","التعليق على أمر كائن موجود، كتعليق القبول على رضا الأب فيقبل في المجلس، فيصح","—"]]},{"id":"c-adl-intiqal","ch":"ch3","p":"60","title":"انتقال الولاية بالعضل","cols":["وجه المقارنة","إلى الولي الذي يليه","إلى الحاكم (المحكمة)"],"rows":[["موقعه","ذكره الكتاب أثرًا من آثار العضل","قول المالكية والشافعية ورواية عند الحنابلة، واختاره ابن تيمية والمنظم"],["وجه الترجيح في الكتاب","يؤخذ عليه أنه يتطلب أن تقيم المرأة عدة دعاوى حتى تجد وليًا يزوجها، أو تصل الولاية إلى القاضي","أيسر في التطبيق، وأعلى مصلحة، وأدنى مفسدة، وأسرع في إنجاز القضية"]]},{"id":"c-umm-rabiba","ch":"ch3","p":"67","title":"أم الزوجة والربيبة","cols":["وجه المقارنة","أم الزوجة وإن علت","بنت الزوجة (الربيبة)"],"rows":[["متى تحرم","بمجرد العقد على البنت","بشرط الدخول بأمها"],["من تشمل","أم الزوجة وجداتها","بنت الزوجة من زوج قبله أو بعده، وبنات أولادها"],["الدليل","﴿وأمهات نسائكم﴾","﴿وربائبكم اللاتي في حجوركم من نسائكم اللاتي دخلتم بهن فإن لم تكونوا دخلتم بهن فلا جناح عليكم﴾"]]},{"id":"c-lian-ikdhab","ch":"ch3","p":"69","title":"أثر إكذاب الملاعن نفسه","cols":["الأمر","حكمه بعد الإكذاب","العلة"],"rows":[["عود النكاح ورفع تأبيد الحرمة","لا يعودان","لأنهما حق له وقد بطلا"],["الحد ولحوق النسب","يعودان","لأنهما حق عليه"]]},{"id":"c-rada-athar","ch":"ch3","p":"71–72","title":"ما يثبت بالرضاع وما لا يثبت","cols":["وجه المقارنة","يثبت","لا يثبت"],"rows":[["الأحكام","تحريم نكاحها عليه، وإباحة نظره إليها وخلوته بها، وكونه محرمًا لها","وجوب نفقتها عليه، والتوارث، والعقل عنها، والولاية عليها"],["العلة","ورد فيه النص: ﴿وأمهاتكم اللاتي أرضعنكم﴾","النسب أقوى من الرضاع، فلا يساويه إلا فيما ورد فيه النص"],["انتشار الحرمة","إلى فروع المرتضع: أولاده وأولاد أولاده","لا تنتشر إلى أصوله، ولا إلى حواشيه من إخوته وأخواته"]]},{"id":"c-laban","ch":"ch3","p":"73","title":"لبن المرأة إذا درّ بلا حمل ولا وطء","cols":["وجه المقارنة","القول الأول","القول الثاني"],"rows":[["الحكم","لا ينشر الحرمة","ينشر الحرمة"],["القائل","رواية عن أحمد، ونقله البهوتي","أظهر الروايتين عن أحمد، وابن حامد، ومالك، والثوري، والشافعي، وأبو ثور، وأصحاب الرأي، وكل من يحفظ عنه ابن المنذر"],["التعليل","لأنه نادر لم تجر العادة به لتغذية الأطفال، فأشبه لبن الرجل والبهيمة","عموم ﴿وأمهاتكم اللاتي أرضعنكم﴾، ولأن ألبان النساء خلقت لغذاء الأطفال"],["الترجيح","—","قال ابن قدامة: وهذا أصح، وبه أفتت اللجنة الدائمة"]]},{"id":"c-muaqqat-anwa","ch":"ch3","p":"74–78","title":"نوعا المحرمات تحريمًا مؤقتًا","cols":["النوع","صوره في المادة 26"],"rows":[["الأول: ما كان تحريمه لعارض يزول غير الجمع","المعتدة من غيره، والبائن منه بينونة كبرى، والمحرم بالحج أو العمرة قبل التحلل، والمسلم من غير الكتابية، والمسلمة من غير المسلم"],["الثاني: ما يحرم من أجل الجمع","الجمع بين أكثر من أربع نسوة، والجمع بين الأختين، أو بين المرأة وعمتها أو خالتها"]]},{"id":"c-iddah-aqd","ch":"ch3","p":"74–75","title":"العقد على المعتدة","cols":["وجه المقارنة","المعتدة من غيره","من فارقها زوجها بخلع أو فسخ"],"rows":[["الحكم","يحرم تزوجها إجماعًا","لمن فارقها أن يعقد عليها في عدتها (م35)"],["الدليل أو العلة","﴿ولا تعزموا عقدة النكاح حتى يبلغ الكتاب أجله﴾، ولئلا تختلط المياه وتشتبه الأنساب","—"]]},{"id":"c-muasira","ch":"ch3","p":"79–80","title":"عقود النكاح المستحدثة (قرار مجمع الفقه الإسلامي)","cols":["العقد","صورته","حكمه"],"rows":[["تنازل المرأة عن السكن والنفقة والقسم أو بعضها","يأتيها الرجل في دارها متى شاء، ومثله بقاء الفتاة في بيت أهلها ويلتقيان متى رغبا","صحيح إذا توافرت الأركان والشروط وخلا من الموانع، ولكنه خلاف الأولى"],["الزواج المؤقت بالإنجاب","يشترط أحد العاقدين أنه إذا أنجبت المرأة فلا نكاح بينهما أو أن يطلقها","فاسد لوجود معنى المتعة فيه"],["الزواج بنية الطلاق","تتوافر أركانه وشروطه، ويضمر الزوج طلاقها بعد مدة معلومة أو مجهولة","أجازه جماعة من العلماء، والمجمع يرى منعه للغش والتدليس"]]},{"id":"c-shurut-madhahib","ch":"ch3","p":"81","title":"موقف المذاهب من الشروط في العقود","cols":["وجه المقارنة","التضييق","التوسعة"],"rows":[["أصحابه","الحنفية والشافعية وجمهور المالكية","الحنابلة ومعهم بعض فقهاء المذاهب الأخرى"],["دليله","«ما بال أناس يشترطون شروطا ليست في كتاب الله»","«المسلمون على شروطهم، إلا شرطا حرم حلالا أو أحل حراما»"],["موقف النظام","—","المادة 27 مما جاء به مذهب الحنابلة"]]},{"id":"c-shurut-aqsam","ch":"ch3","p":"82","title":"أقسام الشروط في عقد الزواج","cols":["القسم","النوع","مثاله"],"rows":[["صحيحة","ما وافق مقتضى العقد (اشتراطه تأكيد)","تسليم الزوجة نفسها لزوجها، واستحقاقها للمهر"],["صحيحة","ما فيه منفعة لأحد الزوجين ولا يلزم بأصل العقد (م27/1)","ألا ينقلها من بلدها، أو أن تسكن مع أهله"],["باطلة","شرط باطل لا يبطل العقد (م29/2)","اشتراط ألا مهر لها"],["باطلة","شرط باطل يبطل العقد (م29/1)","ما ينافي استمرار العقد كالمتعة، وجعل العقد مقابل عقد آخر كالشغار"]]},{"id":"c-shart-waqt","ch":"ch3","p":"84","title":"وقت الشرط وحكمه","cols":["وقت الشرط","حكمه"],"rows":[["في صلب العقد","معتبر إجماعًا"],["قبل العقد","معتبر في ظاهر مذهب أحمد"],["بعد العقد ولزومه","المنصوص عن أحمد أنه لا يلزم، وقال ابن رجب بصحته، وبه أخذ المنظم"]]},{"id":"c-isqat-faskh","ch":"ch3","p":"85","title":"سقوط حق الفسخ لفوات الشرط","cols":["وجه المقارنة","النظام","المذهب الحنبلي"],"rows":[["طريق الإسقاط","صراحة فقط","صراحة أو ضمنًا"],["سكوت المشترط عن إخلال الآخر","لا اعتبار به","يعد إسقاطًا ضمنيًا"]]},{"id":"c-batil-shart","ch":"ch3","p":"87–91","title":"الشروط الباطلة: ما يبطل العقد وما لا يبطله","cols":["وجه المقارنة","تبطل العقد (م29/1)","لا تبطل العقد (م29/2)"],"rows":[["الضابط","كل عقد نهى عنه الشرع وأبطله: ما ينافي استمرار العقد، أو جعله مقابل عقد آخر","كل ما خالف مقتضى عقد النكاح"],["صورها","المحلل، والمتعة، والشغار","اشتراط عدم المهر، أو عدم القسم، أو عدم النفقة والسكن"],["الأثر","العقد باطل","يصح العقد ويبطل الشرط"]]},{"id":"c-shighar-mahr","ch":"ch3","p":"88","title":"اشتراط عدم المهر في الشغار (حاشية الكتاب)","cols":["القول","أصحابه"],"rows":[["لا بد من عدم وجود المهر بينهما","الحنابلة والحنفية"],["يكفي الشرط ولو وجد المهر","المالكية والظاهرية، وبه أخذ المنظم"]]},{"id":"c-batil-fasid","ch":"ch3","p":"92–98","title":"الزواج الباطل والزواج الفاسد","cols":["وجه المقارنة","الباطل","الفاسد"],"rows":[["حقيقته","تخلف ركن أو شرط صحة، أو أحد شرطي المادة 29/1، ولا يعترف به الشارع","اختل فيه شرط مختلف فيه، كالنكاح بلا ولي أو بلا شاهدين، وفيه شبهة"],["الحاجة إلى فرقة","لا يحتاج إلى فرقة من زوج أو حاكم","لا بد فيه من فرقة من زوج أو فسخ من حاكم، وتفسخه المحكمة"],["زواجها من آخر","يجوز دون طلاق ولا فسخ، بعد استبراء المدخول بها بالعدة","لا يصح قبل طلاقها أو فسخ العقد"],["قبل الدخول","لا أثر له","لا أثر سوى الطلاق إن أوقعه الزوج فيقع بائنًا بينونة صغرى"],["بعد الدخول","العدة، وحرمة المصاهرة، ومهر المثل ما لم يسم مهر إن كانت لا تعلم حكم العقد","المهر المسمى، ونسب الولد، والعدة، وحرمة المصاهرة، والنفقة ما لم تعلم الفساد، ووقوع الطلاق بائنًا"],["إذا جهل الزوجان الحكم","تطبق عليه آثار الفاسد بعد الدخول (م34/3)","—"]]},{"id":"c-mahr-ajal","ch":"ch3","p":"101–102","title":"أحوال تأجيل المهر (م39)","cols":["الحال","متى يحل المهر"],"rows":[["لم ينص على التأجيل ولم يحدد وقت التسليم","عند المطالبة به"],["نص على أجل معلوم","بحلول الأجل"],["نص على أجل غير معلوم","فهو معجل"],["نص على التأجيل ولم يذكر وقت الأجل","بالفرقة البائنة (صغرى أو كبرى)، أو وفاة أحد الزوجين"]]},{"id":"c-mutallaqa","ch":"ch3","p":"103–104","title":"ما تستحقه المطلقة","cols":["الحال","ما تستحقه"],"rows":[["قبل الدخول، وقد سمي لها مهر","نصف المهر"],["قبل الدخول، ولم يسم لها مهر","متعة لا تتجاوز نصف مهر المثل"],["بعد الدخول","لا متعة لها في المذهب الحنبلي ولا في النظام (حاشية الكتاب)"]]},{"id":"c-musamma-mithl","ch":"ch3","p":"104–106","title":"المهر المسمى ومهر المثل","cols":["وجه المقارنة","المهر المسمى","مهر المثل"],"rows":[["حقيقته","المهر المدون في العقد، ما لم يصادق الزوجان على خلاف ذلك","يقدّر بمهر مثيلاتها من قراباتها من جهة الأب والأم (م18 من اللائحة)"],["متى يجب","بالعقد الصحيح، ويتأكد بالدخول أو الخلوة أو الوفاة","عند السكوت عن التسمية، أو نفي المهر، أو فساد المسمى (م41)"]]},{"id":"c-huquq-zawjayn","ch":"ch4","p":"109–122","title":"أقسام الحقوق الزوجية (م42)","cols":["القسم","الحقوق"],"rows":[["مشتركة","حسن المعاشرة بالمعروف، وعدم الإضرار، وعدم الامتناع عن المعاشرة أو الإنجاب إلا بموافقة الآخر، والسكن في بيت الزوجية، والمحافظة على مصلحة الأسرة ورعاية الأولاد"],["للزوجة","النفقة بالمعروف، والعدل بين الزوجات في القسم والنفقة الواجبة"],["للزوج","الطاعة بالمعروف، وإرضاع أولادهما ما لم يكن هناك مانع"]]},{"id":"c-rafd-awda","ch":"ch4","p":"112","title":"ما يسقط وما يبقى إذا رفضت الزوجة تنفيذ حكم العودة","cols":["وجه المقارنة","الحقوق المتعلقة بالعقد","الحقوق المتعلقة بالولادة"],"rows":[["أمثلتها","النفقة والسكنى وما يتبعهما","حضانة ولدها وزيارته"],["حكمها ما دامت رافضة","تسقط","باقية وثابتة لها، مراعاة لحق الأمومة"]]},{"id":"c-qasm-ibtidai","ch":"ch4","p":"117","title":"القسم الابتدائي للزوجة الجديدة","cols":["الجديدة","ما يمكثه عندها"],"rows":[["بكر","أسبوعًا، ثم يقسم بين زوجاته"],["ثيب","يخيرها بين ثلاث أو أسبوع، فإن مكث أسبوعًا مكث عند كل زوجة أسبوعًا"]]},{"id":"c-imtina","ch":"ch4","p":"122–124","title":"امتناع الزوجة عن الدخول (م43)","cols":["وجه المقارنة","قبل قبض المهر الحال وتهيئة المسكن","إذا رضيت بالدخول قبل قبض المهر الحال"],"rows":[["الامتناع","لها الامتناع بحق شرعي","ليس لها الامتناع بعد ذلك إذا هيأ لها المسكن المناسب"],["النفقة والمهر","لها النفقة خلال مدة الامتناع؛ لأن الإخلال من الزوج","يبقى المهر دينًا في ذمته، تطالب به متى شاءت"]]},{"id":"c-taqdir-nafaqa","ch":"nafaqa","p":"131–132","title":"المعتبر في تقدير النفقة","cols":["القول","أصحابه","دليله"],"rows":[["حال الزوج","الشافعية وغيرهم","﴿لينفق ذو سعة من سعته﴾"],["حال الزوجة","المالكية","حديث هند: «خذي ما يكفيك وولدك بالمعروف»"],["حال المنفق عليه وسعة المنفق جميعًا","الحنابلة، وعليه الفتوى عند الحنفية، وبه أخذ النظام (م46)","الجمع بين الأدلة، وهي طريقة المحققين"]]},{"id":"c-mustamirra-madiya","ch":"nafaqa","p":"134–136","title":"النفقة المستمرة والنفقة الماضية","cols":["وجه المقارنة","المستمرة (الجارية)","الماضية (المتراكمة)"],"rows":[["الاستحقاق","من تاريخ إقامة الدعوى، لا من تاريخ تصديق الحكم","—"],["مرتبة الدين","دين ممتاز يقدم على سائر الديون، عدا نفقات التنفيذ والدين برهن","تخضع لحكم باقي الديون، فهي دين عادي"],["العلة","وجبت لإقامة الأولاد، وهي من الضرورات الخمس","مستحقها ترك المطالبة بها وتراخى عن تنفيذها"],["المقاصة","لا مقاصة فيها إذا كانت الزوجة غير موسرة، وتجوز إن كانت موسرة","تجوز فيها المقاصة"]]},{"id":"c-muaqqata","ch":"nafaqa","p":"137–138","title":"أثر النفقة المؤقتة عند الحكم بالمستمرة","cols":["المحكوم له","ما تراعيه المحكمة"],"rows":[["الزوجة","تراعي ما حكمت به من نفقة مؤقتة زيادة أو نقصًا، بشرط مطالبة الزوج أو الزوجة"],["الأولاد أو الوالدان","تحسب المستمرة من تاريخ الحكم بها، دون اعتبار للمؤقتة"]]}],"lastNight":[{"ch":"intro","p":"7–8","t":"صدر النظام 5 شعبان 1443هـ (8 مارس 2022م)، ودخل حيز النفاذ 1443/11/18هـ، وصدرت لائحته بالأمر السامي (59641) وتاريخ 1446/8/17هـ."},{"ch":"intro","p":"8–10","t":"خصائصه الخمس: إزالة التقيد بمذهب معين · الحد من السلطة التقديرية للمحكمة · اعتبار المصلحة · المدد · الأخذ بالأيسر."},{"ch":"intro","p":"8–9","t":"مدد المقدمة: سنة (م2/48) · سنتان (م2/52) · سنة (م59) · خمسة عشر يومًا (م90)، وفي النظام أكثر من خمس وعشرين مدة."},{"ch":"ch1","p":"11","t":"الخطبة «طلب الزواج، والوعد به»: وعد غير ملزم، ليست عقدًا ولا شرطًا لصحة النكاح، ولا ينعقد بها النكاح ولو دُفع المهر."},{"ch":"ch1","p":"13","t":"الأصل فيما يُقدَّم في الخطبة أنه هدية، إلا بتصريح الخاطب أنه مهر أو بجريان العرف."},{"ch":"ch1","p":"13–15","t":"الهدية: من عدل بسببه لا يرجع فيها، والآخر يسترد هديته (عينها، ثم مثلها، ثم قيمتها يوم القبض)، ولا يُرد ما يستهلك بطبيعته، ولا يُسترد شيء بالوفاة أو بسبب لا يد للطرفين فيه."},{"ch":"ch1","p":"15–16","t":"المهر: يُسترد إن لم يتم العقد ولو بالموت، وللمخطوبة الخيار فيما اشترته لمصلحة الزواج إن عدل الخاطب بلا سبب منها أو عدلت هي بسبب منه، وعند الخلاف في كونه مهرًا أو هدية فالقول قول الخاطب بيمينه."},{"ch":"ch2","p":"17","t":"الزواج: «عقد بأركان وشروط. يرتب حقوقًا وواجبات بين الزوجين. غايته: الإحصان، وإنشاء أسرة مستقرة، يرعاها الزوجان، بمودة ورحمة»."},{"ch":"ch2","p":"22–23","t":"أحكام النكاح الخمسة: واجب (يخاف الزنا) · مستحب (شهوة وقدرة) · مباح (لا شهوة، كالعنّين والكبير) · مكروه (في حالة الإباحة لضرر المرأة) · حرام (دار حرب بلا ضرورة، أو الإضرار بالمرأة، أو تيقن الجور)."},{"ch":"ch2","p":"23–24","t":"الخلوة: «انفراد الزوجين في مكان ليس عندهما من يميز»؛ وغير المميز لا ينفيها، ولا يُعدّ مميزًا من لم يتم السابعة."},{"ch":"ch2","p":"25–26","t":"التوثيق واجب على الزوجين أو أحدهما؛ القاضي لعقد أحد طرفيه غير سعودي، والمأذون إن كانا سعوديين أو غير سعوديين؛ والتقرير الطبي صالح ستة أشهر."},{"ch":"ch2","p":"29–31","t":"سن التوثيق (ثمانية عشر) عامًا، والإذن لمن دونها بثلاثة شروط (المحكمة المختصة، والبلوغ، والمصلحة)، وزادت اللائحة شرطين (مقدّم الطلب، وإقرار الراغب وسماع الأم)؛ والزواج دونها صحيح عند الجمهور."},{"ch":"ch2","p":"30","t":"علامات البلوغ المشتركة: خروج المني، والسن، ونبات الشعر الخشن؛ وتختص الأنثى بالحيض والحمل."},{"ch":"ch2","p":"32–33","t":"زواج المجنون والمعتوه بإذن المحكمة بطلب ولي التزويج بثلاثة شروط: تقرير طبي معتمد، وقبول الطرف الآخر بعد اطلاعه، والمصلحة؛ والعقل ليس شرطًا للزواج بالاتفاق."},{"ch":"ch3","p":"35–37","t":"ركنا العقد في النظام: الزوجان، والإيجاب والقبول، وهو مذهب الحنابلة. وعند الحنفية ركنه الإيجاب والقبول فقط، وعند الشافعية خمسة."},{"ch":"ch3","p":"38–43","t":"شروط الصحة خمسة: تعيين الزوجين، ورضاهما، والإيجاب من الولي، وشاهدان، وألا تكون المرأة محرمة عليه تحريمًا مؤبدًا أو مؤقتًا."},{"ch":"ch3","p":"44–49","t":"الكفاءة شرط لزوم لا صحة، والمعتبر صلاح الدين وما قام العرف عليه، والاعتراض للقريب حتى الدرجة الثالثة وتقدّره المحكمة."},{"ch":"ch3","p":"49–54","t":"ينعقد بلفظ صريح، ثم بالكتابة عند العجز عن النطق، ثم بالإشارة عند العجز عنهما. وشروط الصيغة: التوافق، والاقتران في مجلس حقيقي أو حكمي، والتنجيز."},{"ch":"ch3","p":"54–57","t":"الأولياء: الأب، ثم وصيه، ثم الجد لأب، ثم الابن... ثم القاضي، ولا ولاية لذوي الأرحام، ولا يزوجها الولي ولو كان الأب بغير رضاها. وشروط الولي: ذكر، عاقل، بالغ سن الرشد (18 سنة هجرية)، موافق في الدين."},{"ch":"ch3","p":"57–61","t":"تعذر حضور الولي: تنقل المحكمة الولاية لمن يليه. والعضل: تتولى المحكمة التزويج بطلب المرأة أو ذي مصلحة، ولها نقل ولايتها لأحد الأولياء أو تفويض مرخص."},{"ch":"ch3","p":"62–63","t":"شروط الشاهد: رجل، بالغ، عاقل، سامع فاهم، مسلم إن كان الزوج مسلمًا. ولم يشترط المنظم العدالة."},{"ch":"ch3","p":"64–66","t":"أسباب التحريم المؤبد أربعة: النسب، والمصاهرة، والملاعنة، والرضاع. والمحرمات بالنسب: الأصل، والفرع، وفروع الوالدين، والطبقة الأولى من فروع الأجداد."},{"ch":"ch3","p":"66–68","t":"أم الزوجة تحرم بمجرد العقد، والربيبة بشرط الدخول بأمها، وتحرم زوجة الأب والابن. ويثبت التحريم بوطء الشبهة والزنا عند الحنفية والحنابلة."},{"ch":"ch3","p":"68–69","t":"الملاعنة محرمة على التأبيد ولو أكذب نفسه، ويعود عليه الحد ولحوق النسب."},{"ch":"ch3","p":"69–73","t":"الرضاع المحرِّم: في الحولين، وخمس رضعات متيقنة متفرقة. وتنتشر حرمته إلى فروع المرتضع لا أصوله ولا حواشيه، ولا تثبت به نفقة ولا إرث ولا ولاية."},{"ch":"ch3","p":"73–80","t":"المحرمات مؤقتًا سبع: المعتدة، والمطلقة ثلاثًا، والخامسة، والجمع بين الأختين ونحوهما، والمحرم قبل التحلل، وغير الكتابية للمسلم، وغير المسلم للمسلمة. والمؤقت بالإنجاب فاسد."},{"ch":"ch3","p":"80–84","t":"الزوجان عند شروطهما، ولا يثبت خيار الفسخ إلا بشرط مكتوب في الوثيقة أو مقرّ به. والمادة مما جاء به مذهب الحنابلة."},{"ch":"ch3","p":"84–86","t":"إن لم يف أحدهما بالشرط فللمشترط الفسخ متى شاء ما لم يسقطه صراحة؛ من الزوج بلا عوض، ومن الزوجة بعوض لا يزيد على المهر."},{"ch":"ch3","p":"86–91","t":"ما ينافي استمرار العقد (المتعة والتحليل) أو جعله مقابل زواج آخر (الشغار) يبطل العقد. وما ينافي مقتضاه (عدم المهر أو القسم أو النفقة) يبطل الشرط ويصح العقد."},{"ch":"ch3","p":"91–98","t":"الزواج صحيح وغير صحيح (باطل وفاسد). الباطل لا أثر له قبل الدخول، وبعده: العدة وحرمة المصاهرة ومهر المثل ما لم يسم مهر إن كانت لا تعلم حكم العقد. والفاسد تفسخه المحكمة، وله بعد الدخول ستة آثار بالدخول وحده."},{"ch":"ch3","p":"99","t":"للزوجين عقد جديد بعد الفاسد أو الباطل دون حكم بفسخ السابق، ولا عدة لأن الناكح واحد."},{"ch":"ch3","p":"99–107","t":"المهر مال يدفعه الرجل بسبب العقد، وهو ملكها، وكل مال يصح مهرًا. يتأكد بالدخول أو الخلوة أو الوفاة. وللمطلقة قبل الدخول نصف المسمى، وإلا متعة لا تتجاوز نصف مهر المثل. ومهر المثل عند السكوت أو النفي أو فساد المسمى."},{"ch":"ch4","p":"109–122","t":"الحقوق المشتركة خمسة: حسن المعاشرة، وعدم الإضرار، وعدم الامتناع عن المعاشرة أو الإنجاب إلا بموافقة الآخر، والسكن في بيت الزوجية، ورعاية الأسرة. وللزوجة النفقة والعدل، وللزوج الطاعة بالمعروف والإرضاع."},{"ch":"ch4","p":"112","t":"لا ينفذ حكم عودة الزوجة جبرًا (م75 تنفيذ)، وتسقط نفقتها ما دامت رافضة، ولا تسقط حضانتها ولا زيارتها."},{"ch":"ch4","p":"116–119","t":"القسم: للبكر الجديدة أسبوع ثم يقسم، وللثيب ثلاث أو أسبوع بالتخيير. ويسقط بالنشوز والسفر، ولا يسافر بإحداهن إلا بقرعة أو رضا."},{"ch":"ch4","p":"122–124","t":"للزوجة الامتناع عن الدخول حتى تقبض مهرها الحال ويهيأ المسكن، ولها النفقة. فإن رضيت بالدخول قبل القبض بقي المهر دينًا، ولا امتناع لها بعده إذا هيأ لها المسكن المناسب."},{"ch":"nafaqa","p":"125–127","t":"نفقة كل إنسان في ماله إلا الزوجة فعلى زوجها ولو كانت موسرة. ومجهول الأبوين الذي لا مال له ولا متبرع: نفقته على الدولة."},{"ch":"nafaqa","p":"128–133","t":"تشمل النفقة الطعام والكسوة والسكن والحاجيات الأساسية بحسب العرف. ويراعى حال المنفق عليه وسعة المنفق. وتجوز نقدًا، والواجب إتاحتها لا تمليكها."},{"ch":"nafaqa","p":"133–138","t":"لا تسمع دعوى زيادة النفقة أو إنقاصها قبل سنة من الحكم إلا لظرف استثنائي، وتحسب من تاريخ الحكم. والمستمرة من تاريخ إقامة الدعوى ودين ممتاز، بخلاف الماضية. وللمحكمة الحكم بنفقة مؤقتة بطلب المستحق ولو غاب الآخر."}],"questions":[{"type":"mcq","ch":"intro","art":0,"q":"صدر نظام الأحوال الشخصية في:","opts":["5 شعبان 1443هـ الموافق 8 مارس 2022م","26 جمادى الآخرة 1442هـ الموافق 8 فبراير 2021م","1443/11/18هـ","1446/8/17هـ"],"a":0,"why":"صدر يوم الثلاثاء 5 شعبان 1443هـ؛ أما 26 جمادى الآخرة 1442هـ فتاريخ الإعلان عن منظومة التشريعات، و1443/11/18هـ تاريخ نفاذه، و1446/8/17هـ تاريخ الأمر الصادرة به اللائحة.","src":"فقد صدر نظام الأحوال الشخصية في يوم الثلاثاء 5 شعبان 1443هـ الموافق 8 مارس 2022م، بموافقة مجلس الوزراء","p":"7","id":"b1-001"},{"type":"mcq","ch":"intro","art":0,"q":"دخل نظام الأحوال الشخصية حيز النفاذ في تاريخ:","opts":["1443/11/18هـ","5 شعبان 1443هـ","26 جمادى الآخرة 1442هـ","1446/8/22هـ"],"a":0,"why":"نصّ الكتاب على أنه دخل حيز النفاذ في 1443/11/18هـ.","src":"وقد دخل حيز النفاذ في تاريخ 1443/11/18هـ","p":"8","id":"b1-002"},{"type":"tf","ch":"intro","art":0,"q":"يُعدّ نظام الأحوال الشخصية أول مشروعات منظومة التشريعات المتخصصة الأربعة صدورًا.","a":false,"why":"هو ثاني مشروعات المنظومة صدورًا، لا أولها.","src":"وهذا النظام يُعدُّ ثاني مشروعات منظومة التشريعات المتخصصة الأربعة في صدوره","p":"7","id":"b1-003"},{"type":"mcq","ch":"intro","art":0,"q":"صدرت اللائحة التنفيذية لنظام الأحوال الشخصية بموجب:","opts":["الأمر السامي رقم (59641) وتاريخ 1446/8/17هـ","المرسوم الملكي رقم (م/164) وتاريخ 1441/11/19هـ","قرار مجلس الوزراء وتاريخ 5 شعبان 1443هـ","الأمر السامي رقم (5072) وتاريخ 1446/8/22هـ"],"a":0,"why":"صدرت بالأمر السامي (59641)؛ أما (م/164) فمرسوم نظام التوثيق، و(5072) رقم عدد جريدة أم القرى الذي نُشرت فيه.","src":"وصدرت لائحته التنفيذية بموجب الأمر السامي رقم (59641) وتاريخ 1446/8/17هـ، وتم نشره بجريدة أم القرى في العدد رقم (5072)","p":"7","id":"b1-004"},{"type":"mcq","ch":"intro","art":0,"q":"يتكون نظام الأحوال الشخصية من:","opts":["ستة أبواب","سبعة أبواب","ثمانية أبواب","عشرة أبواب"],"a":2,"why":"عدّ الكتاب ثمانية أبواب.","src":"وهو يتكون من ثمانية أبواب هي: الزواج - آثار عقد الزواج - الفرقة بين الزوجين - آثار الفرقة بين الزوجين - الوصاية والولاية - الوصية - التركة والإرث - أحكام ختامية","p":"8","id":"b1-005"},{"type":"mcq","ch":"intro","art":0,"q":"أيٌّ مما يلي ليس بابًا من أبواب نظام الأحوال الشخصية كما عدّها الكتاب؟","opts":["الوصاية والولاية","التركة والإرث","الحضانة","آثار الفرقة بين الزوجين"],"a":2,"why":"الحضانة ليست من الأبواب الثمانية التي عدّها الكتاب.","src":"الزواج - آثار عقد الزواج - الفرقة بين الزوجين - آثار الفرقة بين الزوجين - الوصاية والولاية - الوصية - التركة والإرث - أحكام ختامية","p":"8","id":"b1-006"},{"type":"tf","ch":"intro","art":0,"q":"من خصائص نظام الأحوال الشخصية أنه أزال التقيد بمذهب معين.","a":true,"why":"هي الخاصية الأولى في الكتاب.","src":"وقد تميز النظام بعدة خصائص منها: 1 - أزال التقيد بمذهب معين.","p":"8","id":"b1-007"},{"type":"tf","ch":"intro","art":0,"q":"التزم نظام الأحوال الشخصية المشهورَ من المذهب الحنبلي في جميع أحكامه.","a":false,"why":"جاء مخالفًا للسائد والمشهور من المذهب الحنبلي في بعض أحكامه ومواده.","src":"ولذلك جاء النظام مخالفًا للسائد والمشهور من المذهب الحنبلي في بعض أحكامه ومواده.","p":"8","id":"b1-008"},{"type":"mcq","ch":"intro","art":0,"q":"مثّل الكتاب بالمادة (2/8) «يجوز لكل ذي مصلحة طلب إثبات عقد الزواج غير الموثق» لخاصية:","opts":["الحد من السلطة التقديرية للمحكمة","اعتبار المصلحة والأخذ بها","المدد في النظام","الأخذ بالأيسر في الأحكام المختلف فيها"],"a":1,"why":"جعلها الكتاب أول أمثلة اعتبار المصلحة.","src":"3 - اعتبار المصلحة والأخذ بها في كثير من الأحكام: - ومن أمثلة ذلك ما جاء في المادة (2/8)","p":"8","id":"b1-009"},{"type":"mcq","ch":"intro","art":0,"q":"لا تُسمع الدعوى بنفقة الزوجة عن مدة سابقة تزيد على:","opts":["سنة","سنتين","ثلاث سنوات","خمس سنوات"],"a":1,"why":"المادة (2/52) جعلتها سنتين من تاريخ إقامة الدعوى.","src":"لا تسمع الدعوى بنفقة الزوجة عن مدة سابقة تزيد على (سنتين) من تاريخ إقامة الدعوى","p":"9","id":"b1-010"},{"type":"mcq","ch":"intro","art":0,"q":"يجب على الزوج أن يوثّق الطلاق خلال مدة أقصاها:","opts":["سبعة أيام","عشرة أيام","خمسة عشر يومًا","ثلاثون يومًا"],"a":2,"why":"المادة (90): خمسة عشر يومًا من حين البينونة.","src":"وذلك خلال مدة أقصاها (خمسة عشر) يومًا من حين البينونة","p":"9","id":"b1-011"},{"type":"mcq","ch":"intro","art":0,"q":"لا تُسمع دعوى الزيادة أو النقصان في النفقة قبل مضي ... من تاريخ صدور الحكم بالنفقة، إلا في الظروف الاستثنائية التي تقدرها المحكمة:","opts":["ستة أشهر","سنة","سنتين","خمسة عشر يومًا"],"a":1,"why":"المادة (2/48): سنة.","src":"المادة رقم (2/48) أنه لا تسمع دعوى الزيادة أو النقصان قبل مضي (سنة) من تاريخ صدور الحكم بالنفقة إلا في الظروف الاستثنائية التي تقدرها المحكمة","p":"8","id":"b1-012"},{"type":"tf","ch":"intro","art":0,"q":"في نظام الأحوال الشخصية ما يزيد على خمس وعشرين مدة وضعها المنظم لمنع اختلاف اجتهادات القضاة.","a":true,"why":"هذا نص الكتاب.","src":"بل في النظام من المدد ما يزيد على خمس وعشرين من المدد التي وضعها المنظم بهدف عدم اختلاف اجتهادات القضاة","p":"9","id":"b1-013"},{"type":"tf","ch":"intro","art":0,"q":"من خصائص النظام الأخذ بالأحوط والأشد في الأحكام المختلف فيها.","a":false,"why":"الخاصية الخامسة: الأخذ بالأيسر.","src":"5 - الأخذ بالأيسر في كثير من الأحكام المختلف فيها","p":"10","id":"b1-014"},{"type":"essay","ch":"intro","art":0,"q":"عدّد خصائص نظام الأحوال الشخصية كما ذكرها الكتاب، واذكر ما مثّل به لكل خاصية إن وُجد.","a":"1. أزال التقيد بمذهب معين؛ فجاء مخالفًا للسائد والمشهور من المذهب الحنبلي في بعض أحكامه (ولم يذكر الكتاب لها مثالًا).\n2. الحد من السلطة التقديرية للمحكمة والأخذ بها في بعض الأحكام؛ ومنه المادة (2/48): لا تسمع دعوى الزيادة أو النقصان قبل مضي سنة من صدور الحكم بالنفقة إلا في الظروف الاستثنائية، والمادة (50) في النفقة المؤقتة، والمادة (2/104) في الاستعانة بأهل الخبرة.\n3. اعتبار المصلحة والأخذ بها في كثير من الأحكام؛ ومنه المادة (2/8) في طلب إثبات الزواج غير الموثق لكل ذي مصلحة، والمادة التاسعة في سن التوثيق، والمادة (126) في مصلحة المحضون.\n4. المدد في النظام؛ ومنها المادة (2/52) سنتان في نفقة الزوجة الماضية، والمادة (59) سنة في دعوى الرجوع بالنفقة، والمادة (90) خمسة عشر يومًا لتوثيق الطلاق، وفي النظام أكثر من خمس وعشرين مدة.\n5. الأخذ بالأيسر في كثير من الأحكام المختلف فيها، «وهو مما يطول الحديث عنه» (ولم يذكر الكتاب لها مثالًا).","src":"وقد تميز النظام بعدة خصائص منها: 1 - أزال التقيد بمذهب معين. ... 2 - الحد من السلطة التقديرية للمحكمة، والأخذ بها في بعض الأحكام ... 3 - اعتبار المصلحة والأخذ بها في كثير من الأحكام ... 4 - المدد في النظام ... 5 - الأخذ بالأيسر في كثير من الأحكام المختلف فيها","p":"8–10","id":"b1-015"},{"type":"essay","ch":"intro","art":0,"q":"متى صدر نظام الأحوال الشخصية ولائحته التنفيذية، ومتى دخل حيز النفاذ؟","a":"صدر النظام يوم الثلاثاء 5 شعبان 1443هـ الموافق 8 مارس 2022م بموافقة مجلس الوزراء بعد دراسته في مجلس الشورى، وهو ثاني مشروعات منظومة التشريعات المتخصصة الأربعة المعلن عنها في 26 جمادى الآخرة 1442هـ (8 فبراير 2021م).\nوصدرت لائحته التنفيذية بالأمر السامي رقم (59641) وتاريخ 1446/8/17هـ، ونُشرت في جريدة أم القرى العدد (5072) وتاريخ 1446/8/22هـ (2025/2/21م).\nودخل النظام حيز النفاذ في 1443/11/18هـ.","src":"فقد صدر نظام الأحوال الشخصية في يوم الثلاثاء 5 شعبان 1443هـ ... وقد دخل حيز النفاذ في تاريخ 1443/11/18هـ","p":"7–8","id":"b1-016"},{"type":"mcq","ch":"ch1","art":1,"q":"عرّف نظام الأحوال الشخصية الخطبة بأنها:","opts":["طلب الزواج، والوعد به","عقد زواج موقوف على التوثيق","الإيجاب والقبول قبل الدخول","الاتفاق على المهر وتسليمه"],"a":0,"why":"هذا نص المادة الأولى.","src":"الخطبة هي: طلب الزواج، والوعد به","p":"11","id":"b1-017"},{"type":"tf","ch":"ch1","art":1,"q":"الخطبة شرط في صحة النكاح.","a":false,"why":"ليست شرطًا في صحته، وإنما هي وسيلة إليه.","src":"وليست الخطبة شرطًا في صحة النكاح، ولكنها وسيلة إليه","p":"11","id":"b1-018"},{"type":"tf","ch":"ch1","art":1,"q":"إذا اقترنت الخطبة بدفع المهر أو جزء منه انعقد بها النكاح.","a":false,"why":"لا ينعقد النكاح بالخطبة ولو اقترنت بدفع المهر.","src":"ولذا لا ينعقد النكاح بها، حتى ولو اقترنت بدفع المهر أو جزء منه","p":"11","id":"b1-019"},{"type":"tf","ch":"ch1","art":1,"q":"يُباح للخاطبين بعد الخطبة أن يختلطا دون وجود محرم، لأن الخطبة وعد بالزواج.","a":false,"why":"الخطبة ليست عقدًا، فلا يباح الاختلاط دون محرم.","src":"ولا يعدُّ هذا الوعد عقدًا للزواج، فلا يباح أن يختلطا ببعضهما البعض دون وجود محرم","p":"11","id":"b1-020"},{"type":"tf","ch":"ch1","art":1,"q":"يجوز للخاطب أن ينظر إلى مخطوبته، وهو قول جمهور الفقهاء.","a":true,"why":"هذا ما قرره الكتاب مستدلًا بالحديث.","src":"أنه يجوز للخاطب ويباح له أن ينظر إلى مخطوبته، وهو قول جمهور الفقهاء","p":"12","id":"b1-021"},{"type":"mcq","ch":"ch1","art":2,"q":"حق العدول عن الخطبة في المادة الثانية ثابت لـ:","opts":["الخاطب وحده","المخطوبة وحدها","كلٍّ من الخاطب والمخطوبة","ولي المخطوبة وحده"],"a":2,"why":"نصت المادة على أنه لكل منهما.","src":"لكلٍ من الخاطب والمخطوبة العدول عن الخطبة","p":"12","id":"b1-022"},{"type":"mcq","ch":"ch1","art":2,"q":"علّل الكتاب جواز العدول عن الخطبة بأن الخطبة:","opts":["عقد غير لازم يجوز فسخه بالتراضي","وعد بالزواج غير ملزم وليست عقدًا","عقد موقوف على إذن المحكمة","لا تكون إلا بعد توثيق العقد"],"a":1,"why":"الخطبة ليست عقدًا للزواج وإنما وعد غير ملزم.","src":"والسبب في ذلك: ما تقرر أن الخطبة ليست عقدًا للزواج، فلا يعدو الأمر إلا أنها وعد بالزواج غير ملزم.","p":"12","id":"b1-023"},{"type":"tf","ch":"ch1","art":3,"q":"الأصل فيما يقدمه الخاطب أو المخطوبة إلى الآخر خلال فترة الخطبة أنه مهر.","a":false,"why":"الأصل أنه هدية، إلا إذا صرّح الخاطب بأنه مهر أو جرى العرف بذلك.","src":"جميع ما يقدمه الخاطب أو المخطوبة إلى الآخر خلال فترة الخطبة يعد هدية، ما لم يصرح الخاطب بأن ما قدمه يعد مهرًا، أو يجرِ عرفٌ على أنه من المهر","p":"13","id":"b1-024"},{"type":"mcq","ch":"ch1","art":3,"q":"يُعدّ ما قدّمه الخاطب في فترة الخطبة من المهر إذا:","opts":["كان نقدًا لا عينًا","صرّح الخاطب بأنه مهر، أو جرى العرف على أنه من المهر","قبضته المخطوبة بحضور وليها","تجاوزت قيمته ربع المهر"],"a":1,"why":"هاتان هما الحالتان المستثناتان من الأصل.","src":"ويستثنى من ذلك حالتان هما: الحالة الأولى: التصريح من الخاطب أن ما قدمه هو مهر. الحالة الثانية: جريان العرف على أنه من المهر.","p":"13","id":"b1-025"},{"type":"mcq","ch":"ch1","art":4,"q":"إذا عدل الخاطب عن الخطبة بسبب يعود إليه، فإن الهدية التي قدّمها:","opts":["يستردها بعينها إن كانت قائمة","يسترد قيمتها يوم قبضها","ليس له الرجوع فيها","يسترد نصفها"],"a":2,"why":"من عدل بسبب يعود إليه لا يرجع في هديته.","src":"إذا عَدَلَ أيٌّ من الخاطب أو المخطوبة عن الخطبة بسبب يعود إليه، فليس له الرجوع في الهدية التي قدمها","p":"13","id":"b1-026"},{"type":"tf","ch":"ch1","art":4,"q":"إذا عدلت المخطوبة بسبب يعود إليها، فللخاطب أن يسترد ما أهداه إن كان قائمًا، وإلا بمثله أو قيمته يوم قبضه، ما لم يكن مما يستهلك بطبيعته.","a":true,"why":"هذا حكم الطرف الذي لم يعدل.","src":"وللطرف الآخر أن يسترد منه ما قدمه من هدية إن كانت قائمة، وإلا بمثلها، أو قيمتها يوم قبضها، ما لم تكن الهدية مما يستهلك بطبيعتها","p":"13","id":"b1-027"},{"type":"tf","ch":"ch1","art":4,"q":"إذا انتهت الخطبة بوفاة الخاطب، فلورثته أن يستردوا الهدايا التي قدّمها.","a":false,"why":"لا يسترد شيء من الهدايا إذا انتهت الخطبة بالوفاة.","src":"وفي جميع الأحوال: إذا انتهت الخطبة بالوفاة، أو بسبب لا يد للطرفين فيه، فلا يسترد شيء من الهدايا","p":"13","id":"b1-028"},{"type":"mcq","ch":"ch1","art":4,"q":"مثّل الكتاب للهدية التي تُستهلك بطبيعتها فلا تُرد بـ:","opts":["الحلي","السيارة","الأكل والحلوى","الملابس"],"a":2,"why":"هذا مثال الكتاب.","src":"واستثني من ذلك ما لم تكن الهدية مما يستهلك بطبيعتها كالأكل والحلوى مثلاً","p":"14","id":"b1-029"},{"type":"mcq","ch":"ch1","art":4,"q":"السيارة المستعملة في تمثيل الكتاب من:","opts":["المثليات","القيميات","ما يستهلك بطبيعته","المهر المعجل"],"a":1,"why":"مثّل بها الكتاب للقيميات، ومثّل بالسيارة الجديدة للمثليات.","src":"ويقابلها القيميات وهي ما ليس له نظير في السوق، أو له نظير ولكن هناك فارق يعتد به، مثل السيارة المستعملة","p":"14","id":"b1-030"},{"type":"mcq","ch":"ch1","art":5,"q":"إذا مات الخاطب قبل العقد وكان قد سلّم مخطوبته مالًا على أنه من المهر، فلورثته:","opts":["لا شيء لهم","الرجوع فيما سلّم بعينه إن كان قائمًا، وإلا بمثله أو بقيمته يوم القبض","نصف ما سلّم","ما بقي منه دون ما استُهلك"],"a":1,"why":"نصت الفقرة الأولى من المادة الخامسة على الموت قبل العقد.","src":"إذا عدل أي من الخاطب أو المخطوبة عن إبرام عقد الزواج أو مات قبل العقد، وكان الخاطب قد سلم إلى مخطوبته قبل العقد مالاً على أنه من المهر، يحق للخاطب أو لورثته الرجوع فيما سلم بعينه إن كان قائمًا وإلا بمثله، أو بقيمته يوم القبض","p":"15","id":"b1-031"},{"type":"tf","ch":"ch1","art":5,"q":"إذا اختلف الخاطبان في المال المسلَّم للمخطوبة: أهو مهر أم هدية؟ فالقول قول المخطوبة بيمينها.","a":false,"why":"المعتبر قول الخاطب بيمينه لأنه المسلِّم وأدرى بما صرفه.","src":"فالجواب عنه: أن المعتبر هو قول الخاطب بيمينه؛ لأنه هو المسلِّم لأنه أدرى بما صرفه","p":"16","id":"b1-032"},{"type":"mcq","ch":"ch1","art":5,"q":"إذا اشترت المخطوبة بالمهر حليًّا لمصلحة الزواج وفق العرف، ثم عدل الخاطب بلا سبب من قبلها، فلها:","opts":["أن تحتفظ بالمهر والحلي معًا","الخيار بين إعادة المهر أو تسليم ما اشترته بحاله","رد نصف المهر فقط","أن تطالب بتعويض يعادل المهر"],"a":1,"why":"هذا نص الفقرة الثانية من المادة الخامسة.","src":"إذا كانت المخطوبة اشترت بالمهر أو بعضه لمصلحة الزواج - وفق ما جرى به العرف - وكان العدول من الخاطب بلا سبب من قبلها، أو كان العدول منها بسبب من الخاطب، فلها الخيار بين إعادة المهر أو تسليم ما اشترته بحاله","p":"15","id":"b1-033"},{"type":"tf","ch":"ch1","art":5,"q":"إذا كان العدول من المخطوبة بلا سبب من الخاطب، فعليها رد المهر عينه أو بدله.","a":true,"why":"قرره الكتاب في شرح المادة الخامسة.","src":"أما إذا كان العدول من المخطوبة: فإن عليها رد المهر، عينه أو بدله.","p":"16","id":"b1-034"},{"type":"mcq","ch":"ch1","art":5,"q":"القاعدة الفقهية التي استند إليها الكتاب في تخيير المخطوبة في الفقرة الثانية من المادة الخامسة:","opts":["المشقة تجلب التيسير","الضرر يزال","العادة محكّمة","اليقين لا يزول بالشك"],"a":1,"why":"علّل الكتاب بأن الخاطب عليه احتمال الضرر الناشئ عن عدوله، والضرر يزال.","src":"وقد جاء في القواعد المقررة في الشريعة: أن «الضرر يزال»","p":"16","id":"b1-035"},{"type":"essay","ch":"ch1","art":4,"q":"فرّق بين آثار العدول عن الخطبة إذا كان المقدَّم هدية، وإذا كان مهرًا، وفق المادتين الرابعة والخامسة.","a":"أولًا: إذا كان المقدَّم هدية (المادة الرابعة):\n- من عدل بسبب يعود إليه فليس له الرجوع في هديته، وللطرف الآخر أن يسترد ما أهداه: بعينه إن كان قائمًا، وإلا بمثله إن كان مثليًا، أو بقيمته يوم القبض إن كان قيميًا، ما لم يكن مما يستهلك بطبيعته كالأكل والحلوى.\n- إذا انتهت الخطبة بالوفاة أو بسبب لا يد للطرفين فيه فلا يسترد شيء من الهدايا، لأن عدم التمام ليس من جهتهم.\nثانيًا: إذا كان المقدَّم مهرًا (المادة الخامسة):\n- إذا عدل أي من الطرفين عن إبرام العقد أو مات قبله، فللخاطب أو لورثته الرجوع فيما سلّم بعينه إن كان قائمًا، وإلا بمثله أو بقيمته يوم القبض، لأن المرأة لا حق لها في المهر إلا بتمام العقد.\n- إذا اشترت المخطوبة بالمهر أو بعضه ما فيه مصلحة الزواج وفق العرف، وكان العدول من الخاطب بلا سبب منها، أو منها بسبب من الخاطب، فلها الخيار بين إعادة المهر أو تسليم ما اشترته بحاله، لأن الشراء كان بتسليط من الخاطب، والضرر يزال.\n- إذا كان العدول من المخطوبة فعليها رد المهر عينه أو بدله.","src":"فليس له الرجوع في الهدية التي قدمها ... فلا يسترد شيء من الهدايا ... يحق للخاطب أو لورثته الرجوع فيما سلم بعينه ... فلها الخيار بين إعادة المهر أو تسليم ما اشترته بحاله","p":"13–16","id":"b1-036"},{"type":"essay","ch":"ch1","art":3,"q":"ما الأصل فيما يُقدَّم في فترة الخطبة؟ وما الحالتان المستثناتان؟ وكيف يُحسم الخلاف بين الخاطبين في ذلك؟","a":"الأصل أن جميع ما يقدمه الخاطب أو المخطوبة إلى الآخر خلال فترة الخطبة هدية لا مهر (المادة الثالثة).\nويستثنى حالتان يكون فيهما من المهر: الأولى: التصريح من الخاطب أن ما قدمه هو مهر. الثانية: جريان العرف على أنه من المهر.\nوإذا اختلف الخاطبان في المال المسلَّم: أهو مهر أم هدية؟ فالمعتبر قول الخاطب بيمينه، لأنه المسلِّم وهو أدرى بما صرفه، وعليه قول الجمهور.","src":"يعد هدية، ما لم يصرح الخاطب بأن ما قدمه يعد مهرًا، أو يجرِ عرفٌ على أنه من المهر ... أن المعتبر هو قول الخاطب بيمينه","p":"13–16","id":"b1-037"},{"type":"mcq","ch":"ch2","art":6,"q":"غاية الزواج في تعريف النظام:","opts":["الإحصان، وإنشاء أسرة مستقرة، يرعاها الزوجان، بمودة ورحمة","حفظ النسل وتوثيق الأنساب","ترتيب الحقوق المالية بين الزوجين","الإعفاف وتكثير النسل فقط"],"a":0,"why":"هذا نص المادة السادسة.","src":"الزواج: عقد بأركان وشروط. يرتب حقوقًا وواجبات بين الزوجين. غايته: الإحصان، وإنشاء أسرة مستقرة، يرعاها الزوجان، بمودة ورحمة","p":"17","id":"b1-038"},{"type":"mcq","ch":"ch2","art":6,"q":"قوله تعالى ﴿احْشُرُوا الَّذِينَ ظَلَمُوا وَأَزْوَاجَهُمْ﴾ شاهد في الكتاب على المعنى اللغوي للزواج:","opts":["الاقتران والارتباط","التماثل والتناظر","النكاح","المودة والرحمة"],"a":1,"why":"أزواجهم: نظراؤهم.","src":"التماثل والتناظر، قال تعالى: ﴿احْشُرُوا الَّذِينَ ظَلَمُوا وَأَزْوَاجَهُمْ﴾ معناه: ونظراءهم.","p":"17","id":"b1-039"},{"type":"mcq","ch":"ch2","art":6,"q":"معنى «الباءة» في حديث «يا معشر الشباب» عند الكتاب:","opts":["الجماع فقط","مؤن النكاح فقط","قيل الجماع وقيل مؤن النكاح، ولا تنافي بين القولين","البلوغ"],"a":2,"why":"ذكر الكتاب القولين وجمع بينهما.","src":"والباءة: قيل: هي الجماع، وقيل: هي مؤن النكاح، ولا تنافي بين القولين","p":"19","id":"b1-040"},{"type":"mcq","ch":"ch2","art":6,"q":"أمر الحديث بمقاومة الشهوة بأمرين مرتبين، هما:","opts":["الصيام ثم الزواج","الزواج عند المقدرة، ثم الصيام لمن لم يقدر","غض البصر ثم الصيام","الزواج ثم التعدد"],"a":1,"why":"الزواج أولًا لمن قدر، والصيام لمن لم يقدر.","src":"فأمر بمقاومة الشهوة واتقاء خطرها بأمرين مرتبين: الأمر الأول: الزواج عند المقدرة عليه. والثاني: الصيام لمن لم يقدر على الزواج","p":"20","id":"b1-041"},{"type":"mcq","ch":"ch2","art":6,"q":"يكون النكاح واجبًا:","opts":["مع وجود الشهوة ووجود تكاليف الزواج","على من يخاف على نفسه الزنا إذا تركه","مع عدم الشهوة والميل إليه","إذا كان في دار كفار حربيين"],"a":1,"why":"الواجب لمن يخاف على نفسه الزنا إذا تركه.","src":"1 - النكاح الواجب: يكون النكاح واجبًا على من يخاف على نفسه الزنا إذا تركه؛ لأنه طريق لإعفاف نفسه من الحرام.","p":"22","id":"b1-042"},{"type":"mcq","ch":"ch2","art":6,"q":"يكون النكاح مستحبًا:","opts":["على من يخاف على نفسه الزنا إذا تركه","مع وجود الشهوة، ووجود تكاليف الزواج","مع عدم الشهوة والميل إليه","إذا تيقن الجور"],"a":1,"why":"المستحب مع وجود الشهوة وتكاليف الزواج.","src":"2 - النكاح المستحب: يكون النكاح مستحبًا مع وجود الشهوة، ووجود تكاليف الزواج؛ لاشتماله على مصالح كثيرة للرجال والنساء.","p":"22","id":"b1-043"},{"type":"tf","ch":"ch2","art":6,"q":"يُباح النكاح مع عدم الشهوة والميل إليه، كالعنّين والكبير.","a":true,"why":"هذه حالة الإباحة في الكتاب.","src":"3 - النكاح المباح: يباح النكاح مع عدم الشهوة والميل إليه، أو خاف العجز عن الإيفاء بموجبه، كالعنِّين والكبير.","p":"22","id":"b1-044"},{"type":"tf","ch":"ch2","art":6,"q":"قد يكون النكاح مكروهًا في حالة الإباحة؛ لأنه يفوّت على المرأة الغرض الصحيح من النكاح وهو إعفافها.","a":true,"why":"هذه حالة الكراهة في الكتاب.","src":"4 - النكاح المكروه: قد يكون النكاح مكروهًا في الحالة الثالثة؛ لأنه يفوت على المرأة الغرض الصحيح من النكاح، وهو إعفافها، ويضر بها.","p":"22","id":"b1-045"},{"type":"mcq","ch":"ch2","art":6,"q":"أيٌّ مما يلي من صور النكاح المحرم في الكتاب؟","opts":["النكاح مع عدم الشهوة","نكاح المسلم في دار كفار حربيين ولا ضرورة به للنكاح","النكاح مع وجود الشهوة والقدرة","نكاح الكبير"],"a":1,"why":"يحرم على الصحيح لتعريض ذريته للخطر.","src":"5 - النكاح المحرم: يحرم النكاح على المسلم إذا كان في دار كفار حربيين، ولم تكن به ضرورة للنكاح، على الصحيح","p":"23","id":"b1-046"},{"type":"tf","ch":"ch2","art":6,"q":"للزوج أن يعزل عن امرأته الحرة دون إذنها.","a":false,"why":"ليس له ذلك إلا بإذنها.","src":"ليس للزوج أن يعزل عن امرأته الحرة إلا بإذنها","p":"23","id":"b1-047"},{"type":"mcq","ch":"ch2","art":7,"q":"عرّف النظام الخلوة بأنها انفراد الزوجين في مكان:","opts":["مغلق الأبواب","ليس عندهما من يميز","ليس عندهما أحد من محارمهما","بعيد عن أعين الناس"],"a":1,"why":"هذا نص المادة السابعة.","src":"الخلوة - في سبيل تطبيق هذا النظام - انفراد الزوجين في مكان ليس عندهما من يميز","p":"23","id":"b1-048"},{"type":"tf","ch":"ch2","art":7,"q":"وجود طفل غير مميز مع الزوجين ينفي الخلوة بينهما.","a":false,"why":"غير المميز لا اعتبار به، ويعد انفرادهما بوجوده خلوة.","src":"أما لو كان غير مميز فلا اعتبار به ويعد انفرادهما بوجوده خلوة لأنه لا يعقل ما يحدث بينهما","p":"24","id":"b1-049"},{"type":"tf","ch":"ch2","art":7,"q":"عدّت اللائحة التنفيذية مشاهدة المميز للزوجين في حكم وجوده معهما، فتنتفي بها الخلوة.","a":true,"why":"ذكرته اللائحة في مادتها الأولى.","src":"وذكرت اللائحة التنفيذية للنظام في مادتها الأولى أنه يعد من صور انتفاء الخلوة بين الزوجين؛ إذ كان هناك من يشاهدهما وكان مميزاً، فعدت المشاهدة من المميز في حكم وجوده معهما.","p":"24","id":"b1-050"},{"type":"mcq","ch":"ch2","art":7,"q":"سن التمييز في نظام المعاملات المدنية:","opts":["إتمام الخامسة","إتمام السابعة","إتمام العاشرة","إتمام الخامسة عشرة"],"a":1,"why":"المادة الثالثة عشرة من نظام المعاملات المدنية.","src":"(لايعد مميزاً من لم يتم السابعة من عمره)","p":"24","id":"b1-051"},{"type":"mcq","ch":"ch2","art":7,"q":"يتأكد المهر المسمى كاملًا أو مهر المثل في الفقرة الثانية من المادة الأربعين بـ:","opts":["العقد، أو الخطبة، أو الخلوة","الدخول، أو الخلوة، أو وفاة أحد الزوجين","التوثيق، أو الدخول، أو الطلاق","القبض، أو الدخول، أو الطلاق"],"a":1,"why":"ذكرها الكتاب من أحكام الخلوة.","src":"(يتأكد المهر المسمى كاملاً أو مهر المثل، بـ: الدخول، أو الخلوة، أو وفاة أحد الزوجين)","p":"24","id":"b1-052"},{"type":"tf","ch":"ch2","art":8,"q":"توثيق عقد الزواج في النظام جائز وليس واجبًا.","a":false,"why":"نصت المادة الثامنة على وجوبه.","src":"1 - يجب توثيق عقد الزواج، وعلى الزوجين - أو أحدهما - توثيقه، وفق الأحكام المنظمة لذلك.","p":"25","id":"b1-053"},{"type":"mcq","ch":"ch2","art":8,"q":"المخاطب أصالة بتوثيق عقد الزواج:","opts":["الولي","المأذون","الزوجان أو أحدهما","المحكمة"],"a":2,"why":"لأنهما المستفيدان الأولان من التوثيق.","src":"بما أن الزوجين هما المستفيدان الأولان من توثيق عقدهما، فإنهما مخاطبان أصالة بهذا الإجراء","p":"25","id":"b1-054"},{"type":"mcq","ch":"ch2","art":8,"q":"يتم العقد لدى مأذون الأنكحة إذا كان:","opts":["أحد الطرفين غير سعودي","كلا الطرفين سعوديًّا أو كلاهما غير سعودي","العقد ورقيًّا فقط","الولي غير الأب"],"a":1,"why":"أما إذا كان أحد الطرفين غير سعودي فالمعمول به أن يعقده القاضي.","src":"ويتم العقد لدى المأذون إن كان كلا الطرفين سعوديًّا أو كلاهما غير سعودي، كما هو نص المادة رقم (18) من نظام التوثيق.","p":"26","id":"b1-055"},{"type":"mcq","ch":"ch2","art":8,"q":"مدة صلاحية التقرير الطبي للزوجين:","opts":["ثلاثة أشهر","ستة أشهر","سنة","سنتان"],"a":1,"why":"ستة أشهر فقط.","src":"وتوفر تقرير طبي للزوجين ساري المفعول (مدة صلاحية التقرير ستة أشهر فقط)","p":"26","id":"b1-056"},{"type":"mcq","ch":"ch2","art":8,"q":"إذا لم يوجد للمرأة ولي شرعي، أو عضلها أولياؤها، فإن عقد نكاحها يُجرى من قِبَل:","opts":["أقرب رجل من أقاربها","المأذون مباشرة","المحكمة المختصة","وزارة العدل"],"a":2,"why":"بموجب نظام المرافعات الشرعية المادة (33/أ/6).","src":"في حال عدم وجود وليٍّ شرعيٍّ للمرأة، أو في حالة عضل الأولياء لها: فإن إجراء عقد النكاح يكون من قِبل المحكمة المختصة","p":"27","id":"b1-057"},{"type":"tf","ch":"ch2","art":8,"q":"يجوز لكل ذي مصلحة طلب إثبات عقد الزواج غير الموثق.","a":true,"why":"نص الفقرة الثانية من المادة الثامنة.","src":"2 - يجوز لكل ذي مصلحة طلب إثبات عقد الزواج غير الموثق.","p":"25","id":"b1-058"},{"type":"mcq","ch":"ch2","art":8,"q":"الاختصاص بنظر طلب توثيق (إثبات) الزواج غير الموثق منعقد لـ:","opts":["المحكمة العامة دائمًا","محكمة الأحوال الشخصية","كتابة العدل","المأذون"],"a":1,"why":"كما في المادة (الثالثة والثلاثين) من نظام المرافعات الشرعية.","src":"والاختصاص في مثل هذا التوثيق منعقد لمحكمة الأحوال الشخصية كما هو نص المادة (الثالثة والثلاثون) من نظام المرافعات الشرعية","p":"28","id":"b1-059"},{"type":"mcq","ch":"ch2","art":9,"q":"يُمنع توثيق عقد الزواج لمن هو دون:","opts":["خمسة عشر عامًا","سبعة عشر عامًا","ثمانية عشر عامًا","واحد وعشرين عامًا"],"a":2,"why":"نص المادة التاسعة.","src":"يمنع توثيق عقد الزواج لمن هو دون (ثمانية عشر) عامًا","p":"29","id":"b1-060"},{"type":"tf","ch":"ch2","art":9,"q":"للمحكمة أن تأذن بزواج من هو دون الثامنة عشرة ذكرًا كان أو أنثى إذا كان بالغًا، بعد التحقق من مصلحته.","a":true,"why":"نص المادة التاسعة.","src":"وللمحكمة أن تأذن بزواج من هو دون ذلك ذكرًا كان أو أنثى إذا كان بالغًا، بعد التحقق من مصلحته في هذا الزواج","p":"29","id":"b1-061"},{"type":"mcq","ch":"ch2","art":9,"q":"بُني منع توثيق زواج من دون الثامنة عشرة على دليل:","opts":["القياس","الاستصلاح","الإجماع","الاستصحاب"],"a":1,"why":"وهي المصلحة التي يراها ولي الأمر.","src":"وهذا الرأي جاء مبنيًّا على دليل الاستصلاح، وهي المصلحة التي يراها ولي الأمر","p":"29","id":"b1-062"},{"type":"mcq","ch":"ch2","art":9,"q":"المصلحة المرسلة هي كل منفعة داخلة في مقاصد الشارع الخمسة:","opts":["لها شاهد بالاعتبار","لها شاهد بالإلغاء","دون أن يكون لها شاهد بالاعتبار أو الإلغاء","ثبتت بالإجماع"],"a":2,"why":"تعريف الحاشية.","src":"كل منفعة داخلة في مقاصد الشارع الخمسة - وهي: حفظ الدين، والنفس، والعقل، والمال، والنسل - دون أن يكون لها شاهد بالاعتبار أو الإلغاء","p":"29","id":"b1-063"},{"type":"mcq","ch":"ch2","art":9,"q":"من العلامات التي تختص بها الأنثى في البلوغ:","opts":["خروج المني","نبات الشعر الخشن","الحيض والحمل","بلوغ خمس عشرة سنة"],"a":2,"why":"الثلاث الأخرى علامات مشتركة.","src":"ثانيا: تزيد الأنثى وتختص بعلامتين هما: 1 - الحيض، 2 - والحمل","p":"30","id":"b1-064"},{"type":"mcq","ch":"ch2","art":9,"q":"سن البلوغ للغلام والجارية عند الشافعي وأبي يوسف ومحمد:","opts":["خمس عشرة سنة","سبع عشرة سنة","ثماني عشرة سنة","اثنتا عشرة سنة"],"a":0,"why":"وعند أبي حنيفة ثماني عشرة للغلام وسبع عشرة للجارية.","src":"بلوغ خمس عشرة سنة للغلام والجارية، عند الشافعي، وأبي يوسف ومحمد، وابن وهب من المالكية","p":"30","id":"b1-065"},{"type":"tf","ch":"ch2","art":9,"q":"زواج من هم دون الثامنة عشرة باطل عند جمهور أهل العلم.","a":false,"why":"هو صحيح عند الجمهور، والمادة منعت التوثيق فقط سياسةً شرعية.","src":"ذلك أن زواج من هم دون الثامنة عشرة صحيح عند جمهور أهل العلم، لكن منع التوثيق مما يحمل الناس على تركه","p":"31","id":"b1-066"},{"type":"mcq","ch":"ch2","art":9,"q":"تثبت مصلحة زواج من دون الثامنة عشرة بموجب:","opts":["تقرير طبي فقط","تقرير طبي، وتقريرين (نفسي، واجتماعي)، وللقاضي الاكتفاء بأحد الأخيرين إذا تضمن إيضاح التكافؤ","تقرير اجتماعي فقط","شهادة الولي والأم"],"a":1,"why":"هذا ما بينته اللائحة.","src":"- تقرير طبي. - تقريران: (نفسي، واجتماعي). وللقاضي الاكتفاء بأحدهما إذا تضمن التقرير المكتفى به إيضاحاً لمدى التكافؤ النفسي والاجتماعي للراغبين في الزواج.","p":"30–31","id":"b1-067"},{"type":"tf","ch":"ch2","art":9,"q":"يجوز أن تقدّم والدةُ الراغب في الزواج طلبَ الإذن بزواج من دون الثامنة عشرة.","a":true,"why":"الشرط الرابع من اللائحة.","src":"أن يكون طلب الإذن بالزواج مقدماً من الشاب أو الفتاة (الراغبين في الزواج)، أو وليهما الشرعي، أو والدة أي منهما.","p":"31","id":"b1-068"},{"type":"mcq","ch":"ch2","art":10,"q":"يكتسب من تزوج وفق المادة التاسعة أهلية التقاضي في كل ما له علاقة بالزواج وآثاره بشرط:","opts":["بلوغ الثامنة عشرة","أن يكون عاقلًا","إذن الولي","توثيق العقد لدى المأذون"],"a":1,"why":"نص المادة العاشرة.","src":"يكتسب من تزوج وفق حكم المادة (التاسعة) من هذا النظام أهلية التقاضي في كل ما له علاقة بالزواج وآثاره إذا كان عاقلاً","p":"31","id":"b1-069"},{"type":"mcq","ch":"ch2","art":11,"q":"أيٌّ مما يلي ليس من شروط إذن المحكمة بزواج المجنون أو المعتوه في المادة الحادية عشرة؟","opts":["أن يقدم الولي تقريرًا طبيًّا معتمدًا","أن يقبل الطرف الآخر بعد اطلاعه على حالته","أن يكون في الزواج مصلحة له","أن يوافق المجنون أو المعتوه نفسه أمام المحكمة"],"a":3,"why":"الشروط ثلاثة ليس منها موافقته هو.","src":"1 - أن يقدم الولي تقريرًا طبيًّا معتمدًا عن حالة الجنون أو العته. 2 - أن يقبل الطرف الآخر في عقد الزواج بعد اطلاعه على حالة المجنون أو المعتوه. 3 - أن يكون في هذا الزواج مصلحة للمجنون أو المعتوه","p":"32","id":"b1-070"},{"type":"mcq","ch":"ch2","art":11,"q":"يكون الجنون مطبقًا إذا كان:","opts":["حاصلًا في أكثر السنة","مصحوبًا بهيجان","منذ الولادة","مثبتًا بتقرير طبي"],"a":0,"why":"وما دون ذلك فغير مطبق.","src":"وإن كان حاصلًا في أكثر السنة فمطبق، وما دونها فغير مطبق","p":"33","id":"b1-071"},{"type":"tf","ch":"ch2","art":11,"q":"العقل شرط في الزواج باتفاق أهل العلم.","a":false,"why":"العقل ليس شرطًا للزواج بالاتفاق.","src":"إن العقل ليس شرطًا للزواج بالاتفاق بين أهل العلم","p":"33","id":"b1-072"},{"type":"mcq","ch":"ch2","art":11,"q":"العته هو:","opts":["اختلال في العقل ينشأ عنه اضطراب أو هيجان","ضعف في العقل ينشأ عنه ضعف في الوعي والإدراك","فقدان الذاكرة","العجز عن الوطء"],"a":1,"why":"الخيار الأول تعريف الجنون.","src":"أما العته فهو: ضعفٌ في العقل ينشأ عنه ضعفٌ في الوعي والإدراك","p":"33","id":"b1-073"},{"type":"mcq","ch":"ch2","art":11,"q":"الذي يقرر مصلحة زواج المجنون أو المعتوه:","opts":["الولي","الطبيب المعالج","قاضي الموضوع، وله الاستعانة بمن يراه","المأذون"],"a":2,"why":"نص الكتاب.","src":"ومن يقرر المصلحة من عدمها هو قاضي الموضوع، وله الاستعانة في سبيل معرفة ذلك بمن يراه.","p":"34","id":"b1-074"},{"type":"essay","ch":"ch2","art":6,"q":"تكلّم عن الأحكام التكليفية للنكاح كما بيّنها الكتاب.","a":"ذهب الفقهاء إلى أن النكاح تجري عليه الأحكام التكليفية الخمسة:\n1. الواجب: على من يخاف على نفسه الزنا إذا تركه، لأنه طريق لإعفاف نفسه من الحرام، وقال ابن تيمية: إن احتاج إليه وخاف العنت بتركه قدّمه على الحج الواجب.\n2. المستحب: مع وجود الشهوة ووجود تكاليف الزواج، لاشتماله على مصالح كثيرة للرجال والنساء.\n3. المباح: مع عدم الشهوة والميل إليه، أو إذا خاف العجز عن الإيفاء بموجبه، كالعنّين والكبير.\n4. المكروه: قد يكون في الحالة الثالثة، لأنه يفوّت على المرأة الغرض الصحيح من النكاح وهو إعفافها، ويضر بها.\n5. المحرم: على المسلم في دار كفار حربيين إذا لم تكن به ضرورة للنكاح، على الصحيح، لتعريض ذريته للخطر؛ «وكذا إن أضرَّ بالمرأة لعجزه عن الوطء أو مطلق النفقة، أو إلا من حرام»؛ وكذا إن تيقن الجور.","src":"ذهب الفقهاء إلى أن النكاح تجري عليه الأحكام التكليفية الخمسة فيكون: واجبًا - أو فرضًا -، أو مستحبًا، أو مباحًا، أو حرامًا، أو مكروهًا","p":"21–23","id":"b1-075"},{"type":"essay","ch":"ch2","art":9,"q":"ما شروط الإذن بتوثيق زواج من هو دون الثامنة عشرة؟ اذكر ما ورد في المادة وما زادته اللائحة.","a":"منعت المادة التاسعة توثيق عقد الزواج لمن هو دون (ثمانية عشر) عامًا، وأجازت للمحكمة الإذن بزواجه ذكرًا كان أو أنثى بشروط:\n1. أن يكون الإذن من المحكمة المختصة، وهي محكمة الأحوال الشخصية.\n2. بلوغ الزوجين البلوغ الشرعي بإحدى علاماته: المشتركة (خروج المني، والسن، ونبات الشعر الخشن)، والخاصة بالأنثى (الحيض، والحمل).\n3. التحقق من مصلحة الزواج: بلوغ الراغب واكتماله الجسمي والعقلي وألا يكون عليه خطر، ويثبت بتقرير طبي، وتقريرين نفسي واجتماعي، وللقاضي الاكتفاء بأحدهما إذا أوضح التكافؤ.\nوزادت اللائحة التنفيذية:\n4. أن يقدَّم طلب الإذن من الشاب أو الفتاة، أو وليهما الشرعي، أو والدة أي منهما.\n5. موافقة الراغب في الزواج بإقراره الصريح أمام المحكمة، وسماع ما لدى الأم، فإن تعذر سماعها قررت المحكمة ذلك وأذنت.\nوتسري هذه الأحكام على زواج السعودي بغير سعودية والسعودية بغير سعودي إذا أُبرم العقد داخل المملكة.","src":"فاستثنى من عدم إكمال سن الثامنة عشر لتوثيق عقد زواجهم ثلاثة شروط هي ... وقد جاء في اللائحة التنفيذية مزيد توضيح واشتراطات أخرى","p":"29–31","id":"b1-076"},{"type":"essay","ch":"ch2","art":6,"q":"اذكر أهداف الزواج وحِكَمه كما عدّدها الكتاب.","a":"1. بقاء النسل البشري وتكثير عدد المسلمين.\n2. تكوين الأسرة الصالحة التي هي نواة المجتمع؛ فالزوج يكدّ وينفق، والزوجة تربي الأطفال وتدبر المنزل.\n3. إعفاف الفروج وإحصانها وصيانتها من الاستمتاع المحرم.\n4. قيام الزوج على المرأة بالرعاية والإنفاق.\n5. حصول السكن والأنس بين الزوجين والراحة النفسية.\n6. حماية المجتمعات البشرية من الوقوع في الفواحش الخلقية.\n7. حفظ الأنساب وترابط القرابة والأرحام، وقيام الأسر التي تسودها الرحمة والصلة والنصرة على الحق.","src":"شرع الله الزواج لما فيه من المصالح والفوائد والحِكَم التي تعود على الأفراد والمجتمعات، ومن هذه الفوائد والأهداف والحكم ما يلي","p":"20–21","id":"b1-077"},{"type":"essay","ch":"ch2","art":7,"q":"عرّف الخلوة في النظام، واشرح قيدها ومتى تنتفي، واذكر أثرها في المهر.","a":"الخلوة في النظام (المادة السابعة): انفراد الزوجين في مكان ليس عندهما من يميز.\n- فإن كان معهما مميز لم تكن خلوة، وإن كان غير مميز فلا اعتبار به، ويعد انفرادهما بوجوده خلوة لأنه لا يعقل ما يحدث بينهما.\n- وعدّت اللائحة التنفيذية (المادة الأولى) من صور انتفاء الخلوة أن يشاهدهما مميز، فالمشاهدة في حكم الوجود معهما.\n- وسن التمييز في نظام المعاملات المدنية إتمام السابعة.\n- ومن أحكامها أن المهر المسمى كاملًا أو مهر المثل يتأكد بالدخول أو الخلوة أو وفاة أحد الزوجين (المادة 40/2).","src":"الخلوة - في سبيل تطبيق هذا النظام - انفراد الزوجين في مكان ليس عندهما من يميز","p":"23–24","id":"b1-078"},{"type":"essay","ch":"ch2","art":8,"q":"تكلّم عن توثيق عقد الزواج في المادة الثامنة: حكمه، ومن يتولاه، وأهم إجراءاته.","a":"- حكمه: يجب توثيق عقد الزواج، وعلى الزوجين أو أحدهما توثيقه وفق الأحكام المنظمة (8/1)، لأنهما المستفيدان الأولان منه.\n- يجوز لكل ذي مصلحة طلب إثبات عقد الزواج غير الموثق (8/2)، والاختصاص لمحكمة الأحوال الشخصية.\n- يوثق عقد زواج غير المسلم لدى المختص بالتوثيق (8/3)، وبينت اللائحة أنه يوثق بغير المسلمة وفق نظام التوثيق سواء اتحدت جنسيتهما أم اختلفت.\n- من يتولاه: القاضي في محكمة الأحوال الشخصية أو المحكمة العامة حيث لا توجد محكمة متخصصة، والمعمول به أنه يعقد النكاح الذي أحد أطرافه غير سعودي؛ ومأذون الأنكحة إذا كان الطرفان سعوديين أو كلاهما غير سعودي.\n- من إجراءاته: التحقق من الأركان والشروط وانتفاء الموانع وتوفر تقرير طبي ساري المفعول (ستة أشهر)؛ والتحقق من أن الولي غير الأب أقرب ولي بصك حصر الإرث؛ والتأكد من صلاحية الوكيل؛ وإجراء العقد من المحكمة عند عدم الولي أو عضله؛ والاعتماد على صك الطلاق للمطلقة وصك حصر الورثة للمتوفى عنها؛ وتدوين البيانات في ناجز وأخذ الموافقة إلكترونيًا للزوج والزوجة والولي والشاهدين.","src":"1 - يجب توثيق عقد الزواج ... 2 - يجوز لكل ذي مصلحة طلب إثبات عقد الزواج غير الموثق. 3 - يوثق عقد زواج غير المسلم لدى المختص بالتوثيق","p":"25–28","id":"b1-079"},{"type":"essay","ch":"ch2","art":11,"q":"ما شروط زواج المجنون أو المعتوه؟ وما الفرق بين الجنون والعته؟","a":"أجازت المادة الحادية عشرة للمحكمة الإذن بزواج المجنون أو المعتوه بطلب ولي تزويجه بثلاثة شروط:\n1. أن يقدم الولي تقريرًا طبيًا معتمدًا عن حالة الجنون أو العته، صادرًا من جهة معتمدة كمستشفيات وزارة الصحة.\n2. أن يقبل الطرف الآخر بعد اطلاعه على حالته، تأكيدًا لشرط الرضا.\n3. أن يكون في الزواج مصلحة له، ويقررها قاضي الموضوع وله الاستعانة بمن يراه.\nوالفرق: الجنون اختلال في العقل ينشأ عنه اضطراب أو هيجان، فإن كان في أكثر السنة فمطبق وإلا فغير مطبق؛ والعته ضعف في العقل ينشأ عنه ضعف في الوعي والإدراك. والعقل ليس شرطًا للزواج بالاتفاق.","src":"للمحكمة أن تأذن بزواج المجنون أو المعتوه بناء على طلب ولي تزويجه، بعد توافر الشروط الآتية","p":"32–34","id":"b1-080"},{"id":"b2-001","type":"mcq","ch":"ch3","part":"b2","art":12,"q":"أركان عقد الزواج في النظام:","opts":["الزوجان، والإيجاب والقبول","الزوجان، والولي، والشاهدان","الصيغة، والولي، والمهر","الإيجاب والقبول فقط"],"a":0,"why":"نصت المادة 12 على ركنين: الزوجين، والإيجاب والقبول.","src":"أركان عقد الزواج هي: 1 - الزوجان، وهما: الرجل والمرأة. 2 - الإيجاب والقبول","p":"35"},{"id":"b2-002","type":"mcq","ch":"ch3","part":"b2","art":12,"q":"أخذ المنظم في أركان النكاح بمذهب:","opts":["الحنفية","المالكية","الشافعية","الحنابلة"],"a":3,"why":"الحنابلة: زوجان، وإيجاب، وقبول، وبه أخذ المنظم.","src":"وذهب الحنابلة إلى أن أركانه ثلاثة: زوجان، والإيجاب، والقبول، وبه أخذ المنظم هنا","p":"37"},{"id":"b2-003","type":"tf","ch":"ch3","part":"b2","art":12,"q":"يرى الشافعية أن أركان النكاح خمسة: صيغة، وزوج، وزوجة، وشاهدان، وولي.","a":true,"why":"هذا مذهب الشافعية كما نقله الكتاب.","src":"وذهب الشافعية إلى أن أركانه خمسة: صيغة، وزوج، وزوجة، وشاهدان، وولي","p":"37"},{"id":"b2-004","type":"tf","ch":"ch3","part":"b2","art":12,"q":"ذهب الحنفية إلى أن أركان النكاح: ولي، ومحل، وصيغة.","a":false,"why":"هذا مذهب المالكية، أما الحنفية فركن النكاح عندهم الإيجاب والقبول فقط.","src":"فذهب الحنفية إلى أن ركن النكاح هو الإيجاب والقبول فقط","p":"37"},{"id":"b2-005","type":"mcq","ch":"ch3","part":"b2","art":12,"q":"الركن في الاصطلاح:","opts":["جانب الشيء الأقوى","جزء الماهية، وهو ما يدخل في الشيء ولا يقوم إلا به","ما يلزم من عدمه العدم ولا يلزم من وجوده وجود","ما يشترطه أحد العاقدين"],"a":1,"why":"أما «جانب الشيء الأقوى» فمعناه اللغوي، والخيار الثالث تعريف الشرط.","src":"وفي الاصطلاح: عبارة عن جزء الماهية، والمراد بالماهية حقيقة الشيء، أو بعبارة أخرى: هو ما يدخل في الشيء ولا يقوم إلا به","p":"35"},{"id":"b2-006","type":"tf","ch":"ch3","part":"b2","art":12,"q":"الإيجاب هو اللفظ الصادر من الزوج أو من يقوم مقامه.","a":false,"why":"الإيجاب من الولي أو من يقوم مقامه، والقبول من الزوج أو من يقوم مقامه.","src":"فالإيجاب هو: اللفظ الصادر من الولي أو من يقوم مقامه","p":"36"},{"id":"b2-007","type":"mcq","ch":"ch3","part":"b2","art":13,"q":"عدد شروط صحة عقد الزواج في المادة الثالثة عشرة:","opts":["ثلاثة","أربعة","خمسة","ستة"],"a":2,"why":"تعيين الزوجين، ورضاهما، والإيجاب من الولي، وشهادة شاهدين، وألا تكون المرأة محرمة عليه.","src":"وقد بينت المادة أن شروط صحة عقد الزواج خمسة","p":"39"},{"id":"b2-008","type":"mcq","ch":"ch3","part":"b2","art":13,"q":"ليس من شروط صحة عقد الزواج في النظام:","opts":["تعيين الزوجين","رضا الزوجين","كفاءة الرجل للمرأة","شهادة شاهدين"],"a":2,"why":"الكفاءة شرط للزوم العقد لا لصحته (م14).","src":"كفاءة الرجل للمرأة شرط للزوم عقد الزواج لا لصحته","p":"44"},{"id":"b2-009","type":"tf","ch":"ch3","part":"b2","art":13,"q":"الشروط الجعلية من وضع الشارع، ولا محل فيها لاختيار المكلفين.","a":false,"why":"هذا وصف الشروط الشرعية، أما الجعلية فيشترطها أحد الخاطبين ويتراضيان عليها.","src":"النوع الأول: الشروط الشرعية، وهي شروط صحة عقد الزواج ... وهي من وضع الشارع ولا محل فيها للاختيار من المكلفين","p":"38"},{"id":"b2-010","type":"mcq","ch":"ch3","part":"b2","art":13,"q":"الفرق بين الركن والشرط في الزواج:","opts":["الركن جزء من الزواج وحقيقته، والشرط خارج عن ماهيته","الركن يجوز تركه بخلاف الشرط","الشرط جزء من الماهية والركن خارج عنها","لا فرق بينهما"],"a":0,"why":"كلاهما لا يتم الشيء إلا به، لكن الركن داخل في الماهية والشرط خارج عنها.","src":"أن الركن في الزواج هو جزء من الزواج وحقيقته، بخلاف الشرط الذي هو خارج عن ماهية الزواج وحقيقته","p":"39"},{"id":"b2-011","type":"tf","ch":"ch3","part":"b2","art":13,"q":"يكفي في تعيين الزوجة أن يقول الولي: زوجتك بنتي، ولو كان له عدة بنات.","a":false,"why":"لا بد من تحديدها على وجه لا يلتبس بغيرها، بالإشارة أو التسمية أو الوصف.","src":"فلا يكفي أن يقول: زوجتك بنتي؛ إذا كان له عدة بنات","p":"39"},{"id":"b2-012","type":"mcq","ch":"ch3","part":"b2","art":13,"q":"الأيم في حديث «لا تنكح الأيم حتى تستأمر» هي:","opts":["البكر البالغة","المرأة التي مات عنها زوجها أو طلقها","الصغيرة","المرأة التي لا ولي لها"],"a":1,"why":"فسرها الكتاب بذلك، ومعنى تستأمر: يطلب الأمر منها.","src":"والأيم هنا هي المرأة التي مات عنها زوجها أو طلقها","p":"40"},{"id":"b2-013","type":"tf","ch":"ch3","part":"b2","art":13,"q":"ذكر الكتاب في شرح المادة الثالثة عشرة أن المرأة إذا زوجت نفسها بدون إيجاب وليها فنكاحها باطل، بناء على المادة الثانية والثلاثين.","a":true,"why":"هذا نص الكتاب في ص40. وتنبه: نقل الكتاب في شرح المادة 34 عن اللائحة أن الزواج بلا إيجاب من الولي أو بلا شهود تترتب عليه آثار الزواج الفاسد (ص97).","src":"فلو زوجت المرأة نفسها بدون إيجاب وليها؛ فنكاحها باطل؛ بناء على المادة الثانية والثلاثين","p":"40"},{"id":"b2-014","type":"mcq","ch":"ch3","part":"b2","art":13,"q":"ذهب إلى عدم اشتراط الولي في النكاح:","opts":["الحنفية","المالكية","الشافعية","الحنابلة"],"a":0,"why":"واستدلوا بالقياس على عقود البيع والشراء والإجارة، وبحديث «الأيم أحق بنفسها من وليها».","src":"وذهب فقهاء الأحناف إلى عدم اشتراطه","p":"41"},{"id":"b2-015","type":"tf","ch":"ch3","part":"b2","art":13,"q":"مع أن الحنفية لا يشترطون الولي، فإنهم أعطوه حق إيقاف العقد وإبطاله إذا لم يكن الزوج كفؤًا.","a":true,"why":"والأصل عندهم أن يباشر الولي العقد.","src":"ومع ذلك فإنهم أعطوا الولي حق إيقاف العقد وإبطاله إذا لم يكن الزوج كفؤا","p":"41"},{"id":"b2-016","type":"tf","ch":"ch3","part":"b2","art":13,"q":"لم يشترط المالكية الشهود لصحة النكاح، وإنما هو عندهم شرط كمال.","a":true,"why":"ذكره الكتاب في حاشيته على شرط شهادة الشاهدين.","src":"ولم يشترطه المالكية للصحة فيصح عندهم دون شهود، وإنما هو شرط كمال","p":"42"},{"id":"b2-017","type":"mcq","ch":"ch3","part":"b2","art":13,"q":"المحرمات على سبيل التأبيد هن:","opts":["من كان سبب تحريمهن وصفًا غير قابل للزوال","من كان سبب تحريمهن أمرًا قابلًا للزوال","المعتدات من غيره","أخوات الزوجة"],"a":0,"why":"كالأمومة والبنوة والأخوة والعمومة والمصاهرة والرضاع.","src":"وهن اللاتي كان سبب تحريمهن وصفا غير قابل للزوال","p":"43"},{"id":"b2-018","type":"mcq","ch":"ch3","part":"b2","art":13,"q":"من أمثلة المحرمات تحريمًا مؤقتًا التي ذكرها الكتاب:","opts":["الأم","أخت الزوجة","العمة","البنت"],"a":1,"why":"تزول الحرمة بزوال سببها، أما الأم والعمة والبنت فمحرمات على التأبيد.","src":"كأن تكون المرأة أختا لزوجته، أو تكون زوجة للغير، أو مشركة غير ذات دين سماوي","p":"43"},{"id":"b2-019","type":"essay","ch":"ch3","part":"b2","art":13,"q":"اذكر شروط صحة عقد الزواج، ثم اشرح شرط الإيجاب من الولي مع أدلة الجمهور وقول الحنفية.","a":"شروط الصحة خمسة (م13):\n1. تعيين الزوجين.\n2. رضاهما.\n3. الإيجاب من الولي.\n4. شهادة شاهدين.\n5. ألا تكون المرأة محرمة على الرجل تحريمًا مؤبدًا أو مؤقتًا.\n\nالولي: رجل يتمتع بأهلية التزويج، موافق للمرأة في الدين، من عصباتها مرتبين كترتيب الإرث، أو السلطان عند انعدامهم. فلو زوجت المرأة نفسها بلا إيجاب وليها فنكاحها باطل (م32).\n\nواشتراط الولي مذهب الجمهور، ومن أدلتهم:\n- ﴿وأنكحوا الأيامى منكم﴾.\n- ﴿ولا تنكحوا المشركين حتى يؤمنوا﴾، والخطاب فيها للأولياء.\n- ﴿فلا تعضلوهن﴾، ولو لم يكن الولي معتبرًا لما كان لعضله معنى.\n- حديث «لا نكاح إلا بولي»، وحديث «أيما امرأة لم ينكحها الولي فنكاحها باطل».\n\nوخالف الحنفية فلم يشترطوه:\n- قياسًا على البيع والإجارة.\n- ولحديث «الأيم أحق بنفسها من وليها».\nوأجاب الجمهور بأن المراد أن الثيب أحق بنفسها في تعيين من تريد. ومع ذلك أعطى الحنفية الولي حق إبطال العقد إذا لم يكن الزوج كفؤًا.","p":"38–41"},{"id":"b2-020","type":"essay","ch":"ch3","part":"b2","art":13,"q":"ما الحكمة من اشتراط الولاية في الزواج كما ذكرها الكتاب؟","a":"1. صيانة المرأة عما يجرح حياءها، كرغبتها في بعض الشروط أو سؤالها عن أمور خاصة بالزوج.\n2. حمايتها من الانسياق وراء عاطفتها، فقد تنخدع بوعود الزوج وكلامه المعسول.\n3. مزيد من الإعلان عن النكاح، ولذلك شرع الولي والشهود والوليمة والتهنئة.\n4. إشعار الزوج بتضامن الأسرة مع ابنتهم ووقوفهم معها، مما يوفر لها حماية.\n5. أن الزواج ليس شأنًا خاصًا بالمرأة دون سواها؛ فالأب والإخوة يهمهم أن تسعد، ويقلقهم تعثرها، فيكون عليهم الغرم.","p":"42"},{"id":"b2-021","type":"tf","ch":"ch3","part":"b2","art":14,"q":"كفاءة الرجل للمرأة شرط لصحة عقد الزواج.","a":false,"why":"هي شرط للزوم العقد لا لصحته.","src":"كفاءة الرجل للمرأة شرط للزوم عقد الزواج لا لصحته","p":"44"},{"id":"b2-022","type":"mcq","ch":"ch3","part":"b2","art":14,"q":"العبرة في كفاءة الرجل في النظام:","opts":["بالنسب والمال","حين العقد بصلاح دينه، وكل ما قام العرف على اعتباره","بالحرية والصناعة","بالشهادة والوظيفة"],"a":1,"why":"نص الفقرة الثانية من المادة 14.","src":"العبرة في كفاءة الرجل حين العقد بصلاح دينه، وكل ما قام العرف على اعتباره","p":"44"},{"id":"b2-023","type":"mcq","ch":"ch3","part":"b2","art":14,"q":"حق الاعتراض على عقد الزواج لانعدام الكفاءة لكل ذي مصلحة من الأقارب حتى:","opts":["الدرجة الأولى","الدرجة الثانية","الدرجة الثالثة","الدرجة الرابعة"],"a":2,"why":"نص الفقرة الثالثة، وتقدر المحكمة ذلك.","src":"لكل ذي مصلحة من الأقارب - حتى الدرجة الثالثة - يتأثر بانعدام الكفاءة، الحق في الاعتراض على عقد الزواج","p":"44"},{"id":"b2-024","type":"mcq","ch":"ch3","part":"b2","art":14,"q":"الدرجة الثالثة من القرابة بحسب لائحة نظام المرافعات الشرعية:","opts":["الأبوة والبنوة","الأخوة وأبناء الأبناء","العمومة وأبناء الإخوة","الأخوال وأبناؤهم"],"a":2,"why":"الأولى: الأبوة والبنوة، والثانية: الأخوة وأبناء الأبناء.","src":"الدرجة الثالثة: العمومة، وأبناء الإخوة","p":"49"},{"id":"b2-025","type":"tf","ch":"ch3","part":"b2","art":14,"q":"إذا انتفت الكفاءة فالنكاح صحيح، ولمن لم يرض من المرأة أو أوليائها فسخه، ولا يفسخه إلا القاضي.","a":true,"why":"لأن الكفاءة شرط لزوم، والفسخ في النظام للقريب حتى الدرجة الثالثة.","src":"فلو زوجت امرأة بغير كفئها فلمن لم يرض بذلك من المرأة أو أوليائها فسخ النكاح، وفي النظام هنا يكون حق الفسخ للقريب حتى الدرجة الثالثة، ولا يفسخه إلا القاضي","p":"45"},{"id":"b2-026","type":"mcq","ch":"ch3","part":"b2","art":14,"q":"استدل الكتاب على أن الكفاءة ليست شرطًا في صحة النكاح بـ:","opts":["أمر النبي ﷺ فاطمة بنت قيس أن تنكح أسامة بن زيد","حديث بريرة","قصة معقل بن يسار","حديث «لا نكاح إلا بولي»"],"a":0,"why":"ومن المعقول قاعدة «العادة محكمة».","src":"ويدل لذلك أمر النبي ﷺ لفاطمة بنت قيس رضي الله عنها أن تنكح أسامة بن زيد رضي الله عنهما، فنكحها بأمره","p":"45"},{"id":"b2-027","type":"tf","ch":"ch3","part":"b2","art":14,"q":"الكفاءة المقصودة في النظام هي كفاءة المرأة للرجل.","a":false,"why":"المقصود كفاءة الرجل للمرأة، لأن الرجل يملك الطلاق ويسبق لاختيارها.","src":"وغني عن البيان أن الحديث هنا هو في كفاءة الرجل للمرأة وليس العكس","p":"44"},{"id":"b2-028","type":"tf","ch":"ch3","part":"b2","art":14,"q":"نص المنظم صراحة على اعتبار النسب والحرية والصناعة واليسار في الكفاءة.","a":false,"why":"لم يشر إليها بالنص، وإنما أشار إلى اعتبار العرف.","src":"والمنظم لم يشر إلى هذه الأربعة الأخيرة بالنص ولكنه أشار إلى اعتبار العرف في كل موطن","p":"47"},{"id":"b2-029","type":"tf","ch":"ch3","part":"b2","art":14,"q":"إذا كان الزوج كفؤًا وقت العقد ثم طرأ عليه ما يجعله غير كفء كشرب الخمر، فللزوجة طلب الفسخ.","a":true,"why":"لأنه لم يعد مكافئًا لها في دينها، ودليله حديث بريرة.","src":"الجواب، نعم؛ لأنه في هذه الحالة ليس مكافئا لها في دينها","p":"48"},{"id":"b2-030","type":"mcq","ch":"ch3","part":"b2","art":14,"q":"إذا غرر الزوج بزوجته في كفاءة معينة كشهادة أو وظيفة، ثم بان خلافها:","opts":["لا أثر لذلك","لهم فسخ عقد الزواج لهذا التغرير","يبطل العقد تلقائيًا","يلزمه مهر المثل فقط"],"a":1,"why":"نص عليه الكتاب.","src":"ولابد أن يعلم أنه إذا غرر الزوج بزوجته وأهلها في اعتبار كفاءة معينة كشهادة أو وظيفة أو غيرها، ثم بان بخلافها، أن لهم فسخ عقد الزواج لهذا التغرير","p":"48"},{"id":"b2-031","type":"essay","ch":"ch3","part":"b2","art":14,"q":"بيّن حكم الكفاءة في النظام، والكفاءة المعتبرة، وشروط الاعتراض على عقد الزواج لانعدامها.","a":"حكمها: الكفاءة شرط للزوم العقد لا لصحته (م14/1).\n- فإن انتفت صح النكاح، ولمن لم يرض فسخه، وفي النظام للقريب حتى الدرجة الثالثة، ولا يفسخه إلا القاضي.\n- ودليله أمر النبي ﷺ فاطمة بنت قيس أن تنكح أسامة بن زيد، وقاعدة «العادة محكمة».\n- ويرى بعض العلماء أنها شرط صحة، وهو رواية عن أحمد.\n\nالكفاءة المعتبرة: صلاح الدين حين العقد، وما قام العرف على اعتباره (م14/2).\n\nشروط الاعتراض ثلاثة:\n1. أن يكون للمعترض مصلحة.\n2. أن يكون قريبًا حتى الدرجة الثالثة:\n- الأولى: الأبوة والبنوة.\n- الثانية: الأخوة وأبناء الأبناء.\n- الثالثة: العمومة وأبناء الإخوة.\n3. أن تقدير المصلحة عائد إلى المحكمة.","p":"44–49"},{"id":"b2-032","type":"mcq","ch":"ch3","part":"b2","art":15,"q":"ينعقد الزواج بالإشارة المفهومة في النظام:","opts":["مطلقًا","عند العجز عن النطق وحده","عند العجز عن النطق والكتابة","لا ينعقد بها أبدًا"],"a":2,"why":"الكتابة عند العجز عن النطق، والإشارة عند العجز عن النطق والكتابة.","src":"وبالإشارة المفهومة عند العجز عن النطق والكتابة","p":"49"},{"id":"b2-033","type":"tf","ch":"ch3","part":"b2","art":15,"q":"يفهم من عبارة المنظم أن الأخذ بالإشارة المفهومة يشترط فيه العجز عن النطق والكتابة، وهو مذهب الحنفية.","a":true,"why":"أما الجمهور فيجوزونها ولو كان قادرًا على الكتابة.","src":"ويفهم من عبارة المنظم هنا أنه لابد في الأخذ بالإشارة المفهومة أن يكون هناك عجز عن النطق والكتابة وهو مذهب الحنفية","p":"51"},{"id":"b2-034","type":"tf","ch":"ch3","part":"b2","art":15,"q":"اختار ابن تيمية وابن القيم أن النكاح لا ينعقد إلا بلفظ الإنكاح أو التزويج.","a":false,"why":"اختارا أنه ينعقد بكل لفظ يدل عليه.","src":"وقد اختار شيخ الإسلام ابن تيمية، وتلميذه ابن القيم أن النكاح ينعقد بكل لفظ يدل عليه، ولا يقتصر على لفظ الإنكاح والتزويج","p":"50"},{"id":"b2-035","type":"mcq","ch":"ch3","part":"b2","art":15,"q":"إذا كان الطرفان لا يحسنان العربية واختلفت لغتهما:","opts":["لا يصح العقد إلا بالعربية","يصح باللغة التي يحسنها كل منهما إذا كان صريحًا فيها","لا يصح إلا بالكتابة","يؤجل العقد"],"a":1,"why":"ذكره الكتاب نقلًا عن اللائحة التنفيذية.","src":"فإن اختلفت لغتهما صح باللغة التي يحسنها كل منهما إذا كان صريحا فيها","p":"50"},{"id":"b2-036","type":"mcq","ch":"ch3","part":"b2","art":15,"q":"«الخط المرسوم على الوجه المعتاد، للدلالة على القصد والإرادة» تعريف:","opts":["اللفظ الصريح","الكتابة","الإشارة المفهومة","الإيجاب"],"a":1,"why":"وتكون الكتابة عند العجز عن النطق، كحال الأخرس.","src":"الكتابة: وهي الخط المرسوم على الوجه المعتاد، للدلالة على القصد والإرادة","p":"51"},{"id":"b2-037","type":"mcq","ch":"ch3","part":"b2","art":16,"q":"ليس من شروط الإيجاب والقبول في المادة السادسة عشرة:","opts":["التوافق صراحة","الاقتران في مجلس واحد حقيقة أو حكمًا","التنجيز","تقدم الإيجاب على القبول"],"a":3,"why":"لم يشترط المنظم أسبقية الإيجاب على القبول.","src":"ولم يشترط المنظم هنا أسبقية الإيجاب على القبول أو العكس","p":"52"},{"id":"b2-038","type":"tf","ch":"ch3","part":"b2","art":16,"q":"اشترط المنظم أسبقية الإيجاب على القبول، موافقًا المذهب الحنبلي.","a":false,"why":"اكتفى بالموافقة بينهما، وهو قول الجمهور بخلاف المذهب الحنبلي.","src":"وإنما اكتفى بالموافقة بينهما وهو قول جمهور أهل العلم بخلاف المذهب الحنبلي","p":"52"},{"id":"b2-039","type":"tf","ch":"ch3","part":"b2","art":16,"q":"إذا أبرم عقد الزواج بإحدى وسائل التقنية كالاتصال المرئي، عُدّ الإيجاب والقبول مقترنين في مجلس واحد حكمًا.","a":true,"why":"جاء ذلك في اللائحة التنفيذية، مع وجوب التأكد من الأطراف.","src":"إذا أبرم عقد الزواج بإحدى وسائل التقنية؛ فيعد الإيجاب والقبول في العقد مقترنين في مجلس واحد حكما، ويدخل في ذلك تواصلهم عبر الاتصال المرئي","p":"53"},{"id":"b2-040","type":"mcq","ch":"ch3","part":"b2","art":16,"q":"قال الولي: زوجتك ابنتي مريم، فقال الزوج: قبلت بعائشة زوجة لي، فالعقد:","opts":["صحيح","لا يصح لعدم الموافقة بين الإيجاب والقبول","صحيح موقوف على رضا عائشة","صحيح إن أعاده الولي"],"a":1,"why":"يشترط أن يكون الإيجاب والقبول متوافقين صراحة.","src":"أما لو قال قبلت بعائشة زوجة لي فليس هناك موافقة","p":"52"},{"id":"b2-041","type":"mcq","ch":"ch3","part":"b2","art":16,"q":"حكم قوله: «تزوجتك أول العام القادم»:","opts":["يصح في الحال","يصح عند حلول العام","لا يصح لا في الحال ولا عند حصول الزمن المضاف إليه","يصح إن رضي الولي"],"a":2,"why":"لأنه مضاف إلى المستقبل، والشرط أن تكون الصيغة منجزة.","src":"فمثل هذا العقد لا يصح لا في الحال ولا عند حصول الزمن المضاف إليه","p":"54"},{"id":"b2-042","type":"tf","ch":"ch3","part":"b2","art":16,"q":"إذا علقت المرأة القبول على رضا أبيها، فقبل أبوها في المجلس، صح العقد.","a":true,"why":"لأنه تعليق على أمر كائن موجود وقت العقد، فهو في حكم التنجيز.","src":"كما لو علقت المرأة القبول مثلا على رضا أبيها، فقبل أبوها في المجلس","p":"54"},{"id":"b2-043","type":"mcq","ch":"ch3","part":"b2","art":16,"q":"قاعدة «المجلس الواحد يجمع المتفرقات» قررها:","opts":["الحنفية","المالكية","الشافعية","الحنابلة"],"a":0,"why":"فما يوجد في آخر المجلس يعتبر كالذي يوجد في أوله.","src":"وعلى هذا قرر الحنفية قاعدة: المجلس الواحد يجمع المتفرقات","p":"53"},{"id":"b2-044","type":"tf","ch":"ch3","part":"b2","art":16,"q":"إذا فصل بين الإيجاب والقبول كلام أجنبي عن العقد، لم ينعقد حتى يعيد الموجب إيجابه.","a":true,"why":"وكذا إن انقطع المجلس بما يدل على الإعراض، أو بطلت أهلية الموجب قبل القبول.","src":"فإذا فصل بينهما بكلام أجنبي ... لم ينعقد العقد حتى يعيد الموجب إيجابه","p":"53"},{"id":"b2-045","type":"mcq","ch":"ch3","part":"b2","art":17,"q":"الولي الذي يلي الأب مباشرة في ترتيب الأولياء:","opts":["الجد لأب","وصي الأب","الابن","الأخ الشقيق"],"a":1,"why":"الأب، ثم وصيه، ثم الجد لأب وإن علا، ثم الابن.","src":"الأب، ثم وصيه، ثم الجد لأب وإن علا، ثم الابن","p":"54"},{"id":"b2-046","type":"mcq","ch":"ch3","part":"b2","art":17,"q":"أي الترتيبين صحيح في الولاية؟","opts":["الابن، ثم الجد لأب","الجد لأب، ثم الابن","الأخ لأب، ثم الأخ الشقيق","العم الشقيق، ثم ابن الأخ الشقيق"],"a":1,"why":"الجد لأب مقدم على الابن، والشقيق مقدم على الأخ لأب، وابن الأخ مقدم على العم.","src":"ثم الجد لأب وإن علا، ثم الابن، ثم ابنه وإن نزل، ثم الأخ الشقيق ثم الأخ لأب","p":"54"},{"id":"b2-047","type":"tf","ch":"ch3","part":"b2","art":17,"q":"جعل المنظم لذوي الأرحام ولاية التزويج بعد العصبة.","a":false,"why":"جعلها في العصبة فقط، وهو قول جمهور أهل العلم.","src":"ويلحظ هنا أن المنظم لم يجعل لذوي الأرحام ولاية التزويج بل جعلها في العصبة فقط وهو قول جمهور أهل العلم","p":"55"},{"id":"b2-048","type":"tf","ch":"ch3","part":"b2","art":17,"q":"إذا استوى الأولياء في الدرجة ولم تعين المرأة أحدهم، جاز تولي أي منهم عقد الزواج.","a":true,"why":"وإن عينت أحدهم تعين، ويجب تضمين العقد ما يثبت التعيين.","src":"إذا استوى الأولياء في الدرجة؛ تعين من عينته المرأة منهم، وإن لم تعين جاز تولي أي منهم عقد الزواج","p":"54"},{"id":"b2-049","type":"tf","ch":"ch3","part":"b2","art":17,"q":"للأب أن يزوج ابنته بغير رضاها.","a":false,"why":"ليس للولي ولو كان الأب أن يزوج موليته بغير رضاها.","src":"ليس للولي - ولو كان الأب - أن يزوج موليته بغير رضاها","p":"54"},{"id":"b2-050","type":"tf","ch":"ch3","part":"b2","art":17,"q":"ترتيب الأولياء في النظام موافق لمذهب الحنابلة.","a":true,"why":"نص عليه الكتاب.","src":"وهذا الترتيب موافق لما في مذهب الحنابلة","p":"55"},{"id":"b2-051","type":"mcq","ch":"ch3","part":"b2","art":18,"q":"سن الرشد في نظام المعاملات المدنية:","opts":["تمام ثماني عشرة سنة ميلادية","تمام ثماني عشرة سنة هجرية","تمام خمس عشرة سنة هجرية","تمام إحدى وعشرين سنة"],"a":1,"why":"الفقرة الثانية من المادة الثانية عشرة من نظام المعاملات المدنية.","src":"سن الرشد تمام (ثمان عشرة) سنة هجرية","p":"56"},{"id":"b2-052","type":"mcq","ch":"ch3","part":"b2","art":18,"q":"ليس من شروط الولي التي نصت عليها المادة الثامنة عشرة:","opts":["أن يكون ذكرًا","أن يكون بالغًا سن الرشد","أن يكون عاقلًا","أن يكون أكبر الأولياء سنًا"],"a":3,"why":"الشروط: ذكر، عاقل، بالغ سن الرشد، موافق للمرأة في الدين.","src":"يشترط في الولي - في الزواج - أن يكون ذكرا، عاقلا بالغا سن الرشد، موافقا للمرأة في الدين","p":"56"},{"id":"b2-053","type":"tf","ch":"ch3","part":"b2","art":18,"q":"لا ولاية لمسلم على كافرة.","a":true,"why":"لا ولاية لكافر على مسلم، ولا لمسلم على كافر أو كافرة، ولا لمرتد على أحد، باتفاق أهل العلم.","src":"وكذلك لا ولاية لمسلم على كافر أو كافرة، ولا ولاية لمرتد على أحد، وهذا باتفاق أهل العلم","p":"57"},{"id":"b2-054","type":"tf","ch":"ch3","part":"b2","art":18,"q":"إذا فقد الولي شرطًا من شروط الولاية انتقلت الولاية إلى القاضي مباشرة.","a":false,"why":"زوّج الولي الذي يليه في الترتيب.","src":"فإن فقد شرط: زوج الولي الذي يليه","p":"56"},{"id":"b2-055","type":"tf","ch":"ch3","part":"b2","art":19,"q":"إذا تعذر حضور ولي المرأة أو تعذر تبليغه، نقلت المحكمة ولاية التزويج إلى الولي الذي يليه بناء على طلب المرأة.","a":true,"why":"نص المادة 19، وعلى المحكمة التحقق من التعذر بواسطة الجهة المختصة.","src":"إذا تعذر حضور ولي المرأة، أو تعذر تبليغه؛ فتنتقل المحكمة بناء على طلب المرأة ولاية التزويج إلى الولي الذي يليه","p":"57"},{"id":"b2-056","type":"mcq","ch":"ch3","part":"b2","art":19,"q":"المقصود بتعذر حضور الولي في المادة التاسعة عشرة:","opts":["تعذر حضوره لمكان العقد، وهو مكان إقامة المرأة","سفره خارج المملكة فقط","مرضه مرضًا مزمنًا","رفضه التزويج"],"a":0,"why":"أما رفضه التزويج بالكفء فهو العضل (م20).","src":"وتعذر ولي المرأة المقصود به تعذره عن الحضور لمكان العقد، وهو مكان إقامة المرأة","p":"57"},{"id":"b2-057","type":"tf","ch":"ch3","part":"b2","art":19,"q":"للمحكمة تفويض أحد المرخصين بإجراء عقد زواج المرأة التي لا يعرف لها أب، على أن ينص صراحة في العقد على إنابته.","a":true,"why":"ذكره الكتاب نقلًا عن اللائحة التنفيذية.","src":"وللمحكمة تفويض أحد المرخصين - وفق الأحكام النظامية - بإجراء عقد الزواج للمرأة التي لا يعرف لها أب، على أن ينص صراحة في العقد على إنابته بتزويج المرأة","p":"58"},{"id":"b2-058","type":"mcq","ch":"ch3","part":"b2","art":20,"q":"العضل اصطلاحًا:","opts":["منع المرأة التزوج بكفئها إذا طلبت ذلك ورغب كل منهما في صاحبه","حبس المرأة في بيتها","منع الزوج زوجته من زيارة أهلها","عدول الخاطب عن الخطبة"],"a":0,"why":"سواء طلبت ذلك بمهر مثلها أو دونه، وهو ما عليه جمهور الفقهاء.","src":"منع المرأة التزوج بكفئها إذا طلبت ذلك ورغب كل منهما في صاحبه، سواء طلبت ذلك بمهر مثلها أو دونه","p":"59"},{"id":"b2-059","type":"mcq","ch":"ch3","part":"b2","art":20,"q":"ليس من شروط العضل المحرم:","opts":["وجود الخطوبة والرغبة في الزواج","منع الولي للخاطب","كفاءة الخاطب","أن تطلب المرأة مهر مثلها"],"a":3,"why":"الشروط أربعة: الخطوبة والرغبة، ومنع الولي، وكفاءة الخاطب، ورضا المرأة. والعضل يقع سواء طلبت مهر مثلها أو دونه.","src":"يشترط في العضل حتى يكون محرما عدة شروط هي: 1 - وجود الخطوبة والرغبة في الزواج. 2 - منع الولي للخاطب. 3 - كفاءة الخاطب. 4 - رضا المرأة به","p":"59"},{"id":"b2-060","type":"tf","ch":"ch3","part":"b2","art":20,"q":"العضل من الكبائر عند الشافعية.","a":false,"why":"جاء في المذهب الشافعي أنه ليس من الكبائر، وإنما يفسق به الولي إذا عضل مرات.","src":"العضل ليس من الكبائر، وإنما يفسق به الولي إذا عضل مرات، أقلها فيما حكى بعضهم ثلاث","p":"60"},{"id":"b2-061","type":"mcq","ch":"ch3","part":"b2","art":20,"q":"اختار المنظم في العضل أن تنتقل الولاية إلى:","opts":["الولي الذي يليه","المحكمة","الأم","أكبر الإخوة"],"a":1,"why":"لأنه أيسر في التطبيق وأعلى مصلحة وأدنى مفسدة وأسرع في إنجاز القضية.","src":"وقد نص النظام السعودي على أن تتولى المحكمة تزويج المرأة المعضولة","p":"60"},{"id":"b2-062","type":"tf","ch":"ch3","part":"b2","art":20,"q":"يشترط لإثبات العضل وجود خاطب وحضوره.","a":false,"why":"بينت اللائحة عدم تطلب ذلك، ويعرف العضل بأي وسيلة إثبات يقدرها القاضي.","src":"فبينت اللائحة عدم تطلب ذلك، ولا حضوره كذلك إذا كان موجودا","p":"61"},{"id":"b2-063","type":"tf","ch":"ch3","part":"b2","art":20,"q":"لا يمنع الحكم بثبوت العضل تولي العاضل عقد الزواج، بشرط رضا المرأة المعضولة.","a":true,"why":"جاء ذلك في اللائحة التنفيذية كما نقله الكتاب.","src":"والجواب أنه لا يمنع الحكم بثبوت العضل تولي العاضل عقد الزواج بشرط رضا المرأة المعضولة بذلك","p":"61"},{"id":"b2-064","type":"mcq","ch":"ch3","part":"b2","art":20,"q":"ممن يعد في حكم ذي المصلحة لطلب تزويج المعضولة بحسب اللائحة:","opts":["القريب للمرأة المعضولة، ووزارة الموارد البشرية والتنمية الاجتماعية","المأذون","الخاطب وحده","النيابة العامة"],"a":0,"why":"ويدخل في ذي المصلحة الخاطب أيضًا، وبعض الجهات المشرفة على دور الرعاية.","src":"فيعد في حكم كل ذي مصلحة؛ القريب للمرأة المعضولة، ووزارة الموارد البشرية والتنمية الاجتماعية","p":"60"},{"id":"b2-065","type":"essay","ch":"ch3","part":"b2","art":20,"q":"عرّف العضل، واذكر حكمه وشروطه وآثاره، ومن يتولى تزويج المعضولة في النظام.","a":"العضل اصطلاحًا: منع المرأة التزوج بكفئها إذا طلبت ذلك ورغب كل منهما في صاحبه، سواء طلبت ذلك بمهر مثلها أو دونه.\n\nحكمه: محرم، لقوله تعالى ﴿فلا تعضلوهن﴾، ولأنه تعسف في استخدام الحق.\n\nشروطه أربعة:\n1. وجود الخطوبة والرغبة.\n2. منع الولي للخاطب.\n3. كفاءة الخاطب.\n4. رضا المرأة به.\n\nآثاره:\n1. الإثم على العاضل.\n2. الفسق إن تكرر منه.\n3. فقدان أهلية الولاية.\n\nوفي النظام تتولى المحكمة تزويج المعضولة بطلب منها أو من ذي مصلحة، كالقريب ووزارة الموارد البشرية والتنمية الاجتماعية. وللمحكمة نقل ولايتها لأحد الأولياء مع مراعاة رأي المرأة، أو تفويض أحد المرخصين
