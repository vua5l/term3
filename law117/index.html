بالعقد.","p":"58–61"},{"id":"b2-066","type":"essay","ch":"ch3","part":"b2","art":16,"q":"بيّن طرق التعبير عن الإيجاب والقبول، ثم اذكر شروطهما مع التمثيل.","a":"طرق التعبير ثلاث (م15):\n1. لفظ الزواج الصريح: زوجتك وأنكحتك. واختار ابن تيمية وابن القيم انعقاده بكل لفظ يدل عليه.\n2. الكتابة عند العجز عن النطق، كالأخرس.\n3. الإشارة المفهومة عند العجز عن النطق والكتابة، وهو مذهب الحنفية، والجمهور يجيزونها ولو قدر على الكتابة.\n\nوشروطهما ثلاثة (م16):\n1. التوافق صراحة: زوجتك مريم، فيقول: قبلت بمريم. ولو قال: قبلت بعائشة لم يتوافقا. ولم يشترط النظام تقدم الإيجاب.\n2. الاقتران في مجلس واحد حقيقة، أو حكمًا عبر وسائل التقنية كالاتصال المرئي. ويقطع المجلس الكلام الأجنبي أو الإعراض.\n3. التنجيز:\n- فلا يصح المعلق على شرط: تزوجتك إن جاء أبوك، إلا على أمر كائن موجود.\n- ولا المضاف إلى المستقبل: تزوجتك أول العام القادم.","p":"49–54"},{"id":"b2-067","type":"essay","ch":"ch3","part":"b2","art":18,"q":"اذكر ترتيب الأولياء في الزواج، وشروط الولي.","a":"الترتيب (م17):\n1. الأب، ثم وصيه.\n2. ثم الجد لأب وإن علا.\n3. ثم الابن، ثم ابنه وإن نزل.\n4. ثم الأخ الشقيق، ثم الأخ لأب.\n5. ثم ابن الأخ الشقيق، ثم ابن الأخ لأب وإن نزلا.\n6. ثم العم الشقيق، ثم العم لأب، ثم بنوهما وإن نزلوا.\n7. ثم أقرب عصبة على ترتيب الإرث، ثم القاضي.\n\nوهو موافق لمذهب الحنابلة، ولا ولاية لذوي الأرحام.\n- إذا استوى الأولياء في الدرجة تعين من عينته المرأة.\n- ليس للولي ولو كان الأب أن يزوجها بغير رضاها.\n\nشروط الولي (م18):\n1. أن يكون ذكرًا.\n2. بالغًا سن الرشد، وهو تمام ثماني عشرة سنة هجرية.\n3. عاقلًا.\n4. موافقًا للمرأة في الدين.\nفإن فقد شرطًا زوّج الولي الذي يليه.","p":"54–57"},{"id":"b3-001","type":"mcq","ch":"ch3","part":"b3","art":21,"q":"ليس من شروط الشاهد في عقد الزواج في النظام:","opts":["أن يكون رجلًا","أن يكون بالغًا عاقلًا","أن يكون سامعًا الإيجاب والقبول فاهمًا المقصود بهما","أن يكون عدلًا"],"a":3,"why":"لم يشترط المنظم العدالة، فأخذ بمذهب الحنفية ورواية عن أحمد، بخلاف الجمهور.","src":"ولم يشترط المنظم العدالة فجوز أن تكون من الفاسق لأنها من جملة التحملات","p":"63"},{"id":"b3-002","type":"tf","ch":"ch3","part":"b3","art":21,"q":"لم يشترط المنظم العدالة في شاهدي عقد الزواج، آخذًا بمذهب الحنفية ورواية عن أحمد.","a":true,"why":"ذكره الكتاب في حاشيته، والجمهور اشترطوا العدالة.","src":"وهو في هذا قد أخذ بمذهب الحنفية ورواية عن الإمام أحمد بخلاف الجمهور الذين اشترطوا العدالة","p":"63"},{"id":"b3-003","type":"tf","ch":"ch3","part":"b3","art":21,"q":"يصح عقد الزواج في النظام بشهادة رجل وامرأتين.","a":false,"why":"يشترط أن يكون الشاهد رجلًا، فلا يصح بشهادة النساء وحدهن، ولا برجل وامرأتين.","src":"فلا يصح الزواج بشهادة النساء وحدهن، ولا بشهادة رجل وامرأتين","p":"62"},{"id":"b3-004","type":"mcq","ch":"ch3","part":"b3","art":21,"q":"اشتراط أن يكون الشاهدان رجلين قول:","opts":["الحنفية","الجمهور، خلافًا للحنفية ورواية عن أحمد","الحنفية والمالكية فقط","ابن تيمية وحده"],"a":1,"why":"اشترطه الجمهور لخطورة الزواج وأهميته، وخالفهم الحنفية ورواية عن أحمد.","src":"وهذا عند الجمهور سوى الحنفية ورواية عن الإمام أحمد","p":"62"},{"id":"b3-005","type":"tf","ch":"ch3","part":"b3","art":21,"q":"تصح شهادة الصبي المميز على عقد الزواج.","a":false,"why":"يشترط البلوغ، فلا تصح من الصبي ولو كان مميزًا.","src":"فلا تصح الشهادة من الصبي ولو كان مميزا","p":"63"},{"id":"b3-006","type":"mcq","ch":"ch3","part":"b3","art":21,"q":"الشرطان المتفق عليهما في الشاهد، ويجمعهما كون الشاهدين مكلفين:","opts":["الذكورة والإسلام","البلوغ والعقل","السمع والفهم","العدالة والإسلام"],"a":1,"why":"نص الكتاب على اتفاق الفقهاء عليهما.","src":"وهذان الشرطان (الثاني والثالث) متفق عليهما بين الفقهاء، ويمكن جمعهما بشرط واحد وهو كون الشاهدين مكلفين","p":"63"},{"id":"b3-007","type":"tf","ch":"ch3","part":"b3","art":21,"q":"إذا كان الزوجان غير مسلمين صح أن يشهد عليهما غير مسلمين.","a":true,"why":"اشتراط الإسلام متى كان الزوج مسلمًا.","src":"أما لو كان الزوجان غير مسلمين فيصح أن يشهد عليهما غير مسلمين","p":"63"},{"id":"b3-008","type":"tf","ch":"ch3","part":"b3","art":21,"q":"ينعقد الزواج بشهادة نائمين إذا كانا عدلين.","a":false,"why":"يشترط أن يسمعا الإيجاب والقبول ويفهما المقصود بهما.","src":"وهذا شرط عند أكثر الفقهاء، فلا ينعقد بشهادة نائمين أو أصمين","p":"63"},{"id":"b3-009","type":"mcq","ch":"ch3","part":"b3","art":22,"q":"أسباب التحريم المؤبد في النكاح محصورة في:","opts":["ثلاثة: النسب، والمصاهرة، والرضاع","أربعة: النسب، والمصاهرة، والملاعنة، والرضاعة","خمسة: النسب، والمصاهرة، والملاعنة، والرضاعة، والعدة","سببين: النسب والرضاع"],"a":1,"why":"تناولتها المواد 22 و23 و24 و25.","src":"وأسباب ذلك الوصف محصورة في أربعة أسباب","p":"64"},{"id":"b3-010","type":"mcq","ch":"ch3","part":"b3","art":22,"q":"المحرمات بسبب القرابة:","opts":["أربعة أنواع على الإجمال، وسبعة على التفصيل","سبعة على الإجمال، وأربعة على التفصيل","ثلاثة أنواع","عشرة أنواع"],"a":0,"why":"الأربعة في المادة، والسبعة في آيتي النساء.","src":"فالمحرمات بسبب القرابة: أربعة أنواع على الإجمال كما بينتهن هذه المادة، وسبعة على التفصيل","p":"65"},{"id":"b3-011","type":"tf","ch":"ch3","part":"b3","art":22,"q":"«الطبقة الأولى من فروع الأجداد أو الجدات» تشمل العمة والخالة، ومنها عمة الأب وخالة الأم.","a":true,"why":"وكذلك عمة الجد أو الجدة وخالتهما.","src":"كعمة الشخص، وخالته ... وكذلك عمة الأب، وعمة الأم. وخالة الأب، وخالة الأم","p":"66"},{"id":"b3-012","type":"mcq","ch":"ch3","part":"b3","art":22,"q":"تدخل بنت الأخت في المحرمات بالنسب ضمن:","opts":["الأصل وإن علا","الفرع وإن نزل","فروع الوالدين وإن نزلوا","الطبقة الأولى من فروع الأجداد"],"a":2,"why":"فروع الوالدين تشمل الأخوات وبنات الإخوة والأخوات.","src":"وكذلك بنت الأخت، وبنت ابنه، وبنت بنته؛ لقوله تعالى: ﴿وبنات الأخت﴾","p":"66"},{"id":"b3-013","type":"mcq","ch":"ch3","part":"b3","art":22,"q":"الجدة من المحرمات بالنسب لأنها من:","opts":["الأصل وإن علا","الفرع وإن نزل","فروع الوالدين","فروع الأجداد"],"a":0,"why":"الأصل وإن علا يشمل الأم والجدة.","src":"الأصل وإن علا: ويشمل ذلك الأم والجدة","p":"65"},{"id":"b3-014","type":"tf","ch":"ch3","part":"b3","art":23,"q":"تحرم أم الزوجة على الزوج بمجرد العقد على ابنتها.","a":true,"why":"وكذلك جداتها، لقوله تعالى ﴿وأمهات نسائكم﴾.","src":"فتحرم عليه أم زوجته وجداتها بمجرد العقد","p":"67"},{"id":"b3-015","type":"tf","ch":"ch3","part":"b3","art":23,"q":"تحرم بنت الزوجة على الزوج بمجرد العقد على أمها.","a":false,"why":"لا تحرم الربيبة إلا بشرط الدخول بأمها.","src":"وبنات أولادها بشرط أن يكون قد دخل بالأم","p":"67"},{"id":"b3-016","type":"mcq","ch":"ch3","part":"b3","art":23,"q":"يشترط لتحريم الربيبة على زوج أمها:","opts":["أن تكون في حجره","أن يكون قد دخل بأمها","أن تكون من زوج قبله","أن يطلق أمها"],"a":1,"why":"وتحرم سواء كانت من زوج قبله أو بعده.","src":"فتحرم بنت الزوجة - سواء أكانت من زوج قبله أم من زوج بعده - وبنات أولادها بشرط أن يكون قد دخل بالأم","p":"67"},{"id":"b3-017","type":"tf","ch":"ch3","part":"b3","art":23,"q":"الجماع في غير الزواج الصحيح يوجب ما يوجبه التحريم بالمصاهرة في الزواج الصحيح.","a":true,"why":"نص الفقرة الثانية من المادة 23.","src":"الجماع في غير الزواج الصحيح يوجب ما يوجبه التحريم بالمصاهرة في الزواج الصحيح","p":"66"},{"id":"b3-018","type":"mcq","ch":"ch3","part":"b3","art":23,"q":"ثبوت حرمة المصاهرة بوطء الشبهة والزنا على الصحيح من المذاهب هو قول:","opts":["المالكية والشافعية","الحنفية والحنابلة","الشافعية وحدهم","المالكية وحدهم"],"a":1,"why":"لأن مناط التحريم عندهم الوطء، حلالًا كان أو حرامًا.","src":"أما وطء الشبهة والزنا فإنه تثبت به حرمة المصاهرة على الصحيح من المذاهب، وهو قول الحنفية، والحنابلة","p":"67"},{"id":"b3-019","type":"mcq","ch":"ch3","part":"b3","art":23,"q":"«حلائل الأبناء» في قوله تعالى ﴿وحلائل أبنائكم الذين من أصلابكم﴾:","opts":["زوجات الأبناء","بنات الأبناء","أمهات الزوجات","الربائب"],"a":0,"why":"استدل بها الكتاب على تحريم زوجة الابن وإن نزل.","src":"زوجة ابنه وإن نزل؛ لقوله تعالى: ﴿وحلائل أبنائكم الذين من أصلابكم﴾","p":"67"},{"id":"b3-020","type":"tf","ch":"ch3","part":"b3","art":24,"q":"يجوز للملاعن أن يتزوج الملاعنة إذا أكذب نفسه.","a":false,"why":"تحرم عليه على التأبيد ولو أكذب نفسه.","src":"يحرم على التأبيد: زواج الرجل من المرأة التي لاعنها أمام القضاء، ولو أكذب نفسه","p":"68"},{"id":"b3-021","type":"mcq","ch":"ch3","part":"b3","art":24,"q":"اللعان في اللغة:","opts":["مصدر لاعن يلاعن بمعنى دعا باللعنة، واللعنة: الطرد والإبعاد","الفراق بين الزوجين","الحلف بالله","الشهادة على الزنا"],"a":0,"why":"أما اصطلاحًا فشهادات مؤكدات بأيمان من الزوجين مقرونة باللعن والغضب.","src":"مصدر لاعن يلاعن بمعنى دعا باللعنة، واللعنة: الطرد والإبعاد","p":"68"},{"id":"b3-022","type":"tf","ch":"ch3","part":"b3","art":24,"q":"إذا أكذب الملاعن نفسه عاد عليه الحد ولحوق النسب.","a":true,"why":"لأنهما حق عليه، بخلاف عود النكاح ورفع التأبيد فهما حق له وقد بطلا.","src":"بخلاف الحد ولحوق النسب؛ فإنهما يعودان لأنهما حق عليه","p":"69"},{"id":"b3-023","type":"mcq","ch":"ch3","part":"b3","art":24,"q":"علة أن إكذاب الملاعن نفسه لا يعيد النكاح ولا يرفع تأبيد الحرمة:","opts":["أنهما حق له وقد بطلا","أنهما حق عليه","أن القاضي حكم بهما","إجماع الصحابة على الطلاق"],"a":0,"why":"فلا يتمكن من عودهما.","src":"وإكذاب الزوج نفسه لا يفيده في عود النكاح ولا رفع تأبيد الحرمة: لأنهما حق له، وقد بطلا","p":"69"},{"id":"b3-024","type":"tf","ch":"ch3","part":"b3","art":24,"q":"قرر النظام في المادة (5/76) أن المتلاعنين لا يجتمعان أبدًا.","a":true,"why":"وهو قول الجمهور، والراجح عند الكتاب.","src":"وهو ماقرره النظام هنا وفي المادة (5/76)","p":"69"},{"id":"b3-025","type":"mcq","ch":"ch3","part":"b3","art":25,"q":"يحرم من الرضاع ما يحرم من النسب بشرطين:","opts":["أن يقع في العامين الأولين من الولادة، وأن يبلغ خمس رضعات متيقنة متفرقة","ثلاث رضعات في السنة الأولى","عشر رضعات في أي سن","رضعة واحدة قبل الفطام"],"a":0,"why":"نص المادة 25.","src":"1 - أن يقع الرضاع في العامين الأولين من الولادة. 2 - أن يبلغ خمس رضعات متيقنة متفرقة، ولو تقارب وقتها","p":"69"},{"id":"b3-026","type":"tf","ch":"ch3","part":"b3","art":25,"q":"يشترط في الرضعات الخمس ألا يتقارب وقتها.","a":false,"why":"تحسب ولو تقارب وقتها، ولو في مجلس واحد.","src":"أن يبلغ خمس رضعات متيقنة متفرقة، ولو تقارب وقتها","p":"69"},{"id":"b3-027","type":"tf","ch":"ch3","part":"b3","art":25,"q":"إذا قطع الطفل امتصاص الثدي لتنفس ثم عاد، حسبت له رضعتان ولو في مجلس واحد.","a":true,"why":"لأن الشارع اعتبر عدد الرضعات ولم يحدد الرضعة، فيرجع فيها إلى العرف.","src":"فيحتسب له بذلك رضعة. فإن عاد: فرضعتان... وهكذا. ولو في مجلس واحد","p":"71"},{"id":"b3-028","type":"tf","ch":"ch3","part":"b3","art":25,"q":"يثبت الرضاع بشهادة امرأة مرضية في دينها.","a":true,"why":"وذكر ابن تيمية أن المرأة المعروفة بالصدق يقبل قولها في ذلك على الصحيح.","src":"يثبت الرضاع بشهادة امرأة مرضية في دينها","p":"71"},{"id":"b3-029","type":"mcq","ch":"ch3","part":"b3","art":25,"q":"إذا شك في وجود الرضاع أو في كماله خمس رضعات، ولا بينة:","opts":["ثبت التحريم احتياطًا","فلا تحريم؛ لأن الأصل عدم الرضاع","ثبت تحريم مؤقت","رجع إلى القاضي"],"a":1,"why":"هذا نص الكتاب في الشك في الرضاع.","src":"إن شك في وجود الرضاع، أو شك في كماله خمس رضعات، وليس هناك بينة: فلا تحريم؛ لأن الأصل عدم الرضاع","p":"71"},{"id":"b3-030","type":"mcq","ch":"ch3","part":"b3","art":25,"q":"من الأحكام التي لا تثبت بين المرتضع والمرضعة:","opts":["تحريم النكاح","إباحة النظر","إباحة الخلوة","التوارث"],"a":3,"why":"لا يكون ولدها في بقية الأحكام، فلا نفقة ولا توارث ولا ولاية.","src":"لا يكون ولدا لها في بقية الأحكام: فلا تجب نفقتها عليه، ولا توارث بينهما، ولا يعقل عنها، ولا يكون وليا لها","p":"72"},{"id":"b3-031","type":"tf","ch":"ch3","part":"b3","art":25,"q":"تنتشر حرمة الرضاع إلى أصول المرتضع وإخوته.","a":false,"why":"تنتشر إلى فروعه دون أصوله وحواشيه.","src":"وكما تثبت الحرمة على المرتضع تنتشر كذلك على فروعه، من أولاده وأولاد أولاده دون أصوله وحواشيه","p":"72"},{"id":"b3-032","type":"tf","ch":"ch3","part":"b3","art":25,"q":"إذا وصل اللبن إلى جوف الطفل بغير الرضاع، كأن قُطر في فمه أو شربه من إناء، أخذ حكم الرضاع بشرط أن يحصل ذلك خمس مرات.","a":true,"why":"لأنه يحصل به ما يحصل بالرضاع من التغذية.","src":"أخذ ذلك حكم الرضاع؛ لأنه يحصل به ما يحصل بالرضاع من التغذية، بشرط أن يحصل ذلك خمس مرات","p":"72"},{"id":"b3-033","type":"mcq","ch":"ch3","part":"b3","art":25,"q":"لبن المرأة إذا درّ بدون حمل ولا وطء، ورضع منه طفل، فالذي رجحه ابن قدامة وأفتت به اللجنة الدائمة أنه:","opts":["لا ينشر الحرمة","ينشر الحرمة","ينشرها إن كانت متزوجة فقط","مكروه"],"a":1,"why":"لعموم ﴿وأمهاتكم اللاتي أرضعنكم﴾، ولأن ألبان النساء خلقت لغذاء الأطفال.","src":"قال ابن قدامة: وهذا أصح، وقد أفتت به اللجنة الدائمة للبحوث العلمية والإفتاء بالمملكة العربية السعودية","p":"73"},{"id":"b3-034","type":"tf","ch":"ch3","part":"b3","art":25,"q":"النسب أقوى من الرضاع، فلا يساويه إلا فيما ورد فيه النص، وهو التحريم وما يتفرع عليه من المحرمية والخلوة.","a":true,"why":"ولذلك لا تثبت بالرضاع النفقة ولا التوارث ولا الولاية.","src":"لأن النسب أقوى من الرضاع؛ فلا يساويه إلا فيما ورد فيه النص، وهو التحريم، وما يتفرع عليه من المحرمية والخلوة","p":"72"},{"id":"b3-035","type":"mcq","ch":"ch3","part":"b3","art":26,"q":"عدد حالات التحريم المؤقت التي ذكرتها المادة السادسة والعشرون:","opts":["خمس","ست","سبع","ثمان"],"a":2,"why":"جاءت مجموعة غير مفصلة، وقسمها الكتاب نوعين.","src":"وقد ذكرت المادة سبعا من هؤلاء، لكنها جاءت مجموعة غير مفصلة","p":"74"},{"id":"b3-036","type":"tf","ch":"ch3","part":"b3","art":26,"q":"يحرم على الرجل أن يتزوج المعتدة من غيره، ومن الحكمة في ذلك أنه لا يؤمن أن تكون حاملًا.","a":true,"why":"فيفضي ذلك إلى اختلاط المياه واشتباه الأنساب.","src":"ومن الحكمة في ذلك: أنه لا يؤمن أن تكون حاملا، فيفضي ذلك إلى اختلاط المياه واشتباه الأنساب","p":"74"},{"id":"b3-037","type":"tf","ch":"ch3","part":"b3","art":26,"q":"من فارقته زوجته بخلع عن تراض منهما، يجوز له أن يعقد عليها في عدتها.","a":true,"why":"وكذا المفسوخ نكاحها من الحاكم لضرر ونحوه، وهو ما في المادة 35.","src":"فإن لمن فارقها عقد الزواج منها في عدتها، وهو ماذكره المنظم في المادة (35)","p":"75"},{"id":"b3-038","type":"mcq","ch":"ch3","part":"b3","art":26,"q":"لا تحل المطلقة بائنًا بينونة كبرى لمطلقها إلا:","opts":["بعد انقضاء عدتها من زوج آخر دخل بها في زواج صحيح من غير قصد التحليل","بعد مضي سنة على طلاقها","بعقد جديد ومهر جديد","بإذن القاضي"],"a":0,"why":"المادة (85/2/ب)، ودليلها قصة امرأة رفاعة.","src":"لا تحل المطلقة بعده لمطلقها إلا بعد انقضاء عدتها من زوج آخر دخل بها في زواج صحيح من غير قصد الزوج التحليل","p":"75"},{"id":"b3-039","type":"tf","ch":"ch3","part":"b3","art":26,"q":"يجوز للرجل أن يتزوج خامسة إذا كانت إحدى زوجاته الأربع في عدة طلاق رجعي.","a":false,"why":"يحرم الجمع بين أكثر من أربع ولو كانت إحداهن في عدة طلاق رجعي أو بائن أو فسخ.","src":"الجمع بين أكثر من أربع نسوة ولو كانت إحداهن في عدة طلاق رجعي، أو بائن، أو فسخ","p":"74"},{"id":"b3-040","type":"mcq","ch":"ch3","part":"b3","art":26,"q":"ضابط تحريم الجمع بين امرأتين:","opts":["ألا تكونا من أسرة واحدة","ألا يجمع بين كل امرأتين لو كانت إحداهما ذكرًا والأخرى أنثى حرم نكاحها لها لقرابة أو رضاع","ألا يكون بينهما خلاف","ألا تكونا من بلد واحد"],"a":1,"why":"والحكمة: «إنكن إذا فعلتن ذلك قطعتن أرحامكن».","src":"أنه لا يجوز الجمع بين كل امرأتين لو كانت إحداهما ذكرا والأخرى أنثى حرم نكاحها لها لقرابة أو رضاع","p":"78"},{"id":"b3-041","type":"tf","ch":"ch3","part":"b3","art":26,"q":"تحريم النكاح على المحرم بالحج أو العمرة يشمل المحرم والمحرمة، ويشمل الولي والوكيل.","a":true,"why":"لعموم حديث «لا ينكح المحرم، ولا ينكح، ولا يخطب».","src":"وهذا التحريم المؤقت يشمل المحرم والمحرمة ... أنه يشمل الولي والوصي والوكيل","p":"76"},{"id":"b3-042","type":"mcq","ch":"ch3","part":"b3","art":26,"q":"إذا عقد الولي أو الوكيل النكاح وهو محرم قبل التحلل، فالنكاح:","opts":["صحيح","باطل لا يجدد","فاسد، وعليهم تجديده بعد التحلل إن رغبا الاستمرار","موقوف على إذن القاضي"],"a":2,"why":"وإلا طلق الزوج، فإن أبى فسخه الحاكم.","src":"ومتى عقد أمثال هؤلاء فالنكاح فاسد وعليهم تجديده بعد التحلل إذا رغبا الاستمرار","p":"76"},{"id":"b3-043","type":"tf","ch":"ch3","part":"b3","art":26,"q":"يجوز للمسلم أن يتزوج الحرة الكتابية.","a":true,"why":"لقوله تعالى ﴿والمحصنات من الذين أوتوا الكتاب من قبلكم﴾.","src":"إلا الحرة الكتابية، فيجوز للمسلم أن يتزوجها","p":"76"},{"id":"b3-044","type":"tf","ch":"ch3","part":"b3","art":26,"q":"يجوز للمسلمة أن تتزوج الكتابي.","a":false,"why":"لا يحل أن يتزوج كافر امرأة مسلمة.","src":"فلا يحل أن يتزوج كافر امرأة مسلمة","p":"77"},{"id":"b3-045","type":"mcq","ch":"ch3","part":"b3","art":26,"q":"أمر النبي ﷺ غيلان بن سلمة الثقفي لما أسلم وتحته عشر نسوة:","opts":["أن يطلقهن جميعًا","أن يتخير أربعًا منهن","أن يبقي أولاهن","أن يتخير اثنتين"],"a":1,"why":"استدل به الكتاب على تحريم الجمع بين أكثر من أربع.","src":"فأمره النبي ﷺ أن يتخير أربعا منهن","p":"77"},{"id":"b3-046","type":"mcq","ch":"ch3","part":"b3","art":26,"q":"حكم الزواج المؤقت بالإنجاب بحسب قرار مجمع الفقه الإسلامي:","opts":["صحيح","صحيح لكنه خلاف الأولى","فاسد لوجود معنى المتعة فيه","مكروه"],"a":2,"why":"التوقيت بمدة مجهولة كالإنجاب يصيره متعة، ونكاح المتعة مجمع على تحريمه.","src":"وهذا الزواج فاسد لوجود معنى المتعة فيه","p":"79"},{"id":"b3-047","type":"tf","ch":"ch3","part":"b3","art":26,"q":"عقد الزواج الذي تتنازل فيه المرأة عن السكن والنفقة والقسم صحيح إذا توافرت أركانه وشروطه، لكنه خلاف الأولى.","a":true,"why":"هذا نص قرار مجمع الفقه الإسلامي الذي نقله الكتاب.","src":"هذان العقدان وأمثالهما صحيحان: إذا توافرت فيهما أركان الزواج وشروطه، وخلوه من الموانع، ولكن ذلك خلاف الأولى","p":"79"},{"id":"b3-048","type":"tf","ch":"ch3","part":"b3","art":26,"q":"يرى مجمع الفقه الإسلامي منع الزواج بنية الطلاق؛ لاشتماله على الغش والتدليس.","a":true,"why":"مع أن جماعة من العلماء أجازوه.","src":"على الرغم من أن جماعة من العلماء أجازوه إلا أن المجمع يرى منعه؛ لاشتماله على الغش والتدليس","p":"80"},{"id":"b3-049","type":"tf","ch":"ch3","part":"b3","art":26,"q":"أخذ المنظم في الزواج من الزانية بقول الجمهور، وهو جوازه وإن لم تتب، خلافًا للمذهب الحنبلي.","a":true,"why":"ذكره الكتاب في حاشيته فيما أغفله المنظم من الصور.","src":"فإنه قد أخذ بقول الجمهور وهو جواز الزواج منها وإن لم تتب خلافا للمذهب الحنبلي","p":"78"},{"id":"b3-050","type":"essay","ch":"ch3","part":"b3","art":22,"q":"اذكر أسباب التحريم المؤبد، ثم فصّل المحرمات بالنسب مع الدليل.","a":"أسباب التحريم المؤبد أربعة:\n1. النسب (م22).\n2. المصاهرة (م23).\n3. الملاعنة (م24).\n4. الرضاعة (م25).\n\nوالمحرمات بالنسب أربعة أنواع إجمالًا، وسبعة تفصيلًا في آيتي النساء:\n1. الأصل وإن علا: الأم والجدة، ﴿حرمت عليكم أمهاتكم﴾.\n2. الفرع وإن نزل: البنت، وبنت الابن، وبنت البنت، ﴿وبناتكم﴾.\n3. فروع الوالدين وإن نزلوا: الأخت شقيقة أو لأب أو لأم، وبنت الأخ، وبنت الأخت، ﴿وأخواتكم﴾ ﴿وبنات الأخ﴾ ﴿وبنات الأخت﴾.\n4. الطبقة الأولى من فروع الأجداد أو الجدات: العمة والخالة، وعمة الأب والأم وخالتهما، ﴿وعماتكم﴾ ﴿وخالاتكم﴾.","p":"64–66"},{"id":"b3-051","type":"essay","ch":"ch3","part":"b3","art":25,"q":"اذكر شرطي التحريم بالرضاع مع الدليل، ثم بيّن ما يثبت بالرضاع وما لا يثبت.","a":"الشرطان (م25):\n1. أن يقع في العامين الأولين من الولادة، لقوله تعالى ﴿حولين كاملين﴾، ولحديث «لا يحرم من الرضاع إلا ما فتق الأمعاء... وكان قبل الفطام».\n2. أن يبلغ خمس رضعات متيقنة متفرقة ولو تقارب وقتها، لحديث عائشة: عشر رضعات معلومات ثم نسخن بخمس.\n\nما يثبت: يصير المرتضع ولدها في تحريم نكاحها عليه، ويباح نظره إليها وخلوته بها، ويكون محرمًا لها، وتنتشر الحرمة إلى فروعه.\n\nما لا يثبت: النفقة، والتوارث، والعقل، والولاية؛ لأن النسب أقوى من الرضاع. ولا تنتشر الحرمة إلى أصول المرتضع ولا حواشيه.","p":"69–72"},{"id":"b3-052","type":"essay","ch":"ch3","part":"b3","art":26,"q":"عدّد المحرمات تحريمًا مؤقتًا في المادة السادسة والعشرين، مقسمة على نوعيها.","a":"النوع الأول: ما حُرّم لعارض يزول غير الجمع:\n1. المعتدة من غيره، ولمن فارقها بخلع أو فسخ أن يعقد عليها في عدتها (م35).\n2. البائن منه بينونة كبرى، حتى يطأها زوج غيره بنكاح صحيح من غير قصد التحليل، وتنقضي عدتها منه (م85/2/ب).\n3. المحرم بالحج أو العمرة قبل التحلل، ويشمل المحرمة والولي والوكيل.\n4. زواج المسلم من غير الكتابية.\n5. زواج المسلمة من غير المسلم.\n\nالنوع الثاني: ما حُرّم من أجل الجمع:\n1. الجمع بين أكثر من أربع ولو كانت إحداهن في عدة.\n2. الجمع بين الأختين.\n3. الجمع بين المرأة وعمتها أو خالتها.\nوضابطه: كل امرأتين لو كانت إحداهما ذكرًا حرم نكاحها للأخرى لقرابة أو رضاع.","p":"73–78"},{"id":"b3-053","type":"essay","ch":"ch3","part":"b3","art":21,"q":"اذكر شروط الشاهد في عقد الزواج، مع تعليل كل شرط كما في الكتاب.","a":"1. أن يكون رجلًا (عند الجمهور، خلافًا للحنفية ورواية عن أحمد): لخطورة الزواج وأهميته، فلا يصح بالنساء وحدهن ولا برجل وامرأتين.\n2. أن يكون بالغًا: فلا تصح من الصبي ولو مميزًا، لأنه لا يتحقق بحضوره الإعلان والتكريم.\n3. أن يكون عاقلًا: إذ لا تتحقق بالمجنون غاية الشهادة، وهي الإعلان والإثبات عند الإنكار. والثاني والثالث متفق عليهما، ويجمعهما التكليف.\n4. أن يكون سامعًا الإيجاب والقبول فاهمًا المقصود بهما: فلا ينعقد بشهادة نائمين أو أصمين؛ لأن الغرض من الشهادة لا يتحقق بأمثالهما.\n5. أن يكون مسلمًا متى كان الزوج مسلمًا: لينتشر خبره بين المسلمين.\n\nولم يشترط المنظم العدالة، أخذًا بمذهب الحنفية ورواية عن أحمد.","p":"62–63"},{"id":"b3-054","type":"essay","ch":"ch3","part":"b3","art":26,"q":"بيّن حكم العقود المستحدثة الآتية بحسب قرار مجمع الفقه الإسلامي: العقد الذي تتنازل فيه المرأة عن السكن والنفقة والقسم، والزواج المؤقت بالإنجاب، والزواج بنية الطلاق.","a":"1. العقد الذي تتنازل فيه المرأة عن السكن والنفقة والقسم أو بعضها، ومثله بقاء الفتاة في بيت أهلها ويلتقيان متى رغبا:\n- صحيح إذا توافرت أركانه وشروطه وخلا من الموانع، ولكنه خلاف الأولى.\n\n2. الزواج المؤقت بالإنجاب: أن يُشترط أنه إذا أنجبت فلا نكاح أو يطلقها.\n- فاسد لوجود معنى المتعة، ونكاح المتعة مجمع على تحريمه.\n\n3. الزواج بنية الطلاق: أن يضمر الزوج طلاقها بعد مدة.\n- أجازه جماعة من العلماء، والمجمع يرى منعه لاشتماله على الغش والتدليس، ولما يؤدي إليه من مفاسد.\n\nوصدر القرار في الدورة الثامنة عشرة (12/3/1427هـ).","p":"79–80"},{"id":"b4-001","type":"tf","ch":"ch3","part":"b4","art":27,"q":"نص النظام على أن الزوجين عند شروطهما.","a":true,"why":"الفقرة الأولى من المادة 27، وهي مبدأ عام.","src":"الزوجان عند شروطهما","p":"80"},{"id":"b4-002","type":"mcq","ch":"ch3","part":"b4","art":27,"q":"لا يكون الشرط مثبتًا لخيار فسخ عقد الزواج إلا إذا:","opts":["نص عليه كتابة في وثيقة عقد الزواج، أو أقر به الزوجان","ذكر أثناء الخطبة","شهد عليه شاهدان","وافق عليه الولي"],"a":0,"why":"قطعًا للمنازعات، فلا يعتد بالشرط إلا بالكتابة أو الإقرار.","src":"لا يكون الشرط مثبتا لخيار فسخ عقد الزواج إلا إذا نص على الشرط كتابة في وثيقة عقد الزواج، أو أقر به الزوجان","p":"80"},{"id":"b4-003","type":"tf","ch":"ch3","part":"b4","art":27,"q":"وقف الحنفية والشافعية وجمهور المالكية من الشروط في العقود موقف التوسعة.","a":false,"why":"وقفوا موقف التضييق، والذين فتحوا المجال واسعًا هم الحنابلة.","src":"فوقف الحنفية والشافعية وجمهور المالكية موقف التضييق","p":"81"},{"id":"b4-004","type":"mcq","ch":"ch3","part":"b4","art":27,"q":"المادة السابعة والعشرون في الشروط مما جاء به مذهب:","opts":["الحنفية","المالكية","الشافعية","الحنابلة"],"a":3,"why":"لما فيه من رحابة الصدر في قبول المشارطات.","src":"وهذه المادة هي مما جاء به مذهب الحنابلة","p":"81"},{"id":"b4-005","type":"mcq","ch":"ch3","part":"b4","art":27,"q":"اشتراط المرأة ألا ينقلها زوجها من بلدها من:","opts":["الشروط الصحيحة الموافقة لمقتضى العقد","الشروط الصحيحة التي لأحد الزوجين فيها منفعة ولم تلزم بأصل العقد","الشروط الباطلة المبطلة للعقد","الشروط الباطلة التي لا تبطل العقد"],"a":1,"why":"وهو المراد في المادة (27/1).","src":"ما كان لأحد الزوجين فيه منفعة ولم يكن لازما بأصل العقد، مثل اشتراط المرأة أن لا ينقلها من بلدها","p":"82"},{"id":"b4-006","type":"tf","ch":"ch3","part":"b4","art":27,"q":"اشتراط تسليم الزوجة نفسها لزوجها من الشروط الموافقة لمقتضى العقد، فاشتراطه تأكيد.","a":true,"why":"لأن العقد يقتضيه ابتداء من غير شرط، فلا يضر عدم ذكره.","src":"فيكون اشتراطها من باب التأكيد ولايضر عدم ذكرها، مثل شرط تسليم الزوجة نفسها لزوجها","p":"82"},{"id":"b4-007","type":"tf","ch":"ch3","part":"b4","art":27,"q":"الوعود التي يبذلها أحد الزوجين للآخر بعد انبرام العقد، ولم ترد في العقد ولم يقر بها المشترط عليه، يثبت بها خيار الفسخ.","a":false,"why":"لا يعتد بالشرط إلا بالكتابة في وثيقة العقد أو بإقرار المشترط عليه، وإن كان الوفاء بالوعد واجبًا ديانة.","src":"ولا لما يبذله أحد الزوجين للآخر من وعود بعد انبرام عقد الزواج","p":"83"},{"id":"b4-008","type":"mcq","ch":"ch3","part":"b4","art":27,"q":"الشروط التي تكون بعد العقد ولزومه:","opts":["لا تلزم عند المنظم","أخذ المنظم بصحتها، وهو قول ابن رجب","باطلة بالإجماع","معتبرة إجماعًا"],"a":1,"why":"المنصوص عن أحمد أنها لا تلزم، وأخذ المنظم بقول ابن رجب حين نص على الإقرار.","src":"وقد تكون بعد العقد ولزومه فالمنصوص عن أحمد أنها لا تلزم عنده، وقال ابن رجب بصحتها وهو ما أخذ به المنظم","p":"84"},{"id":"b4-009","type":"tf","ch":"ch3","part":"b4","art":27,"q":"الشروط التي تكون في صلب العقد معتبرة إجماعًا.","a":true,"why":"أما التي قبل العقد فمعتبرة في ظاهر مذهب أحمد.","src":"والشروط هنا قد تكون في صلب العقد وهي معتبرة إجماعا","p":"84"},{"id":"b4-010","type":"mcq","ch":"ch3","part":"b4","art":27,"q":"أحق الشروط أن يوفى بها، كما في الحديث:","opts":["ما استحللتم به الفروج","ما كان في البيوع","ما كتب في العقود","ما شهد عليه الشهود"],"a":0,"why":"ولذلك كانت شروط النكاح أحق الشروط بالوفاء.","src":"أحق الشروط أن توفوا به ما استحللتم به الفروج","p":"83"},{"id":"b4-011","type":"tf","ch":"ch3","part":"b4","art":28,"q":"إذا لم يف أحد الزوجين بما شرطه الآخر، فللمشترط طلب الفسخ متى شاء، إلا إذا أسقط حقه صراحة.","a":true,"why":"نص المادة 28.","src":"فللمشترط طلب فسخ عقد الزواج متى شاء؛ إلا إذا أسقط حقه صراحة","p":"84"},{"id":"b4-012","type":"mcq","ch":"ch3","part":"b4","art":28,"q":"إذا كان عدم الوفاء بالشرط من الزوج، فالفسخ:","opts":["بلا عوض","بعوض لا يزيد على المهر","بعوض يعادل المهر","بنصف المهر"],"a":0,"why":"أما إن كان من الزوجة فبعوض لا يزيد على المهر.","src":"فإذا كان عدم الوفاء من الزوج: فيكون الفسخ بلا عوض","p":"84"},{"id":"b4-013","type":"mcq","ch":"ch3","part":"b4","art":28,"q":"إذا كان عدم الوفاء بالشرط من الزوجة، فالفسخ:","opts":["بلا عوض","بعوض لا يزيد على المهر","بعوض يزيد على المهر","بمهر المثل"],"a":1,"why":"للزوج أن يأخذ عوضًا بشرط ألا يزيد على المهر الذي دفعه.","src":"وإذا كان من الزوجة: فيكون بعوض لا يزيد على المهر","p":"84"},{"id":"b4-014","type":"tf","ch":"ch3","part":"b4","art":28,"q":"يسقط حق الفسخ في النظام بالإسقاط الضمني، كأن يخل أحد الزوجين بالشرط ويسكت الآخر.","a":false,"why":"يشترط النظام أن يكون الإسقاط صريحًا، بخلاف المذهب الحنبلي.","src":"فهذا لا اعتبار به عند المنظم هنا، إذ يشترط أن يكون الإسقاط صريحا","p":"85"},{"id":"b4-015","type":"tf","ch":"ch3","part":"b4","art":28,"q":"خيار الفسخ لفوات الشرط على التراخي، بدلالة قول المادة «متى شاء».","a":true,"why":"استدل الكتاب بنص المادة.","src":"وتدل هذه الفقرة على أن هذا الخيار بالفسخ هو على التراخي بدلالة نصها بقولها (متى شاء)","p":"85"},{"id":"b4-016","type":"tf","ch":"ch3","part":"b4","art":28,"q":"سوّى النظام بين الزوج والزوجة في حق الفسخ عند فوات الصفة المشترطة في العقد.","a":true,"why":"أي صفة كانت، كأن تكون بكرًا أو يكون موظفًا.","src":"نصت الفقرة الأولى من هذه المادة على التسوية بين الزوج والزوجة في حق الفسخ عند فوات الصفة التي اشترطت بالعقد","p":"85"},{"id":"b4-017","type":"mcq","ch":"ch3","part":"b4","art":27,"q":"قال عمر رضي الله عنه: «إن مقاطع الحقوق عند الشروط» في قضائه:","opts":["فيمن شرط لزوجته دارها فأراد إخراجها","في المتلاعنين","في المحلل","في الشغار"],"a":0,"why":"فمنعه من إخراجها وفاء بما شرطه على نفسه.","src":"وما ورد من قضاء عمر بن الخطاب رضي الله عنه فيمن شرط لها زوجها دارها، بمنعه من إخراجها وفقا لما شرطه على نفسه","p":"84"},{"id":"b4-018","type":"mcq","ch":"ch3","part":"b4","art":29,"q":"إذا اشترط في عقد الزواج ما ينافي استمراره، فالعقد:","opts":["صحيح والشرط باطل","باطل","فاسد","موقوف"],"a":1,"why":"وكذلك إذا جعل عقد الزواج في مقابل عقد زواج آخر.","src":"إذا اشترط في عقد الزواج ما ينافي استمراره، أو جعل عقد الزواج في مقابل عقد زواج آخر؛ فالعقد باطل","p":"86"},{"id":"b4-019","type":"tf","ch":"ch3","part":"b4","art":29,"q":"إذا اشترط في عقد الزواج ما ينافي مقتضاه، صح العقد وبطل الشرط.","a":true,"why":"مع مراعاة الفقرة الأولى من المادة 29.","src":"يصح عقد الزواج، ويبطل الشرط إذا كان منافيا لمقتضى العقد","p":"87"},{"id":"b4-020","type":"mcq","ch":"ch3","part":"b4","art":29,"q":"من الشروط الباطلة التي لا تبطل العقد:","opts":["اشتراط عدم المهر","اشتراط التحليل","جعل العقد مقابل عقد زواج آخر","توقيت العقد بمدة"],"a":0,"why":"الثلاثة الأخرى تبطل العقد: المحلل، والشغار، والمتعة.","src":"وهناك صور لشروط باطلة لا تبطل العقد: 1 - اشتراط عدم المهر","p":"90"},{"id":"b4-021","type":"mcq","ch":"ch3","part":"b4","art":29,"q":"العقود التي يتصور فيها الشرط الباطل المبطل للعقد:","opts":["المحلل، والمتعة، والشغار","المسيار، والمتعة، والتفويض","الشغار، والتفويض، والمحلل","الفاسد، والباطل، والموقوف"],"a":0,"why":"ضابطها: كل عقد نهى عنه الشرع وأبطله.","src":"وضابط ذلك هو: كل عقد نهى عنه الشرع وأبطله، ويتصور ذلك في ثلاثة عقود","p":"87"},{"id":"b4-022","type":"tf","ch":"ch3","part":"b4","art":29,"q":"العبرة في شرط التحليل ونيته بما يصدر عن الزوج المحلل، ولا أثر لنية الزوجة أو وليها.","a":true,"why":"لأن الفرقة ليست لهما، بل يملكها الزوج.","src":"والعبرة بشرط التحليل ونيته هو ما يصدر عن الزوج (المحلل)، ولا أثر لنية الزوجة أو وليها في ذلك","p":"87"},{"id":"b4-023","type":"mcq","ch":"ch3","part":"b4","art":29,"q":"زواج المتعة هو:","opts":["النكاح والتزويج إلى مدة معينة","الزواج بلا مهر","تزويج امرأة بشرط تزويج أخرى","الزواج بنية التحليل"],"a":0,"why":"كقوله: زوجتكها شهرًا أو سنة، وهو ينافي استمرار العقد.","src":"زواج المتعة: وهو النكاح والتزويج إلى مدة معينة","p":"88"},{"id":"b4-024","type":"tf","ch":"ch3","part":"b4","art":29,"q":"يشترط النظام في الشغار ألا يكون بين العقدين مهر.","a":false,"why":"لم يشترط المنظم عدم وجود المهر، آخذًا بقول المالكية والظاهرية.","src":"وهو ما أخذ به المنظم هنا فلم يشترط عدم وجود المهر","p":"88"},{"id":"b4-025","type":"mcq","ch":"ch3","part":"b4","art":29,"q":"سمي الشغار بذلك:","opts":["من الشغور، وهو الخلو من العوض","من الانشغال","لشيوعه","لسرعته"],"a":0,"why":"وقيل من شغر الكلب إذا رفع رجله ليبول.","src":"سمي بذلك من الشغور وهو الخلو من العوض","p":"88"},{"id":"b4-026","type":"tf","ch":"ch3","part":"b4","art":29,"q":"إذا سمي لكل واحدة من المرأتين مهر مستقل كامل بلا حيلة، مع موافقتهما، صح العقد.","a":true,"why":"لانتفاء الضرر.","src":"فإذا سمي لكل واحدة منهما مهر مستقل كامل، بلا حيلة، مع أخذ موافقة المرأتين؛ صح ذلك، لانتفاء الضرر","p":"89"},{"id":"b4-027","type":"tf","ch":"ch3","part":"b4","art":29,"q":"الراجح عند الكتاب أن اشتراط المرأة طلاق ضرتها شرط صحيح.","a":false,"why":"رجح الكتاب القول الثاني: لا يصح، لنهي النبي ﷺ عن ذلك، والنهي يقتضي الفساد.","src":"لا يصح هذا الشرط ... والثاني أرجح والله تعالى أعلم","p":"91"},{"id":"b4-028","type":"mcq","ch":"ch3","part":"b4","art":29,"q":"ضابط الشروط الباطلة التي لا تبطل العقد:","opts":["كل ما خالف مقتضى عقد النكاح","كل عقد نهى عنه الشرع وأبطله","كل ما ينافي استمرار العقد","كل شرط لم يكتب"],"a":0,"why":"ومقتضى العقد: ما يجب به من غير شرط.","src":"وضابط هذه الشروط: هي كل ما خالف مقتضى عقد النكاح","p":"90"},{"id":"b4-029","type":"mcq","ch":"ch3","part":"b4","art":30,"q":"الزواج غير الصحيح في النظام يشمل:","opts":["الباطل والفاسد","الباطل والموقوف","الفاسد والمكروه","الموقوف والنافذ"],"a":0,"why":"أخذ المنظم بالقسمة الثلاثية: صحيح، وباطل، وفاسد.","src":"زواج غير صحيح، ويشمل ما يأتي: أ - الزواج الباطل. ب - الزواج الفاسد","p":"91"},{"id":"b4-030","type":"tf","ch":"ch3","part":"b4","art":30,"q":"العقد الفاسد هو الذي اختل فيه شرط من شروطه المختلف فيها بين أهل العلم.","a":true,"why":"كالنكاح بلا ولي أو بلا شاهدين، وهو مرحلة بين الصحة والبطلان.","src":"أما العقد الفاسد: هو العقد الذي اختل شرط من شروطه المختلف فيها بين أهل العلم","p":"92"},{"id":"b4-031","type":"tf","ch":"ch3","part":"b4","art":30,"q":"الزواج الباطل يحتاج إلى فرقة من زوج أو حاكم.","a":false,"why":"لا يحتاج إليها لأنه لم ينعقد أصلًا، بخلاف الفاسد.","src":"الأول، أن الزواج الباطل لا يحتاج إلى فرقة من زوج أو حاكم","p":"92"},{"id":"b4-032","type":"mcq","ch":"ch3","part":"b4","art":30,"q":"في الزواج الباطل يجوز للمرأة أن تتزوج آخر:","opts":["دون طلاق ولا فسخ، لكن بعد استبراء المدخول بها بالعدة","بعد طلاق الزوج","بعد فسخ الحاكم","لا يجوز لها ذلك"],"a":0,"why":"وهو الفرق الثاني بين الباطل والفاسد.","src":"جواز زواج المرأة في الزواج الباطل من زوج آخر دون طلاق من زوج ولا فسخ من حاكم، لكن بعد استبراء مدخول بها","p":"92"},{"id":"b4-033","type":"tf","ch":"ch3","part":"b4","art":31,"q":"يرتب عقد الزواج الصحيح آثاره من حين انعقاده.","a":true,"why":"إذا توافرت أركانه وشروطه.","src":"يكون عقد الزواج صحيحا إذا توافرت أركانه وشروطه، ويرتب آثاره من حين انعقاده","p":"93"},{"id":"b4-034","type":"mcq","ch":"ch3","part":"b4","art":31,"q":"لا ينحل عقد الزواج الصحيح إلا بـ:","opts":["الوفاة أو الطلاق أو الفسخ أو التفريق القضائي","الطلاق وحده","الخلع وحده","الوفاة وحدها"],"a":0,"why":"نص عليه الكتاب في شرح المادة 31.","src":"ولا ينحل إلا بالوفاة أو بالطلاق أو بالفسخ أو بالتفريق القضائي","p":"93"},{"id":"b4-035","type":"mcq","ch":"ch3","part":"b4","art":32,"q":"يكون عقد الزواج باطلًا إذا:","opts":["تخلف أحد أركانه، أو أحد شروط صحته، أو اشترط فيه أحد شرطي الفقرة الأولى من المادة 29","انعدمت الكفاءة","اشترط فيه عدم المهر","لم يوثق"],"a":0,"why":"الكفاءة شرط لزوم، واشتراط عدم المهر يبطل الشرط وحده، والتوثيق ليس شرط صحة.","src":"يكون عقد الزواج باطلا إذا تخلف أحد أركانه، أو أحد شروط صحته، أو اشترط فيه أحد الشرطين الواردين في الفقرة (1) من المادة (التاسعة والعشرين)","p":"94"},{"id":"b4-036","type":"tf","ch":"ch3","part":"b4","art":32,"q":"الزواج الباطل لا ينقل العلاقة بين الرجل والمرأة من التحريم إلى الحل.","a":true,"why":"لأنه لا يعترف به الشارع، ولا يترتب عليه حكم شرعي.","src":"ولذلك فإنه لا ينقل العلاقة بين الرجل والمرأة من التحريم إلى الحل","p":"94"},{"id":"b4-037","type":"tf","ch":"ch3","part":"b4","art":33,"q":"لا يرتب الزواج الباطل أي أثر قبل الدخول.","a":true,"why":"لأنه لم ينعقد، فوجوده كعدمه.","src":"لا يرتب الزواج الباطل أي أثر قبل الدخول","p":"95"},{"id":"b4-038","type":"mcq","ch":"ch3","part":"b4","art":33,"q":"ليس من الأحكام التي نصت المادة 33 على ترتبها على الزواج الباطل بعد الدخول:","opts":["وجوب العدة","حرمة المصاهرة","استحقاق مهر المثل ما لم يسم مهر إن كانت لا تعلم حكم العقد","استحقاق النفقة"],"a":3,"why":"النفقة من آثار الزواج الفاسد بعد الدخول (م34).","src":"أ - وجوب العدة. ب - حرمة المصاهرة. ج - استحقاق المرأة مهر المثل ما لم يسم مهر، إن كانت لا تعلم حكم العقد","p":"95"},{"id":"b4-039","type":"tf","ch":"ch3","part":"b4","art":33,"q":"تستحق المرأة في الزواج الباطل بعد الدخول مهر المثل إن كانت تعلم حكم العقد.","a":false,"why":"تستحقه إن كانت لا تعلم حكم العقد.","src":"استحقاق المرأة مهر المثل ما لم يسم مهر، إن كانت لا تعلم حكم العقد","p":"95"},{"id":"b4-040","type":"mcq","ch":"ch3","part":"b4","art":34,"q":"إذا أوقع الزوج الطلاق في الزواج الفاسد قبل الدخول، فإنه يقع:","opts":["رجعيًا","بائنًا بينونة صغرى","بائنًا بينونة كبرى","لا يقع"],"a":1,"why":"ولا أثر للفاسد قبل الدخول إلا هذا.","src":"ولا يترتب عليه أي أثر قبل الدخول إلا الطلاق إذا أوقعه الزوج فيقع بائنا بينونة صغرى","p":"96"},{"id":"b4-041","type":"mcq","ch":"ch3","part":"b4","art":34,"q":"عدد آثار الزواج الفاسد بعد الدخول في المادة 34:","opts":["ثلاثة","أربعة","خمسة","ستة"],"a":3,"why":"المهر المسمى، والنسب، والعدة، وحرمة المصاهرة، والنفقة، ووقوع الطلاق بائنًا.","src":"ثالثا، آثار العقد الفاسد إن كان بعد الدخول: وهي ستة آثار","p":"97"},{"id":"b4-042","type":"tf","ch":"ch3","part":"b4","art":34,"q":"تستحق المرأة في الزواج الفاسد بعد الدخول النفقة، ما لم تكن عالمة فساد العقد.","a":true,"why":"لأن جهلها الفساد يجعلها كالزوجة الشرعية المحتبسة لمصلحة الزوج.","src":"استحقاق المرأة النفقة ما لم تكن عالمة فساد العقد","p":"97"},{"id":"b4-043","type":"mcq","ch":"ch3","part":"b4","art":34,"q":"من أمثلة الزواج الفاسد التي جاءت في اللائحة ونقلها الكتاب:","opts":["الزواج بلا إيجاب من الولي، أو بلا شهود، أو زواج المحرم بحج أو عمرة","زواج المحارم","زواج المسلمة بغير المسلم","زواج المتعة"],"a":0,"why":"أما زواج المحارم والمسلمة بغير المسلم فباطل في حكم الزنا المحض، والمتعة باطلة.","src":"إذا كان بلا إيجاب من الولي، أو بلا شهود، أو زواج محرم بحج أو عمرة","p":"97"},{"id":"b4-044","type":"tf","ch":"ch3","part":"b4","art":34,"q":"تطبق آثار الزواج الفاسد على كل زواج باطل بعد الدخول إذا كان الزوجان لا يعلمان حكمه.","a":true,"why":"الفقرة الثالثة من المادة 34.","src":"تطبق الآثار المترتبة على الزواج الفاسد على كل زواج باطل بعد الدخول إذا كان الزوجان لا يعلمان حكمه","p":"97"},{"id":"b4-045","type":"tf","ch":"ch3","part":"b4","art":34,"q":"تثبت آثار الزواج الفاسد في النظام بالخلوة كما تثبت بالدخول.","a":false,"why":"لا تثبت إلا بالدخول، وهو قول أكثر أهل العلم، بخلاف المذهب الحنبلي.","src":"ويفهم من هذه المادة أنها لا تستحق هذه الآثار بالخلوة وغيرها، وإنما بالدخول فقط","p":"98"},{"id":"b4-046","type":"tf","ch":"ch3","part":"b4","art":34,"q":"المهر المسمى هو المهر المدون في العقد، ما لم يصادق الزوجان على خلاف ذلك.","a":true,"why":"ذكره الكتاب نقلًا عن اللائحة.","src":"المهر المدون في العقد هو المهر المسمى، ما لم يصادق الزوجان على خلاف ذلك","p":"98"},{"id":"b4-047","type":"tf","ch":"ch3","part":"b4","art":35,"q":"لا يصح للزوجين إبرام عقد جديد بعد عقد فاسد أو باطل إلا بعد حكم قضائي بفسخ العقد السابق.","a":false,"why":"يصح دون الحاجة إلى حكم قضائي، مع مراعاة إجراءات التوثيق.","src":"يصح للزوجين إبرام عقد زواج جديد مستوف الأركان والشروط، دون الحاجة إلى حكم قضائي بفسخ العقد السابق الفاسد أو الباطل","p":"99"},{"id":"b4-048","type":"tf","ch":"ch3","part":"b4","art":35,"q":"لا عدة على المرأة إذا أبرم معها الزوج نفسه عقدًا جديدًا بعد عقد فاسد أو باطل.","a":true,"why":"لأن الناكح واحد، فلا حاجة للتحقق من خلو الرحم.","src":"لأن المرأة هنا ليس عليها عدة؛ لأن الناكح واحد","p":"99"},{"id":"b4-049","type":"mcq","ch":"ch3","part":"b4","art":36,"q":"المهر في النظام:","opts":["المال الذي يدفعه الرجل للمرأة بسبب عقد الزواج","ركن من أركان العقد","شرط لصحة العقد","هدية الخطبة"],"a":0,"why":"نص المادة 36، وهو أثر من آثار العقد لا ركن ولا شرط.","src":"المهر هو المال الذي يدفعه الرجل للمرأة بسبب عقد الزواج","p":"99"},{"id":"b4-050","type":"tf","ch":"ch3","part":"b4","art":36,"q":"المهر ركن من أركان عقد الزواج.","a":false,"why":"هو أثر من آثار العقد، ليس ركنًا ولا شرطًا.","src":"وهو أثر من آثار عقد الزواج فليس ركنا فيه ولا شرطا كذلك","p":"100"},{"id":"b4-051","type":"tf","ch":"ch3","part":"b4","art":37,"q":"يصح أن يكون المهر منفعة، كتعليم يؤخذ عليه أجر.","a":true,"why":"كل ما صح اعتباره مالًا صح أن يكون مهرًا، والمال يشمل الأعيان والمنافع والحقوق.","src":"أو عمل يصح التزامه، كبناء أو زراعة أو تعليم ويأخذ عليه أجرا، فكل ذلك يصح أن يكون مهرا","p":"100"},{"id":"b4-052","type":"tf","ch":"ch3","part":"b4","art":38,"q":"إذا شرط الزوج على زوجته أن تشتري بالمهر أثاثًا لداره، لزمها الشرط.","a":false,"why":"المهر ملكها، لا تجبر على أي تصرف فيه، فلا يعتد بهذا الشرط.","src":"ولو شرط عليها الزوج ان تشتري به متاعا أو أثاثا لداره، فإنه لا يعتد بهذا الشرط","p":"101"},{"id":"b4-053","type":"mcq","ch":"ch3","part":"b4","art":38,"q":"مما يحق للمرأة في مهرها:","opts":["أن تهبه لزوجها بعد قبضه، أو تبرئ ذمته منه قبل قبضه إذا كانت كاملة الأهلية","ألا تتصرف فيه إلا بإذن وليها","أن يقبضه وليها وجوبًا","ألا تبرئ زوجها منه"],"a":0,"why":"وهي التي تقبضه، ولها أن توكل.","src":"ومما يتصل بهذه المادة أن يحق للمرأة أن تهب مهرها لزوجها، بعد قبضه، كما أن من حقها أن تبرئ ذمته منه، كلا أو بعضا قبل قبضه ما دامت كاملة الأهلية","p":"101"},{"id":"b4-054","type":"mcq","ch":"ch3","part":"b4","art":39,"q":"إذا ذكر في العقد أجل غير معلوم لتسليم المهر، فالمهر:","opts":["معجل","يحل بالفرقة البائنة","يحل بوفاة أحد الزوجين","باطل"],"a":0,"why":"لأن غاية التسليم غير معلومة، والأصل الحلول.","src":"ب - إذا ذكر أجل غير معلوم، فهو معجل","p":"101"},{"id":"b4-055","type":"mcq","ch":"ch3","part":"b4","art":39,"q":"إذا نص في العقد على تأجيل المهر ولم يذكر وقت الأجل، فإنه يحل:","opts":["بالفرقة البائنة، أو وفاة أحد الزوجين","عند المطالبة","بعد سنة من العقد","بالدخول"],"a":0,"why":"والفرقة البائنة صغرى كانت أو كبرى.","src":"ج - إذا لم يذكر وقت الأجل، فيحل بالفرقة البائنة، أو وفاة أحد الزوجين","p":"101"},{"id":"b4-056","type":"tf","ch":"ch3","part":"b4","art":39,"q":"إذا لم ينص في العقد على تأجيل المهر ولم يحدد وقت لتسليمه، تعين تسليمه عند المطالبة به.","a":true,"why":"لأنه حق لها، تطالب به في أي وقت.","src":"إذا لم ينص في العقد على تأجيل المهر ولم يحدد وقت معين لتسليمه، فيتعين تسليمه عند المطالبة به","p":"101"},{"id":"b4-057","type":"mcq","ch":"ch3","part":"b4","art":40,"q":"يتأكد المهر المسمى كاملًا أو مهر المثل بـ:","opts":["الدخول، أو الخلوة، أو وفاة أحد الزوجين","العقد وحده","الخطبة","التوثيق"],"a":0,"why":"أما العقد فيجب به المهر، ولا يتأكد إلا بهذه الثلاثة.","src":"يتأكد المهر المسمى كاملا - أو مهر المثل - بالدخول، أو الخلوة، أو وفاة أحد الزوجين","p":"103"},{"id":"b4-058","type":"tf","ch":"ch3","part":"b4","art":40,"q":"تستحق المطلقة قبل الدخول نصف المهر إن كان المهر مسمى.","a":true,"why":"لقوله تعالى: ﴿فنصف ما فرضتم﴾.","src":"تستحق المطلقة قبل الدخول نصف المهر إن كان المهر مسمى","p":"103"},{"id":"b4-059","type":"mcq","ch":"ch3","part":"b4","art":40,"q":"المطلقة قبل الدخول إذا لم يسم لها مهر:","opts":["لها متعة لا تتجاوز نصف مهر المثل","لها نصف مهر المثل","لها مهر المثل كاملًا","لا شيء لها"],"a":0,"why":"نص الفقرة الثالثة من المادة 40.","src":"وإلا فلها متعة لا تتجاوز نصف مهر المثل","p":"103"},{"id":"b4-060","type":"tf","ch":"ch3","part":"b4","art":40,"q":"لا متعة للمطلقة بعد الدخول في النظام.","a":true,"why":"ولا في المذهب الحنبلي، كما في حاشية الكتاب.","src":"وأما المطلقة بعد الدخول فلا متعة لها في المذهب الحنبلي ولا في النظام هنا","p":"104"},{"id":"b4-061","type":"tf","ch":"ch3","part":"b4","art":40,"q":"ورد في القرآن تحديد قدر المتعة.","a":false,"why":"لم يرد في القرآن ولا السنة تحديد، والمنظم حددها بألا تتجاوز نصف مهر المثل.","src":"ولم يرد في القرآن أو السنة تحديد لقدر المتعة، لكن المنظم هنا حددها بأن لا تتجاوز نصف مهر المثل","p":"104"},{"id":"b4-062","type":"mcq","ch":"ch3","part":"b4","art":41,"q":"ليس من حالات ثبوت مهر المثل في المادة 41:","opts":["السكوت عن تسمية المهر","نفي المهر في عقد الزواج","فساد المهر المسمى","تأجيل المهر"],"a":3,"why":"الحالات ثلاث: السكوت، والنفي، وفساد المسمى.","src":"1 - السكوت عن تسمية المهر. 2 - نفي المهر في عقد الزواج. 3 - فساد المهر المسمى","p":"106"},{"id":"b4-063","type":"mcq","ch":"ch3","part":"b4","art":41,"q":"يقدر مهر المثل باعتبار مهر مثيلاتها:","opts":["من قراباتها من جهة الأب والأم","من قريباتها لأبيها فقط","من نساء بلدها","من صديقاتها"],"a":0,"why":"المادة 18 من اللائحة.","src":"يكون تقدير مهر المثل للمرأة باعتبار مهر مثيلاتها من قراباتها من جهة الأب والأم","p":"106"},{"id":"b4-064","type":"tf","ch":"ch3","part":"b4","art":41,"q":"السكوت عن تسمية المهر يسمى نكاح التفويض، ويجب فيه مهر المثل.","a":true,"why":"لأنها لم تأذن في تزويجها إلا على صداق، لكنه مجهول.","src":"ويسمى نكاح التفويض ... فهنا يجب مهر المثل","p":"106"},{"id":"b4-065","type":"tf","ch":"ch3","part":"b4","art":41,"q":"إذا تزوج امرأة على ألا مهر لها فقبلت، فسد الزواج.","a":false,"why":"الاتفاق باطل ويجب مهر المثل، والشرط الفاسد لا يفسد الزواج.","src":"لأن هذا الاتفاق باطل، واشتراط نفي المهر فاسد، والشرط الفاسد لا يفسد الزواج","p":"106"},{"id":"b4-066","type":"mcq","ch":"ch3","part":"b4","art":41,"q":"معنى «لا وكس ولا شطط» في حديث ابن مسعود:","opts":["لا نقص ولا زيادة","لا تأجيل ولا تعجيل","لا مال ولا منفعة","لا شرط ولا عوض"],"a":0,"why":"الوكس النقص، والشطط مجاوزة القدر.","src":"الوكس هو النقص، والشطط مجاوزة القدر في كل شيء ... والمقصود لانقص ولا زيادة","p":"106"},{"id":"b4-067","type":"essay","ch":"ch3","part":"b4","art":30,"q":"قارن بين الزواج الباطل والزواج الفاسد: في الحقيقة، والحاجة إلى الفرقة، والآثار قبل الدخول وبعده.","a":"الحقيقة:\n- الباطل: تخلف فيه ركن أو شرط صحة، أو اشترط فيه ما ينافي استمراره أو جعل مقابل زواج آخر (م32). ولا يعترف به الشارع.\n- الفاسد: اختل فيه شرط مختلف فيه، كالنكاح بلا ولي أو بلا شهود أو زواج المحرم، وفيه شبهة.\n\nالفرقة:\n- الباطل: لا يحتاج إلى فرقة، ولها أن تتزوج غيره بعد الاستبراء بالعدة إن كان قد دخل بها.\n- الفاسد: تفسخه المحكمة، ولا تتزوج قبل الطلاق أو الفسخ.\n\nقبل الدخول:\n- الباطل: لا أثر له.\n- الفاسد: لا أثر له إلا الطلاق إن أوقعه الزوج، فيقع بائنًا بينونة صغرى.\n\nبعد الدخول:\n- الباطل (م33): العدة، وحرمة المصاهرة، ومهر المثل ما لم يسم مهر إن كانت لا تعلم حكم العقد.\n- الفاسد (م34)، ستة آثار بالدخول وحده:\n  1. المهر المسمى.\n  2. ثبوت النسب.\n  3. العدة.\n  4. حرمة المصاهرة.\n  5. النفقة ما لم تعلم الفساد.\n  6. وقوع الطلاق بائنًا.\n\nوإذا جهل الزوجان حكم الباطل، طبقت عليه آثار الفاسد بعد الدخول (م34/3).","p":"92–98"},{"id":"b4-068","type":"essay","ch":"ch3","part":"b4","art":27,"q":"اذكر أقسام الشروط في عقد الزواج مع التمثيل، ثم بيّن كيف يثبت الشرط في النظام.","a":"القسم الأول: الشروط الصحيحة، ونوعاها:\n1. ما وافق مقتضى العقد، فاشتراطه تأكيد، كتسليم الزوجة نفسها واستحقاقها المهر.\n2. ما فيه منفعة لأحد الزوجين ولا يلزم بأصل العقد، كاشتراطها ألا ينقلها من بلدها، أو اشتراطه أن تسكن مع أهله (م27/1).\n\nالقسم الثاني: الشروط الباطلة، ونوعاها:\n1. باطل لا يبطل العقد، كاشتراط عدم المهر أو القسم أو النفقة (م29/2).\n2. باطل يبطل العقد: ما ينافي استمراره كالمتعة، أو جعل العقد مقابل آخر كالشغار (م29/1).\n\nإثبات الشرط (م27/2): لا يثبت به خيار الفسخ إلا بطريقين:\n1. الكتابة في وثيقة العقد.\n2. إقرار المشترط عليه.\nولا عبرة بما يجري في الخطبة، ولا بالوعود بعد العقد.","p":"81–83"},{"id":"b4-069","type":"essay","ch":"ch3","part":"b4","art":28,"q":"ما أثر عدم الوفاء بالشرط في عقد الزواج؟ ومتى يسقط حق الفسخ؟","a":"إذا لم يف أحد الزوجين بما شرطه الآخر، فللمشترط طلب الفسخ متى شاء، فالخيار على التراخي (م28).\n- إن كان عدم الوفاء من الزوج فالفسخ بلا عوض.\n- إن كان من الزوجة فبعوض لا يزيد على المهر.\n\nوسوى النظام بين الزوجين في حق الفسخ عند فوات أي صفة مشترطة.\n\nيسقط حق الفسخ بالإسقاط الصريح فقط، ولا اعتبار بالإسقاط الضمني كالسكوت، بخلاف المذهب الحنبلي.\n\nومن الأدلة:\n- حديث «أحق الشروط أن توفوا به ما استحللتم به الفروج».\n- قول عمر: «إن مقاطع الحقوق عند الشروط».","p":"84–86"},{"id":"b4-070","type":"essay","ch":"ch3","part":"b4","art":39,"q":"بيّن أحكام تعجيل المهر وتأجيله في المادة 39.","a":"يجوز الاتفاق على تأجيل المهر كله أو بعضه، ويكون دينًا.\n\nإذا لم ينص على التأجيل ولم يحدد وقت للتسليم: تعيّن تسليمه عند المطالبة.\n\nإذا نص على التأجيل:\n1. أجل معلوم، كتاريخ معين: يحل بحلول الأجل.\n2. أجل غير معلوم، كرجوع فلان من السفر: فهو معجل، لأن الأصل الحلول.\n3. لم يذكر وقت الأجل: يحل بالفرقة البائنة صغرى أو كبرى، أو بوفاة أحد الزوجين.","p":"101–102"},{"id":"b4-071","type":"essay","ch":"ch3","part":"b4","art":40,"q":"متى يجب المهر ومتى يتأكد؟ وما حكم المطلقة قبل الدخول؟ ومتى يثبت مهر المثل؟","a":"يجب المهر بعقد الزواج الصحيح.\n\nويتأكد كاملًا، المسمى أو مهر المثل، في ثلاثة مواضع:\n1. الدخول.\n2. الخلوة الصحيحة.\n3. وفاة أحد الزوجين ولو قبل الدخول.\n\nالمطلقة قبل الدخول:\n- إن سمي لها مهر فلها نصفه.\n- وإلا فلها متعة لا تتجاوز نصف مهر المثل. ولم يحدد القرآن ولا السنة قدرها، والمنظم حددها.\n- ولا متعة للمطلقة بعد الدخول في النظام.\n\nيثبت مهر المثل في ثلاث حالات (م41):\n1. السكوت عن التسمية، وهو نكاح التفويض.\n2. نفي المهر، فيبطل الشرط ويصح العقد.\n3. فساد المسمى.\nويقدّر بمهر مثيلاتها من قراباتها من جهة الأب والأم.","p":"103–107"},{"id":"b4-072","type":"essay","ch":"ch3","part":"b4","art":29,"q":"اذكر العقود التي يبطل فيها عقد الزواج بسبب الشرط، مع تعريف كل منها ودليله.","a":"ضابطها: كل عقد نهى عنه الشرع وأبطله، وهي ثلاثة:\n\n1. زواج المحلل: أن يتزوجها بشرط أنه متى حللها للأول طلقها، أو ينوي ذلك، أو يتفقا عليه قبل العقد. فيبطل في جميع الأحوال، لحديث «لعن الله المحلل والمحلل له». والعبرة بنية الزوج المحلل لا بنية الزوجة ووليها.\n\n2. زواج المتعة: النكاح إلى مدة معينة، كشهر أو سنة، وقد حرمه الله إلى يوم القيامة. وهو مع التحليل ينافيان استمرار العقد.\n\n3. زواج الشغار: أن يزوج الولي موليته بشرط أن يزوجه الآخر موليته. وقد أجمع أهل العلم على تحريمه، فهو باطل، ولم يشترط المنظم فيه عدم المهر. فإن سمي لكل منهما مهر مستقل كامل، بلا حيلة، مع موافقة المرأتين، صح.","p":"87–89"},{"id":"b5-001","type":"mcq","ch":"ch4","art":42,"q":"ليس من الحقوق المشتركة بين الزوجين في المادة 42:","opts":["حسن المعاشرة بالمعروف","عدم إضرار أحدهما بالآخر ماديًا أو معنويًا","النفقة بالمعروف","المحافظة على مصلحة الأسرة"],"a":2,"why":"النفقة بالمعروف حق للزوجة على زوجها.","src":"وعلى الزوج النفقة بالمعروف، والعدل بين الزوجات في القسم والنفقة الواجبة","p":"109"},{"id":"b5-002","type":"tf","ch":"ch4","art":42,"q":"عدم امتناع أحد الزوجين عن الإنجاب إلا بموافقة الآخر من الحقوق المشتركة بينهما.","a":true,"why":"لأن الإنجاب حق لهما جميعًا، ومقصد من مقاصد النكاح.","src":"عدم امتناع أحد الزوجين عن المعاشرة الزوجية أو الإنجاب إلا بموافقة الطرف الآخر","p":"109"},{"id":"b5-003","type":"mcq","ch":"ch4","art":42,"q":"من حقوق الزوج على زوجته في المادة 42:","opts":["الطاعة بالمعروف، وإرضاع أولادهما ما لم يكن هناك مانع","النفقة بالمعروف","العدل بين الزوجات","تهيئة المسكن"],"a":0,"why":"أما النفقة والعدل فمن حقوق الزوجة.","src":"وعلى الزوجة الطاعة بالمعروف، وإرضاع أولادهما ما لم يكن هناك مانع","p":"109"},{"id":"b5-004","type":"tf","ch":"ch4","art":42,"q":"ينفذ الحكم الصادر على الزوجة بالعودة إلى بيت الزوجية جبرًا.","a":false,"why":"نصت المادة 75 من نظام التنفيذ على أنه لا ينفذ جبرًا.","src":"لا ينفذ الحكم الصادر على الزوجة بالعودة إلى بيت الزوجية جبرا","p":"112"},{"id":"b5-005","type":"tf","ch":"ch4","art":42,"q":"إذا امتنعت الزوجة عن تنفيذ حكم العودة إلى بيت الزوجية سقط حقها في حضانة ولدها.","a":false,"why":"تسقط الحقوق المتعلقة بالعقد كالنفقة والسكنى، أما المتعلقة بالولادة فباقية.","src":"سقوط حقوقها الزوجية لا يعني سقوط حقها في حضانة ولدها أو زيارته","p":"112"},{"id":"b5-006","type":"mcq","ch":"ch4","art":42,"q":"إذا امتنعت الزوجة من تنفيذ حكم عودتها إلى بيت الزوجية:","opts":["تجبر على التنفيذ","لا تجبر، لكن لا حق لها في النفقة وتوابعها ما دامت رافضة","تسقط حضانتها","يفسخ النكاح تلقائيًا"],"a":1,"why":"وفي ذلك رفق بالمرأة ومراعاة لاختيارها.","src":"ففي حال امتناع المرأة من تنفيذ الحكم فلا تجبر عليه، لكن لا يكون لها الحق في النفقة وما يتبعها من الحقوق الزوجية ما دامت رافضة لتنفيذ الحكم","p":"112"},{"id":"b5-007","type":"tf","ch":"ch4","art":42,"q":"العدل الواجب بين الزوجات هو مطلق التساوي في كل شيء، ومنه المحبة والميل القلبي.","a":false,"why":"العدل إيتاء كل ذي حق حقه، وما لا يقدر عليه كالمحبة لا يلزم العدل فيه.","src":"والعدل هو إيتاء كل ذي حق حقه مما وجب عليه، وليس مطلق التساوي","p":"116"},{"id":"b5-008","type":"mcq","ch":"ch4","art":42,"q":"إذا تزوج بكرًا على زوجاته:","opts":["مكث عندها أسبوعًا ثم قسم بين زوجاته","مكث عندها ثلاثًا ثم قسم","خيرها بين ثلاث وأسبوع","قسم من أول ليلة"],"a":0,"why":"لحديث أنس: من السنة إذا تزوج البكر على الثيب أقام عندها سبعًا وقسم.","src":"فإن كانت الزوجة الجديدة بكرا: مكث عندها أسبوعا، ثم قسم بين زوجاته","p":"117"},{"id":"b5-009","type":"mcq","ch":"ch4","art":42,"q":"إذا تزوج ثيبًا على زوجاته:","opts":["مكث عندها أسبوعًا وجوبًا","خيرها بين أن يمكث عندها ثلاثًا أو أسبوعًا، فإن مكث أسبوعًا مكث عند كل زوجة أسبوعًا","مكث عندها يومًا واحدًا","لا يخصها بشيء"],"a":1,"why":"لحديث أم سلمة: إن شئت سبعت لك، وإن سبعت لك سبعت لنسائي.","src":"وإن كانت ثيبا: فإنه يخيرها بين أن يمكث عندها ثلاثا أو أسبوعا، فإن مكث عندها أسبوعا، فإنه يمكث عند كل زوجة أسبوعا","p":"117"},{"id":"b5-010","type":"tf","ch":"ch4","art":42,"q":"يسقط القسم بما تسقط به النفقة، وذلك في نشوز الزوجة وسفرها.","a":true,"why":"هما الموضعان اللذان ذكرهما الكتاب.","src":"ويسقط القسم بما تسقط به النفقة، وذلك في موضعين: 1 - نشوز الزوجة. 2 - سفرها","p":"117"},{"id":"b5-011","type":"tf","ch":"ch4","art":42,"q":"للزوج أن يسافر بمن شاء من زوجاته دون قرعة ولا رضاهن.","a":false,"why":"ليس له ذلك إلا بقرعة أو برضاهن، كما كان النبي ﷺ يقرع بين نسائه.","src":"ليس للزوج أن يسافر بإحداهن إلا بقرعة بين الزوجات أو برضاهن","p":"118"},{"id":"b5-012","type":"tf","ch":"ch4","art":42,"q":"يقسم الزوج لزوجته الحائض والنفساء والمريضة.","a":true,"why":"لأن القصد السكن والأنس، ويحصل بمبيته عندها ولو لم يطأ.","src":"يقسم الزوج لزوجته الحائض والنفساء والمريضة؛ لأن القصد السكن والأنس","p":"118"},{"id":"b5-013","type":"tf","ch":"ch4","art":42,"q":"إذا وهبت الزوجة ليلتها لضرتها ثم رجعت وطالبت بقسمها، قسم لها الزوج في المستقبل.","a":true,"why":"لأن هبتها في حكم الهبة التي لم تقبض، وحق المبيت يتجدد بتجدد الزمن.","src":"وإذا رجعت الواهبة وطالبت بقسمها، قسم لها الزوج في المستقبل","p":"118"},{"id":"b5-014","type":"mcq","ch":"ch4","art":42,"q":"الأصل في وقت القسم بين الزوجات:","opts":["الليل دائمًا","الوقت الذي لا يتعلق فيه بحث الزوج عن المعيشة","النهار دائمًا","ما تختاره الزوجة الأولى"],"a":1,"why":"فإن كان عمله نهارًا فعماد القسم الليل، وإن كان ليلًا فعماده النهار.","src":"الأصل في القسم: أن يكون في الوقت الذي لا يتعلق فيه بحث الزوج عن المعيشة","p":"116"},{"id":"b5-015","type":"tf","ch":"ch4","art":42,"q":"يجوز للزوجة أن تسامح زوجها عن حقها في القسم والنفقة ليمسكها وتبقى في عصمته.","a":true,"why":"لقوله تعالى: ﴿فلا جناح عليهما أن يصلحا بينهما صلحا والصلح خير﴾.","src":"يجوز للزوجة أن تسامح زوجها عن حقها في القسم والنفقة ليمسكها وتبقى في عصمته","p":"118"},{"id":"b5-016","type":"mcq","ch":"ch4","art":42,"q":"علّل الكتاب جعل القوامة في الأسرة للرجل بـ:","opts":["اختلاطه بالمجتمع العام، وقدرته على تغليب حكم العقل، وشعوره بالمضرة المالية إن فسدت الحياة الزوجية","كثرة ماله فقط","كبر سنه","العرف وحده"],"a":0,"why":"هذه العلل الثلاث التي ذكرها الكتاب.","src":"بحكم اختلاطه بالمجتمع العام، ولأنه أقدر على تغليب حكم العقل وضبط المواقف والعواطف، ولأنه يشعر بالمضرة المالية وغيرها إن فسدت الحياة الزوجية أو انقطعت","p":"120"},{"id":"b5-017","type":"tf","ch":"ch4","art":42,"q":"يلتزم الأب بأجرة إرضاع ولده الصغير في الحولين إذا تعذر على الأم إرضاعه، وتعد من النفقة.","a":true,"why":"نصت عليه المادة 61 من النظام كما نقل الكتاب.","src":"فقد نصت المادة (61) من النظام على التزام الأب بأجرة إرضاع ولده الصغير في الحولين إذا تعذر على الأم إرضاعه، وأن ذلك يعد من النفقة","p":"122"},{"id":"b5-018","type":"tf","ch":"ch4","art":42,"q":"إتيان الحائض محرم بإجماع أهل العلم.","a":true,"why":"لقوله تعالى: ﴿فاعتزلوا النساء في المحيض﴾. وقيّد الكتاب ما يباح له بقوله: «وله أن يلصق بشرته ببشرتها فيما دون الإزار»، لحديث عائشة.","src":"إتيان الحائض لا يجوز بإجماع أهل العلم","p":"113"},{"id":"b5-019","type":"mcq","ch":"ch4","art":42,"q":"من ضوابط زينة المرأة التي ذكرها الكتاب:","opts":["ألا يكون فيها تغيير لخلق الله، ولا مانع من معالجة التشوه الخلقي","ألا تلبس الذهب","ألا تتزين لزوجها","ألا تلبس الحرير"],"a":0,"why":"والحرير والذهب رخص فيهما للنساء.","src":"ألا يكون فيها تغيير لخلق الله ... أما إذا كان لمعالجة تشوه خلقي، فلا مانع منه","p":"111"},{"id":"b5-020","type":"tf","ch":"ch4","art":43,"q":"للزوجة الامتناع عن الدخول والانتقال إلى بيت الزوجية حتى تقبض مهرها الحال ويهيئ الزوج لها المسكن المناسب، ولها النفقة خلال هذه المدة.","a":true,"why":"نص الفقرة الأولى من المادة 43.","src":"للزوجة الامتناع عن الدخول والانتقال إلى بيت الزوجية حتى تقبض مهرها الحال، ويهيئ الزوج لها المسكن المناسب، ولها الحق في النفقة خلال هذه المدة","p":"122"},{"id":"b5-021","type":"tf","ch":"ch4","art":43,"q":"إذا رضيت الزوجة بالدخول قبل قبض مهرها الحال سقط مهرها.","a":false,"why":"يبقى دينًا في ذمة الزوج، تطالب به في أي وقت.","src":"فيبقى دينا في ذمة الزوج، لها المطالبة به في أي وقت شاءت","p":"122"},{"id":"b5-022","type":"mcq","ch":"ch4","art":43,"q":"إذا رضيت الزوجة بالدخول قبل قبض مهرها الحال، ثم أرادت الامتناع بعد أن هيأ لها المسكن المناسب:","opts":["لها الامتناع","ليس لها الامتناع، ويبقى المهر دينًا تطالب به متى شاءت","يفسخ النكاح","يسقط المهر والنفقة"],"a":1,"why":"لأن رضاها بالدخول علامة إسقاطها حقها في الامتناع، والساقط لا يعود.","src":"وليس لها الامتناع بعد ذلك إذا هيأ لها المسكن المناسب","p":"122"},{"id":"b5-023","type":"mcq","ch":"ch4","art":43,"q":"يحق للزوجة الامتناع عن الدخول مع وجوب نفقتها في حالتين:","opts":["عدم تسليم المهر، وعدم تهيئة المسكن المناسب","عدم تقديم الهدايا، وعدم إقامة الوليمة","مرضها، وسفرها","عدم رضا أهلها، وعدم التوثيق"],"a":0,"why":"هما الحالتان اللتان استخلصهما الكتاب من الفقرة الأولى.","src":"الحالة الأولى: عدم تسليم المهر. الحالة الثانية، عدم تهيئة المسكن المناسب","p":"123"},{"id":"b5-024","type":"tf","ch":"ch4","art":43,"q":"إذا امتنعت الزوجة عن الدخول لعدم تسليم مهرها الحال، فلها المطالبة بنفقتها خلال مدة الامتناع.","a":true,"why":"لأن الإخلال من الزوج وليس منها.","src":"ويحق لها المطالبة بنفقتها خلال هذه المدة؛ لأن الإخلال من الزوج وليس منها","p":"123"},{"id":"b5-025","type":"tf","ch":"ch4","art":43,"q":"أخذ المنظم في الفقرة الثانية من المادة 43 بقول جمهور أهل العلم.","a":true,"why":"وهو أنه ليس لها الامتناع بعد دخولها برضاها قبل قبض المعجل.","src":"وقد أخذ المنظم بقولهم، وجاء نص الفقرة الثانية من هذه المادة موافقا لما قرروه","p":"124"},{"id":"b5-026","type":"tf","ch":"nafaqa","art":44,"q":"نفقة الزوجة على زوجها ولو كانت موسرة.","a":true,"why":"استثناء من قاعدة أن نفقة كل إنسان في ماله.","src":"نفقة كل إنسان في ماله، إلا الزوجة فنفقتها على زوجها ولو كانت موسرة","p":"125"},{"id":"b5-027","type":"mcq","ch":"nafaqa","art":44,"q":"إذا لم يوجد لمجهول الأبوين مال، ولم يتبرع أحد بالإنفاق عليه، فنفقته على:","opts":["الدولة","من وجده","دار الرعاية وحدها","الجمعيات الخيرية"],"a":0,"why":"وهذا يؤكد مسؤولية الدولة عن رعاياها.","src":"إن لم يوجد لمجهول الأبوين مال، ولم يتبرع أحد بالإنفاق عليه؛ كانت نفقته على الدولة","p":"125"},{"id":"b5-028","type":"mcq","ch":"nafaqa","art":44,"q":"علة وجوب نفقة الزوجة على زوجها:","opts":["أنها احتبست نفسها على الزوج لحقه وواجبه","فقرها وحاجتها","العرف وحده","أنه دفع لها المهر"],"a":0,"why":"عملًا بالأصل: كل من احتبس لحق غيره ومنفعته فنفقته على من احتبس لأجله.","src":"ذلك لأن الزوجة إذا احتبست نفسها على الزوج لحقه وواجبه فنفقتها تكون واجبة عليه","p":"125"},{"id":"b5-029","type":"tf","ch":"nafaqa","art":44,"q":"يقصد الفقهاء بحبس الزوجة نفسها لزوجها السجن المنزلي.","a":false,"why":"يراد به أنها تحبس عن الزواج بغيره، وتؤدي حقوقه مقابل حقوقها.","src":"لا يقصد به السجن المنزلي كما فهمه بعض فقهاء القانون، بل يراد به أن الزوجة تحبس عن الزواج بغيره","p":"126"},{"id":"b5-030","type":"mcq","ch":"nafaqa","art":45,"q":"تشمل النفقة في المادة 45:","opts":["الطعام، والكسوة، والسكن، والحاجيات الأساسية","الطعام والكسوة فقط","السكن وحده","الطعام والسكن والسفر"],"a":0,"why":"بحسب العرف وما تقرره الأحكام النظامية.","src":"وتشمل: الطعام، والكسوة، والسكن، والحاجيات الأساسية، بحسب العرف","p":"128"},{"id":"b5-031","type":"tf","ch":"nafaqa","art":45,"q":"الكسوة بالمعروف هي الكسوة التي جرت عادة أمثالها بلبسه.","a":true,"why":"تعريف الكتاب، وقد أجمع أهل العلم على وجوب الكسوة.","src":"والكسوة بالمعروف: هي الكسوة التي جرت عادة أمثالها بلبسه","p":"129"},{"id":"b5-032","type":"tf","ch":"nafaqa","art":45,"q":"يدخل في الحاجيات الأساسية للزوجة وسائل النقل والاتصالات بحسب العرف.","a":true,"why":"وكل ما يعتبر حاجة للزوجة يدخل في مفهوم النفقة.","src":"فيدخل فيها مثلا وسائل النقل والاتصالات وما لا غنى عنه في الحياة المعاصرة","p":"130"},{"id":"b5-033","type":"tf","ch":"nafaqa","art":45,"q":"أجرة التطبيب لا تدخل في نفقة الزوجة.","a":false,"why":"تدخل فيها، لأنها من المعاشرة بالمعروف.","src":"ويدخل فيه أجرة التطبيب فهي من المعاشرة بالمعروف مع الزوجة","p":"130"},{"id":"b5-034","type":"mcq","ch":"nafaqa","art":45,"q":"رأي المؤلف في عبارة «بحسب العرف» في المادة 45:","opts":["خاصة بالحاجيات الأساسية","تشمل الطعام والكسوة والسكن والحاجيات الأساسية جميعًا","خاصة بالسكن","خاصة بالكسوة"],"a":1,"why":"ولا خلاف في شمولها الحاجيات الأساسية.","src":"والذي أراه أنه يشمل الجميع، فليس خاصا بالحاجيات الأساسية فقط","p":"131"},{"id":"b5-035","type":"tf","ch":"nafaqa","art":45,"q":"ليس للحاضن أن يطالب بأجرة السكن إذا هيأ من وجبت عليه النفقة سكنًا مناسبًا للمحضون.","a":true,"why":"ذكره الكتاب في مسائل سكن المحضون.","src":"وكذلك ليس للحاضن أن يطالب بأجرة السكن إذا هيأ من وجبت عليه النفقة سكنا مناسبا للمحضون","p":"130"},{"id":"b5-036","type":"tf","ch":"nafaqa","art":45,"q":"إذا حكم بالنفقة للمحضون، ضمن الحكم تسليمها للحاضن دون تعيينه، ويحل الحاضن اللاحق محل السابق في تسلمها.","a":true,"why":"قررته اللائحة التنفيذية كما نقل الكتاب.","src":"إذا حكم بالنفقة للمحضون: ضمن الحكم تسليمها للحاضن دون تعيينه، ويحل الحاضن اللاحق محل الحاضن السابق في تسلم النفقة","p":"131"},{"id":"b5-037","type":"mcq","ch":"nafaqa","art":46,"q":"يراعى في تقدير النفقة في النظام:","opts":["حال المنفق عليه، وسعة المنفق","حال الزوج وحده","حال الزوجة وحدها","العرف وحده"],"a":0,"why":"نص المادة 46، جمعًا بين الأدلة.","src":"يراعى في تقدير النفقة: 1 - حال المنفق عليه. 2 - وسعة المنفق","p":"131"},{"id":"b5-038","type":"mcq","ch":"nafaqa","art":46,"q":"القول بأن المعتبر في تقدير النفقة حال الزوجة مذهب:","opts":["الحنفية","المالكية","الشافعية","الحنابلة"],"a":1,"why":"واستدلوا بحديث هند: خذي ما يكفيك وولدك بالمعروف.","src":"وبين من يرى أن المعتبر هو حال الزوجة كما هو مذهب المالكية","p":"132"},{"id":"b5-039","type":"tf","ch":"nafaqa","art":46,"q":"القول بأن المعتبر في تقدير النفقة حال الزوج مذهب الشافعية وغيرهم.","a":true,"why":"ودليلهم: ﴿لينفق ذو سعة من سعته﴾.","src":"إن المعتبر هو حال الزوج كما هو مذهب الشافعية وغيرهم","p":"131"},{"id":"b5-040","type":"tf","ch":"nafaqa","art":46,"q":"ما أخذ به النظام في تقدير النفقة هو مذهب الحنابلة، وعليه الفتوى عند الحنفية.","a":true,"why":"جمعًا بين الأدلة، وهي طريقة المحققين.","src":"وهذا هو مذهب الحنابلة وعليه الفتوى عند الحنفية، وذلك جمعا بين الأدلة","p":"131"},{"id":"b5-041","type":"tf","ch":"nafaqa","art":47,"q":"الأصل في النفقة أن تكون نقدًا.","a":false,"why":"الأصل أن تكون عينًا أو منفعة، والنقد استثناء.","src":"لأن الأصل في النفقة أن تكون عينا أو منفعة لا أن تكون نقدا","p":"132"},{"id":"b5-042","type":"mcq","ch":"nafaqa","art":47,"q":"يفهم من الفقرة الثانية من المادة 47 أن الواجب في النفقة:","opts":["إتاحتها لا تمليكها","تمليكها نقدًا","تسليمها كل شهر","تسليمها للولي"],"a":0,"why":"فيعد من الإنفاق إتاحة المال عينًا أو منفعة.","src":"ويفهم من هذه الفقرة أن الواجب في النفقة هو إتاحتها لا تمليكها","p":"133"},{"id":"b5-043","type":"mcq","ch":"nafaqa","art":48,"q":"لا تسمع دعوى زيادة النفقة أو إنقاصها قبل مضي:","opts":["ستة أشهر","سنة","سنتين","ثلاث سنوات"],"a":1,"why":"من تاريخ صدور الحكم بالنفقة، إلا في الظروف الاستثنائية.","src":"لا تسمع دعوى زيادة النفقة أو إنقاصها قبل مضي (سنة) من تاريخ صدور الحكم بالنفقة","p":"133"},{"id":"b5-044","type":"tf","ch":"nafaqa","art":48,"q":"تحسب زيادة النفقة أو نقصانها اعتبارًا من تاريخ رفع الدعوى.","a":false,"why":"تحسب من تاريخ صدور الحكم.","src":"تحسب زيادة النفقة أو نقصانها اعتبارا من تاريخ صدور الحكم","p":"133"},{"id":"b5-045","type":"tf","ch":"nafaqa","art":48,"q":"للقاضي أن يسمع دعوى زيادة النفقة قبل مضي السنة في الظروف الاستثنائية التي تقدرها المحكمة.","a":true,"why":"حتى لا يكون المنع على إطلاقه، وذلك وفق سلطته التقديرية.","src":"فترك للقاضي أمر قبول الدعوى وسماعها قبل مضي السنة وفق سلطته التقديرية","p":"134"},{"id":"b5-046","type":"mcq","ch":"nafaqa","art":48,"q":"علة منع سماع دعوى زيادة النفقة أو إنقاصها قبل مضي سنة:","opts":["لتستقر الأحكام القضائية في النفقات، ومنعًا للكيد بين المتقاضين","لتخفيف العبء على المحاكم","لأن النفقة لا تتغير","لمصلحة الزوج وحده"],"a":0,"why":"نص عليه الكتاب في شرح الفقرة الثانية.","src":"وما ذاك إلا لتستقر الأحكام القضائية في مجال النفقات بين الزوجين، ومنعا للكيد عند المتقاضين","p":"133"},{"id":"b5-047","type":"mcq","ch":"nafaqa","art":49,"q":"تستحق النفقة المستمرة للزوجة والأولاد والوالدين من:","opts":["تاريخ إقامة الدعوى للمطالبة بها","تاريخ تصديق الحكم","تاريخ الطلاق","تاريخ العقد"],"a":0,"why":"لأن تصديق الحكم كاشف له لا منشئ.","src":"تستحق النفقة المستمرة للزوجة والأولاد والوالدين من تاريخ إقامة الدعوى للمطالبة بها","p":"134"},{"id":"b5-048","type":"tf","ch":"nafaqa","art":49,"q":"النفقة المستمرة دين ممتاز يقدم على سائر الديون.","a":true,"why":"لأنها وجبت لإقامة الأولاد، وتقدم على سائر الديون عدا نفقات التنفيذ والدين برهن.","src":"وتعد دينا ممتازا يقدم على سائر الديون","p":"134"},{"id":"b5-049","type":"tf","ch":"nafaqa","art":49,"q":"النفقة الماضية المتراكمة دين ممتاز كالنفقة المستمرة.","a":false,"why":"تخضع لحكم باقي الديون، فهي دين عادي.","src":"بخلاف النفقة الماضية، فتخضع إلى حكم باقي الديون","p":"134"},{"id":"b5-050","type":"mcq","ch":"nafaqa","art":49,"q":"علّل الكتاب استحقاق النفقة المستمرة من تاريخ إقامة الدعوى لا من تاريخ تصديق الحكم بأن:","opts":["تصديق الحكم كاشف له لا منشئ","الدعوى أسبق في الزمن فقط","القاضي يقدر ذلك","العرف جرى بذلك"],"a":0,"why":"نص الكتاب على هذه العلة.","src":"وعلة ذلك أن تصديق الحكم هو كاشف له لا منشئ","p":"135"},{"id":"b5-051","type":"tf","ch":"nafaqa","art":49,"q":"الأصل أنه لا مقاصة في النفقة المستمرة إذا كانت الزوجة غير موسرة.","a":true,"why":"وتجوز المقاصة إن كانت موسرة قادرة على الإنفاق على نفسها وهي مدينة للزوج.","src":"المقاصة في النفقة المستمرة، والأصل أنه لا مقاصة فيها إذا كانت الزوجة غير موسرة","p":"136"},{"id":"b5-052","type":"tf","ch":"nafaqa","art":49,"q":"تجوز المقاصة في النفقة الماضية.","a":true,"why":"لأنها دين من الديون.","src":"المقاصة في النفقة الماضية: فهذه دين من الديون ويجوز فيها المقاصة","p":"136"},{"id":"b5-053","type":"mcq","ch":"nafaqa","art":50,"q":"النفقة المؤقتة هي:","opts":["نفقة يحكم بها القضاء لفترة معينة أثناء نظره للنفقة المستمرة","نفقة العدة","نفقة الأقارب","نفقة الحضانة"],"a":0,"why":"حتى لا تتعطل مصالح المنفق عليه وقت نظر الدعوى الأصلية.","src":"ويراد بها: نفقة يحكم بها القضاء لفترة معينة أثناء نظره للنفقة المستمرة","p":"137"},{"id":"b5-054","type":"tf","ch":"nafaqa","art":50,"q":"يشترط للحكم بالنفقة المؤقتة حضور الطرف الآخر.","a":false,"why":"يحكم بها بناء على طلب المستحق دون حضور الطرف الآخر.","src":"الحكم بنفقة مؤقتة لمستحقها بناء على طلبه دون حضور الطرف الآخر","p":"137"},{"id":"b5-055","type":"mcq","ch":"nafaqa","art":50,"q":"إذا حكم بنفقة مؤقتة للأولاد أو الوالدين، ثم حكم بالنفقة المستمرة، فإنها تحسب:","opts":["من تاريخ الحكم بها، دون اعتبار لما حكم به من نفقة مؤقتة","بعد خصم المؤقتة","من تاريخ إقامة الدعوى مع المؤقتة","من تاريخ الحكم بالمؤقتة"],"a":0,"why":"أما الزوجة فتراعي المحكمة ما حكمت به من مؤقتة بشرط مطالبة الزوج أو الزوجة.","src":"إذا كان الحكم للأولاد أو الوالدين؛ فتحسب النفقة المستمرة من تاريخ الحكم بها، دون اعتبار لما حكمت به من نفقة مؤقتة","p":"138"},{"id":"b5-056","type":"tf","ch":"nafaqa","art":50,"q":"إذا كان الحكم بالنفقة المؤقتة للزوجة، راعت المحكمة عند الحكم بالمستمرة ما حكمت به من مؤقتة زيادة أو نقصًا، بشرط مطالبة الزوج أو الزوجة بذلك.","a":true,"why":"نقله الكتاب في شرح المادة 50.","src":"فعلى المحكمة عند الحكم بالنفقة المستمرة مراعاة ما حكمت به من نفقة مؤقتة زيادة أو نقصا، بشرط مطالبة الزوج أو الزوجة بذلك، بحسب الأحوال","p":"137"},{"id":"b5-057","type":"essay","ch":"ch4","art":42,"q":"اذكر الحقوق المشتركة بين الزوجين، وحقوق كل منهما على الآخر كما في المادة 42.","a":"الحقوق المشتركة خمسة:\n1. حسن المعاشرة بالمعروف وتبادل الاحترام، ويدخل فيها التزين.\n2. عدم إضرار أحدهما بالآخر ماديًا أو معنويًا، لحديث «لا ضرر ولا ضرار».\n3. عدم امتناع أحدهما عن المعاشرة أو الإنجاب إلا بموافقة الآخر.\n4. السكن في بيت الزوجية، بمبيت الزوج فيه وبقاء الزوجة معه.\n5. المحافظة على مصلحة الأسرة ورعاية الأولاد وحسن تربيتهم.\n\nحقوق الزوجة:\n1. النفقة بالمعروف، ولو كانت موسرة.\n2. العدل بين الزوجات في القسم والنفقة الواجبة. والعدل إيتاء كل ذي حق حقه لا مطلق التساوي، ولا يلزم في المحبة.\n\nحقوق الزوج:\n1. الطاعة بالمعروف، والقوامة له.\n2. إرضاع أولادهما ما لم يكن مانع، فإن وجد التزم الأب بأجرة الإرضاع في الحولين (م61).","p":"109–122"},{"id":"b5-058","type":"essay","ch":"ch4","art":43,"q":"بيّن أحكام امتناع الزوجة عن الدخول والانتقال إلى بيت الزوجية في المادة 43.","a":"للزوجة الامتناع عن الدخول والانتقال حتى تقبض مهرها الحال ويهيئ لها الزوج المسكن المناسب، ولها النفقة خلال المدة لأن الإخلال منه (م43/1).\n\nفحقها في الامتناع مع وجوب النفقة في حالتين:\n1. عدم تسليم المهر.\n2. عدم تهيئة المسكن المناسب.\n\nفإن قدم المعجل وهيأ المسكن لزمها إجابته، ولو رفضت بعد قبض المهر فله استرجاعه.\n\nوإن رضيت بالدخول قبل قبض المهر الحال (م43/2):\n- بقي دينًا في ذمته تطالب به متى شاءت.\n- وليس لها الامتناع بعد ذلك إذا هيأ لها المسكن، لأن رضاها إسقاط والساقط لا يعود.\nوهو قول جمهور أهل العلم، وبه أخذ المنظم.","p":"122–124"},{"id":"b5-059","type":"essay","ch":"nafaqa","art":46,"q":"ما الذي تشمله النفقة؟ وما المعتبر في تقديرها؟ مع بيان أقوال الفقهاء.","a":"تشمل النفقة أربعة أشياء (م45):\n1. الطعام والشراب.\n2. الكسوة التي جرت عادة أمثالها بلبسها.\n3. السكن اللائق بها.\n4. الحاجيات الأساسية، كوسائل النقل والاتصالات والخادمة لمن مثلها يُخدم، وأجرة التطبيب.\nوذلك كله بحسب العرف، ويرى المؤلف أن «بحسب العرف» تشمل الجميع.\n\nويراعى في تقديرها حال المنفق عليه وسعة المنفق (م46).\n\nوفي المسألة أقوال:\n- حال الزوج: مذهب الشافعية، لقوله تعالى ﴿لينفق ذو سعة من سعته﴾.\n- حال الزوجة: مذهب المالكية، لحديث هند «خذي ما يكفيك وولدك بالمعروف».\n- الجمع بينهما: مذهب الحنابلة وعليه الفتوى عند الحنفية، وبه أخذ النظام، وهو طريقة المحققين.","p":"128–132"},{"id":"b5-060","type":"essay","ch":"nafaqa","art":49,"q":"قارن بين النفقة المستمرة والنفقة الماضية، ثم بيّن المراد بالنفقة المؤقتة وأحكامها.","a":"النفقة المستمرة (الجارية):\n- للزوجة والأولاد والوالدين.\n- تستحق من تاريخ إقامة الدعوى لا من تصديق الحكم، لأن التصديق كاشف لا منشئ.\n- دين ممتاز يقدم على سائر الديون عدا نفقات التنفيذ والدين برهن، لأنها لإقامة الأولاد.\n- لا مقاصة فيها إن كانت الزوجة غير موسرة.\n\nالنفقة الماضية (المتراكمة):\n- دين عادي يخضع لحكم باقي الديون، لأن مستحقها ترك المطالبة.\n- تجوز فيها المقاصة.\n\nالنفقة المؤقتة: يحكم بها القضاء لفترة معينة أثناء نظر دعوى النفقة المستمرة، حتى لا تتعطل مصالح المستحق.\n- يحكم بها بطلب المستحق ولو لم يحضر الطرف الآخر.\n- حجيتها مؤقتة تزول بالفصل في الدعوى الأصلية.\n- إن كان الحكم للزوجة: تُراعى عند الحكم بالمستمرة بشرط مطالبة أحد الزوجين.\n- إن كان للأولاد أو الوالدين: تحسب المستمرة من تاريخ الحكم بها دون اعتبار للمؤقتة.","p":"134–138"},{"id":"b5-061","type":"essay","ch":"nafaqa","art":48,"q":"اذكر أحكام زيادة النفقة وإنقاصها في المادة 48 مع تعليل كل فقرة.","a":"1. تجوز زيادة النفقة أو إنقاصها تبعًا لتغير الأحوال، مع مراعاة المادة 46:\n- كتغير حال المنفق يسرًا أو عسرًا، أو تغير الحالة الاقتصادية.\n- لأن النفقة تتجدد بتجدد الزمان وتجب شيئًا فشيئًا.\n\n2. لا تسمع دعوى الزيادة أو الإنقاص قبل مضي سنة من صدور الحكم بالنفقة، إلا في الظروف الاستثنائية التي تقدرها المحكمة:\n- لتستقر الأحكام في النفقات، ومنعًا للكيد بين المتقاضين.\n- والاستثناء حتى لا يكون المنع على إطلاقه، فيُترك للقاضي وفق سلطته التقديرية.\n\n3. تحسب الزيادة أو النقصان من تاريخ صدور الحكم:\n- تحقيقًا للعدالة، وقطعًا للخلاف في بدء سريان المدة.","p":"133–134"}]}</script>
<script>
(function(){
"use strict";
var root = document.documentElement;
root.setAttribute('dir','rtl'); root.setAttribute('lang','ar');
var D = JSON.parse(document.getElementById('data').textContent);
var EXAM = new Date(D.exam).getTime();
var view = document.getElementById('view');

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* «…» in Claude's text marks book wording: render it in the book face */
function rich(s){ return esc(s).replace(/«([^»]+)»/g, '<span class="q-bk">$1</span>'); }
function pg(p){ return '<span class="chip pg">ص ' + esc(p) + '</span>'; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
var CH = {}; D.chapters.forEach(function(c){ CH[c.id] = c; });
var PT = {}; (D.parts || []).forEach(function(x){ PT[x.id] = x; });
function partReady(id){ return !!(PT[id] && PT[id].ready); }
function ready(chId){ return !!(CH[chId] && CH[chId].ready); }
function chTitle(id){ return CH[id] ? CH[id].short : ''; }
function artLabel(n){ return n === 0 ? 'المقدمة' : 'المادة ' + n; }
var Q = {}; D.questions.forEach(function(q){ Q[q.id] = q; });

/* ---------- state: this device first, then the account copy ---------- */
var KEY = 'ahkam-alusra-v1';
function fresh(){ return { v:1, updatedAt:0, plan:{}, q:{} }; }
var S = fresh();
try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.v === 1) S = p; } } catch (e) {}
var remoteRef = null, writing = false, again = false, timer = null, syncNote = 'يُحفظ تقدمك على هذا الجهاز.';
function persistLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function save(){ S.updatedAt = Date.now(); persistLocal(); if (remoteRef){ clearTimeout(timer); timer = setTimeout(flush, 1500); } }
function flush(retried){
  if (!remoteRef) return;
  if (writing){ again = true; return; }
  writing = true;
  remoteRef.set({ s: JSON.stringify(S), updatedAt: S.updatedAt }).then(function(){
    writing = false; if (again){ again = false; flush(); }
  }, function(e){
    writing = false;
    var code = e && e.code;
    if (code === 'unavailable' && !retried){ setTimeout(function(){ flush(true); }, 1500 + Math.random() * 2000); return; }
    if (code !== 'unavailable' && code !== 'resource_exhausted'){ remoteRef = null; syncNote = 'يُحفظ تقدمك على هذا الجهاز.'; }
  });
}
function adopt(r){
  try { var st = JSON.parse(r.s); if (st && st.v === 1 && (st.updatedAt || 0) > (S.updatedAt || 0)) { S = st; persistLocal(); render(); return true; } } catch (e) {}
  return false;
}
(function connect(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
    var db = r[0], user = r[1];
    if (!db || !user) return null;
    return user.id().then(function(uid){
      if (!uid) return null;
      var ref = db.doc('data/users/' + uid + '/progress');
      return ref.get().then(function(snap){
        remoteRef = ref; syncNote = 'يُحفظ تقدمك على حسابك، فيظهر على أي جهاز.';
        if (snap.exists){
          var d = snap.data() || {};
          if (!adopt(d) && (S.updatedAt || 0) > (d.updatedAt || 0)) flush();
        } else if (S.updatedAt) { flush(); }
        ref.onSnapshot(function(s){
          if (s.exists && !s.metadata.hasPendingWrites) adopt(s.data() || {});
        }, function(){ /* live sync stopped; local copy keeps working */ });
        render();
      });
    });
  }).catch(function(){});
})();

/* ---------- answers, mistakes, levels ---------- */
function rec(id){ return S.q[id] || { n:0, c:0, s:0, m:false }; }
function record(id, ok){
  var r = rec(id); r = { n:r.n + 1, c:r.c + (ok ? 1 : 0), s:r.s, m:r.m };
  if (ok){ if (r.m){ r.s += 1; if (r.s >= 2){ r.m = false; r.s = 0; } } }
  else { r.m = true; r.s = 0; }
  S.q[id] = r; save(); updateBadge();
}
function mistakes(){ return D.questions.filter(function(q){ var r = S.q[q.id]; return r && r.m; }); }
function updateBadge(){ var n = mistakes().length, b = document.getElementById('mistakesBadge'); b.textContent = n; b.hidden = n === 0; }
function statsFor(chId){
  var n = 0, c = 0;
  D.questions.forEach(function(q){ if (chId && q.ch !== chId) return; var r = S.q[q.id]; if (r){ n += r.n; c += r.c; } });
  return { n:n, c:c, pct: n ? Math.round(100 * c / n) : null };
}
function level(st){
  if (st.n < 10) return { k:'none', label:'لم يُقَس بعد' };
  if (st.pct >= 85) return { k:'top', label:'ممتاز' };
  if (st.pct >= 60) return { k:'mid', label:'جيد' };
  return { k:'low', label:'ضعيف' };
}

/* ---------- countdown ---------- */
function plural(n, one, two, few, many){ if (n === 1) return one; if (n === 2) return two; if (n >= 3 && n <= 10) return n + ' ' + few; return n + ' ' + many; }
function countdownText(){
  var ms = EXAM - Date.now();
  if (ms <= 0) return 'حان موعد الاختبار، وفقك الله';
  var h = Math.floor(ms / 3600000), d = Math.floor(h / 24); h = h % 24;
  var parts = [];
  if (d > 0) parts.push(plural(d, 'يوم', 'يومان', 'أيام', 'يومًا'));
  if (h > 0) parts.push(plural(h, 'ساعة', 'ساعتان', 'ساعات', 'ساعة'));
  if (!parts.length) parts.push('أقل من ساعة');
  return parts.join(' و');
}

/* ---------- plan ---------- */
function allTasks(){ var t = []; D.plan.forEach(function(day){ day.tasks.forEach(function(k){ t.push(k); }); }); return t; }
function planPct(){ var t = allTasks(); if (!t.length) return 0; var d = t.filter(function(k){ return S.plan[k.id]; }).length; return Math.round(100 * d / t.length); }
function todayKey(){ var n = new Date(); var y = n.getFullYear(), m = ('0' + (n.getMonth() + 1)).slice(-2), d = ('0' + n.getDate()).slice(-2); return y + '-' + m + '-' + d; }
function currentDay(){
  var t = todayKey();
  for (var i = 0; i < D.plan.length; i++){ if (D.plan[i].date === t) return { day:D.plan[i], state:'today' }; }
  if (t < D.plan[0].date) return { day:D.plan[0], state:'before' };
  return { day:D.plan[D.plan.length - 1], state:'after' };
}

  var waiting = k.part ? !partReady(k.part) : (k.chs || []).some(function(c){ return !ready(c); });

  if (k.partQuiz) acts += '<button type="button" class="btn ghost" data-act="go-quiz" data-n="15" data-chs="' + esc(k.sum) + '" data-part="' + esc(k.part) + '"' + (partReady(k.part) ? '' : ' disabled') + '>اختبار قصير</button>';
  if (k.quiz) acts += '<button type="button" class="btn ghost" data-act="go-quiz" data-n="' + (k.n || 15) + '" data-chs="' + esc(k.quiz.join(',')) + '"' + (k.quiz.every(ready) ? '' : ' disabled') + '>' + (k.n && k.n > 15 ? 'ابدأ الاختبار' : 'اختبار قصير') + '</button>';
  if (k.go) acts += '<button type="button" class="btn ghost" data-act="go-tab" data-tab="' + esc(k.go.tab) + '" data-sub="' + esc(k.go.sub || '') + '">' + esc(k.go.label) + '</button>';
  return '<li class="task kind-' + esc(k.kind) + (done ? ' is-done' : '') + '">' +
    '<button type="button" class="tick" data-act="tick" data-id="' + esc(k.id) + '" role="checkbox" aria-checked="' + done + '" aria-label="أنجزت: ' + esc(k.title) + '">' + TICK + '</button>' +
    '<div><p class="t-title">' + esc(k.title) + '</p><p class="t-meta">' + esc(k.meta) + (waiting ? ' · تصل بعد مراجعتها' : '') + '</p>' + (acts ? '<div class="t-acts">' + acts + '</div>' : '') + '</div></li>';

function poolFor(chs, types){ return D.questions.filter(function(q){ return chs.indexOf(q.ch) > -1 && types[q.type]; }); }
function startQuiz(ids, label){
  if (!ids.length) return;
  quiz = { ids: ids, i: 0, picked: null, revealed: false, results: [], label: label, order: {} };
  tab = 'quiz'; render(); window.scrollTo(0, 0);
}
function runHTML(){
  if (quiz.i >= quiz.ids.length) return resultHTML();
  var q = Q[quiz.ids[quiz.i]], n = quiz.ids.length;
  var head = '<div class="qbar"><div class="track"><div class="fill" style="width:' + Math.round(100 * quiz.i / n) + '%"></div></div><span class="n">' + (quiz.i + 1) + ' / ' + n + '</span></div>' +
    '<div class="chips"><span class="chip">' + esc({mcq:'اختيار من متعدد', tf:'صح أم خطأ', essay:'مقالي'}[q.type]) + '</span><span class="chip">' + esc(chTitle(q.ch)) + '</span><span class="chip">' + esc(artLabel(q.art)) + '</span>' + (rec(q.id).m ? '<span class="chip">من دفتر الأخطاء</span>' : '') + '</div>';
  var body = '<p class="q-text">' + rich(q.q) + '</p>';
  var answered = quiz.picked !== null;
  if (q.type === 'mcq'){
    if (!quiz.order[q.id]) quiz.order[q.id] = shuffle(q.opts.map(function(_, i){ return i; }));
    body += '<div class="opts">' + quiz.order[q.id].map(function(oi, k){
      var cls = 'opt';
      if (answered){ if (oi === q.a) cls += ' is-right'; else if (oi === quiz.picked) cls += ' is-wrong'; }
      return '<button type="button" class="' + cls + '" data-act="answer" data-v="' + oi + '"' + (answered ? ' disabled' : '') + '><span class="k">' + 'أبجد'.charAt(k) + '</span><span>' + esc(q.opts[oi]) + '</span></button>';
    }).join('') + '</div>';
  } else if (q.type === 'tf'){
    body += '<div class="tf">' + [[1,'صح'],[0,'خطأ']].map(function(t){
      var cls = 'opt', v = t[0] === 1;
      if (answered){ if (v === q.a) cls += ' is-right'; else if (quiz.picked === v) cls += ' is-wrong'; }
      return '<button type="button" class="' + cls + '" data-act="answer" data-v="' + t[0] + '"' + (answered ? ' disabled' : '') + '>' + t[1] + '</button>';
    }).join('') + '</div>';
  } else {
    if (!quiz.revealed) body += '<p class="muted small" style="margin:0">أجب في ذهنك أو على ورقة، ثم اكشف الإجابة النموذجية وقيّم نفسك.</p><button type="button" class="btn ghost wide" data-act="reveal">اكشف الإجابة النموذجية</button>';
    else {
      body += '<div class="quote"><p class="model">' + rich(q.a) + '</p><cite>الإجابة النموذجية · ص ' + esc(q.p) + '</cite></div>';
      if (!answered) body += '<div class="tf"><button type="button" class="opt" data-act="self" data-v="1">أصبت</button><button type="button" class="opt" data-act="self" data-v="0">أخطأت</button></div>';
    }
  }
  if (answered){
    var ok = quiz.results[quiz.results.length - 1];
    if (q.type !== 'essay'){
      body += '<p class="verdict ' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'إجابة صحيحة' : 'إجابة خاطئة، ودخل السؤال دفتر الأخطاء') + '</p>' +
        (q.why ? '<p class="why">' + rich(q.why) + '</p>' : '');
      body += '<blockquote class="quote book">' + esc(q.src) + '<cite>من الكتاب · ص ' + esc(q.p) + '</cite></blockquote>';
    } else {
      body += '<p class="verdict ' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'سُجّلت إجابة صحيحة' : 'سُجّلت إجابة خاطئة، ودخل السؤال دفتر الأخطاء') + '</p>';
    }

  }
  return '<div class="block-head"><h2>' + esc(quiz.label) + '</h2><button type="button" class="link" data-act="quit">إنهاء</button></div>' + head + '<section class="card">' + body + '</section>';
