    chs.forEach(function(c){ var list = D.comparisons.filter(function(x){ return x.ch === c.id; }); if (!list.length) return; h += '<p class="sec-title">' + esc(c.title) + '</p>' + list.map(cmpHTML).join(''); });
  } else {
    h += '<p class="muted small" style="margin:0">صفحة واحدة لليلة الأحد: أهم ما يُسأل عنه ويُخلط فيه، بنص الكتاب حيث يلزم.</p>';
    chs.forEach(function(c){ var list = D.lastNight.filter(function(x){ return x.ch === c.id; }); if (!list.length) return;
      h += '<p class="sec-title">' + esc(c.short) + '</p><ul class="night-list">' + list.map(function(x){ return '<li>' + rich(x.t) + pg(x.p) + '</li>'; }).join('') + '</ul>'; });
  }
  var waiting = D.chapters.filter(function(c){ return !c.ready; });
  if (waiting.length) h += '<p class="note">تصل بقية الفصول هنا بعد مراجعتها: ' + esc(waiting.map(function(c){ return c.short; }).join('، ')) + '.</p>';
  return h;
}

/* ---------- events ---------- */
document.querySelector('.tabs').addEventListener('click', function(e){
  var b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.getAttribute('data-tab'); if (tab === 'quiz' && quiz && quiz.i >= quiz.ids.length) quiz = null;
  try { history.replaceState(null, '', '#' + tab); } catch (x) {}
  render(); window.scrollTo(0, 0);
});
document.getElementById('mistakesBtn').addEventListener('click', function(){
  var m = mistakes(); if (m.length) startQuiz(shuffle(m.map(function(q){ return q.id; })), 'دفتر الأخطاء'); else { tab = 'quiz'; quiz = null; render(); }
});
view.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var act = el.getAttribute('data-act');
  if (act === 'tick'){ var id = el.getAttribute('data-id'); if (S.plan[id]) delete S.plan[id]; else S.plan[id] = 1; save(); render(); return; }
  if (act === 'go-tab'){ tab = el.getAttribute('data-tab'); var sub = el.getAttribute('data-sub'); if (sub) revSub = sub; quiz = tab === 'quiz' ? null : quiz; render(); window.scrollTo(0, 0); return; }
  if (act === 'go-sum'){ sumCh = el.getAttribute('data-ch'); tab = 'sum'; render(); var pid = el.getAttribute('data-part'); var tgt = pid && document.getElementById('part-' + pid); if (tgt) tgt.scrollIntoView(); else window.scrollTo(0, 0); return; }
  if (act === 'sum-ch'){ sumCh = el.getAttribute('data-ch'); render(); window.scrollTo(0, 0); return; }
  if (act === 'go-quiz'){ var chs = el.getAttribute('data-chs').split(',').filter(ready); var nq = +(el.getAttribute('data-n') || 15); var part = el.getAttribute('data-part'); var pool0 = poolFor(chs, { mcq:true, tf:true, essay: nq > 15 }); if (part) pool0 = pool0.filter(function(q){ return q.part === part; }); var ids = shuffle(pool0.map(function(q){ return q.id; })).slice(0, nq); startQuiz(ids, 'اختبار: ' + (part && PT[part] ? PT[part].title : chs.map(chTitle).join('، '))); return; }
  if (act === 'pick-ch'){ var c = el.getAttribute('data-ch'), k = setup.chs.indexOf(c); if (k > -1) setup.chs.splice(k, 1); else setup.chs.push(c); render(); return; }
  if (act === 'pick-type'){ var t = el.getAttribute('data-type'); setup.types[t] = !setup.types[t]; render(); return; }
  if (act === 'pick-count'){ setup.count = +el.getAttribute('data-n'); render(); return; }
  if (act === 'start'){ var pool = shuffle(poolFor(setup.chs, setup.types).map(function(q){ return q.id; })); startQuiz(setup.count ? pool.slice(0, setup.count) : pool, 'اختبار: ' + setup.chs.map(chTitle).join('، ')); return; }
  if (act === 'start-mistakes'){ var m = mistakes(); startQuiz(shuffle(m.map(function(q){ return q.id; })), 'دفتر الأخطاء'); return; }
  if (act === 'answer'){
    var q = Q[quiz.ids[quiz.i]], v = +el.getAttribute('data-v');
    var ok = q.type === 'tf' ? ((v === 1) === q.a) : (v === q.a);
    quiz.picked = q.type === 'tf' ? (v === 1) : v; quiz.results.push(ok); record(q.id, ok); render(); return;
  }
  if (act === 'reveal'){ quiz.revealed = true; render(); return; }
  if (act === 'self'){ var qq = Q[quiz.ids[quiz.i]], good = el.getAttribute('data-v') === '1'; quiz.picked = good; quiz.results.push(good); record(qq.id, good); render(); return; }
  if (act === 'next'){ quiz.i++; quiz.picked = null; quiz.revealed = false; render(); window.scrollTo(0, 0); return; }
  if (act === 'quit' || act === 'new-quiz'){ quiz = null; render(); window.scrollTo(0, 0); return; }
  if (act === 'rev-sub'){ revSub = el.getAttribute('data-sub'); render(); return; }
  if (act === 'hide-nums'){ hideNums = !hideNums; render(); return; }
  if (act === 'peek'){ el.classList.toggle('shown'); return; }
});
view.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'peek'){ e.preventDefault(); e.target.classList.toggle('shown'); } });

/* ---------- theme: day / night ---------- */
var MOON = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>', SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>';
function sysNight(){ var t = root.getAttribute('data-theme'); if (t) return t === 'dark'; return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
function isNight(){ var m = root.getAttribute('data-mode'); return m ? m === 'night' : sysNight(); }
function paintMode(){ document.getElementById('modeIcon').innerHTML = isNight() ? SUN : MOON; }
try { var sm = localStorage.getItem('ahkam-mode'); if (sm === 'day' || sm === 'night') root.setAttribute('data-mode', sm); } catch (e) {}
document.getElementById('modeBtn').addEventListener('click', function(){
  var m = isNight() ? 'day' : 'night'; root.setAttribute('data-mode', m);
  try { localStorage.setItem('ahkam-mode', m); } catch (e) {} paintMode();
});
if (window.matchMedia){ var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', paintMode); }
paintMode();

/* ---------- boot ---------- */
var h0 = (location.hash || '').replace('#', ''); if (['home','plan','sum','quiz','rev'].indexOf(h0) > -1) tab = h0;
window.addEventListener('scroll', function(){ document.getElementById('top').classList.toggle('scrolled', window.scrollY > 4); }, { passive:true });
render();
setInterval(function(){ var el = document.getElementById('count'); if (el) el.textContent = countdownText(); }, 60000);
})();
</script>
