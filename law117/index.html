الورقة"},"chs":[]}]}],"articles":[{"n":0,"ch":"intro","title":"المقدمة: صدور النظام وخصائصه","p":"7","text":"","points":[{"t":"«صدر نظام الأحوال الشخصية في يوم الثلاثاء 5 شعبان 1443هـ الموافق 8 مارس 2022م، بموافقة مجلس الوزراء بعد استكمال الإجراءات النظامية لدراسته في مجلس الشورى».","p":"7"},{"t":"هو «ثاني مشروعات منظومة التشريعات المتخصصة الأربعة في صدوره»، وهي المنظومة التي أُعلن عنها «بتاريخ 26 جمادى الآخرة 1442هـ الموافق 8 فبراير 2021م».","p":"7"},{"t":"«وصدرت لائحته التنفيذية بموجب الأمر السامي رقم (59641) وتاريخ 1446/8/17هـ، وتم نشره بجريدة أم القرى في العدد رقم (5072) وتاريخ 1446/8/22هـ الموافق 2025/2/21م».","p":"7"},{"t":"استُمدت مواده من أحكام الشريعة الإسلامية ومقاصدها، مع مراعاة أحدث التوجهات القانونية والممارسات القضائية الدولية، ومواكبة مستجدات الواقع.","p":"7"},{"t":"من غاياته: الحفاظ على الأسرة واستقرارها، وتحسين وضع الأسرة والطفل، وضبط السلطة التقديرية للقاضي للحد من تباين الأحكام القضائية.","p":"7"},{"t":"«وقد دخل حيز النفاذ في تاريخ 1443/11/18هـ».","p":"8"},{"t":"يتكون من ثمانية أبواب: «الزواج - آثار عقد الزواج - الفرقة بين الزوجين - آثار الفرقة بين الزوجين - الوصاية والولاية - الوصية - التركة والإرث - أحكام ختامية».","p":"8"},{"t":"خصائصه كما عدّها الكتاب: «أزال التقيد بمذهب معين» · «الحد من السلطة التقديرية للمحكمة، والأخذ بها في بعض الأحكام» · «اعتبار المصلحة والأخذ بها في كثير من الأحكام» · «المدد في النظام» · «الأخذ بالأيسر في كثير من الأحكام المختلف فيها».","p":"8–10"},{"t":"في الخاصية الأولى جاء النظام «مخالفًا للسائد والمشهور من المذهب الحنبلي في بعض أحكامه ومواده».","p":"8"},{"t":"أمثلة الحد من السلطة التقديرية: المادة (2/48) لا تُسمع دعوى الزيادة أو النقصان قبل مضي (سنة) من تاريخ صدور الحكم بالنفقة إلا في الظروف الاستثنائية، والمادة (50) في الحكم بنفقة مؤقتة، والمادة (2/104) في استعانة المحكمة بأهل الخبرة في معرفة العلة وتقديرها.","p":"8"},{"t":"أمثلة اعتبار المصلحة: المادة (2/8) «يجوز لكل ذي مصلحة طلب إثبات عقد الزواج غير الموثق»، والمادة التاسعة في سن توثيق الزواج، والمادة السادسة والعشرون بعد المائة في مصلحة المحضون.","p":"8–9"},{"t":"أمثلة المدد: المادة (2/52) لا تُسمع الدعوى بنفقة الزوجة عن مدة سابقة تزيد على (سنتين) من تاريخ إقامة الدعوى، والمادة (59) لا تُسمع دعوى الرجوع بنفقة تزيد على (سنة) سابقة لتاريخ إقامة الدعوى، والمادة (90) يوثّق الزوج الطلاق خلال مدة أقصاها (خمسة عشر) يومًا من حين البينونة.","p":"9"},{"t":"وفي المادة (59): إن لم ينفق الأب الموسر أو غاب ولا مال له يُنفق منه على الولد، أنفقت الأم إن كانت موسرة، وإلا أنفق من تجب عليه النفقة عند عدم الأب، وتكون دينًا على الأب يرجع بها من أنفق إن نوى الرجوع.","p":"9"},{"t":"«بل في النظام من المدد ما يزيد على خمس وعشرين من المدد التي وضعها المنظم بهدف عدم اختلاف اجتهادات القضاة».","p":"9"}]},{"n":1,"ch":"ch1","title":"تعريف الخطبة","p":"11","text":"الخطبة هي: طلب الزواج، والوعد به","points":[{"t":"الخِطبة - بكسر الخاء - طلب الزواج والاتفاق عليه والوعد به، سواء أكان من الرجل للمرأة أم من المرأة للرجل.","p":"11"},{"t":"ليست عقدًا للزواج، فلا يُباح للخاطبين أن يختلطا دون وجود محرم.","p":"11"},{"t":"هي «وعدٌ غير ملزم، وليست الخطبة شرطًا في صحة النكاح، ولكنها وسيلة إليه»، والجمهور على مشروعيتها وجوازها.","p":"11"},{"t":"لا ينعقد النكاح بها ولو اقترنت بدفع المهر أو جزء منه؛ ولذا كان لكل من الخاطبين العدول عنها.","p":"11"},{"t":"يجوز للخاطب أن ينظر إلى مخطوبته، وهو قول جمهور الفقهاء، لحديث: «إذا خطب أحدكم امرأة فلا جناح عليه أن ينظر إليها، إذا كان إنما ينظر لخطبته، وإن كانت لا تعلم ذلك».","p":"12"}]},{"n":2,"ch":"ch1","title":"العدول عن الخطبة","p":"12","text":"لكلٍ من الخاطب والمخطوبة العدول عن الخطبة","points":[{"t":"العدول: ألّا يُكمل أحد الخاطبين إجراءات ما بعد الخطبة من عقد الزواج وتقديم المهر وغير ذلك.","p":"12"},{"t":"سببه أن الخطبة ليست عقدًا للزواج، وإنما هي وعد بالزواج غير ملزم؛ فمن رجع عنها «فهو مستعمل لخالص حقه».","p":"12"},{"t":"مصلحته: أن تكون لكل من الطرفين قبل إبرام العقد الحرية التامة في إتمامه أو تركه، لأنه عقد الحياة، فيتم العقد عن رضا تام.","p":"12"}]},{"n":3,"ch":"ch1","title":"الهدية وقت الخطبة","p":"13","text":"جميع ما يقدمه الخاطب أو المخطوبة إلى الآخر خلال فترة الخطبة يعد هدية، ما لم يصرح الخاطب بأن ما قدمه يعد مهرًا، أو يجرِ عرفٌ على أنه من المهر","points":[{"t":"الأصل فيما يُقدَّم في فترة الخطبة للطرف الآخر أنه هدية لا مهر.","p":"13"},{"t":"يُستثنى حالتان يكون فيهما من المهر: «الحالة الأولى: التصريح من الخاطب أن ما قدمه هو مهر. الحالة الثانية: جريان العرف على أنه من المهر».","p":"13"},{"t":"تعريف الهدية في حاشية الكتاب (نقلًا عن ابن خنين): «الهدية هي: تمليك شخص لآخر في الحياة بغير عوض بقصد التودد والألفة، وهي بمعنى الهبة، إلا أن الهدية يغلب عليها حصولها لمناسبة أو سبب، وتكون للإكرام والإجلال، بخلاف الهبة فهي متجردة بقصد التودد».","p":"13"}]},{"n":4,"ch":"ch1","title":"آثار العدول عن الخطبة إذا كان ما قدمه هدية","p":"13","text":"إذا عَدَلَ أيٌّ من الخاطب أو المخطوبة عن الخطبة بسبب يعود إليه، فليس له الرجوع في الهدية التي قدمها، وللطرف الآخر أن يسترد منه ما قدمه من هدية إن كانت قائمة، وإلا بمثلها، أو قيمتها يوم قبضها، ما لم تكن الهدية مما يستهلك بطبيعتها.\nوفي جميع الأحوال: إذا انتهت الخطبة بالوفاة، أو بسبب لا يد للطرفين فيه، فلا يسترد شيء من الهدايا","points":[{"t":"من عدل بسبب يعود إليه لا يرجع في هديته، ويردّ هدية الآخر: بعينها إن كانت قائمة، أو مثلها إن كانت من المثليات وهلكت أو استُهلكت، أو قيمتها يوم القبض إن كانت من القيميات. «وهو قول الجمهور في الجملة، واختاره ابن تيمية»، فقد قالوا: إن الهدية لو كانت قبل العقد ووعدوه بالزواج ولم يفوا فزوجوا غيره رجع بالهدية.","p":"14"},{"t":"يُستثنى ما يُستهلك بطبيعته «كالأكل والحلوى مثلاً» فلا يُرد.","p":"14"},{"t":"لا يُسترد شيء إذا انتهت الخطبة بالوفاة، أو بسبب لا يد لأحد الطرفين فيه كالجنون والوقوع في الأسر؛ والتعليل: «أن عدم التمام ليس من جهتهم».","p":"14"},{"t":"قياسًا على ذلك: إن مات الخاطب أو جُنّ فلا رجوع لورثته على المخطوبة أو أوليائها بشيء، وكذا إن ماتت هي فلا رجوع لورثتها على الخاطب.","p":"15"},{"t":"تعريف المثليات والقيميات في حاشية الكتاب: «المثليات هي ما كان لها نظير في السوق، من غير فارق يعتد به، كالسيارة الجديدة التي لم تستعمل ولها نظير في جميع صفاتها؛ ويقابلها القيميات وهي ما ليس له نظير في السوق، أو له نظير ولكن هناك فارق يعتد به، مثل السيارة المستعملة».","p":"14"}]},{"n":5,"ch":"ch1","title":"آثار العدول عن الخطبة إذا كان ما قدمه مهرًا","p":"15","text":"1 - إذا عدل أي من الخاطب أو المخطوبة عن إبرام عقد الزواج أو مات قبل العقد، وكان الخاطب قد سلم إلى مخطوبته قبل العقد مالاً على أنه من المهر، يحق للخاطب أو لورثته الرجوع فيما سلم بعينه إن كان قائمًا وإلا بمثله، أو بقيمته يوم القبض.\n2 - إذا كانت المخطوبة اشترت بالمهر أو بعضه لمصلحة الزواج - وفق ما جرى به العرف - وكان العدول من الخاطب بلا سبب من قبلها، أو كان العدول منها بسبب من الخاطب، فلها الخيار بين إعادة المهر أو تسليم ما اشترته بحاله","points":[{"t":"الفقرة الأولى: للخاطب استرداد ما قدّمه على أنه مهر إذا لم يتم العقد: بعينه إن كان قائمًا، وإلا بمثله إن كان مثليًا، أو بقيمته يوم القبض.","p":"15"},{"t":"العلة: أن المرأة لا حق لها في المهر إلا إذا تم عقد الزواج بإيجاب وقبول شرعيين.","p":"15"},{"t":"إن اختلف الخاطبان في المال المسلَّم: أمهر هو أم هدية؟ «فالجواب عنه: أن المعتبر هو قول الخاطب بيمينه؛ لأنه هو المسلِّم لأنه أدرى بما صرفه»، وعليه قول الجمهور.","p":"15–16"},{"t":"الفقرة الثانية: إن اشترت المخطوبة بالمهر أو بعضه ما فيه مصلحة الزواج وفق العرف كشراء حليّ، ثم عدل الخاطب بلا سبب منها، أو عدلت هي بسبب منه، فلها الخيار بين إعادة المهر أو تسليم ما اشترته بحاله.","p":"16"},{"t":"العلة: أن شراءها وقع بتسليط من الخاطب، فعليه احتمال الضرر الناشئ عن عدوله، والقاعدة أن «الضرر يزال»، والضرر هو الفرق بين قيمة الأشياء المشتراة بحالتها الحاضرة وبين السعر الذي اشتريت به.","p":"16"},{"t":"إن كان العدول من المخطوبة: «فإن عليها رد المهر، عينه أو بدله».","p":"16"}]},{"n":6,"ch":"ch2","title":"تعريف الزواج","p":"17","text":"الزواج: عقد بأركان وشروط.\nيرتب حقوقًا وواجبات بين الزوجين.\nغايته: الإحصان، وإنشاء أسرة مستقرة، يرعاها الزوجان، بمودة ورحمة","points":[{"t":"من معاني الزواج في اللغة: «الاقتران والارتباط» (يقرنهم)، و«التماثل والتناظر» (نظراءهم)، و«النكاح» (أنكحناك إياها).","p":"17–18"},{"t":"استمد المنظم تعريفه من قوله تعالى: ﴿وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةً وَرَحْمَةً﴾، وراعى درجة القوامة والرعاية في قوله تعالى: ﴿وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌ﴾.","p":"18"},{"t":"«الزواج مشروع في الجملة وذلك في الكتاب والسنة وإجماع علماء الأمة».","p":"18"},{"t":"من السنة حديث: «يا معشر الشباب، من استطاع الباءة فليتزوج...»، والباءة قيل: الجماع، وقيل: مؤن النكاح، «ولا تنافي بين القولين».","p":"19"},{"t":"أمر الحديث بمقاومة الشهوة بأمرين مرتبين: «الأمر الأول: الزواج عند المقدرة عليه. والثاني: الصيام لمن لم يقدر على الزواج».","p":"20"},{"t":"حكى الإجماع على مشروعيته جماعة منهم ابن قدامة، ونقل الرافعي إجماع أهل الملل على مشروعيته.","p":"20"},{"t":"من أهدافه وحِكَمه: «بقاء النسل البشري، وتكثير عدد المسلمين» · تكوين «الأسرة الصالحة التي هي نواة المجتمع» · «إعفاف الفروج وإحصانها» · «قيام الزوج على المرأة بالرعاية والإنفاق» · «حصول السكن والأنس بين الزوجين، وحصول الراحة النفسية» · «حماية للمجتمعات البشرية من الوقوع في الفواحش الخُلقية» · «حفظ الأنساب، وترابط القرابة والأرحام بعضها ببعض».","p":"20–21"},{"t":"تجري على النكاح الأحكام التكليفية الخمسة: واجب، ومستحب، ومباح، ومكروه، وحرام (انظر جدول المقارنة).","p":"21–23"},{"t":"حكم تنظيم النسل: «ليس للزوج أن يعزل عن امرأته الحرة إلا بإذنها»، والصحيح أنه لا بأس به إذا اتفقا عليه، وقد كان الصحابة يعزلون.","p":"23"}]},{"n":7,"ch":"ch2","title":"تعريف الخلوة في هذا النظام","p":"23","text":"الخلوة - في سبيل تطبيق هذا النظام - انفراد الزوجين في مكان ليس عندهما من يميز","points":[{"t":"قيد «من يميز»: لو كان معهما مميز لم تكن خلوة، أما غير المميز فلا اعتبار به، ويُعدّ انفرادهما بوجوده خلوة لأنه لا يعقل ما يحدث بينهما.","p":"24"},{"t":"عدّت اللائحة التنفيذية (المادة الأولى) من صور انتفاء الخلوة أن يكون هناك من يشاهدهما وكان مميزًا، فالمشاهدة من المميز في حكم وجوده معهما.","p":"24"},{"t":"سن التمييز في نظام المعاملات المدنية (المادة الثالثة عشرة): «لايعد مميزاً من لم يتم السابعة من عمره»، وتحديد السن بالسابعة مأخوذ - كما قال المؤلف: «والله اعلم» - من حديث «مروا أولادكم بالصلاة وهم أبناء سبع سنين».","p":"24"},{"t":"نهى النبي ﷺ عن الخلوة بالأجنبية إلا مع محرم، والمخطوبة ما تزال أجنبية عن الخاطب.","p":"24"},{"t":"من أحكام الخلوة الفقرة الثانية من المادة الأربعين: «يتأكد المهر المسمى كاملاً أو مهر المثل، بـ: الدخول، أو الخلوة، أو وفاة أحد الزوجين».","p":"24"}]},{"n":8,"ch":"ch2","title":"توثيق عقد الزواج","p":"25","text":"1 - يجب توثيق عقد الزواج، وعلى الزوجين - أو أحدهما - توثيقه، وفق الأحكام المنظمة لذلك.\n2 - يجوز لكل ذي مصلحة طلب إثبات عقد الزواج غير الموثق.\n3 - يوثق عقد زواج غير المسلم لدى المختص بالتوثيق، وتبين لوائح هذا النظام الأحكام المتصلة بذلك","points":[{"t":"الزوجان «هما المستفيدان الأولان من توثيق عقدهما، فإنهما مخاطبان أصالة بهذا الإجراء».","p":"25"},{"t":"يُجري عقد النكاح ويثبته شخصان: الأول القاضي في محكمة الأحوال الشخصية (المادة 33 من نظام المرافعات الشرعية)، أو في المحكمة العامة حيث لا توجد محكمة أحوال شخصية (المادة 32)، «والمعمول به الآن هو: عقد القاضي لعقد النكاح الذي أحد أطرافه غير سعودي».","p":"25–26"},{"t":"الثاني مأذون الأنكحة، «ويتم العقد لدى المأذون إن كان كلا الطرفين سعوديًّا أو كلاهما غير سعودي» (المادة 18 من نظام التوثيق).","p":"26"},{"t":"تعريف المأذون في حاشية الكتاب: «من يقوم بتوثيق عقود النكاح بموجب رخصة صادرة وفق أحكام النظام»، ومن شروط رخصته أن يكون سعودي الجنسية، حسن السيرة والسلوك، لائقًا صحيًا، حاصلًا على شهادة جامعية في العلوم الشرعية، وأن يجتاز امتحانًا تحريريًا.","p":"26"},{"t":"تُجرى العقود حاليًا إلكترونيًا، وقد تُجرى ورقيًا عند الضرورة.","p":"26"},{"t":"قبل العقد يُتحقق من توفر: «الأركان، والشروط، وانتفاء الموانع في الزوجين، وتوفر تقرير طبي للزوجين ساري المفعول (مدة صلاحية التقرير ستة أشهر فقط)».","p":"26"},{"t":"إن كان الولي غير الأب: يُتحقق أنه أقرب ولي بالاطلاع على صك حصر الإرث أو ما يدل على انتقال ولاية التزويج إليه. وإن جرى العقد بوكالة: يُتأكد أن الوكيل مخوّل من الولي الشرعي أو من الراغب في النكاح.","p":"26–27"},{"t":"عند عدم وجود ولي شرعي للمرأة أو عضل الأولياء لها: يكون إجراء العقد من قِبل المحكمة المختصة (نظام المرافعات الشرعية المادة 33/أ/6).","p":"27"},{"t":"تعريف المرأة التي لا ولي لها في حاشية الكتاب: «مَن ثبت لدى الدائرة انقطاع أوليائها، بفقد، أو موت، أو غيبة يتعذر معها الاتصال بهم أو حضورهم أو توكيلهم، ومن لا يُعرف لها أب، ومن أسلَمَتْ وليس لها وليٌّ مسلم».","p":"27"},{"t":"للمطلقة يُعتمد على أصل صك الطلاق، أو صك بدل مفقود إن فُقد أو تلف؛ وللمتوفى عنها زوجها يُتأكد من الوفاة بصك حصر الورثة.","p":"27"},{"t":"تُدوَّن البيانات في «ناجز» وتؤخذ الموافقة إلكترونيًا للزوج والزوجة والولي والشاهدين، وفي العقد الورقي تُدوَّن في دفتر الضبط مع توقيع طرفي العقد والولي والشاهدين.","p":"27"},{"t":"الفقرة الثانية: لكل صاحب مصلحة أن يطلب توثيق الزواج غير الموثق، والاختصاص لمحكمة الأحوال الشخصية (المادة 33 من نظام المرافعات: «1 - إثبات الزواج»)، وتوثيق الزواج هنا هو نفسه إثبات الزواج.","p":"28"},{"t":"الفقرة الثالثة: بيّنت اللائحة التنفيذية «أنه يوثق عقد زواج غير المسلم بغير المسلمة، سواء اتحدت جنسية طرفيه أم اختلفت، وفقاً لأحكام نظام التوثيق».","p":"28"}]},{"n":9,"ch":"ch2","title":"السن النظامي لتوثيق عقد الزواج","p":"29","text":"يمنع توثيق عقد الزواج لمن هو دون (ثمانية عشر) عامًا، وللمحكمة أن تأذن بزواج من هو دون ذلك ذكرًا كان أو أنثى إذا كان بالغًا، بعد التحقق من مصلحته في هذا الزواج، وتبين لوائح هذا النظام الضوابط والإجراءات اللازمة لذلك","points":[{"t":"بُني المنع على «دليل الاستصلاح»، مراعاةً لمسؤوليات الزواج وآثاره، وليحصّل الزوجان تعليمًا يمكّنهم من معرفة أعباء المسؤولية.","p":"29"},{"t":"تعريف المصلحة المرسلة في حاشية الكتاب: «كل منفعة داخلة في مقاصد الشارع الخمسة - وهي: حفظ الدين، والنفس، والعقل، والمال، والنسل - دون أن يكون لها شاهد بالاعتبار أو الإلغاء».","p":"29"},{"t":"شروط الإذن بزواج من دون الثامنة عشرة: «الشرط الأول: أن يكون الإذن من مقام المحكمة المختصة، وهي محكمة الأحوال الشخصية» · «الشرط الثاني: بلوغ الزوجان البلوغ الشرعي» · «الشرط الثالث: التحقق من مصلحة هذا الزواج».","p":"30"},{"t":"وزادت اللائحة التنفيذية: «الشرط الرابع: أن يكون طلب الإذن بالزواج مقدماً من الشاب أو الفتاة (الراغبين في الزواج)، أو وليهما الشرعي، أو والدة أي منهما» · «الشرط الخامس: موافقة الراغب في الزواج بإقراره الصريح أمام المحكمة، وسماع ما لدى الأم بشأن ذلك»، فإن تعذر سماعها قررت المحكمة ذلك وأذنت.","p":"31"},{"t":"علامات البلوغ المشتركة: «خروج المني يقظةً أو منامًا» · «بلوغ خمس عشرة سنة للغلام والجارية، عند الشافعي، وأبي يوسف ومحمد، وابن وهب من المالكية. وثماني عشرة سنة في الغلام، عند أبي حنيفة، والمشهور عند المالكية، وسبع عشرة سنة في الجارية عند أبي حنيفة» · «نبات الشعر الخشن القوي حول القُبُل».","p":"30"},{"t":"وتختص الأنثى بعلامتين: «الحيض»، و«الحمل»؛ «لأن حملها دليلُ إنزالها». فإن وُجدت علامة حُكم بالبلوغ، وإلا كان البلوغ بالسن.","p":"30"},{"t":"المصلحة كما بينتها اللائحة: بلوغ الراغب في الزواج واكتماله الجسمي والعقلي، وألا يكون في الزواج خطر عليه، ويثبت ذلك بتقرير طبي، وتقريرين (نفسي، واجتماعي)، «وللقاضي الاكتفاء بأحدهما إذا تضمن التقرير المكتفى به إيضاحاً لمدى التكافؤ النفسي والاجتماعي».","p":"30–31"},{"t":"تسري هذه الأحكام على زواج السعودي بغير سعودية والسعودية بغير سعودي بشرط أن يُبرم العقد داخل المملكة.","p":"31"},{"t":"المادة منعت التوثيق ولم تتطرق إلى صحة العقد؛ فزواج من دون الثامنة عشرة «صحيح عند جمهور أهل العلم»، لكن منع التوثيق يحمل الناس على تركه، «وهو باب من أبواب السياسة الشرعية لولي الأمر».","p":"31"}]},{"n":10,"ch":"ch2","title":"أهلية التقاضي في قضايا الزواج","p":"31","text":"يكتسب من تزوج وفق حكم المادة (التاسعة) من هذا النظام أهلية التقاضي في كل ما له علاقة بالزواج وآثاره إذا كان عاقلاً","points":[{"t":"الأصل أن أهلية التقاضي لمن بلغ سن الرشد الشرعي، وهو في النظام السعودي «بلوغ سن ثمانية عشرة عاماً».","p":"32"},{"t":"استثنت المادة من تزوج وفق المادة التاسعة، فيكتسب أهلية التقاضي فيما له علاقة بالزواج وآثاره إذا كان عاقلًا، ولو لم يبلغ هذه السن.","p":"32"},{"t":"إن تم النكاح بلا توثيق ولم تتوافر أهلية التقاضي: يقوم الولي مقام الزوج أو الزوجة في الترافع والتقاضي.","p":"32"}]},{"n":11,"ch":"ch2","title":"شروط زواج المجنون أو المعتوه","p":"32","text":"للمحكمة أن تأذن بزواج المجنون أو المعتوه بناء على طلب ولي تزويجه، بعد توافر الشروط الآتية:\n1 - أن يقدم الولي تقريرًا طبيًّا معتمدًا عن حالة الجنون أو العته.\n2 - أن يقبل الطرف الآخر في عقد الزواج بعد اطلاعه على حالة المجنون أو المعتوه.\n3 - أن يكون في هذا الزواج مصلحة للمجنون أو المعتوه","points":[{"t":"المراد بالولي هنا: ولي الزواج المنصوص عليه في المادتين (17 و18)، «وهذه الولاية غير ولاية المال».","p":"32"},{"t":"لم تبيّن المادة المراد بالمجنون: هل هو المجنون جنونًا مطبقًا، أو غير المطبق، أو كلاهما.","p":"32"},{"t":"الجنون: «اختلالٌ في العقل ينشأ عنه اضطراب أو هيجان»، «وقيل الجُنُونُ: هو اختلال العقل بحيث يمنع جريان الأفعال والأقوال على نهج العقل إلا نادرًا، وإن كان حاصلًا في أكثر السنة فمطبق، وما دونها فغير مطبق».","p":"33"},{"t":"العته: «ضعفٌ في العقل ينشأ عنه ضعفٌ في الوعي والإدراك»، «وقيل العَتَهُ: عبارة عن آفة ناشئة عن الذات توجب خللًا في العقل فيصير صاحبه مختلط العقل، فيشبه بعض كلامه كلام العقلاء وبعضه كلام المجانين».","p":"33"},{"t":"«إن العقل ليس شرطًا للزواج بالاتفاق بين أهل العلم»، ولهم في ذلك تفصيلات وضوابط.","p":"33"},{"t":"التقرير الطبي لا بد أن يصدر من جهة معتمدة كمستشفيات وزارة الصحة، وقبول الطرف الآخر تأكيد لشرط الرضا، ومن يقرر المصلحة «هو قاضي الموضوع، وله الاستعانة في سبيل معرفة ذلك بمن يراه».","p":"33–34"}]},{"n":12,"ch":"ch3","part":"b2","title":"أركان عقد الزواج","p":"35","text":"أركان عقد الزواج هي:\n1 - الزوجان، وهما: الرجل والمرأة.\n2 - الإيجاب والقبول","points":[{"t":"الركن لغة: «جانب الشيء الأقوى»، واصطلاحًا: «عبارة عن جزء الماهية، والمراد بالماهية حقيقة الشيء، أو بعبارة أخرى: هو ما يدخل في الشيء ولا يقوم إلا به».","p":"35"},{"t":"«وفي هذه المادة يتبين أن أركان عقد الزواج: ركنان».","p":"35"},{"t":"الركن الأول: «الزوجان، وهما الرجل والمرأة، فلا يمكن تصور عقد الزواج بدون هذين»، ولا بد أن يخلوا من موانع صحة النكاح، كأن تحرم المرأة عليه بنسب أو رضاع أو عدة، أو يكون الرجل كافرًا والمرأة مسلمة.","p":"36"},{"t":"الركن الثاني: «الصيغة، ويعبر عنها بـ: الإيجاب والقبول».","p":"36"},{"t":"«فالإيجاب هو: اللفظ الصادر من الولي أو من يقوم مقامه؛ بأن يقول للزوج: زوجتك فلانة، أو: أنكحتكها». «والقبول هو: اللفظ الصادر من الزوج أو من يقوم مقامه؛ بأن يقول: قبلت هذا النكاح أو هذا التزويج».","p":"36"},{"t":"اختلف الفقهاء في أركان النكاح: «فذهب الحنفية إلى أن ركن النكاح هو الإيجاب والقبول فقط»، والمالكية: «ولي، ومحل (زوج وزوجة)، وصيغة»، والشافعية: «أركانه خمسة: صيغة، وزوج، وزوجة، وشاهدان، وولي»، «وذهب الحنابلة إلى أن أركانه ثلاثة: زوجان، والإيجاب، والقبول، وبه أخذ المنظم هنا».","p":"37"},{"t":"يستحب قبل العقد تقديم خطبة تسمى «خطبة الحاجة» أو «خطبة ابن مسعود»، يخطبها العاقد أو غيره من الحاضرين، ثم توصل بثلاث آيات: آل عمران 102، والنساء 1، والأحزاب 70–71.","p":"37–38"}]},{"n":13,"ch":"ch3","part":"b2","title":"شروط عقد الزواج","p":"38","text":"يشترط لصحة عقد الزواج ما يأتي:\n1 - تعيين الزوجين.\n2 - رضا الزوجين.\n3 - الإيجاب من الولي.\n4 - شهادة شاهدين.\n5 - ألا تكون المرأة محرمة على الرجل تحريمًا مؤبدًا أو موقتًا","points":[{"t":"الشروط نوعان: «النوع الأول: الشروط الشرعية، وهي شروط صحة عقد الزواج، وهي هذه المذكورة في المادة محل الشرح، وهي من وضع الشارع ولا محل فيها للاختيار من المكلفين بل هم مطالبون بها»، و«النوع الثاني: الشروط الجعلية، وهي الشروط التي يشترطها أحد الخاطبين لإتمام عقد الزواج، ويتراضيان عليها»، وتأتي في المادة (27).","p":"38–39"},{"t":"الشرط: «ما يلزم من عدمه العدم، ولا يلزم من وجوده وجود ولا عدم لذاته».","p":"39"},{"t":"الفرق بين الركن والشرط: «أن الركن في الزواج هو جزء من الزواج وحقيقته، بخلاف الشرط الذي هو خارج عن ماهية الزواج وحقيقته».","p":"39"},{"t":"تعيين الزوجين: «تحديدهما على وجه لا يلتبس أحدهما بغيره من الناس»، فلا يكفي: زوجتك بنتي، وله عدة بنات. «ويحصل التعيين بالإشارة إلى المتزوج، أو تسميته، أو وصفه بما يتميز به».","p":"39"},{"t":"رضا الزوجين: «قبول كل واحد من الخاطبين بالزواج من صاحبه باختياره عن طواعية تامة»، فلا يصح إكراه أحدهما، لحديث: «لا تنكح الأيم حتى تستأمر، ولا تنكح البكر حتى تستأذن»، وإذن البكر: «أن تسكت». «والأيم هنا هي المرأة التي مات عنها زوجها أو طلقها، ومعنى تستأمر أي يطلب الأمر منها».","p":"39–40"},{"t":"الإيجاب من الولي، والولي: «رجل يتمتع بأهلية التزويج موافق للمرأة في الدين من عصباتها - ويرتبون كترتيبهم في الإرث - أو السلطان عند انعدامهم»، ودليله: «لا نكاح إلا بولي».","p":"40"},{"t":"«فلو زوجت المرأة نفسها بدون إيجاب وليها؛ فنكاحها باطل؛ بناء على المادة الثانية والثلاثين من نظام الأحوال الشخصية».","p":"40"},{"t":"وتنبه: في شرح المادة 34 نقل الكتاب عن اللائحة أن الزواج «بلا إيجاب من الولي، أو بلا شهود» تترتب عليه آثار الزواج الفاسد، ويمكن توثيقه بعد تصحيحه.","p":"97"},{"t":"اشتراط الولي مذهب الجمهور، ومن أدلتهم: ﴿وأنكحوا الأيامى منكم﴾، و﴿ولا تنكحوا المشركين حتى يؤمنوا﴾ «والخطاب هنا للأولياء»، و﴿فلا تعضلوهن أن ينكحن أزواجهن﴾ «ولو لم يكن الولي معتبرا لما كان لعضله معنى»، وحديث: «أيما امرأة لم ينكحها الولي، فنكاحها باطل».","p":"40–41"},{"t":"«وذهب فقهاء الأحناف إلى عدم اشتراطه»، قياسًا على البيع والشراء والإجارة، ولحديث: «الأيم أحق بنفسها من وليها». وأجاب الجمهور بأن المراد «أنها أحق بنفسها في تعيين من تريد نكاحه إن كانت ثيبا».","p":"41"},{"t":"والأصل عند الحنفية مباشرة الولي للعقد، فإن باشرته المرأة جاز عندهم، «ومع ذلك فإنهم أعطوا الولي حق إيقاف العقد وإبطاله إذا لم يكن الزوج كفؤا».","p":"41"},{"t":"حكم اشتراط الولاية خمس: صيانة المرأة عما يجرح حياءها، وحمايتها من الانسياق وراء عاطفتها، ومزيد الإعلان عن النكاح، وإشعار الزوج بتضامن الأسرة معها، وأن الزواج «ليس شأنا خاصا بالمرأة دون سواها».","p":"42"},{"t":"شهادة شاهدين: لحديث «لا نكاح إلا بولي وشاهدي عدل»، «فلا يصح إلا بشاهدين عدلين». ولم يشترطه المالكية للصحة، وإنما هو عندهم شرط كمال (حاشية الكتاب).","p":"42"},{"t":"ألا تكون المرأة محرمة عليه: «وهذا الشرط يسميه بعض الفقهاء (خلو الزوجين من موانع الزواج)، ويطلق عليه (المحرمات في النكاح)».","p":"43"},{"t":"المحرمات قسمان: «محرمات على سبيل التأبيد: وهن اللاتي كان سبب تحريمهن وصفا غير قابل للزوال، كالأمومة والبنوة والأخوة والعمومة والمصاهرة والرضاع»، و«محرمات تحريما مؤقتا، تزول الحرمة بزوال سببها: وهن اللاتي كان سبب تحريمهن أمرا قابلا للزوال، كأن تكون المرأة أختا لزوجته، أو تكون زوجة للغير، أو مشركة غير ذات دين سماوي».","p":"43"}]},{"n":14,"ch":"ch3","part":"b2","title":"الكفاءة في الزواج","p":"44","text":"1 - كفاءة الرجل للمرأة شرط للزوم عقد الزواج لا لصحته.\n2 - العبرة في كفاءة الرجل حين العقد بصلاح دينه، وكل ما قام العرف على اعتباره.\n3 - لكل ذي مصلحة من الأقارب - حتى الدرجة الثالثة - يتأثر بانعدام الكفاءة، الحق في الاعتراض على عقد الزواج، وتقدر المحكمة ذلك","points":[{"t":"الحديث هنا في كفاءة الرجل للمرأة وليس العكس، وعللوه «بأن الرجل يملك حق الطلاق، فإذا فقدت الكفاءة فله حق بفراق المرأة، ثم هو من يسبق لاختيارها كزوجة».","p":"44"},{"t":"«فالكفاءة لغة هي: المساواة والمماثلة»، ويمكن أن يقال في تعريفها: «أنها هي المقاربة والمساواة بين الزوجين في أمور مخصوصة إذا اختلت كانت الحياة الزوجية غير مستقرة لما يلحق أولياء المرأة من الأذى والعار».","p":"44–45"},{"t":"اعتبرها النظام شرط لزوم لا صحة، «فإذا انتفت الكفاءة بأن اختلف أحد الزوجين عن الآخر، فإن ذلك لا يؤثر على صحة النكاح»، ودليله أمر النبي ﷺ فاطمة بنت قيس أن تنكح أسامة بن زيد، ومن المعقول قاعدة «العادة محكمة».","p":"45"},{"t":"«فلو زوجت امرأة بغير كفئها فلمن لم يرض بذلك من المرأة أو أوليائها فسخ النكاح، وفي النظام هنا يكون حق الفسخ للقريب حتى الدرجة الثالثة، ولا يفسخه إلا القاضي».","p":"45"},{"t":"«وبعض العلماء يرى أن الكفاءة شرط لصحة النكاح، وهو رواية عن أحمد»، ونقل الكتاب عن ابن تيمية أن الكفاءة «ليست بمنزلة الأمور المالية مثل مهر المرأة».","p":"46"},{"t":"الكفاءة المعتبرة في النظام «في أمرين مهمين هما: الأول، صلاح الدين. الثاني، ما قام العرف على اعتباره».","p":"46"},{"t":"وذكر بعض أهل العلم أن المساواة قد تكون في خمسة أشياء: الدين، و«المنصب، وهو النسب»، والحرية، والصناعة، و«اليسار بالمال بحسب ما يجب لها من المهر والنفقة». «والمنظم لم يشر إلى هذه الأربعة الأخيرة بالنص ولكنه أشار إلى اعتبار العرف».","p":"46–47"},{"t":"قال ابن قدامة: «إذا أطلقت الكفاءة وجب حملها على المتعارف».","p":"47"},{"t":"قرار مجلس القضاء الأعلى بهيئته الدائمة رقم (5/1228) في 1428/8/1هـ: «الأصل إنما الكفاءة في الدين»، وأما إبطال العقود الصادرة عن رضا المرأة ووليها بدعوى أخ ونحوه «فأمر غير صالح».","p":"47"},{"t":"«وبهذا يتبين أن النص النظامي هنا جاء موافقا لما عليه العمل القضائي من اعتبار الكفاءة في الدين مع اعتبار العرف في ماعدا ذلك».","p":"48"},{"t":"إذا غرر الزوج بزوجته وأهلها في كفاءة معينة «كشهادة أو وظيفة أو غيرها، ثم بان بخلافها، أن لهم فسخ عقد الزواج لهذا التغرير».","p":"48"},{"t":"إذا كان كفؤًا وقت العقد ثم طرأ عليه ما يجعله غير كفء كشرب الخمر، فلها طلب الفسخ: «الجواب، نعم؛ لأنه في هذه الحالة ليس مكافئا لها في دينها»، ودليله حديث بريرة لما أعتقت وزوجها مغيث عبد.","p":"48"},{"t":"شروط الاعتراض ثلاثة: «أن يكون للمعترض مصلحة في ذلك»، و«أن يكون المعترض قريبا حتى الدرجة الثالثة»، و«أن تقدير هذه المصلحة عائد إلى المحكمة في ذلك».","p":"48–49"},{"t":"الدرجات كما في المادة السابعة من لائحة نظام المرافعات الشرعية: «الدرجة الأولى: الأبوة، والبنوة. الدرجة الثانية: الأخوة، وأبناء الأبناء. الدرجة الثالثة: العمومة، وأبناء الإخوة».","p":"49"}]},{"n":15,"ch":"ch3","part":"b2","title":"الإيجاب والقبول في الزواج","p":"49","text":"مع التقيد بأحكام المادة (الثالثة عشرة) من هذا النظام، ينعقد الزواج بـ:\n- إيجاب من الولي، وقبول من الزوج، بلفظ الزواج الصريح، وبالكتابة عند العجز عن النطق، وبالإشارة المفهومة عند العجز عن النطق والكتابة","points":[{"t":"«والإيجاب: هو اللفظ الصادر من الولي، أو من يقوم مقامه»، كقوله: زوجتك ابنتي، «وسمي إيجابا؛ لأنه أوجب به العقد».","p":"49"},{"t":"«وأما القبول: فهو اللفظ الصادر من الزوج أو من يقوم مقامه»، «والمقصود بمن يقوم مقام الزوج أو الولي هو الوكيل».","p":"49"},{"t":"طرق التعبير ثلاث، أولها لفظ الزواج الصريح: «ويراد به اللفظ الموضوع للزواج لا يفهم منه عند الإطلاق غيره»، «وهي زوجتك وأنكحتك».","p":"50"},{"t":"«وقد اختار شيخ الإسلام ابن تيمية، وتلميذه ابن القيم أن النكاح ينعقد بكل لفظ يدل عليه، ولا يقتصر على لفظ الإنكاح والتزويج»، ومن قصره عليهما احتج بأنهما اللفظان اللذان ورد بهما القرآن.","p":"50"},{"t":"إن كان الطرفان لا يحسنان العربية، كان اللفظ صريحًا إذا كان صريحًا في لغتيهما، «فإن اختلفت لغتهما صح باللغة التي يحسنها كل منهما إذا كان صريحا فيها».","p":"50"},{"t":"الطريق الثاني الكتابة: «وهي الخط المرسوم على الوجه المعتاد، للدلالة على القصد والإرادة»، وتكون عند العجز عن النطق كحال الأخرس.","p":"51"},{"t":"الطريق الثالث الإشارة المفهومة عند العجز عن النطق والكتابة، «ويفهم من عبارة المنظم هنا أنه لابد في الأخذ بالإشارة المفهومة أن يكون هناك عجز عن النطق والكتابة وهو مذهب الحنفية»، أما الجمهور فيجيزونها ولو كان قادرًا على الكتابة (حاشية الكتاب).","p":"51"}]},{"n":16,"ch":"ch3","part":"b2","title":"شروط الإيجاب والقبول","p":"51–52","text":"يشترط في الإيجاب والقبول:\n1 - أن يكونا متوافقين صراحة.\n2 - أن يكونا مقترنين في مجلس واحد حقيقة، ويصح أن يكونا مقترنين في مجلس واحد حكمًا، وذلك وفقًا لما تقرره الأحكام النظامية في هذا الشأن.\n3 - أن يكونا منجزين، لا معلقين على شرط، ولا مضافين إلى المستقبل","points":[{"t":"الموافقة: كأن يقول الولي: زوجتك ابنتي مريم، فيقول الزوج: قبلت بمريم زوجة لي، «أما لو قال قبلت بعائشة زوجة لي فليس هناك موافقة».","p":"52"},{"t":"«ولم يشترط المنظم هنا أسبقية الإيجاب على القبول أو العكس، وإنما اكتفى بالموافقة بينهما وهو قول جمهور أهل العلم بخلاف المذهب الحنبلي».","p":"52"},{"t":"المقارنة: لصعوبة الفورية «فقد حدد الفقهاء للعقد مجلسا تعتبر ساعاته وحدة زمنية، فاكتفوا باتحاد هذا المجلس بين الإيجاب والقبول، ولو طالت فترة المجلس».","p":"52"},{"t":"قاعدة الحنفية: «المجلس الواحد يجمع المتفرقات، فما يوجد في آخر المجلس يعتبر كالذي يوجد في أوله من حيث وحدة الزمن».","p":"53"},{"t":"لا يضر الفصل مهما طال، فإن فصل بينهما كلام أجنبي، أو انقطع المجلس بما يدل على الإعراض، أو بطلت أهلية الموجب قبل القبول: «لم ينعقد العقد حتى يعيد الموجب إيجابه».","p":"53"},{"t":"المجلس الحكمي: «إذا أبرم عقد الزواج بإحدى وسائل التقنية؛ فيعد الإيجاب والقبول في العقد مقترنين في مجلس واحد حكما، ويدخل في ذلك تواصلهم عبر الاتصال المرئي».","p":"53"},{"t":"الغائب المخاطب بالإيجاب كتابة أو برسول: إن تريث ثم أعاد قراءة الرسالة في محضر من الشهود وقال: قبلت، صح العقد.","p":"53"},{"t":"التنجيز: «أي: يترتب عليها أثرها في الحال كالبيع»، «لأن عقد الزواج من عقود التمليكات».","p":"53"},{"t":"المعلق على شرط كقوله: «تزوجتك إن جاء أبوك» لا ينعقد، «سواء أكان وقوع الشرط فيما بعد محققا أم محتملا أم مستحيلا»، إلا التعليق على أمر كائن موجود، كتعليق المرأة القبول على رضا أبيها فقبل أبوها في المجلس.","p":"54"},{"t":"والمضاف إلى المستقبل كقوله: «تزوجتك أول العام القادم»: «فمثل هذا العقد لا يصح لا في الحال ولا عند حصول الزمن المضاف إليه».","p":"54"}]},{"n":17,"ch":"ch3","part":"b2","title":"ترتيب الأولياء في الزواج","p":"54","text":"1 - يكون ترتيب الأولياء - في الزواج - على النحو الآتي:\nالأب، ثم وصيه، ثم الجد لأب وإن علا، ثم الابن، ثم ابنه وإن نزل، ثم الأخ الشقيق ثم الأخ لأب، ثم ابن الأخ الشقيق ثم ابن الأخ لأب وإن نزلا، ثم العم الشقيق ثم العم لأب، ثم بنوهما وإن نزلوا، ثم أقرب عصبة على ترتيب الإرث، ثم القاضي.\n2 - إذا استوى الأولياء في الدرجة؛ تعين من عينته المرأة منهم، وإن لم تعين جاز تولي أي منهم عقد الزواج.\n3 - ليس للولي - ولو كان الأب - أن يزوج موليته بغير رضاها على أن يضمن عقد الزواج ما يثبت الرضا","points":[{"t":"«مبنى الولاية قائم على الشفقة والرعاية والسعي في تحصيل مصالح المرأة»، ولأن الشفقة أمر معنوي «ربطه الشارع بأمر ظاهر وهو القرابة».","p":"54"},{"t":"«وهذا الترتيب موافق لما في مذهب الحنابلة، ويلحظ هنا أن المنظم لم يجعل لذوي الأرحام ولاية التزويج بل جعلها في العصبة فقط وهو قول جمهور أهل العلم».","p":"55"},{"t":"إذا طلبت المرأة التزويج لانقطاع أوليائها بغيبة أو فقد أو موت: «فينظر في الطلب إنهاء، ويثبت بالبينة إن وجدت»، وإلا تُحقق من الانقطاع بأي وسيلة إثبات أو بالكتابة إلى الجهة المختصة.","p":"55"},{"t":"إذا استوى الأولياء في الدرجة فالولي من عينته المرأة، «ويجب تضمين عقد الزواج ما يثبت هذا التعيين».","p":"55"},{"t":"«ومن المسائل المهمة في الولاية أنه لا يجوز للولي - ولو كان الأب - أن يزوج موليته بغير رضاها»، وفي تعميم لوزارة العدل أنه «ينبغي على المأذون أن يتثبت من موافقة المرأة على تزويجها».","p":"55"},{"t":"لفتة: «كلام الفقهاء هو في إجراء العقد وليس في الدخول بالزوجة، فالدخول بالزوجة لا يكون للزوجة الصغيرة التي لم تبلغ، وإنما للزوجة التي بلغت مبلغ النساء».","p":"56"}]},{"n":18,"ch":"ch3","part":"b2","title":"شروط الولي في الزواج","p":"56","text":"يشترط في الولي - في الزواج - أن يكون ذكرًا، عاقلًا بالغًا سن الرشد، موافقًا للمرأة في الدين، فإن فقد شرط: زوج الولي الذي يليه","points":[{"t":"الأول: أن يكون ذكرًا، لحديث: «لا تزوج المرأة المرأة، ولا تزوج المرأة نفسها».","p":"56"},{"t":"الثاني: أن يكون بالغًا سن الرشد، وهو في الفقرة الثانية من المادة الثانية عشرة من نظام المعاملات المدنية: «سن الرشد تمام (ثمان عشرة) سنة هجرية».","p":"56"},{"t":"الثالث: أن يكون عاقلًا، «فغير العاقل ليس له ولاية على نفسه، لقصور إدراكه وعجزه فلا تكون له ولاية على غيره؛ والولاية تتطلب كمال الحال».","p":"56"},{"t":"الرابع: أن يكون موافقًا للمرأة في الدين، «فإنه لا ولاية لكافر على مسلم ولا مسلمة وكذلك لا ولاية لمسلم على كافر أو كافرة، ولا ولاية لمرتد على أحد، وهذا باتفاق أهل العلم»، لقوله تعالى: ﴿ولن يجعل الله للكافرين على المؤمنين سبيلا﴾.","p":"56–57"},{"t":"فإن فقد الولي شرطًا، زوّج الولي الذي يليه في الترتيب.","p":"56"}]},{"n":19,"ch":"ch3","part":"b2","title":"تعذر حضور الولي في الزواج","p":"57","text":"إذا تعذر حضور ولي المرأة، أو تعذر تبليغه؛ فتنتقل المحكمة بناء على طلب المرأة ولاية التزويج إلى الولي الذي يليه","points":[{"t":"تعالج المادة غياب الولي الأقرب أو تعذر تبليغه مع حضور الخاطب الكفء، فتعطي القاضي «أمر الفصل في قبول ولاية الأبعد حين غيبة الولي الأقرب، وهو قول الحنفية، والمالكية، والشافعية».","p":"57"},{"t":"«إذ إن القاعدة العامة تجعل القاضي صاحب الشأن في تحقيق مصالح الناس، وفي السعي لرفع الظلم عنهم».","p":"57"},{"t":"«وتعذر ولي المرأة المقصود به تعذره عن الحضور لمكان العقد، وهو مكان إقامة المرأة».","p":"57"},{"t":"وعلى المحكمة أن تتحقق من تعذر الحضور أو التبليغ بواسطة الجهة المختصة، وفقًا لإجراءات التبليغ المقرة نظامًا.","p":"58"},{"t":"«وللمحكمة تفويض أحد المرخصين - وفق الأحكام النظامية - بإجراء عقد الزواج للمرأة التي لا يعرف لها أب، على أن ينص صراحة في العقد على إنابته بتزويج المرأة».","p":"58"}]},{"n":20,"ch":"ch3","part":"b2","title":"العضل في الزواج","p":"58","text":"إذا منع الولي - ولو كان الأب - موليته من الزواج بكفئها الذي رضيت به، تتولى المحكمة تزويج المرأة المعضولة بطلب منها أو من ذي مصلحة.\n- وللمحكمة نقل ولايتها لأي من الأولياء لمصلحة تراها.\n- أو تفويض أحد المرخصين - وفق الأحكام النظامية - بإجراء العقد","points":[{"t":"العضل في اللغة: «حبسها»، و«منعها الزوج ظلما».","p":"58"},{"t":"العضل اصطلاحًا: «منع المرأة التزوج بكفئها إذا طلبت ذلك ورغب كل منهما في صاحبه، سواء طلبت ذلك بمهر مثلها أو دونه»، وهو ما عليه جمهور الفقهاء.","p":"59"},{"t":"«العضل محرم»؛ لقوله تعالى: ﴿فلا تعضلوهن أن ينكحن أزواجهن﴾، وسبب نزولها قصة معقل بن يسار مع أخته. «ولأن العضل من قبيل التعسف في استخدام الحق، فالعاضل ظالم، والظالم فاسق، والفاسق لا ولاية له».","p":"59"},{"t":"شروط العضل المحرم أربعة: «وجود الخطوبة والرغبة في الزواج»، و«منع الولي للخاطب»، و«كفاءة الخاطب»، و«رضا المرأة به».","p":"59"},{"t":"آثار العضل: «الإثم على العاضل»، و«الفسق إن تكرر منه»، وعند الشافعية يفسق إذا عضل مرات «أقلها فيما حكى بعضهم ثلاث»، و«فقدان أهلية الولاية، وانتقالها للولي الذي يليه».","p":"60"},{"t":"«وقيل: تنتقل للحاكم»، وعليه جرى العمل قبل النظام، واختاره المنظم، وهو قول المالكية والشافعية ورواية في المذهب الحنبلي، واختاره ابن تيمية؛ لأنه «أيسر في التطبيق وأعلى مصلحة وأدنى مفسدة وأسرع في إنجاز القضية».","p":"60"},{"t":"تتولى المحكمة التزويج بطلب من المرأة أو من ذي مصلحة، وفي اللائحة: «فيعد في حكم كل ذي مصلحة؛ القريب للمرأة المعضولة، ووزارة الموارد البشرية والتنمية الاجتماعية».","p":"60"},{"t":"للمحكمة نقل ولايتها لأي من الأولياء لمصلحة تراها، «ولكن بشرط أن تراعي المحكمة رأي المرأة المعضولة في ذلك»، وإن فوضت أحد المرخصين نُص صراحة على إنابته.","p":"61"},{"t":"لا يشترط لإثبات العضل وجود خاطب ولا حضوره، ويعرف العضل «بأي وسيلة إثبات يقدرها القاضي في ذلك».","p":"61"},{"t":"إذا ثبت العضل ولم يكن سببه خاصًا بها، سرى ذلك على باقي موليات العاضل إذا طالبت إحداهن، وينظر في الطلب إنهاء.","p":"61"},{"t":"«لا يمنع الحكم بثبوت العضل تولي العاضل عقد الزواج بشرط رضا المرأة المعضولة بذلك».","p":"61"}]},{"n":21,"ch":"ch3","part":"b3","title":"شروط الشاهد في الزواج","p":"62","text":"يشترط في الشاهد أن يكون:\nرجلًا، بالغًا، عاقلًا، سامعًا الإيجاب والقبول، فاهمًا المقصود بهما.\nوأن يكون: مسلمًا متى كان الزوج مسلمًا","points":[{"t":"الأول: أن يكون رجلًا، «وهذا عند الجمهور سوى الحنفية ورواية عن الإمام أحمد»، «فلا يصح الزواج بشهادة النساء وحدهن، ولا بشهادة رجل وامرأتين»، وعلتهم: «خطورة الزواج وأهميته، بخلاف الشهادة في الأموال والمعاملات المالية».","p":"62"},{"t":"قال الزهري: «مضت السنة ألا تجوز شهادة النساء في الحدود، ولا في النكاح، ولا في الطلاق»، ولأنه عقد ليس بمال ولا يقصد منه المال.","p":"62–63"},{"t":"الثاني: أن يكون بالغًا، «فلا تصح الشهادة من الصبي ولو كان مميزا»؛ لأنه لا يتحقق بحضور الصبيان الإعلان والتكريم.","p":"63"},{"t":"الثالث: أن يكون عاقلًا، «فلا تصح شهادة المجنون على عقد الزواج؛ إذ لا تتحقق الغاية من الشهادة، وهي الإعلان وإثبات الزواج في المستقبل عند الجحود والإنكار».","p":"63"},{"t":"«وهذان الشرطان (الثاني والثالث) متفق عليهما بين الفقهاء، ويمكن جمعهما بشرط واحد وهو كون الشاهدين مكلفين».","p":"63"},{"t":"الرابع: أن يكون سامعًا الإيجاب والقبول فاهمًا المقصود بهما، «وهذا شرط عند أكثر الفقهاء، فلا ينعقد بشهادة نائمين أو أصمين».","p":"63"},{"t":"الخامس: أن يكون مسلمًا متى كان الزوج مسلمًا، «لينتشر خبره بين المسلمين، أما لو كان الزوجان غير مسلمين فيصح أن يشهد عليهما غير مسلمين».","p":"63"},{"t":"وفي حاشية الكتاب: «ولم يشترط المنظم العدالة فجوز أن تكون من الفاسق لأنها من جملة التحملات، وهو في هذا قد أخذ بمذهب الحنفية ورواية عن الإمام أحمد بخلاف الجمهور الذين اشترطوا العدالة».","p":"63"}]},{"n":22,"ch":"ch3","part":"b3","title":"المحرمات في الزواج (بالنسب)","p":"64","text":"يحرم على التأبيد - بسبب القرابة من النسب - الزواج من:\n1 - الأصل وإن علا.\n2 - الفرع وإن نزل.\n3 - فروع الوالدين وإن نزلوا.\n4 - الطبقة الأولى من فروع الأجداد أو الجدات","points":[{"t":"«والمحرمات في النكاح إما محرمات لأبد أو لأمد»، «فالمحرمات تحريما مؤبدا: هن اللائي يحرم الزواج بأي منهن أبدا؛ لوصف قائم لا يزول أبدا».","p":"64"},{"t":"«وأسباب ذلك الوصف محصورة في أربعة أسباب»: النسب (م22)، والمصاهرة (م23)، والملاعنة (م24)، والرضاعة (م25).","p":"64–65"},{"t":"«فالمحرمات بسبب القرابة: أربعة أنواع على الإجمال كما بينتهن هذه المادة، وسبعة على التفصيل» في آيتي النساء 22–23.","p":"65"},{"t":"الأولى: «الأصل وإن علا: ويشمل ذلك الأم والجدة»؛ لقوله تعالى: ﴿حرمت عليكم أمهاتكم﴾.","p":"65"},{"t":"الثانية: «الفرع وإن نزل: ويشمل البنت، وبنت الابن، وبنت البنت، وما نزل»؛ لقوله تعالى: ﴿وبناتكم﴾.","p":"65"},{"t":"الثالثة: «فروع الوالدين وإن نزلوا: ويشمل الأخت؛ شقيقة كانت، أو لأب، أو لأم»، وبنت الأخ وبنت ابنه، وبنت الأخت وبنت ابنه وبنت بنته؛ لقوله تعالى: ﴿وأخواتكم﴾ ﴿وبنات الأخ﴾ ﴿وبنات الأخت﴾.","p":"65–66"},{"t":"الرابعة: «الطبقة الأولى من فروع الأجداد أو الجدات: كعمة الشخص، وخالته»، شقيقة أو لأب أو لأم، وكذلك عمة الأب وعمة الأم، وخالة الأب وخالة الأم، وعمة الجد أو الجدة وخالتهما؛ لقوله تعالى: ﴿وعماتكم﴾ ﴿وخالاتكم﴾.","p":"66"}]},{"n":23,"ch":"ch3","part":"b3","title":"المحرمات بالمصاهرة","p":"66","text":"1 - يحرم على التأبيد بسبب المصاهرة، زواج الرجل من:\nأ - أمهات زوجته، وإن علون.\nب - بنات زوجته التي دخل بها.\nج - من كانت زوجة أحد أصوله وإن علوا، أو أحد فروعه وإن نزلوا.\n2 - الجماع في غير الزواج الصحيح يوجب ما يوجبه التحريم بالمصاهرة في الزواج الصحيح","points":[{"t":"«والأصهار هنا: هم أقارب المرأة من أمهاتها، وإخوتها - ذكورا وإناثا - وزوجة أحد أصول الرجل وإن علوا، وزوجة أحد فروعه وإن نزلوا».","p":"66"},{"t":"أمهات الزوجة: «فتحرم عليه أم زوجته وجداتها بمجرد العقد»؛ لقوله تعالى: ﴿وأمهات نسائكم﴾.","p":"67"},{"t":"بنات الزوجة «وهن الربائب»: «فتحرم بنت الزوجة - سواء أكانت من زوج قبله أم من زوج بعده - وبنات أولادها بشرط أن يكون قد دخل بالأم»؛ لقوله تعالى: ﴿وربائبكم اللاتي في حجوركم من نسائكم اللاتي دخلتم بهن فإن لم تكونوا دخلتم بهن فلا جناح عليكم﴾.","p":"67"},{"t":"ويحرم عليه: «زوجة أبيه وزوجة جده»؛ لقوله تعالى: ﴿ولا تنكحوا ما نكح آباؤكم من النساء﴾، و«زوجة ابنه وإن نزل»؛ لقوله تعالى: ﴿وحلائل أبنائكم الذين من أصلابكم﴾.","p":"67"},{"t":"«ولا خلاف في أن الوطء الحلال تثبت به حرمة المصاهرة. أما وطء الشبهة والزنا فإنه تثبت به حرمة المصاهرة على الصحيح من المذاهب، وهو قول الحنفية، والحنابلة».","p":"67"},{"t":"«فمن زنى بامرأة حرمت عليه أمها وبنتها، وحرمت على أبيه وابنه»، وكذا الموطوءة بشبهة؛ «لأن مناط التحريم عند الحنفية والحنابلة: هو الوطء، حلالا كان أو حراما».","p":"68"}]},{"n":24,"ch":"ch3","part":"b3","title":"المحرمة باللعان","p":"68","text":"يحرم على التأبيد: زواج الرجل من المرأة التي لاعنها أمام القضاء، ولو أكذب نفسه","points":[{"t":"«النوع الثالث من المحرمات في النكاح: تحريم الملاعنة على الملاعن».","p":"68"},{"t":"اللعان لغة: «مصدر لاعن يلاعن بمعنى دعا باللعنة، واللعنة: الطرد والإبعاد».","p":"68"},{"t":"واصطلاحًا: «شهادات مؤكدات بأيمان من زوجين، مقرونة باللعن والغضب، قائمة مقام حد قذف أو تعزير في جانبه، أو حد زنى في جانبها».","p":"68"},{"t":"«ومن آثار اللعان إذا تم صحيحا هو الفرقة بين الزوجين، وحرمتهما على بعضهما»، والراجح «قول الجمهور وأنهما لا يجتمعان أبدا»؛ لما جاء عن عمر رضي الله عنه: «المتلاعنان يفرق بينهما، ولا يجتمعان أبدا»، «وهو ماقرره النظام هنا وفي المادة (5/76)».","p":"69"},{"t":"«وإكذاب الزوج نفسه لا يفيده في عود النكاح ولا رفع تأبيد الحرمة: لأنهما حق له، وقد بطلا، فلا يتمكن من عودهما، بخلاف الحد ولحوق النسب؛ فإنهما يعودان لأنهما حق عليه».","p":"69"}]},{"n":25,"ch":"ch3","part":"b3","title":"المحرمات بالرضاع","p":"69","text":"يحرم من الرضاع ما يحرم من النسب، إذا توافر الشرطان الآتيان:\n1 - أن يقع الرضاع في العامين الأولين من الولادة.\n2 - أن يبلغ خمس رضعات متيقنة متفرقة، ولو تقارب وقتها","points":[{"t":"نصت المادة على ذلك «اتباعا للفظ حديث النبي ﷺ: يحرم من الرضاع ما يحرم من النسب»، «فكل امرأة حرمت عليه بالنسب: يحرم مثلها بالرضاع، كالأمهات والأخوات».","p":"70"},{"t":"الشرط الأول: «أن يقع الرضاع في العامين الأولين من الولادة»؛ لقوله تعالى: ﴿والوالدات يرضعن أولادهن حولين كاملين﴾، ولحديث: «لا يحرم من الرضاع إلا ما فتق الأمعاء في الثدي، وكان قبل الفطام».","p":"70"},{"t":"«فالذي يثبت الحرمة: حيث يكون الرضيع طفلا يسد اللبن جوعه وينبت لحمه، فيكون ذلك جزءا منه».","p":"70"},{"t":"الشرط الثاني: خمس رضعات متيقنة متفرقة ولو تقارب وقتها، لحديث عائشة: «كان فيما أنزل من القرآن: عشر رضعات معلومات يحرمن. ثم نسخن: بخمس معلومات».","p":"71"},{"t":"«والرضعة المقصودة هي: أن يمتص الطفل الثدي، ثم يقطع امتصاصه لتنفس أو انتقال من ثدي لآخر أو لغير ذلك: فيحتسب له بذلك رضعة. فإن عاد: فرضعتان»، ولو في مجلس واحد، ويرجع في تحديدها إلى العرف.","p":"71"},{"t":"ثبوت الرضاع: «يثبت الرضاع بشهادة امرأة مرضية في دينها».","p":"71"},{"t":"الشك في الرضاع: «إن شك في وجود الرضاع، أو شك في كماله خمس رضعات، وليس هناك بينة: فلا تحريم؛ لأن الأصل عدم الرضاع».","p":"71"},{"t":"آثار الرضاع: يصير المرتضع ولدها في تحريم نكاحها عليه، ويباح نظره إليها وخلوته بها، ويكون محرمًا لها.","p":"71–72"},{"t":"و«لا يكون ولدا لها في بقية الأحكام: فلا تجب نفقتها عليه، ولا توارث بينهما، ولا يعقل عنها، ولا يكون وليا لها؛ لأن النسب أقوى من الرضاع».","p":"72"},{"t":"ويصير المرتضع ولدًا لمن ينسب لبنها إليه، ومحارم صاحب اللبن ومحارم المرضعة محارم للمرتضع.","p":"72"},{"t":"«وكما تثبت الحرمة على المرتضع تنتشر كذلك على فروعه، من أولاده وأولاد أولاده دون أصوله وحواشيه».","p":"72"},{"t":"وصول اللبن بغير الرضاع، كالقطر في الفم أو الأنف أو الشرب من إناء: «أخذ ذلك حكم الرضاع»، «بشرط أن يحصل ذلك خمس مرات».","p":"72"},{"t":"لبن المرأة إذا درّ بلا حمل ولا وطء: قيل لا ينشر الحرمة، وهو رواية عن أحمد، وقيل ينشرها، وهو أظهر الروايتين عن أحمد ومذهب مالك والشافعي وغيرهم. قال ابن قدامة: «وهذا أصح»، وبه أفتت اللجنة الدائمة للبحوث العلمية والإفتاء.","p":"73"}]},{"n":26,"ch":"ch3","part":"b3","title":"المحرمات تحريمًا مؤقتًا","p":"73–74","text":"يحرم الزواج مؤقتًا، في الحالات الآتية:\n1 - زواج الرجل من المعتدة من غيره.\n2 - زواج الرجل من البائن منه بينونة كبرى بطلاقها ثلاثًا مع مراعاة أحكام المادة (الخامسة والثمانين) من هذا النظام.\n3 - الجمع بين أكثر من أربع نسوة ولو كانت إحداهن في عدة طلاق رجعي، أو بائن، أو فسخ.\n4 - الجمع بين الأختين أو بين المرأة وعمتها أو خالتها.\n5 - زواج المحرم بالحج أو العمرة قبل التحلل.\n6 - زواج المسلم من غير الكتابية.\n7 - زواج المسلمة من غير المسلم","points":[{"t":"«وقد ذكرت المادة سبعا من هؤلاء، لكنها جاءت مجموعة غير مفصلة»، وقسمها الكتاب نوعين: «ما كان تحريمه لعارض يزول غير الجمع»، و«ما يحرم من أجل الجمع».","p":"74–77"},{"t":"المعتدة من غيره: «فيحرم تزوج المعتدة من الغير إجماعا»؛ لقوله تعالى: ﴿ولا تعزموا عقدة النكاح حتى يبلغ الكتاب أجله﴾، «ومن الحكمة في ذلك: أنه لا يؤمن أن تكون حاملا، فيفضي ذلك إلى اختلاط المياه واشتباه الأنساب».","p":"74"},{"t":"«وأما من فارقها زوجها بخلع عن تراض منهما، أو فسخ من الحاكم لضرر ونحوه، فإن لمن فارقها عقد الزواج منها في عدتها، وهو ماذكره المنظم في المادة (35)».","p":"75"},{"t":"البائن بينونة كبرى: «فيحرم على الرجل أن يتزوج من طلقها ثلاثا حتى يطأها زوج غيره بنكاح صحيح، وهو بإجماع أهل العلم».","p":"75"},{"t":"ومع مراعاة المادة (85/2/ب): «الطلاق البائن بينونة كبرى، لا تحل المطلقة بعده لمطلقها إلا بعد انقضاء عدتها من زوج آخر دخل بها في زواج صحيح من غير قصد الزوج التحليل»، ودليله قصة امرأة رفاعة: «لا، حتى يذوق عسيلتك، وتذوقي عسيلته».","p":"75"},{"t":"المحرم بالحج أو العمرة: «وهذا التحريم المؤقت يشمل المحرم والمحرمة»، «هذا مذهب مالك والشافعي وأحمد»؛ لحديث: «لا ينكح المحرم، ولا ينكح، ولا يخطب».","p":"76"},{"t":"وعموم «ولا ينكح» يشمل الولي والوصي والوكيل، «ومتى عقد أمثال هؤلاء فالنكاح فاسد وعليهم تجديده بعد التحلل إذا رغبا الاستمرار، وإلا طلق الزوج فإن أبى فسخه الحاكم».","p":"76"},{"t":"المسلم من غير الكتابية: لا يتزوج المسلم كافرة؛ «إلا الحرة الكتابية، فيجوز للمسلم أن يتزوجها»؛ لقوله تعالى: ﴿والمحصنات من الذين أوتوا الكتاب من قبلكم﴾.","p":"76"},{"t":"المسلمة من غير المسلم: «فلا يحل أن يتزوج كافر امرأة مسلمة»؛ لقوله تعالى: ﴿ولا تنكحوا المشركين حتى يؤمنوا﴾.","p":"77"},{"t":"الجمع بين أكثر من أربع: «فلا يجوز للرجل أن يجمع بين أكثر من أربع نسوة بغير خلاف»، وأمر النبي ﷺ غيلان بن سلمة الثقفي لما أسلم وله عشر نسوة «أن يتخير أربعا منهن».","p":"77"},{"t":"الجمع بين الأختين محرم: ﴿وأن تجمعوا بين الأختين﴾، وبين المرأة وعمتها أو خالتها: «لا يجمع بين المرأة وعمتها، ولا بين المرأة وخالتها».","p":"77–78"},{"t":"«وضابط هذا التحريم هنا هو: أنه لا يجوز الجمع بين كل امرأتين لو كانت إحداهما ذكرا والأخرى أنثى حرم نكاحها لها لقرابة أو رضاع»، والحكمة: «إنكن إذا فعلتن ذلك قطعتن أرحامكن».","p":"78"},{"t":"وفي الحاشية أن المنظم أغفل صورًا، منها الزواج من الزانية: «فإنه قد أخذ بقول الجمهور وهو جواز الزواج منها وإن لم تتب خلافا للمذهب الحنبلي».","p":"78"},{"t":"من المسائل المعاصرة: زواج المسيار، وزواج الأصدقاء، والزواج المؤقت بالإنجاب، والزواج بنية الطلاق، وقد صدر فيها قرار مجمع الفقه الإسلامي في دورته الثامنة عشرة في (12/3/1427هـ).","p":"78–79"},{"t":"عقد تتنازل فيه المرأة عن السكن والنفقة والقسم أو بعضها، ومثله بقاء الفتاة في بيت أهلها ويلتقيان متى رغبا: «هذان العقدان وأمثالهما صحيحان: إذا توافرت فيهما أركان الزواج وشروطه، وخلوه من الموانع، ولكن ذلك خلاف الأولى».","p":"79"},{"t":"الزواج المؤقت بالإنجاب: «وهذا الزواج فاسد لوجود معنى المتعة فيه»، «ونكاح المتعة مجمع على تحريمه».","p":"79"},{"t":"الزواج بنية الطلاق: «وهذا النوع من النكاح على الرغم من أن جماعة من العلماء أجازوه إلا أن المجمع يرى منعه؛ لاشتماله على الغش والتدليس».","p":"80"}]},{"n":27,"ch":"ch3","part":"b4","title":"الشروط في عقد الزواج","p":"80","text":"1 - الزوجان عند شروطهما.\n2 - لا يكون الشرط مثبتًا لخيار فسخ عقد الزواج إلا إذا نص على الشرط كتابة في وثيقة عقد الزواج، أو أقر به الزوجان","points":[{"t":"مصلحة العاقد في الشرط: «إما نوعية، وهي: ما يترتب عادة على العقود من نوع واحد، كملك المبيع في عقد البيع»، «وإما شخصية، وهي: ما تتطلبها المصلحة الشخصية للعاقد».","p":"80"},{"t":"«فوقف الحنفية والشافعية وجمهور المالكية موقف التضييق»، لحديث: «ما بال أناس يشترطون شروطا ليست في كتاب الله»، «وفتح الحنابلة ومعهم بعض فقهاء المذاهب الأخرى، المجال واسعا أمام المتعاقدين»، لحديث: «المسلمون على شروطهم، إلا شرطا حرم حلالا أو أحل حراما».","p":"81"},{"t":"«وهذه المادة هي مما جاء به مذهب الحنابلة»، فأخذ المنظم عنها أحكام الشروط «تيسيرا للحياة الزوجية».","p":"81"},{"t":"الشروط قسمان: «القسم الأول: الشروط الصحيحة؛ وهي نوعان»: «ما وافق مقتضى العقد»، مثل «شرط تسليم الزوجة نفسها لزوجها، واستحقاقها للمهر»، و«ما كان لأحد الزوجين فيه منفعة ولم يكن لازما بأصل العقد، مثل اشتراط المرأة أن لا ينقلها من بلدها».","p":"82"},{"t":"«القسم الثاني: الشروط الباطلة: وهي الشروط التي تخالف نصوص الشرع أو مقتضى العقد»، ومنها ما لا يبطل العقد كاشتراط ألا مهر لها (م29/2)، وما يبطله: نكاح المتعة ونكاح الشغار (م29/1).","p":"82"},{"t":"الفقرة الأولى مبدأ عام: الزوجان ملزمان بالوفاء بشروطهما، «إلا شرطا حرم حلالا أو أحل حراما»، كاشتراط ارتكاب جريمة، «فهذا الشرط لغو وباطل ولا يبطل به العقد».","p":"82"},{"t":"ومن الشروط الصحيحة: أن يشترط الزوج أن تسافر معه إلى بلده، أو تشترط ألا يخرجها من دارها أو بلدها، وهي شروط «يجب الوفاء به ولصاحبه حق الفسخ إذا أخل به المشروط عليه».","p":"83"},{"t":"«لا يعتد بأي شرط إلا بطريقين هما: الطريق الأول، الكتابة»، فلا عبرة بما يجري أثناء الخطبة ولم يرد في العقد، ولا بالوعود بعد انبرامه، «الطريق الثاني، الإقرار: ويكون من قبل المشترط عليه».","p":"83"},{"t":"ومن أدلة الوفاء: «أحق الشروط أن توفوا به ما استحللتم به الفروج»، وقضاء عمر فيمن شرط لزوجته دارها: «إن مقاطع الحقوق عند الشروط، ولك ما شرطت».","p":"83–84"},{"t":"نقل الكتاب عن ابن القيم أنه «لا فرق بين اشتراطه واشتراطها به، بل إثبات الخيار لها إذا فات ما اشترطته أولى»، «وبه أخذ المنظم السعودي هنا».","p":"84"},{"t":"«والشروط هنا قد تكون في صلب العقد وهي معتبرة إجماعا. وقد تكون قبل العقد وهي معتبرة في ظاهر مذهب أحمد، وقد تكون بعد العقد ولزومه فالمنصوص عن أحمد أنها لا تلزم عنده، وقال ابن رجب بصحتها وهو ما أخذ به المنظم».","p":"84"}]},{"n":28,"ch":"ch3","part":"b4","title":"أثر عدم الوفاء بالشروط في الزواج","p":"84","text":"إذا لم يف أحد الزوجين بما شرطه الآخر، وفقًا لما تضمنته المادة (السابعة والعشرين) من هذا النظام؛ فللمشترط طلب فسخ عقد الزواج متى شاء؛ إلا إذا أسقط حقه صراحة.\nفإذا كان عدم الوفاء من الزوج: فيكون الفسخ بلا عوض. وإذا كان من الزوجة: فيكون بعوض لا يزيد على المهر","points":[{"t":"«نصت الفقرة الأولى من هذه المادة على التسوية بين الزوج والزوجة في حق الفسخ عند فوات الصفة التي اشترطت بالعقد، أي صفة كانت»، مثل أن تكون الزوجة بكرًا أو الزوج موظفًا.","p":"85"},{"t":"«وتدل هذه الفقرة على أن هذا الخيار بالفسخ هو على التراخي بدلالة نصها بقولها (متى شاء)».","p":"85"},{"t":"يسقط حق الفسخ بإسقاط صاحبه صراحة، «والمذهب الحنبلي على الإسقاط صراحة أو ضمنا»، والإسقاط الضمني كأن يخل أحدهما بالشرط ويسكت الآخر، «فهذا لا اعتبار به عند المنظم هنا، إذ يشترط أن يكون الإسقاط صريحا، وهو رأي سديد يقطع كثيرا من المنازعات».","p":"85"},{"t":"وإن كان عدم الوفاء من الزوج فالفسخ بلا عوض، وإن كان من الزوجة فبعوض لا يزيد على المهر، ويدل عليه: «أحق الشروط أن توفوا به ما استحللتم به الفروج».","p":"85"},{"t":"قال عمر للذي قال: إذن يطلقننا: «إن مقاطع الحقوق عند الشروط». وذكر ابن القيم أن المرأة «لم ترض ببذل بضعها للزوج إلا على هذا الشرط، ولو لم يجب الوفاء به لم يكن العقد عن تراض».","p":"86"},{"t":"وفي الحاشية: المذهب الحنبلي على عدم وجوب الوفاء، «وفي رواية عن أحمد اختارها ابن تيمية وابن القيم أنه يجب الوفاء وهو ما أخذ به المنظم هنا، ورتب عليه الفسخ».","p":"86"},{"t":"وإن كان عدم الوفاء من الزوجة فللزوج الفسخ، «وله أن يأخذ عوضا عن ذلك بشرط أن لا يزيد العوض على المهر الذي دفعه الزوج لزوجته».","p":"86"}]},{"n":29,"ch":"ch3","part":"b4","title":"الشروط الباطلة","p":"86–87","text":"1 - إذا اشترط في عقد الزواج ما ينافي استمراره، أو جعل عقد الزواج في مقابل عقد زواج آخر؛ فالعقد باطل.\n2 - مع مراعاة ما تضمنته الفقرة (1) من هذه المادة، يصح عقد الزواج، ويبطل الشرط إذا كان منافيًا لمقتضى العقد","points":[{"t":"النوع الأول: شروط باطلة تبطل العقد، «وضابط ذلك هو: كل عقد نهى عنه الشرع وأبطله، ويتصور ذلك في ثلاثة عقود»: المحلل، والمتعة، والشغار.","p":"87"},{"t":"زواج المحلل: «أن يتزوج الرجل المرأة بشرط أنه متى حللها للأول طلقها، أو نوى التحليل بلا شرط يذكر في العقد، أو اتفقا عليه قبل العقد، ففي جميع هذه الأحوال: يبطل النكاح»، لحديث: «لعن الله المحلل والمحلل له».","p":"87"},{"t":"«والعبرة بشرط التحليل ونيته هو ما يصدر عن الزوج (المحلل)، ولا أثر لنية الزوجة أو وليها في ذلك؛ لأن الفرقة ليست لهما».","p":"87"},{"t":"زواج المتعة: «وهو النكاح والتزويج إلى مدة معينة»، كقوله: زوجتها شهرًا أو سنة. قال ابن تيمية: «الروايات المستفيضة المتواترة متواطئة على أن الله تعالى حرم المتعة بعد إحلالها». «وهذان العقدان ينافيان استمرار عقد الزواج».","p":"88"},{"t":"زواج الشغار: «أن يزوج الولي موليته بشرط أن يزوجه الآخر موليته»، وسمي به «من الشغور وهو الخلو من العوض»، وقيل من شغر الكلب.","p":"88"},{"t":"وفي الحاشية: عند الحنابلة والحنفية لا بد في الشغار من عدم المهر، وعند المالكية والظاهرية يكفي الشرط ولو وجد المهر، «وهو ما أخذ به المنظم هنا فلم يشترط عدم وجود المهر».","p":"88"},{"t":"«أجمع أهل العلم على تحريمه، فهو باطل، ويجب التفريق فيه، سواء كان مصرحا فيه بنفي المهر أو مسكوتا عنه»، وعلته أن الولي يزوجها لغرضه لا لمصلحتها.","p":"89"},{"t":"«فإذا سمي لكل واحدة منهما مهر مستقل كامل، بلا حيلة، مع أخذ موافقة المرأتين؛ صح ذلك، لانتفاء الضرر».","p":"89"},{"t":"النوع الثاني: شروط باطلة لا تبطل العقد، وضابطها: «هي كل ما خالف مقتضى عقد النكاح»، ومقتضاه: «ما يجب بعقد النكاح من غير شرط»، كتسليم المهر والنفقة والقسم.","p":"90"},{"t":"من صورها: «اشتراط عدم المهر»، و«اشتراط عدم القسم»، و«اشتراط عدم النفقة والسكن».","p":"90"},{"t":"اشتراط طلاق الضرة: قيل صحيح «لأن لها في ذلك فائدة»، وقيل: «لا يصح هذا الشرط»؛ لنهي النبي ﷺ أن تشترط طلاق أختها، «والثاني أرجح والله تعالى أعلم».","p":"90–91"},{"t":"«فهذه كلها شروط باطلة، لأنها تنافي مقتضى العقد»، «أما العقد فيصح؛ لأن هذه الشروط تعود إلى معنى زائد في العقد لا ينافي أصله».","p":"91"}]},{"n":30,"ch":"ch3","part":"b4","title":"أنواع عقد الزواج","p":"91","text":"الزواج نوعان، وهما:\n1 - زواج صحيح.\n2 - زواج غير صحيح، ويشمل ما يأتي:\nأ - الزواج الباطل.\nب - الزواج الفاسد","points":[{"t":"«فالعقد الباطل: غير منعقد بإجماع المذاهب الفقهية، ولا تترتب عليه آثار العقد الصحيح».","p":"92"},{"t":"«أما العقد الفاسد: هو العقد الذي اختل شرط من شروطه المختلف فيها بين أهل العلم، كالنكاح بلا ولي أو بلا شاهدين»، «فهو مرحلة بين الصحة والبطلان، وإذا تم تنفيذه رضاء فإنه ينتج آثاره، لكنه يقبل الفسخ بقوة القضاء».","p":"92"},{"t":"«وقد أخذ المنظم بالقسمة الثلاثية على التفصيل»، والباطل والفاسد كلاهما غير منعقد، «والفرق بينهما هو أن الفاسد فيه شبهة تجعل فيه آثارا» بينتها المادة (34).","p":"92"},{"t":"أبرز فرقين: «الأول، أن الزواج الباطل لا يحتاج إلى فرقة من زوج أو حاكم؛ لأنه لم ينعقد أصلا، بخلاف الفاسد فلا بد فيه من فرقة من زوج أو فسخ من حاكم».","p":"92"},{"t":"«الثاني، جواز زواج المرأة في الزواج الباطل من زوج آخر دون طلاق من زوج ولا فسخ من حاكم، لكن بعد استبراء مدخول بها من وطء بالعدة المعتبرة كعدة المطلقة».","p":"92"}]},{"n":31,"ch":"ch3","part":"b4","title":"عقد الزواج الصحيح","p":"93","text":"يكون عقد الزواج صحيحًا إذا توافرت أركانه وشروطه، ويرتب آثاره من حين انعقاده","points":[{"t":"«والعقد سبب شرعي يثبت الحل وقبله تحريم»، فإذا وجد بأركانه وشروطه ترتبت آثاره من حين انعقاده، ونقل العلاقة من التحريم إلى الحل.","p":"93"},{"t":"«فيترتب عليه: الحل بين الزوجين، والمهر، والعشرة بالمعروف، وحقوق الزوجية، والنسب، ونفيه باللعان، ونفقة الزوجية، ونفقة العدة للمطلقة، والتوارث بين الزوجين، وحرمة المصاهرة».","p":"93"},{"t":"«ولا ينحل إلا بالوفاة أو بالطلاق أو بالفسخ أو بالتفريق القضائي». وأركانه ما في المادة 12، وشروطه ما في المادة 13.","p":"93"}]},{"n":32,"ch":"ch3","part":"b4","title":"عقد الزواج الباطل","p":"94","text":"يكون عقد الزواج باطلًا إذا تخلف أحد أركانه، أو أحد شروط صحته، أو اشترط فيه أحد الشرطين الواردين في الفقرة (1) من المادة (التاسعة والعشرين) من هذا النظام","points":[{"t":"يكون العقد باطلًا بأحد أمور ثلاثة: اختلال ركن من أركانه (م12)، أو شرط من شروطه (م13)، أو اشتراط ما ينافي استمراره أو جعله مقابل عقد زواج آخر (م29/1).","p":"94"},{"t":"«وهذا النوع من الزواج لا يعترف به من قبل الشارع»، «ولذلك فإنه لا ينقل العلاقة بين الرجل والمرأة من التحريم إلى الحل».","p":"94"},{"t":"«ويكون هذا الزواج الباطل في حكم الزنا المحض لا يترتب على الدخول به أي أثر كزواج المحارم أو زواج المسلمة بغير مسلم».","p":"94"}]},{"n":33,"ch":"ch3","part":"b4","title":"آثار عقد الزواج الباطل","p":"95","text":"1 - لا يرتب الزواج الباطل أي أثر قبل الدخول.\n2 - يترتب على الزواج الباطل بعد الدخول، الأحكام الآتية:\nأ - وجوب العدة.\nب - حرمة المصاهرة.\nج - استحقاق المرأة مهر المثل ما لم يسم مهر، إن كانت لا تعلم حكم العقد","points":[{"t":"قبل الدخول: «لا يترتب عليها أي أثر؛ لأنه لم ينعقد فوجود العقد كعدمه».","p":"95"},{"t":"بعد الدخول: وجوب العدة، ودليلها حديث يوم حنين: «لا يحل لامرئ يؤمن بالله واليوم الآخر أن يسقي ماءه زرع غيره»، «وهو يشمل كل امرأة تم نكاحها سواء أكان نكاحا باطلا أم غيره».","p":"95"},{"t":"وحرمة المصاهرة «احتياطا واستبراء للدين، والأخذ بالاحتياط في النكاح أولى».","p":"95"},{"t":"ومهر المثل ما لم يسم مهر إن كانت لا تعلم حكم العقد، لحديث: «فإن دخل بها فلها المهر بما استحل من فرجها». «ويفهم من هذه المادة أنها تستحق المهر المسمى؛ لأنهما تراضيا عليه».","p":"96"},{"t":"ويثبت نسب الولد إذا كانا لا يعلمان بطلان العقد، بدلالة الفقرة الثالثة من المادة 34.","p":"96"}]},{"n":34,"ch":"ch3","part":"b4","title":"عقد الزواج الفاسد وآثاره","p":"96–97","text":"1 - تفسخ المحكمة عقد الزواج الفاسد، ولا يترتب عليه أي أثر قبل الدخول إلا الطلاق إذا أوقعه الزوج فيقع بائنًا بينونة صغرى.\n2 - يترتب على الزواج الفاسد بعد الدخول ما يأتي:\nأ - استحقاق المرأة المهر المسمى.\nب - ثبوت نسب الولد.\nج - وجوب العدة.\nد - حرمة المصاهرة.\nهـ - استحقاق المرأة النفقة ما لم تكن عالمة فساد العقد.\nو - الطلاق إذا أوقعه الزوج فيقع بائنًا بينونة صغرى.\n3 - تطبق الآثار المترتبة على الزواج الفاسد على كل زواج باطل بعد الدخول إذا كان الزوجان لا يعلمان حكمه","points":[{"t":"لم يعرّف النظام الزواج الفاسد، «لكن جاء في اللائحة أنه تترتب آثار عقد الزواج الواردة في هذه المادة إذا كان بلا إيجاب من الولي، أو بلا شهود، أو زواج محرم بحج أو عمرة، ويمكن توثيقه بعد تصحيحه».","p":"97"},{"t":"«أي عقد ثبت فساده فإن على المحكمة فسخه، فيفرق القاضي بينهما متى علم باجتماعهما في عقد فاسد».","p":"97"},{"t":"قبل الدخول: لا أثر «سوى الطلاق إذا أوقعه الزوج فيقع بائنا بينونة صغرى»، «ولا يصح تزويجها قبل طلاقها من زوجها أو فسخ العقد الفاسد من قبل حاكم».","p":"97"},{"t":"بعد الدخول «ستة آثار»: المهر المسمى، و«المهر المدون في العقد هو المهر المسمى، ما لم يصادق الزوجان على خلاف ذلك»، وثبوت النسب «احتياطا حتى لا يضيع الولد»، والعدة «استبراء لرحمها»، وحرمة المصاهرة.","p":"97–98"},{"t":"والنفقة ما لم تكن عالمة فساد العقد؛ «لأن جهلها الفساد يجعلها كالزوجة الشرعية فهي محتبسة لمصلحة الزوج فنفقتها عليه، وهذا هو قول الجمهور»، والطلاق يقع بائنًا بينونة صغرى.","p":"98"},{"t":"«ويفهم من هذه المادة أنها لا تستحق هذه الآثار بالخلوة وغيرها، وإنما بالدخول فقط»، وهو قول أكثر أهل العلم بخلاف المذهب الحنبلي (حاشية الكتاب).","p":"98"},{"t":"«رابعا: الآثار المترتبة على العقد الباطل إذا لم يكن الزوجان يعلمان حكمه: هي نفسها آثار العقد الفاسد بعد الدخول».","p":"98"}]},{"n":35,"ch":"ch3","part":"b4","title":"إبرام عقد زواج جديد للعقد الفاسد أو الباطل","p":"99","text":"يصح للزوجين إبرام عقد زواج جديد مستوف الأركان والشروط، دون الحاجة إلى حكم قضائي بفسخ العقد السابق الفاسد أو الباطل، وذلك مع مراعاة الإجراءات المنظمة للتوثيق","points":[{"t":"«ولايجب في هذه الحالة - لو كان العقد باطلا أو فاسدا - وجود حكم قضائي بفساد أو ببطلان العقد السابق».","p":"99"},{"t":"«ولم نقل قبل الدخول أو بعده، ولم نقل كذلك بعد العدة؛ لأن المرأة هنا ليس عليها عدة؛ لأن الناكح واحد، فلا نحتاج إلى التحقق من خلو الرحم من الحمل».","p":"99"},{"t":"ويتم ذلك «مع مراعاة العاقدين للإجراءات المنظمة للتوثيق وما قبلها من فحص زواج وغيره».","p":"99"}]},{"n":36,"ch":"ch3","part":"b4","title":"تعريف المهر","p":"99","text":"المهر هو المال الذي يدفعه الرجل للمرأة بسبب عقد الزواج","points":[{"t":"«ويسمى بعدة مسميات كالصداق والأجر والصدقة والنحلة وغيرها».","p":"99"},{"t":"«وهو مشروع بالكتاب والسنة والإجماع»: ﴿وآتوا النساء صدقاتهن نحلة﴾، وحديث عبد الرحمن بن عوف: «أولم ولو بشاة»، وحكى ابن قدامة الإجماع.","p":"100"},{"t":"«وهو أثر من آثار عقد الزواج فليس ركنا فيه ولا شرطا كذلك».","p":"100"}]},{"n":37,"ch":"ch3","part":"b4","title":"ضابط ما يعد مهرًا","p":"100","text":"كل ما صح اعتباره مالًا، صح أن يكون مهرًا","points":[{"t":"«والمال يشمل الأعيان والمنافع والحقوق»، وفي المادة العشرين من نظام المعاملات المدنية: «المال هو كل ماله قيمة مادية معتبرة في التعامل من عين أو منفعة أو حق».","p":"100"},{"t":"فيدخل كل مال متقوّم أو منفعة متقوّمة، «كسكنى دار، أو زراعة أرض، أو عمل يصح التزامه، كبناء أو زراعة أو تعليم ويأخذ عليه أجرا»، «وقد قال به جمهور الفقهاء».","p":"100"}]},{"n":38,"ch":"ch3","part":"b4","title":"ملك المرأة للمهر","p":"100","text":"المهر ملك للمرأة، لا تجبر على أي تصرف فيه","points":[{"t":"«تؤكد هذه المادة على أن المهر حق خالص للزوجة، تتصرف فيه كيف شاءت بما لا يخالف شرعا أو نظاما»، وهي التي تقبضه، ولها أن توكل.","p":"101"},{"t":"لها أن تهب مهرها لزوجها بعد قبضه، وأن تبرئ ذمته منه كلًا أو بعضًا قبل قبضه «ما دامت كاملة الأهلية ومن أهل التبرع».","p":"101"},{"t":"«ولو شرط عليها الزوج ان تشتري به متاعا أو أثاثا لداره، فإنه لا يعتد بهذا الشرط».","p":"101"}]},{"n":39,"ch":"ch3","part":"b4","title":"أحكام تعجيل المهر وتأجيله","p":"101","text":"1 - يجوز الاتفاق في عقد الزواج على تأجيل المهر كله أو بعضه.\n2 - إذا لم ينص في العقد على تأجيل المهر ولم يحدد وقت معين لتسليمه، فيتعين تسليمه عند المطالبة به.\n3 - إذا نص في العقد على تأجيل المهر فلا يخلو من الأحوال الآتية:\nأ - إذا ذكر أجل معلوم، فيحل المهر بحلول الأجل.\nب - إذا ذكر أجل غير معلوم، فهو معجل.\nج - إذا لم يذكر وقت الأجل، فيحل بالفرقة البائنة، أو وفاة أحد الزوجين","points":[{"t":"يجوز تأجيل المهر كله أو بعضه، «ويكون دينا في هذه الحال».","p":"102"},{"t":"إذا لم ينص على التأجيل «يتعين تسليم المهر إذا طالبت به الزوجة في أي وقت لأنه حق لها».","p":"102"},{"t":"الأجل المعلوم: كتاريخ معين، «فيكون المهر حالا بحلول هذا التاريخ المعين».","p":"102"},{"t":"الأجل غير المعلوم، «ومثاله لو عين رجوع فلان من السفر وهو لا يعلم وقت رجوعه، فيعتبر المهر حالا؛ لأن غاية التسليم غير معلومة، والأصل هو الحلول».","p":"102"},{"t":"إذا لم يذكر وقت الأجل يحل المهر «بالفرقة البائنة، سواء أكانت بينونة صغرى أم كبرى»، «أو بوفاة أحد الزوجين».","p":"102"}]},{"n":40,"ch":"ch3","part":"b4","title":"حالات المهر","p":"103","text":"1 - يجب المهر بموجب عقد الزواج الصحيح.\n2 - يتأكد المهر المسمى كاملًا - أو مهر المثل - بالدخول، أو الخلوة، أو وفاة أحد الزوجين.\n3 - تستحق المطلقة قبل الدخول نصف المهر إن كان المهر مسمى، وإلا فلها متعة لا تتجاوز نصف مهر المثل","points":[{"t":"«تبين هذه المادة أن المهر إنما يجب بنفس عقد الزواج الصحيح فهو موجبه»، ولا يتأكد إلا في ثلاثة مواضع: الدخول، والخلوة الصحيحة، وموت أحد الزوجين قبل الدخول «لأنه لايبطل النكاح بدليل التوارث».","p":"103"},{"t":"«والمهر المسمى هو المهر المدون في العقد ما لم يصادق الزوجان على خلاف ذلك». «وأما مهر المثل فإنه يقدر باعتبار مهر مثيلاتها من قراباتها من جهة الأب والأم».","p":"104"},{"t":"المطلقة قبل الدخول وقد سمي لها مهر: لها نصفه؛ لقوله تعالى: ﴿فنصف ما فرضتم﴾. وإن لم يسم: وجبت المتعة؛ لقوله تعالى: ﴿ومتعوهن على الموسع قدره وعلى المقتر قدره﴾.","p":"104"},{"t":"«والمتعة هي: مال يجب على الزوج دفعه لامرأته المفارقة في الحياة بطلاق وما في معناه بشروط، ولم يرد في القرآن أو السنة تحديد لقدر المتعة، لكن المنظم هنا حددها بأن لا تتجاوز نصف مهر المثل».","p":"104"},{"t":"وفي الحاشية: «وأما المطلقة بعد الدخول فلا متعة لها في المذهب الحنبلي ولا في النظام هنا».","p":"104"}]},{"n":41,"ch":"ch3","part":"b4","title":"مهر المثل","p":"106","text":"يثبت للمرأة مهر المثل في الأحوال الآتية:\n1 - السكوت عن تسمية المهر.\n2 - نفي المهر في عقد الزواج.\n3 - فساد المهر المسمى","points":[{"t":"ضابطه ما في المادة (18) من اللائحة: «يكون تقدير مهر المثل للمرأة باعتبار مهر مثيلاتها من قراباتها من جهة الأب والأم».","p":"106"},{"t":"السكوت عن التسمية «ويسمى نكاح التفويض، وتسمى المرأة مفوضة بكسر الواو أو فتحها»، فيجب مهر المثل؛ لحديث ابن مسعود: «لها صداق نسائها، لا وكس ولا شطط»، و«المقصود لانقص ولا زيادة».","p":"106"},{"t":"نفي المهر: «كأن يتزوج رجل امرأة على ألا مهر لها، فتقبل، فيجب لها مهر المثل بالدخول أو بالموت عند الجمهور؛ لأن هذا الاتفاق باطل، واشتراط نفي المهر فاسد، والشرط الفاسد لا يفسد الزواج».","p":"106"},{"t":"فساد المسمى: كأن يكون غير مال أو لا ينتفع به، أو مالًا غير متقوم، أو مشتملًا على غرر، أو معجوز التسليم، «أو يكون المسمى مجهولا جهالة فاحشة: وهي التي تفضي إلى النزاع؛ فهنا يجب مهر المثل».","p":"107"}]},{"n":42,"ch":"ch4","title":"حقوق الزوجين","p":"109","text":"يلزم على كل من الزوجين حقوق للزوج الآخر، وهي:\n1 - حسن المعاشرة بينهما بالمعروف، وتبادل الاحترام بما يؤدي للمودة والرحمة بينهما.\n2 - عدم إضرار أحدهما بالآخر ماديًا أو معنويًا.\n3 - عدم امتناع أحد الزوجين عن المعاشرة الزوجية أو الإنجاب إلا بموافقة الطرف الآخر.\n4 - السكن في بيت الزوجية، بمبيت الزوج فيه وبقاء الزوجة معه.\n5 - المحافظة على مصلحة الأسرة، ورعاية الأولاد وحسن تربيتهم.\nوعلى الزوج النفقة بالمعروف، والعدل بين الزوجات في القسم والنفقة الواجبة.\nوعلى الزوجة الطاعة بالمعروف، وإرضاع أولادهما ما لم يكن هناك مانع","points":[{"t":"قسم الكتاب الحقوق الزوجية ثلاثة: «أولا، الحقوق المشتركة، وثانيا: حقوق الزوجة، وثالثا: حقوق الزوج»، و«ما من شك في أن كل حق يقابله واجب»: ﴿ولهن مثل الذي عليهن بالمعروف﴾.","p":"110"},{"t":"الحق الأول المعاشرة بالمعروف: «بأن يحسن كل واحد منهما إلى الآخر بحسن الخلق، وطيب الكلام، والرحمة والشفقة، وأن يتغاضى كل واحد منهما عن أخطاء الآخر»، ويدخل فيها التزين من الزوجين لبعضهما.","p":"110–111"},{"t":"من ضوابط زينة المرأة: عدم الضرر، وألا يكون فيها تغيير لخلق الله «أما إذا كان لمعالجة تشوه خلقي، فلا مانع منه»، وألا تتجمل بما لا يجوز كالوشم، وألا تكون زينة محرمة كوصل الشعر.","p":"111"},{"t":"الحق الثاني تجنب الإضرار، وأصله «لا ضرر ولا ضرار»، «فالضرر في الشريعة مدفوع، وإذا وقع فهو مرفوع».","p":"112"},{"t":"«التنفيذ الجبري لا ينفذ على الزوجة في الحكم بعودتها إلى بيت الزوجية»، فإن امتنعت «فلا تجبر عليه، لكن لا يكون لها الحق في النفقة وما يتبعها من الحقوق الزوجية ما دامت رافضة لتنفيذ الحكم».","p":"112"},{"t":"«سقوط حقوقها الزوجية لا يعني سقوط حقها في حضانة ولدها أو زيارته، وإنما تسقط الحقوق المتعلقة بالعقد كالنفقة والسكنى. وأما الحقوق المتعلقة بالولادة، فهي باقية وثابتة لها».","p":"112"},{"t":"وفي المادة الخامسة والسبعين من نظام التنفيذ: «لا ينفذ الحكم الصادر على الزوجة بالعودة إلى بيت الزوجية جبرا».","p":"112"},{"t":"الحق الثالث: ألا يمتنع أحدهما عن المعاشرة أو الإنجاب إلا بموافقة الآخر، والمعاشرة مقيدة بآداب شرعية، فيحرم إتيان الحائض والإتيان في الدبر بإجماع أهل العلم. والإنجاب «حق لهما جميعا»، «والإنجاب مقصد من مقاصد النكاح لاينبغي إهداره».","p":"113–114"},{"t":"الحق الرابع السكن في بيت الزوجية: أن يبيت الزوج فيه، وأن تبقى الزوجة فيه، «وعدم خروجها إلا بإذن من زوجها أو بمسوغ شرعي»، ولا تدخل أحدًا بيته إلا بإذنه.","p":"114"},{"t":"الحق الخامس: المحافظة على مصلحة الأسرة، والعناية بالأولاد وتربيتهم تربية صالحة.","p":"114"},{"t":"من حقوق الزوجة النفقة بالمعروف، وهي «ما يلزم المرأة من الطعام والشراب والملبس والمسكن»، «والقاعدة العامة في النفقة: أن نفقة كل إنسان في ماله، إلا الزوجة فنفقتها على زوجها ولو كانت موسرة».","p":"115"},{"t":"والعدل بين الزوجات: «والعدل هو إيتاء كل ذي حق حقه مما وجب عليه، وليس مطلق التساوي»، فيعدل في النفقة، والسكنى والمبيت، والهبة والعطية، «وأما ما لا يقدر عليه كالمحبة والميل القلبي، فلا يلزم العدل فيه».","p":"116"},{"t":"«الأصل في القسم: أن يكون في الوقت الذي لا يتعلق فيه بحث الزوج عن المعيشة»، فإن كان عمله نهارًا فعماد القسم الليل، والعكس.","p":"116"},{"t":"القسم الابتدائي: «فإن كانت الزوجة الجديدة بكرا: مكث عندها أسبوعا، ثم قسم بين زوجاته»، «وإن كانت ثيبا: فإنه يخيرها بين أن يمكث عندها ثلاثا أو أسبوعا، فإن مكث عندها أسبوعا، فإنه يمكث عند كل زوجة أسبوعا». والقسم المتكرر بحسب ما يناسبه شريطة العدل.","p":"116–117"},{"t":"«ويسقط القسم بما تسقط به النفقة، وذلك في موضعين: 1 - نشوز الزوجة. 2 - سفرها».","p":"117"},{"t":"«ليس للزوج أن يسافر بإحداهن إلا بقرعة بين الزوجات أو برضاهن»، ويقسم للحائض والنفساء والمريضة «لأن القصد السكن والأنس»، ولا يبدأ بإحداهن إلا بقرعة أو رضاهن.","p":"118"},{"t":"من وهبت قسمها لضرتها بإذن الزوج جاز، كما وهبت سودة يومها لعائشة، «وإذا رجعت الواهبة وطالبت بقسمها، قسم لها الزوج في المستقبل».","p":"118"},{"t":"«يجوز للزوجة أن تسامح زوجها عن حقها في القسم والنفقة ليمسكها وتبقى في عصمته»؛ لقوله تعالى: ﴿فلا جناح عليهما أن يصلحا بينهما صلحا والصلح خير﴾.","p":"118–119"},{"t":"من حقوق الزوج الطاعة بالمعروف، والقوامة للرجل «بحكم اختلاطه بالمجتمع العام، ولأنه أقدر على تغليب حكم العقل وضبط المواقف والعواطف، ولأنه يشعر بالمضرة المالية وغيرها إن فسدت الحياة الزوجية».","p":"120"},{"t":"ومن حقه عليها: «طاعتها له بالمعروف، ومعاملتها إياه بالحسنى، والمحافظة على ماله، وكرامته، وعرضه»، وله إرشادها وتوجيهها، «ولم يجعل الشرع أمر تأديب الزوجة لغير زوجها».","p":"120–121"},{"t":"والحق الثاني للزوج إرضاع أولادهما ما لم يكن مانع، فإن وجد «فقد نصت المادة (61) من النظام على التزام الأب بأجرة إرضاع ولده الصغير في الحولين إذا تعذر على الأم إرضاعه، وأن ذلك يعد من النفقة».","p":"122"}]},{"n":43,"ch":"ch4","title":"امتناع الزوجة من زوجها","p":"122","text":"1 - للزوجة الامتناع عن الدخول والانتقال إلى بيت الزوجية حتى تقبض مهرها الحال، ويهيئ الزوج لها المسكن المناسب، ولها الحق في النفقة خلال هذه المدة.\n2 - إذا رضيت الزوجة بالدخول قبل أن تقبض مهرها الحال، فيبقى دينًا في ذمة الزوج، لها المطالبة به في أي وقت شاءت، وليس لها الامتناع بعد ذلك إذا هيأ لها المسكن المناسب","points":[{"t":"«تشير هذه المادة إلى بعض الحقوق المتقابلة في الزواج، فإذا كان من حق الزوج طلب زوجته للزفاف أو لمتابعته إلى مسكن الزوجية، فإن من حق المرأة مطالبته بحال المهر».","p":"122"},{"t":"فإذا قدم المعجل وهيأ المسكن المناسب لزمها إجابته، «ولو رفضت بعد قبضها لمهر فله استرجاعه».","p":"122"},{"t":"«وقد ذكر المنظم تهيئة المسكن لأنه من المعاشرة بالمعروف، والمسكن حق واجب للزوجة على زوجها».","p":"123"},{"t":"إن لم يقدم ما وجب تعجيله فلها الامتناع، «ويحق لها المطالبة بنفقتها خلال هذه المدة؛ لأن الإخلال من الزوج وليس منها».","p":"123"},{"t":"«فتحصل لنا من هذه الفقرة أن حق الزوجة في الامتناع عن الدخول مع وجوب نفقتها يكون في حالتين هما: الحالة الأولى: عدم تسليم المهر. الحالة الثانية، عدم تهيئة المسكن المناسب».","p":"123"},{"t":"وإن دخل بها برضاها قبل قبض المعجل: «قال جمهور أهل العلم: ليس لها ذلك، ويبقى المهر في ذمة الزوج كأي دين آخر»؛ لأن رضاها علامة إسقاطها، «والساقط لا يعود».","p":"123–124"},{"t":"«وقد أخذ المنظم بقولهم، وجاء نص الفقرة الثانية من هذه المادة موافقا لما قرروه».","p":"124"}]},{"n":44,"ch":"nafaqa","title":"حدود النفقة","p":"125","text":"1 - نفقة كل إنسان في ماله، إلا الزوجة فنفقتها على زوجها ولو كانت موسرة.\n2 - إن لم يوجد لمجهول الأبوين مال، ولم يتبرع أحد بالإنفاق عليه؛ كانت نفقته على الدولة","points":[{"t":"النفقة عند الفقهاء: «كفاية من يمونه بالطعام والماء والمسكن والملبس وتوابعها».","p":"125"},{"t":"القاعدة العامة: نفقة كل إنسان في ماله، واستثنيت الزوجة؛ «ذلك لأن الزوجة إذا احتبست نفسها على الزوج لحقه وواجبه فنفقتها تكون واجبة عليه»؛ عملًا بالأصل: «كل من احتبس لحق غيره ومنفعته فنفقته على من احتبس لأجله».","p":"125"},{"t":"والمراد بالحبس هنا «لا يقصد به السجن المنزلي كما فهمه بعض فقهاء القانون، بل يراد به أن الزوجة تحبس عن الزواج بغيره، وتؤدي له حقوقه مقابل أن يؤدي هو لها حقوقها».","p":"126"},{"t":"دليلها من الكتاب: ﴿وعلى المولود له رزقهن وكسوتهن بالمعروف﴾، ﴿لينفق ذو سعة من سعته﴾، ومن السنة: «ولهن عليكم رزقهن، وكسوتهن بالمعروف».","p":"126"},{"t":"نفقة مجهول الأبوين على الدولة بشرطين: «الشرط الأول: أن لا يوجد له مال. الشرط الثاني: أن لا يتبرع أحد بالإنفاق عليه»، «وهذا مما يؤكد مسؤولية الدولة عن رعاياها».","p":"127"}]},{"n":45,"ch":"nafaqa","title":"مشتملات النفقة","p":"128","text":"النفقة حق من حقوق المنفق عليه، وتشمل:\nالطعام، والكسوة، والسكن، والحاجيات الأساسية، بحسب العرف وما تقرره الأحكام النظامية ذات الصلة","points":[{"t":"«قررت هذه المادة أن النفقة تعتبر حقا من حقوق المنفق عليه، وأن هذه النفقة تشمل أربعة أشياء»: الطعام، ويشمل الطعام والشراب، والكسوة، والسكن، والحاجيات الأساسية.","p":"128"},{"t":"الكسوة: «وقد أجمع أهل العلم على أنه تجب على الزوج لزوجته كسوتها»، «والكسوة بالمعروف: هي الكسوة التي جرت عادة أمثالها بلبسه».","p":"129"},{"t":"السكن: «فيجب للزوجة أن يكون لها سكن لائق بها»؛ لقوله تعالى: ﴿أسكنوهن من حيث سكنتم من وجدكم﴾، أي بحسب سعتكم وقدرتكم المالية.","p":"129"},{"t":"مقدار الكسوة والسكن يختلف باختلاف الأزمان والأمكنة والأعراف، «ويجمع ذلك كله أن يكون حسب العرف».","p":"130"},{"t":"سكن المحضون: يفهم من المادة (19) من اللائحة أنه يوفر له إلا إذا كان الحاضن أو المحضون في سكن مملوك أو مخصص له، أو كان الحاضن يسكن تبعًا لغيره، «وكذلك ليس للحاضن أن يطالب بأجرة السكن إذا هيأ من وجبت عليه النفقة سكنا مناسبا للمحضون».","p":"130"},{"t":"الحاجيات الأساسية: «فكل ما يعتبر حاجة للزوجة فإنه يدخل في مفهوم النفقة»، كوسائل النقل والاتصالات، «ويدخل فيه الخادمة لمن كان لمثلها خادم يخدمها، ويدخل فيه أجرة التطبيب».","p":"130"},{"t":"هل عبارة «بحسب العرف» خاصة بالحاجيات الأساسية؟ قال المؤلف: «والذي أراه أنه يشمل الجميع، فليس خاصا بالحاجيات الأساسية فقط».","p":"130–131"},{"t":"نفقة المحضون: «إذا حكم بالنفقة للمحضون: ضمن الحكم تسليمها للحاضن دون تعيينه، ويحل الحاضن اللاحق محل الحاضن السابق في تسلم النفقة».","p":"131"}]},{"n":46,"ch":"nafaqa","title":"ما يراعى في النفقة","p":"131","text":"يراعى في تقدير النفقة:\n1 - حال المنفق عليه.\n2 - وسعة المنفق","points":[{"t":"«وهذا هو مذهب الحنابلة وعليه الفتوى عند الحنفية، وذلك جمعا بين الأدلة».","p":"131"},{"t":"«بين من يقول: إن المعتبر هو حال الزوج كما هو مذهب الشافعية وغيرهم»، ودليلهم: ﴿لينفق ذو سعة من سعته﴾.","p":"131"},{"t":"«وبين من يرى أن المعتبر هو حال الزوجة كما هو مذهب المالكية»، ودليلهم حديث هند: «خذي ما يكفيك وولدك بالمعروف».","p":"132"},{"t":"«وبما أنه يمكن الجمع بينهما فهو أولى من الأخذ بأحدهما واطراح الآخر، وهذه هي طريقة المحققين من أهل العلم».","p":"132"}]},{"n":47,"ch":"nafaqa","title":"حالات النفقة في ذاتها","p":"132","text":"1 - يجوز أن تكون النفقة نقدًا.\n2 - يعد من الإنفاق إتاحة المال عينًا أو منفعة","points":[{"t":"«هذه المادة فيها من المرونة التي يتمتع بها هذا النظام»، «وإنما عبر بالجواز هنا لأن الأصل في النفقة أن تكون عينا أو منفعة لا أن تكون نقدا».","p":"132"},{"t":"والاستثناء أن تكون نقدًا، ويكون غالبًا في حالين: «التراضي على أن تكون النفقة نقدا»، و«حال النزاع بين الطرفين: فيفصل فيه القضاء».","p":"132–133"},{"t":"«ويفهم من هذه الفقرة أن الواجب في النفقة هو إتاحتها لا تمليكها».","p":"133"}]},{"n":48,"ch":"nafaqa","title":"زيادة النفقة وإنقاصها","p":"133","text":"1 - مع مراعاة ما تقضي به (المادة السادسة والأربعون) من هذا النظام: يجوز زيادة النفقة أو إنقاصها تبعًا لتغير الأحوال.\n2 - لا تسمع دعوى زيادة النفقة أو إنقاصها قبل مضي (سنة) من تاريخ صدور الحكم بالنفقة إلا في الظروف الاستثنائية التي تقدرها المحكمة.\n3 - تحسب زيادة النفقة أو نقصانها اعتبارًا من تاريخ صدور الحكم","points":[{"t":"الفقرة الأولى: إذا تغير حال المكلف بالنفقة يسرًا أو عسرًا، أو تغيرت الحالة الاقتصادية، عدلت النفقة، «فالنفقة تتجدد بتجدد الزمان، وتجب شيئا فشيئا».","p":"133"},{"t":"الفقرة الثانية منعت سماع الدعوى قبل مضي سنة، «وما ذاك إلا لتستقر الأحكام القضائية في مجال النفقات بين الزوجين، ومنعا للكيد عند المتقاضين».","p":"133"},{"t":"«وحتى لا يكون المنع على إطلاقه فيتأثر البعض»، ترك النظام للقاضي قبول الدعوى قبل مضي السنة في الظروف الاستثنائية «وفق سلطته التقديرية».","p":"134"},{"t":"الفقرة الثالثة جاءت «تحقيقا للعدالة وقطعا لاحتمالية الخلاف في بدء سريان المدة»، فالزيادة أو النقصان تسري من تاريخ صدور الحكم القضائي.","p":"134"}]},{"n":49,"ch":"nafaqa","title":"النفقة المستمرة","p":"134","text":"تستحق النفقة المستمرة للزوجة والأولاد والوالدين من تاريخ إقامة الدعوى للمطالبة بها، وتعد دينًا ممتازًا يقدم على سائر الديون بخلاف النفقة الماضية، فتخضع إلى حكم باقي الديون","points":[{"t":"النفقة المستمرة «وهي النفقة الجارية»، تكون للزوجة والأولاد والوالدين، وتستحق من تاريخ إقامة الدعوى «وليس من تاريخ تصديق الحكم في المحكمة؛ وعلة ذلك أن تصديق الحكم هو كاشف له لا منشئ».","p":"135"},{"t":"وهي دين ممتاز؛ «لأنه وجب لإقامة الأولاد، وهو من الضرورات الخمس التي أوجب الشرع الإسلامي حفظها»، فلو كان مال المنفق تحت التصفية لإفلاسه فرضت النفقة من حاصل التصفية، «فيكون حق التقديم على سائر الديون عدا نفقات التنفيذ والدين برهن».","p":"135"},{"t":"«أما النفقة الماضية المتراكمة فليس لها ما يبرر امتيازها كدين»؛ لأن مستحقها ترك المطالبة بها، «فأصبحت من الديون العادية».","p":"135"},{"t":"«والديون الممتازة فهي: تلك الحقوق العينية التي يعطي النظام صاحبها أسبقية في اقتضاء الحق، مراعاة لصفته بنص النظام»، فلا امتياز إلا بنص نظامي.","p":"135"},{"t":"المقاصة: «تساقط الدينين على غريمين متقابلين متى كانت الديون متماثلة جنسا وقدرا - ولو على الأقل منها - وحلولا وتأجيلا».","p":"136"},{"t":"«المقاصة في النفقة المستمرة، والأصل أنه لا مقاصة فيها إذا كانت الزوجة غير موسرة»، وتجوز إن كانت موسرة قادرة على الإنفاق على نفسها وهي مدينة للزوج. وأما النفقة الماضية «فهذه دين من الديون ويجوز فيها المقاصة».","p":"136"}]},{"n":50,"ch":"nafaqa","title":"المطالبة بالنفقة","p":"137","text":"تكون المطالبة بالنفقة وفق الأحكام المنظمة لذلك، وللمحكمة - عند الاقتضاء - أثناء نظرها طلبًا يتعلق بنفقة مستمرة: الحكم بنفقة مؤقتة لمستحقها بناء على طلبه دون حضور الطرف الآخر","points":[{"t":"من الأحكام المنظمة للمطالبة بالنفقة: نظام المرافعات الشرعية الصادر بالمرسوم الملكي رقم (م/1) وتاريخ 1435/1/22هـ، وما يتعلق بصندوق النفقة وتنظيمه.","p":"137"},{"t":"النفقة المؤقتة «مصطلح جديد»، «ويراد بها: نفقة يحكم بها القضاء لفترة معينة أثناء نظره للنفقة المستمرة، وذلك حتى لا تتعطل مصالح المنفق عليه وقت نظر الدعوى الأصلية بالنفقة المستمرة».","p":"137"},{"t":"«وحجية الحكم فيها مؤقتة تزول بالفصل في موضوع الدعوى الأصلية»، وهي عائدة لتقدير المحكمة، «ويشترط لها أن يطلبها المدعي حتى ولو لم يحضر الطرف الآخر».","p":"137"},{"t":"إن كان الحكم للزوجة: راعت المحكمة عند الحكم بالمستمرة ما حكمت به من مؤقتة «زيادة أو نقصا، بشرط مطالبة الزوج أو الزوجة بذلك، بحسب الأحوال».","p":"137"},{"t":"«إذا كان الحكم للأولاد أو الوالدين؛ فتحسب النفقة المستمرة من تاريخ الحكم بها، دون اعتبار لما حكمت به من نفقة مؤقتة». وعلى وزارة العدل إعداد نماذج وإجراءات طلبات تقدير النفقة، وتعتمد من المحكمة.","p":"138"}]}],"numbers":[{"v":"5 شعبان 1443هـ","sub":"8 مارس 2022م","t":"صدور نظام الأحوال الشخصية بموافقة مجلس الوزراء","ref":"المقدمة","ch":"intro","p":"7"},{"v":"26 جمادى الآخرة 1442هـ","sub":"8 فبراير 2021م","t":"الإعلان عن منظومة التشريعات المتخصصة الأربعة، والنظام ثانيها صدورًا","ref":"المقدمة","ch":"intro","p":"7"},{"v":"(59641)","sub":"1446/8/17هـ","t":"رقم الأمر السامي الصادرة به اللائحة التنفيذية وتاريخه","ref":"المقدمة","ch":"intro","p":"7"},{"v":"العدد (5072)","sub":"1446/8/22هـ · 2025/2/21م","t":"نشر اللائحة التنفيذية في جريدة أم القرى","ref":"المقدمة","ch":"intro","p":"7"},{"v":"1443/11/18هـ","sub":"","t":"دخول النظام حيز النفاذ","ref":"المقدمة","ch":"intro","p":"8"},{"v":"ثمانية أبواب","sub":"","t":"عدد أبواب نظام الأحوال الشخصية","ref":"المقدمة","ch":"intro","p":"8"},{"v":"(سنة)","sub":"م 2/48","t":"لا تُسمع دعوى الزيادة أو النقصان في النفقة قبل مضيها من صدور الحكم، إلا في الظروف الاستثنائية","ref":"المقدمة","ch":"intro","p":"8"},{"v":"(سنتين)","sub":"م 2/52","t":"لا تُسمع الدعوى بنفقة الزوجة عن مدة سابقة تزيد عليها من تاريخ إقامة الدعوى","ref":"المقدمة","ch":"intro","p":"9"},{"v":"(سنة)","sub":"م 59","t":"لا تُسمع دعوى الرجوع بنفقة تزيد عليها سابقة لتاريخ إقامة الدعوى","ref":"المقدمة","ch":"intro","p":"9"},{"v":"(خمسة عشر) يومًا","sub":"م 90","t":"أقصى مدة لتوثيق الزوج الطلاق من حين البينونة","ref":"المقدمة","ch":"intro","p":"9"},{"v":"أكثر من خمس وعشرين","sub":"","t":"عدد المدد التي وضعها المنظم في النظام","ref":"المقدمة","ch":"intro","p":"9"},{"v":"حالتان","sub":"م 3","t":"يُعدّ فيهما المقدَّم في الخطبة مهرًا: تصريح الخاطب، وجريان العرف","ref":"المادة 3","ch":"ch1","p":"13"},{"v":"حالتان","sub":"م 4","t":"لا تُسترد فيهما الهدية: انتهاء الخطبة بالوفاة، أو بسبب لا يد للطرفين فيه","ref":"المادة 4","ch":"ch1","p":"14"},{"v":"الخمسة","sub":"","t":"الأحكام التكليفية التي تجري على النكاح","ref":"المادة 6","ch":"ch2","p":"21"},{"v":"السابعة","sub":"م 13 معاملات مدنية","t":"لا يُعدّ مميزًا من لم يتمها من عمره","ref":"المادة 7","ch":"ch2","p":"24"},{"v":"ستة أشهر","sub":"","t":"مدة صلاحية التقرير الطبي للزوجين","ref":"المادة 8","ch":"ch2","p":"26"},{"v":"خمس سنوات على الأقل","sub":"نظام التوثيق م19","t":"يشترط مضيها على انتهاء تنفيذ الحكم في جريمة مخلة بالدين أو الشرف لمن يطلب رخصة المأذون (حاشية الكتاب)","ref":"المادة 8","ch":"ch2","p":"26"},{"v":"(ثمانية عشر) عامًا","sub":"م 9","t":"يُمنع توثيق عقد زواج من هو دونها","ref":"المادة 9","ch":"ch2","p":"29"},{"v":"ثلاثة شروط","sub":"م 9","t":"للإذن بزواج من دون الثامنة عشرة، وزادت اللائحة رابعًا وخامسًا","ref":"المادة 9","ch":"ch2","p":"29–31"},{"v":"خمس عشرة سنة","sub":"","t":"سن البلوغ للغلام والجارية عند الشافعي، وأبي يوسف ومحمد، وابن وهب من المالكية","ref":"المادة 9","ch":"ch2","p":"30"},{"v":"ثماني عشرة سنة","sub":"","t":"سن البلوغ للغلام عند أبي حنيفة، والمشهور عند المالكية","ref":"المادة 9","ch":"ch2","p":"30"},{"v":"سبع عشرة سنة","sub":"","t":"سن البلوغ للجارية عند أبي حنيفة","ref":"المادة 9","ch":"ch2","p":"30"},{"v":"ثمانية عشرة عاماً","sub":"","t":"سن الرشد الذي تكون به أهلية التقاضي في النظام السعودي","ref":"المادة 10","ch":"ch2","p":"32"},{"v":"ثلاثة شروط","sub":"م 11","t":"للإذن بزواج المجنون أو المعتوه","ref":"المادة 11","ch":"ch2","p":"32"},{"v":"ركنان","sub":"م 12","t":"أركان عقد الزواج في النظام: الزوجان، والإيجاب والقبول","ref":"المادة 12","ch":"ch3","p":"35"},{"v":"خمسة","sub":"الشافعية","t":"أركان النكاح عند الشافعية: صيغة، وزوج، وزوجة، وشاهدان، وولي","ref":"المادة 12","ch":"ch3","p":"37"},{"v":"ثلاثة","sub":"الحنابلة","t":"أركان النكاح عند الحنابلة: زوجان، والإيجاب، والقبول، وبه أخذ المنظم","ref":"المادة 12","ch":"ch3","p":"37"},{"v":"ثلاث آيات","sub":"","t":"توصل بها خطبة الحاجة: آل عمران 102، والنساء 1، والأحزاب 70–71","ref":"المادة 12","ch":"ch3","p":"37–38"},{"v":"خمسة شروط","sub":"م 13","t":"شروط صحة عقد الزواج","ref":"المادة 13","ch":"ch3","p":"38"},{"v":"نوعان","sub":"","t":"الشروط: شرعية، وهي شروط الصحة؛ وجعلية، يشترطها أحد الخاطبين","ref":"المادة 13","ch":"ch3","p":"38–39"},{"v":"خمس حِكَم","sub":"","t":"الحكمة من اشتراط الولاية في الزواج","ref":"المادة 13","ch":"ch3","p":"42"},{"v":"قسمان","sub":"","t":"المحرمات: على سبيل التأبيد، وتحريمًا مؤقتًا","ref":"المادة 13","ch":"ch3","p":"43"},{"v":"الدرجة الثالثة","sub":"م 14/3","t":"حد القرابة لمن يحق له الاعتراض على عقد الزواج لانعدام الكفاءة","ref":"المادة 14","ch":"ch3","p":"44"},{"v":"أمران","sub":"م 14/2","t":"الكفاءة المعتبرة: صلاح الدين، وما قام العرف على اعتباره","ref":"المادة 14","ch":"ch3","p":"46"},{"v":"خمسة أشياء","sub":"","t":"تكون فيها المساواة عند بعض أهل العلم: الدين، والمنصب (النسب)، والحرية، والصناعة، واليسار","ref":"المادة 14","ch":"ch3","p":"46–47"},{"v":"(5/1228)","sub":"1428/8/1هـ","t":"قرار مجلس القضاء الأعلى بهيئته الدائمة: الأصل إنما الكفاءة في الدين","ref":"المادة 14","ch":"ch3","p":"47"},{"v":"ثلاثة شروط","sub":"","t":"للاعتراض على عقد الزواج لانعدام الكفاءة","ref":"المادة 14","ch":"ch3","p":"48–49"},{"v":"ثلاث درجات","sub":"لائحة المرافعات م7","t":"الأولى: الأبوة والبنوة؛ الثانية: الأخوة وأبناء الأبناء؛ الثالثة: العمومة وأ مرافعات الشرعية، ومن أحكامه تكون المطالبة بالنفقة","ref":"المادة 50","ch":"nafaqa","p":"137"}],"comparisons":[{"id":"c-udool","ch":"ch1","p":"13–16","title":"آثار العدول عن الخطبة: الهدية والمهر","cols":["الحالة","إذا كان المقدَّم هدية (م4)","إذا كان المقدَّم مهرًا (م5)"],"rows":[["متى يكون كذلك","الأصل في كل ما يُقدَّم خلال الخطبة (م3)","إذا صرّح الخاطب بأنه مهر، أو جرى العرف بذلك (م3)"],["عدل أحدهما بسبب يعود إليه","ليس له الرجوع في هديته، وللآخر أن يسترد ما أهداه: بعينه إن كان قائمًا، وإلا بمثله أو قيمته يوم قبضه","للخاطب الرجوع فيما سلّم: بعينه إن كان قائمًا، وإلا بمثله أو بقيمته يوم القبض؛ وإن كان العدول من المخطوبة فعليها رد المهر عينه أو بدله"],["عدل الخاطب بلا سبب منها، أو عدلت هي بسبب منه، وقد اشترت بالمهر ما فيه مصلحة الزواج عرفًا","—","لها الخيار بين إعادة المهر أو تسليم ما اشترته بحاله (م5/2)"],["الوفاة","لا يُسترد شيء من الهدايا","يحق للخاطب أو لورثته الرجوع فيما سلّم (م5/1: «أو مات قبل العقد»)"],["سبب لا يد للطرفين فيه (كالجنون والأسر)","لا يُسترد شيء من الهدايا","لم ينص عليه الكتاب في المهر"],["ما يُستهلك بطبيعته","لا يُرد، كالأكل والحلوى","لم تستثنه المادة"]]},{"id":"c-hadiya-hiba","ch":"ch1","p":"13","title":"الهدية والهبة (حاشية الكتاب)","cols":["وجه المقارنة","الهدية","الهبة"],"rows":[["المعنى","تمليك شخص لآخر في الحياة بغير عوض بقصد التودد والألفة","الهدية بمعنى الهبة"],["الفرق","يغلب عليها حصولها لمناسبة أو سبب، وتكون للإكرام والإجلال","متجردة بقصد التودد"]]},{"id":"c-mithli","ch":"ch1","p":"14","title":"المثليات والقيميات (حاشية الكتاب)","cols":["وجه المقارنة","المثليات","القيميات"],"rows":[["التعريف","ما كان لها نظير في السوق، من غير فارق يعتد به","ما ليس له نظير في السوق، أو له نظير ولكن هناك فارق يعتد به"],["المثال","السيارة الجديدة التي لم تستعمل ولها نظير في جميع صفاتها","السيارة المستعملة"],["الرد إذا هلكت الهدية (م4)","يُرد مثلها","تُرد قيمتها يوم القبض"]]},{"id":"c-ahkam-nikah","ch":"ch2","p":"22–23","title":"الأحكام التكليفية للنكاح","cols":["الحكم","متى يكون","التعليل"],"rows":[["واجب","على من يخاف على نفسه الزنا إذا تركه","لأنه طريق
