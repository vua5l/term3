<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEAE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C211E" media="(prefers-color-scheme: dark)">
<title>جدول الاختبارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <!-- شاشة اليوم -->
  <section class="screen" id="screen-today" aria-labelledby="nav-today">
    <header class="head" id="head-today"></header>
    <section class="track" id="track" aria-label="خط الاختبارات"></section>
    <section class="today-card" id="today-card" aria-label="تقدم اليوم"></section>
    <div class="groups" id="groups"></div>
  </section>

  <!-- شاشة التقويم -->
  <section class="screen" id="screen-calendar" aria-labelledby="nav-calendar">
    <header class="head" id="head-calendar"></header>
    <section class="cal" id="cal"></section>
  </section>

  <!-- شاشة التعديل -->
  <section class="screen" id="screen-settings" aria-label="التعديل">
    <header class="head head-settings">
      <a class="back" href="#today" aria-label="رجوع إلى اليوم">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <div class="head-title">
        <div class="title">التعديل</div>
        <div class="subtitle">المواعيد والخطة والمزامنة</div>
      </div>
    </header>
    <div class="settings" id="settings"></div>
  </section>

  <nav class="nav" id="nav" aria-label="التنقل">
    <a href="#today" id="nav-today" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
      <span>اليوم</span>
    </a>
    <a href="#calendar" id="nav-calendar" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path></svg>
      <span>التقويم</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<noscript><p class="noscript">تحتاج هذه الصفحة إلى تشغيل JavaScript.</p></noscript>

<script src="sync.js"></script>
<script src="schedule.js"></script>
<script src="app.js"></script>
</body>
</html>
