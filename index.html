<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الترم الثالث</title>
<style>
  :root { --bg:#f6f4ef; --ink:#1f1d1a; --muted:#7a7468; --card:#ffffff; --line:#e6e1d6; --accent:#8a5a2b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151412; --ink:#efebe3; --muted:#9a9384; --card:#1e1c19; --line:#2e2b26; --accent:#d9a46c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
         display:flex; align-items:center; justify-content:center;
         padding:max(24px, env(safe-area-inset-top)) 16px 24px; }
  main { width:100%; max-width:440px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p { margin:0 0 24px; color:var(--muted); font-size:15px; }
  a { display:flex; justify-content:space-between; align-items:center;
      background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:18px 20px; margin-bottom:12px; text-decoration:none; color:var(--ink);
      font-size:19px; font-weight:600; transition:border-color .2s, transform .2s; }
  a:hover, a:focus-visible { border-color:var(--accent); transform:translateY(-1px); outline:none; }
  a span { color:var(--accent); font-size:22px; line-height:1; }
</style>
</head>
<body>
<main>
  <h1>الترم الثالث</h1>
  <p>اختر المادة</p>
  <a href="law117/">أحكام الأسرة <span>‹</span></a>
  <a href="law114/">مصادر الالتزام <span>‹</span></a>
  <a href="law138/">القانون الإداري <span>‹</span></a>
</main>
</body>
</html>
